# What the C consumer sanitizer lane accepts in a LeakSanitizer report (C SDK
# plan, C5), read by run-c-consumers.py --sanitize.
#
# The runner parses every leak block LSan prints and classifies it here. It
# does not use LSan suppressions: they match any frame of a stack, and the
# handle tombstones below share `net_mesh_new` with a real leak of the node
# itself (D-C5-1, now fixed), so a suppression could not tell them apart. A block that matches nothing here
# fails the program. Each accepted class is printed on every run with its
# blocks and bytes, so retained memory is reported, never hidden.
#
# Being reachable from a static is not a claim that teardown reclaims it;
# nothing here claims that.

# Intended. Each FFI handle's free drops its inner value and keeps the outer
# box, so a call racing the free fails cleanly instead of touching freed
# memory ("Box stays leaked. See super::handle_guard":
# src/ffi/mesh.rs net_mesh_free, src/ffi/cortex.rs net_redex_free,
# src/ffi/blob.rs net_mesh_blob_adapter_free). One small direct block per
# freed handle, allocated by the handle's constructor.
[[direct]]
name = "handle tombstone"
constructors = ["net_mesh_new", "net_mesh_blob_adapter_new", "net_mesh_blob_adapter_new_v2", "net_redex_new"]
max_block_bytes = 64

# No indirect leak is accepted. D-C5-1 (a MeshNode never reclaimed after
# net_mesh_shutdown + net_mesh_free) was accepted here, in two named programs,
# until its fix: nineteen FFI entry points cloned the handle's
# ManuallyDrop<Arc<MeshNode>> wrapper instead of the Arc, leaking one strong
# reference per call. Guarded by ffi::tests::no_clone_of_a_manually_drop_arc_field
# and ffi::mesh::tests::node_reclaim_c_abi.
