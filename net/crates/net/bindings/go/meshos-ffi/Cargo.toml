[package]
name = "net-meshos-ffi"
version = "0.35.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "C ABI MeshOS daemon-author SDK for the Go binding of Net"
# Linked into the single `libnet` cdylib, not distributed on its own.
publish = false

[lib]
# `rlib` only. This surface is linked into the single `libnet` cdylib by
# `bindings/go/net-ffi`, never on its own.
#
# It used to emit a cdylib too, and anything that linked that beside `libnet`
# put two copies of `net::ffi` in one process. Link order unifies the duplicate
# functions, so it looked correct; it does not unify `static`s, and
# `parking_lot_core`'s parked-thread registry is one — a thread parking on a
# mesh mutex through one copy was never woken by an unlock through the other.
# Dropping the cdylib makes that arrangement unrepresentable rather than merely
# undocumented.
name = "net_meshos"
crate-type = ["rlib"]

[features]
default = []

[dependencies]
# Substrate-side MeshOS SDK + the daemon trait. Pulls in
# `compute` for `MeshDaemon` and `meshos` for the supervisor runtime;
# the latter implies `cortex` per the substrate's feature gating.
net = { package = "net-mesh", version = "0.35.0", path = "../../..", default-features = false, features = ["meshos"] }
tokio = { version = "1.48", features = ["rt-multi-thread", "sync", "time"] }
bytes = "1.11"
parking_lot = "0.12"
serde_json = "1"
