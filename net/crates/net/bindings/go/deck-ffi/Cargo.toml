[package]
name = "net-deck-ffi"
version = "0.34.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "C ABI Deck operator-side SDK for the Go binding of Net"
# Linked into the single `libnet` cdylib, not distributed on its own.
publish = false

[lib]
# `rlib` only. This surface is linked into the single `libnet` cdylib by
# `bindings/go/net-ffi`, never on its own.
#
# It used to emit a cdylib too, and anything that linked that beside `libnet`
# put two copies of `net::ffi` in one process. Link order unifies the duplicate
# functions, so it looked correct; it does not unify `static`s, and
# `parking_lot_core`'s parked-thread registry is one — a thread parking on a
# mesh mutex through one copy was never woken by an unlock through the other.
# Dropping the cdylib makes that arrangement unrepresentable rather than merely
# undocumented.
name = "net_deck"
crate-type = ["rlib"]

[features]
default = []

[dependencies]
# Substrate-side Deck SDK + the supervisor runtime. The substrate's
# `deck` feature pulls in `meshos` transitively; we list both
# explicitly so the dep chain is self-documenting at the crate
# boundary.
net = { package = "net-mesh", version = "0.34.0", path = "../../..", default-features = false, features = ["meshos"] }
parking_lot = "0.12"
tokio = { version = "1.48", features = ["rt-multi-thread", "sync", "time"] }
futures = "0.3"
serde_json = "1"
# Zeroizing wrapper for transient operator-seed copies in the
# net_deck_client_new / net_deck_operator_identity_new entry
# points.
zeroize = "1"
