[package]
name = "net-rpc-ffi"
version = "0.35.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "C ABI nRPC surface for the Go binding of Net"
# Linked into the single `libnet` cdylib, not distributed on its own.
publish = false

[lib]
# `rlib` only. This surface is linked into the single `libnet` cdylib by
# `bindings/go/net-ffi`, never on its own.
#
# It used to emit a cdylib too, and anything that linked that beside `libnet`
# put two copies of `net::ffi` in one process. Link order unifies the duplicate
# functions, so it looked correct; it does not unify `static`s, and
# `parking_lot_core`'s parked-thread registry is one — a thread parking on a
# mesh mutex through one copy was never woken by an unlock through the other.
# Dropping the cdylib makes that arrangement unrepresentable rather than merely
# undocumented.
name = "net_rpc"
crate-type = ["rlib"]

[features]
default = ["tool"]
# `tool` exposes the `net_rpc_list_tools` C symbol + propagates the
# `tool` feature into `net-mesh`, matching the compute-ffi build
# (which enables `tool` for layout consistency on shared types).
# Default-on so the shipped cdylib carries the symbol.
tool = ["net/tool"]

[dependencies]
# Core mesh types — needed because we expose C-ABI handles that
# wrap `Arc<MeshNode>` references handed in by the existing Go
# binding via `net::ffi::mesh::net_mesh_arc_clone`. The feature
# list MUST match what the standalone libnet.dylib build enables
# (see compute-ffi/Cargo.toml's note on cfg-gated field offsets);
# both cdylibs export the same `#[no_mangle]` FFI symbols and the
# Go test binary's link order resolves them — diverging features
# corrupt shared types' layouts.
net = { package = "net-mesh", version = "0.35.0", path = "../../..", features = ["net", "netdb", "redex-disk"] }
tokio = { version = "1.48", features = ["rt-multi-thread", "sync", "time"] }
bytes = "1"
parking_lot = "0.12"
async-trait = "0.1"
# `libc::free` for any cross-FFI buffers that need releasing
# through the C runtime allocator (matches compute-ffi).
libc = "0.2"
# `StreamExt::next` for polling the SDK's `RpcStream` from the
# C-ABI's blocking `net_rpc_stream_next` entry point.
futures = "0.3"
# Emits the `net_rpc_metrics_snapshot` payload — variable-length
# data (per-service histograms + bucket arrays) serialized as
# JSON so the Go side can decode with `encoding/json`.
serde_json = "1"

# `[profile.release]` intentionally omitted — cargo ignores non-root
# profiles ("profiles for the non root package will be ignored"). The
# workspace root governs release-profile settings (lto = true and
# friends) for every member crate.
