[package]
name = "net-org-ffi"
version = "0.34.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "C ABI organization-capability-auth surface for the Go binding of Net"
# Distributed as a cdylib alongside the Go binding, not via crates.io.
# Block accidental `cargo publish`.
publish = false

[lib]
# `cdylib` for the shared object Go links against; `staticlib` for
# platforms that prefer `.a` archives. `rlib` alongside lets any
# in-crate `#[cfg(test)] mod tests` compile — cargo requires an rlib
# to link the unit-test harness. The shipped artifact is the cdylib.
name = "net_org"
crate-type = ["cdylib", "staticlib", "rlib"]

[features]
default = []

[dependencies]
# Core mesh types — needed because we expose C-ABI handles that wrap
# `Arc<MeshNode>` references handed in by the existing Go binding via
# `net::ffi::mesh::net_mesh_arc_clone`.
#
# This crate is no longer linked on its own. `bindings/go/net-ffi` pulls it in
# as an rlib and emits the single `libnet_go` cdylib the Go binding links, so
# there is exactly one copy of `net-mesh` in the process.
#
# The note that used to live here said the duplication was fine because link
# order resolved the exported FFI symbols to one copy, and worried only about
# cfg-gated field offsets staying consistent. The offsets part was right. The
# conclusion was not: link order unifies FUNCTIONS, never `static`s, and each
# cdylib kept its own `ffi::mesh::runtime()` OnceLock, its own tokio TLS, and —
# the one that actually bit — its own `parking_lot_core` parked-thread
# registry. A thread blocking on `MeshNode::announce_mu` parked in libnet's
# registry; the unlock ran out of this crate's copy, found nothing parked in
# ITS registry, and never woke it. That is the Go CI hang: ~9 minutes inside
# `net_mesh_announce_capabilities`, every worker thread idle, lock held by
# nobody.
#
# The feature list below is still kept aligned with `compute-ffi`'s for the
# offset reason, though `net-ffi/Cargo.toml` now declares the authoritative
# union.
net = { package = "net-mesh", version = "0.34.0", path = "../../..", features = ["net", "netdb", "redex-disk", "tool"] }
# SDK org surface — `OrgCredentials`, `OrgClient`, `OrgAccess`,
# `OrgCaller`, `OrgSdkError`, and the provisioning entrypoints. The Go
# FFI delegates to this layer so all four language bindings stay
# behavior-aligned; the C ABI is pure marshaling over it. `cortex`
# because the org call/serve/provision verbs ride the nRPC surface
# (`net_sdk::org` gates them on it); `net` for the bind + credential
# surface. `compute-ffi` already carries this same `net-mesh-sdk`
# dependency, so org-ffi is not the first Go FFI crate to take it.
net-sdk = { package = "net-mesh-sdk", version = "0.34.0", path = "../../../sdk", features = ["net", "cortex"] }
tokio = { version = "1.48", features = ["rt-multi-thread", "sync", "time"] }
bytes = "1"
parking_lot = "0.12"
# `libc::free` for the Go-allocated handler-response buffers the
# dispatcher hands us. Go side allocates via `C.malloc`; we release
# via the matching `free` (mirrors rpc-ffi / compute-ffi).
libc = "0.2"

[dev-dependencies]
# The C-surface consumer of the shared cross-language stable-kind
# fixture (review-10 P3-2) reads `stable_kinds.json`. Test-only: the
# cdylib itself parses no JSON.
serde_json = "1"
# The S4 live cell drives the C ABI end to end against the SAME generated
# scenario the Node / Python / Go harnesses load, so it needs the
# generator. `fixtures` is dev-only: the shipped cdylib mints no
# credentials and writes no files.
net-sdk = { package = "net-mesh-sdk", version = "0.34.0", path = "../../../sdk", features = [
    "net",
    "cortex",
    "fixtures",
] }
tokio = { version = "1.48", features = ["rt-multi-thread", "sync", "time", "macros"] }

# `[profile.release]` intentionally omitted — cargo ignores non-root
# profiles ("profiles for the non root package will be ignored"). The
# workspace root governs release-profile settings (lto = true and
# friends) for every member crate.
