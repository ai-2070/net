[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
# PyPI distribution name. The runtime import path stays
# `net_sdk` (the package directory under `src/` is unchanged) so
# user code keeps `import net_sdk` working.
name = "net-mesh-sdk"
version = "0.34.0"
description = "Ergonomic Python SDK for the Net mesh network"
license = "MIT OR Apache-2.0"
license-files = ["LICENSE-APACHE", "LICENSE-MIT"]
requires-python = ">=3.10"
# Compatible-release, not an open lower bound. `net-mesh-sdk` is a thin
# wrapper over the native `net-mesh` module, and
# `web/src/content/docs/reference/versioning.md` says the two must
# match, that mixing versions is unsupported, and that pre-1.0 minors
# may break APIs. `>=0.34.0` let pip resolve or retain this 0.34 wrapper
# against a 0.35+ core anyway, and the failure only surfaced later, at
# the first call into a changed or removed native method.
dependencies = ["net-mesh>=0.34.0,<0.35.0"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries",
]
keywords = ["net", "mesh", "event-bus", "streaming", "ai", "llm", "inference"]

[project.optional-dependencies]
pydantic = ["pydantic>=2.0"]
test = ["pytest>=9.0.0"]

[project.urls]
Homepage = "https://github.com/ai-2070/net"
Repository = "https://github.com/ai-2070/net"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
