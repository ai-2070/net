# cargo-nextest configuration.
#
# Retries for timing-sensitive integration suites.
#
# Several suites here exercise the reliable-stream transport over loopback UDP
# and/or spawn `net` CLI subprocesses that stand up full mesh nodes. They are
# correct but inherently timing-sensitive: under a full-workspace run the CPU
# is oversubscribed, so grant/ACKs can slip past the transport retransmit
# budget and a data stream resets ("holder reset stream (retransmit
# exhausted)"), or a second-resolution token expires before a subscribe
# handshake lands. Each passes in isolation and at moderate load.
#
# nextest re-runs a failed test in a FRESH, isolated process. A load flake
# passes on the re-run; a genuine logic bug fails all attempts — so retries
# absorb saturation noise without masking real regressions. CI already runs
# with `--no-fail-fast`, so this only changes the per-test outcome, not the
# matrix.
[profile.default]
retries = 2

# A hung test must FAIL, not consume the job.
#
# Several bridges deliver a terminal frame that releases a caller blocked in
# `finish()`, and `CallOptions::default()` has `deadline: None` — documented as
# "waits indefinitely". A regression that bumps the denial metric but skips the
# emit therefore does not fail a test; it hangs one, and without a timeout the
# job dies at its `timeout-minutes` budget with no indication of WHICH test
# stalled. `terminate-after` converts that into an ordinary named failure.
#
# Generous because the slowest legitimate suites stand up multi-node meshes
# over loopback UDP under an oversubscribed CI CPU.
slow-timeout = { period = "60s", terminate-after = 3 }

# Security-critical suites get NO retries.
#
# The blanket `retries = 2` above is right for transport saturation noise, but
# it is exactly wrong for these: their regression signal is INTERMITTENT by
# construction. They drive deliberate races — a floor publish against a scoped
# insert, a visibility change against serialization, a credential replacement
# against a granted insert, an authority swap against an admission — and a
# broken lock or a lost barrier does not fail every attempt, it fails some
# fraction of them. Three attempts then turn a real security regression into a
# green run.
#
# A genuine flake here is itself a defect worth seeing, so failing loudly on
# the first attempt is the correct behavior, not a nuisance.
#
# `sensing_provider` (net-mesh-sdk) rides the same rule for the same reason.
# Its provider-lifecycle witnesses are ownership races and state-edge timing
# proofs: an in-flight evaluation released after a close or a replacement, a
# superseded handle poking its successor's schedule, an edge that must arrive
# far inside a deliberately long cadence. Every one of those fails only on the
# interleaving that exposes the defect, which is exactly what retries hide.
#
# `sensing_org_lease_wire` joins for the same reason: its witnesses park one
# organization transition mid-flight and prove a later one cannot overtake it,
# and prove a refused transition puts nothing on the wire. Both are properties
# of one specific interleaving, so a retry could only ever convert a real
# ordering defect into a green run.
#
# `sensing_org_exact_projection` joins on the same rule: one witness drives a
# concurrent readiness writer against repeated captures, and another proves no
# sensing guard is held during the proximity/budget/order phases. A retry there
# would hide exactly the coherence or lock-order defect those witnesses exist
# to catch.
#
# `org_exact_sensing` joins for the same reason from the other side: it is the
# PRODUCTION call edge, and its ordering claim is that one protected invocation
# reached the sensed provider. A retry could convert a lost readiness
# observation - which would have planned the deterministic order instead - into
# a green run, which is precisely the signal.
#
# `sensing_org_exact_seam` and `sensing_org_three_node` join too: the first
# composes real discovery, real organization sensing transport, real signed
# observations and one protected invocation, and the second proves a dark peer
# installs nothing and buys no legacy downgrade. Both are ordering/exclusion
# proofs over real loopback UDP, where a retry can only convert a dropped
# registration or a lost observation into a green run.
#
# `sensing_consumer` (net-mesh-sdk) joins on the same rule. Its lost-wake
# witness fires a real change at one placed instant inside a capture and
# requires the next park to return far below the population floor; its control
# requires the same park NOT to return inside that bound. Both are properties
# of one interleaving and of one timing boundary, so a retry could only turn a
# swallowed wake — or an always-immediate one — into a green run. Its
# ownership witnesses are the same shape as `sensing_provider`'s.
[[profile.default.overrides]]
filter = 'binary(integration_nrpc_protected) + binary(org_ownership) + binary(capability_exposure_revocation) + binary(org_admission_gate) + binary(org_admission_wire) + binary(nrpc_call_hijack) + binary(nrpc_response_routing) + binary(nrpc_service_equality) + binary(nrpc_route_discriminator) + binary(nrpc_streaming_gate) + binary(nrpc_registration_order) + binary(sensing_provider) + binary(sensing_consumer) + binary(sensing_org_lease_wire) + binary(sensing_org_exact_projection) + binary(sensing_org_exact_seam) + binary(sensing_org_three_node) + binary(org_exact_sensing)'
retries = 0
