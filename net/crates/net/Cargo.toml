[profile.release]
lto = true
codegen-units = 1
panic = "abort"
opt-level = 3

# The profile the published Python wheel is built with.
#
# Identical to `release` except that it unwinds. A Python extension is
# loaded into a host process it does not own — a Jupyter kernel, a web
# worker, an orchestrator — and `panic = "abort"` means an internal Rust
# panic kills that process, along with every other extension and task in
# it, with no traceback. pyo3's boundary machinery is built around
# unwindable panics; shipping with `abort` disables that recovery model
# wholesale.
#
# This is deliberately NOT a change to `[profile.release]`. The CLI, the
# daemon, and the Node/Go/C artifacts own their processes and keep
# `abort`, where failing fast is the right call.
#
# Build the wheel with `--profile python-release`, and test the wheel
# that was built that way — a `maturin develop` (debug, unwind) run does
# not exercise the shipped configuration, so panics that only matter in
# the shipped one are invisible.
#
# That mismatch is the reason for the profile; do not read more into it.
# A tokio runtime dropped in an async context was found here, but when
# it was observed on a `--release` wheel the process survived — which an
# effective abort profile cannot do. Whether the shipped extension
# really used abort, and whether that panic caused the `0xC0000409`
# termination that started the investigation, are both unestablished.
#
# What this does NOT do: make every panic a Python exception. It makes a
# panic crossing a pyo3-invoked boundary containable, lets `catch_unwind`
# work, and turns a panicking background tokio task into a `JoinError`
# rather than an abort. A detached task that nobody joins still fails
# silently — every task whose result matters needs its `JoinHandle`
# observed and turned into a real error.
[profile.python-release]
inherits = "release"
panic = "unwind"

# `python-release` with symbols, for diagnosing panics in the shipped
# configuration.
#
# A release backtrace is useless here: every frame resolves to the
# nearest exported symbol, so a stack of thirty frames prints
# `net_validate_capabilities` thirty times. That was tried.
#
# Use this when a panic reproduces only against an installed wheel —
# same optimisation and the same panic strategy as what ships, but with
# full debug info and nothing stripped, so `RUST_BACKTRACE=full` names
# real functions. It is not a published profile.
#
#   maturin build --profile python-diagnostic --out dist --features …
#   pip install <wheel> into a clean venv
#   RUST_BACKTRACE=full PYTHONFAULTHANDLER=1 pytest -s
[profile.python-diagnostic]
inherits = "python-release"
debug = 2
strip = "none"

[profile.bench]
lto = true
codegen-units = 1
# The `bench` profile inherits its defaults from `release`, which sets
# `panic = "abort"`. A libtest/Criterion harness must unwind, so the
# bench binary is forced to `unwind` while the inherited `abort` still
# governs the lib deps (`net`, `thiserror`, `bytes`, …) — producing
# "requires panic strategy `abort` … incompatible with `unwind`" link
# errors under `cargo bench` (and `cargo test --release`). Pin the whole
# bench build graph back to `unwind`; the real release binaries keep
# `abort` via `[profile.release]`.
panic = "unwind"

# Fast compile times for development
[profile.dev]
opt-level = 0
debug = true

# Release with debug symbols for profiling
[profile.release-with-debug]
inherits = "release"
debug = true

# Maximum performance for local benchmarks
# Use: RUSTFLAGS="-C target-cpu=native" cargo build --profile native
[profile.native]
inherits = "release"
lto = "thin"  # Faster link times than full LTO
