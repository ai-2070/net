name: Web

# The docs site had no CI at all: 85 broken links shipped to production
# because nothing enumerated them, and `web/` could stop compiling without
# a single job going red. This gates the site the way `ci.yml` gates the
# crates.
on:
  push:
    branches: ["**"]
    paths:
      - "web/**"
      - ".github/workflows/web.yml"
      # The tier manifest and its checker live outside web/. Without these the
      # manifest could stop describing the tree with nothing going red — the
      # same trigger-coverage gap that let a red TypeScript job sit beside a
      # green skills publish.
      - "docs/data/**"
      - ".github/scripts/check-docs-tiers.py"
      - ".github/scripts/check-spine-symbols.py"
  pull_request:
    paths:
      - "web/**"
      - ".github/workflows/web.yml"
      # The tier manifest and its checker live outside web/. Without these the
      # manifest could stop describing the tree with nothing going red — the
      # same trigger-coverage gap that let a red TypeScript job sit beside a
      # green skills publish.
      - "docs/data/**"
      - ".github/scripts/check-docs-tiers.py"
      - ".github/scripts/check-spine-symbols.py"

jobs:
  check:
    name: Lint, links, types
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        run: npm ci

      # Cheapest and highest-signal check — runs first so a dead link
      # fails the job in seconds rather than after a full Next build.
      - name: Check doc links
        run: npm run check:docs

      # The site's release notes are generated from the crate's copy. If
      # someone edits one and not the other, this is what says so.
      - name: Check release notes are in sync
        run: npm run check:releases


      - name: Typecheck
        run: npm run check:types

      # Every page declares a migration state, the states are exhaustive and
      # disjoint over the tree, and the adaptive_pending allowlist only shrinks.
      # Runs from the repo root because the manifest is product metadata under
      # docs/data/, not part of the site.
      - name: Check the docs tier manifest and the migration ratchet
        working-directory: .
        run: |
          python3 -m pip install --quiet pyyaml
          .github/scripts/check-docs-tiers.py

      # Guards the checker rather than the manifest: plants one defect per rule
      # and requires each to be reported. It has already earned this — the first
      # run caught a path-guard bug that made the walk skip every page.
      - name: Check the tier checker still catches defects
        working-directory: .
        run: .github/scripts/check-docs-tiers.py --self-test

      # Every API symbol the composed SDK spine names resolves in its binding's
      # own tree, and appears on the page that claims it. Evidence level
      # source-match: the name exists — NOT that the example compiles or runs.
      #
      # It exists because reading a page cannot catch this class of defect. The
      # spine shipped `serve_tool(node, …)` in two bindings where the argument is
      # an RPC handle, and a Rust deadline builder that was never written. Both
      # read correctly. Both were found by opening the source.
      - name: Check every symbol the SDK spine names exists
        working-directory: .
        run: .github/scripts/check-spine-symbols.py

      - name: Check the spine-symbol checker still catches defects
        working-directory: .
        run: .github/scripts/check-spine-symbols.py --self-test

      # No lint or format step, and both omissions are deliberate:
      #
      #   - ESLint is currently broken repo-wide. `eslint-plugin-react`
      #     (via eslint-config-next) crashes under ESLint 10 with
      #     "contextOrFilename.getFilename is not a function" on every
      #     file. `next lint` is also gone in Next 16.
      #   - `prettier --check` fails on 119 files under web/, source and
      #     content alike; `npm run prettier` exists but has never been
      #     enforced.
      #
      # Both are worth fixing, and both mean touching files far outside
      # the docs — so they're their own change, not a silent side effect
      # of the first workflow to cover this directory. Adding a step that
      # fails every run would just train people to ignore it.

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: check
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        run: npm ci

      # Every docs page is statically generated, so a build failure is the
      # only thing that catches an MDX page that parses but won't render.
      - name: Build
        run: npm run build
        env:
          # The homepage pulls the GitHub release list at build time; without
          # a token the unauthenticated rate limit makes builds flaky.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
