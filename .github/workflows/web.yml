name: Web

# The docs site had no CI at all: 85 broken links shipped to production
# because nothing enumerated them, and `web/` could stop compiling without
# a single job going red. This gates the site the way `ci.yml` gates the
# crates.
on:
  push:
    branches: ["**"]
    paths:
      - "web/**"
      - ".github/workflows/web.yml"
      # The tier manifest and its checker live outside web/. Without these the
      # manifest could stop describing the tree with nothing going red — the
      # same trigger-coverage gap that let a red TypeScript job sit beside a
      # green skills publish.
      - "docs/data/**"
      - ".github/scripts/check-docs-tiers.py"
      - ".github/scripts/check-spine-symbols.py"
      - ".github/scripts/check-doc-code-width.py"
      # The C snippet check compiles doc fences against the real public
      # headers, so a header change can break it without web/ being touched.
      - ".github/scripts/check-c-doc-snippets.py"
      - ".github/scripts/check-install-version.py"
      # The one-library checker reads the skills tree and the docs tree.
      # ci.yml's copy fires on `net/**` / `go/**` and cannot see either.
      - ".claude/skills/**"
      - ".github/scripts/check-one-library-docs.py"
      - "net/crates/net/include/**"
  pull_request:
    paths:
      - "web/**"
      - ".github/workflows/web.yml"
      # The tier manifest and its checker live outside web/. Without these the
      # manifest could stop describing the tree with nothing going red — the
      # same trigger-coverage gap that let a red TypeScript job sit beside a
      # green skills publish.
      - "docs/data/**"
      - ".github/scripts/check-docs-tiers.py"
      - ".github/scripts/check-spine-symbols.py"
      - ".github/scripts/check-doc-code-width.py"
      # The C snippet check compiles doc fences against the real public
      # headers, so a header change can break it without web/ being touched.
      - ".github/scripts/check-c-doc-snippets.py"
      - ".github/scripts/check-install-version.py"
      # The one-library checker reads the skills tree and the docs tree.
      # ci.yml's copy fires on `net/**` / `go/**` and cannot see either.
      - ".claude/skills/**"
      - ".github/scripts/check-one-library-docs.py"
      - "net/crates/net/include/**"

jobs:
  check:
    name: Lint, links, types
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      # `fetch-depth: 0` for `check-install-version.py` below. It answers
      # "what is the current release?" with the newest stable unified
      # `vX.Y.Z` tag REACHABLE FROM HEAD, and the default shallow checkout
      # brings neither the tags nor the history that decides reachability.
      # The checker fails closed on a shallow clone rather than guessing, so
      # dropping this turns the job red with a prerequisite error — noisy,
      # but never a wrong "current release".
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        run: npm ci

      # Cheapest and highest-signal check — runs first so a dead link
      # fails the job in seconds rather than after a full Next build.
      - name: Check doc links
        run: npm run check:docs

      # The site's release notes are generated from the crate's copy. If
      # someone edits one and not the other, this is what says so.
      - name: Check release notes are in sync
        run: npm run check:releases


      - name: Typecheck
        run: npm run check:types

      # Every page declares a migration state, the states are exhaustive and
      # disjoint over the tree, and the adaptive_pending allowlist only shrinks.
      # Runs from the repo root because the manifest is product metadata under
      # docs/data/, not part of the site.
      - name: Check the docs tier manifest and the migration ratchet
        working-directory: .
        run: |
          python3 -m pip install --quiet pyyaml
          .github/scripts/check-docs-tiers.py

      # Guards the checker rather than the manifest: plants one defect per rule
      # and requires each to be reported. It has already earned this — the first
      # run caught a path-guard bug that made the walk skip every page.
      - name: Check the tier checker still catches defects
        working-directory: .
        run: .github/scripts/check-docs-tiers.py --self-test

      # Every API symbol the composed SDK spine names resolves in its binding's
      # own tree, and appears on the page that claims it. Evidence level
      # source-match: the name exists — NOT that the example compiles or runs.
      #
      # It exists because reading a page cannot catch this class of defect. The
      # spine shipped `serve_tool(node, …)` in two bindings where the argument is
      # an RPC handle, and a Rust deadline builder that was never written. Both
      # read correctly. Both were found by opening the source.
      - name: Check every symbol the SDK spine names exists
        working-directory: .
        run: .github/scripts/check-spine-symbols.py

      - name: Check the spine-symbol checker still catches defects
        working-directory: .
        run: .github/scripts/check-spine-symbols.py --self-test

      # Also run in ci.yml's `go-tests`, and deliberately so. The checker
      # scans four roots — `go/`, `net/crates/net/include/`, `.claude/skills/`
      # and `web/src/content/docs/` — and no single workflow's path filter
      # covers all four. ci.yml fires on `net/**` and `go/**`; this one fires
      # on `web/**` and the skills tree. Without this copy, a docs page could
      # reintroduce the exact sentence the checker exists to stop and nothing
      # would go red: that is how "eleven headers and five shared libraries"
      # survived a release on the C overview after the code side was clean.
      #
      # It is pure text against `git ls-files` — no toolchain, no network —
      # so the duplication costs seconds.
      - name: Guard — no doc claims a library that is not built
        working-directory: .
        run: |
          python3 .github/scripts/check-one-library-docs.py
          python3 .github/scripts/check-one-library-docs.py --self-test

      # Phase 1A made code blocks scroll rather than wrap, which was right and
      # has a cost nobody was watching: a line wider than the column silently
      # runs off the right edge, and a reader who does not think to scroll
      # sideways reads a truncated statement as the whole thing. 94 characters
      # fit at the widest layout (measured, not guessed); the limit is 90.
      - name: Check no code line is wider than the column that renders it
        working-directory: .
        run: .github/scripts/check-doc-code-width.py

      - name: Check the width checker still catches defects
        working-directory: .
        run: .github/scripts/check-doc-code-width.py --self-test

      # The install pages hard-code "the current published release is X" and
      # use it as a cross-layer pin instruction. It said 0.33 while every
      # registry served 0.34 — a fact with an expiry date that nothing was
      # watching. This derives the answer from the newest stable unified
      # `vX.Y.Z` tag reachable from HEAD (hence `fetch-depth: 0` above).
      #
      # Release-note FILES were the previous answer and were not one: v0.35.0
      # shipped without a `RELEASE_v0.35*.md`, so the old check went on
      # certifying pages that named 0.34. A tag is created BY publishing.
      - name: Check the install pages name the current release
        working-directory: .
        run: .github/scripts/check-install-version.py

      - name: Check the version checker still catches defects
        working-directory: .
        run: .github/scripts/check-install-version.py --self-test

      # The C quickstart shipped calling `free(cursor)` while including only
      # net.h, <stdio.h> and <string.h>, so the advertised copy-and-run program
      # did not compile. Reading it cannot catch that, and the skill-example
      # check only covers real .c files on disk — the doc-site fences had no
      # floor at all. This compiles every complete C program the docs publish,
      # against the real public headers, at the strictness a careful reader
      # would use.
      #
      # `--require-cc` because a runner without a C compiler is a broken
      # runner, not a reason to pass. Skipping is the right default locally —
      # editing markdown without a toolchain is reasonable — but in CI a
      # silent skip is a green step that checked nothing, which is the same
      # failure this gate exists to prevent one level up.
      - name: Check every published C program compiles
        working-directory: .
        run: .github/scripts/check-c-doc-snippets.py --require-cc

      - name: Check the C snippet checker still catches defects
        working-directory: .
        run: .github/scripts/check-c-doc-snippets.py --self-test --require-cc

      # No lint or format step, and both omissions are deliberate:
      #
      #   - ESLint is currently broken repo-wide. `eslint-plugin-react`
      #     (via eslint-config-next) crashes under ESLint 10 with
      #     "contextOrFilename.getFilename is not a function" on every
      #     file. `next lint` is also gone in Next 16.
      #   - `prettier --check` fails on 119 files under web/, source and
      #     content alike; `npm run prettier` exists but has never been
      #     enforced.
      #
      # Both are worth fixing, and both mean touching files far outside
      # the docs — so they're their own change, not a silent side effect
      # of the first workflow to cover this directory. Adding a step that
      # fails every run would just train people to ignore it.

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: check
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        run: npm ci

      # Every docs page is statically generated, so a build failure is the
      # only thing that catches an MDX page that parses but won't render.
      - name: Build
        run: npm run build
        env:
          # The homepage pulls the GitHub release list at build time; without
          # a token the unauthenticated rate limit makes builds flaky.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
