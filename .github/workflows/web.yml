name: Web

# The docs site had no CI at all: 85 broken links shipped to production
# because nothing enumerated them, and `web/` could stop compiling without
# a single job going red. This gates the site the way `ci.yml` gates the
# crates.
on:
  push:
    branches: ["**"]
    paths:
      - "web/**"
      - ".github/workflows/web.yml"
  pull_request:
    paths:
      - "web/**"
      - ".github/workflows/web.yml"

jobs:
  check:
    name: Lint, links, types
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        run: npm ci

      # Cheapest and highest-signal check — runs first so a dead link
      # fails the job in seconds rather than after a full Next build.
      - name: Check doc links
        run: npm run check:docs

      - name: Typecheck
        run: npm run check:types

      - name: Lint
        run: npx next lint

      # No `prettier --check` step. `npm run prettier` exists but has never
      # been enforced, and 119 files under web/ (source and content alike)
      # are currently unformatted. Turning the gate on means reformatting
      # all of them — a decision worth making on its own, not as a
      # side effect of the first workflow that happens to touch this
      # directory. Until then a check step would fail every run.

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: check
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        run: npm ci

      # Every docs page is statically generated, so a build failure is the
      # only thing that catches an MDX page that parses but won't render.
      - name: Build
        run: npm run build
        env:
          # The homepage pulls the GitHub release list at build time; without
          # a token the unauthenticated rate limit makes builds flaky.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
