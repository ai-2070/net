name: CI

on:
  push:
    # Branches only — without this filter GitHub fires `push`
    # events on tag pushes too, so every `cli-v*` / `deck-v*`
    # release tag spawns a duplicate CI run alongside its
    # release workflow. The release workflows themselves run
    # their own build + tests against the same SHA; we don't
    # need CI to repeat them per tag.
    branches: ["**"]
    paths:
      - "net/**"
      - "go/**"
      - ".github/workflows/ci.yml"
      # Three jobs here execute the skill examples — Python in `python-tests`,
      # Go and C in `go-tests` — because those are the only jobs holding the
      # maturin wheel and the libnet cdylib. Without these paths, editing an
      # example would not run the checks that execute it, and a hang could land
      # green. `skills.yml` fires on the same files for the compile floor.
      - ".claude/skills/net-event-bus/examples/**"
      - "docs/data/examples.yaml"
      # Every script under `.github/scripts/` is executed by a step of this
      # workflow — the skill-example runners (`run-skill-examples.sh`,
      # `skill_examples.py`), the C-surface text guards
      # (`check-one-library-docs.py`, `check-header-count.py`), the
      # witness/roster/ABI checkers, and the rest. Editing one must re-run
      # the step that executes it, or a loosened predicate lands green.
      # The WHOLE directory is watched rather than an enumerated list: the
      # list rots (it once omitted ten of the scripts these steps run —
      # `check-ffi-exports.py`, `check-callback-buffer-ownership.py`,
      # `check-rpc-abi-parity.py`, `go-test-with-native-stacks.sh`,
      # `check-script-permissions.py`, `check-npm-peer-range.py`,
      # `check-npm-platform-packages.py`, `check-ts-consumer.sh`,
      # `check-skill-example-ts.sh`, `check-python-wheel-features.py`)
      # and over-firing is free. The checkers' other roots
      # (`.claude/skills/`, `web/src/content/docs/`) are covered by the
      # copies in `web.yml`.
      - ".github/scripts/**"

env:
  CARGO_TERM_COLOR: always

jobs:
  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    # Wider feature set than before → larger compile; the target cache
    # keeps incremental runs fast, but leave headroom for a cold build.
    timeout-minutes: 40
    env:
      # The widest SERVICE-FREE feature set — every feature except
      # `redis` / `jetstream`, which need running service containers.
      #
      # The gating `--lib` / `--doc` run MUST stay this broad. In-source
      # `#[cfg(test)]` units behind `meshos` / `port-mapping` /
      # `nat-traversal` / `meshdb` / `dataforts` / `cli` … are otherwise
      # gated by NO job: the per-feature `integration-tests` steps pin
      # `--test <file>` (which runs only those integration binaries, not
      # the lib units), and the one job that does run them — the Coverage
      # workflow — is information-only / non-gating. Narrowing this list
      # silently drops every feature-gated unit test out of CI.
      UNIT_FEATURES: "net redex redex-disk cortex netdb meshdb meshos dataforts nat-traversal port-mapping tool batched-ingress cli regex"
      # sccache trial job #1 of 3 (see the shared note in `integration-net-core`).
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: "sccache"
      CARGO_INCREMENTAL: "0"
    defaults:
      run:
        working-directory: net/crates/net
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Set up sccache
        uses: mozilla-actions/sccache-action@v0.0.11

      # Replaces the hand-rolled `actions/cache` block this job used to carry.
      # That block keyed solely on `hashFiles('**/Cargo.lock')` with NO
      # `restore-keys`, and GitHub cache entries are immutable: the first run to
      # save under a given lockfile hash froze the target dir at that moment, and
      # every lockfile bump after it fell back to a fully cold build. The last
      # green master run missed on every single job for exactly that reason
      # (`Cache not found for input keys: Linux-cargo-…`), then recompiled the
      # whole dep graph. `rust-cache` keys on lockfile + rustc version + job and
      # carries prefix `restore-keys`, so a lockfile bump restores the previous
      # entry and rebuilds only what changed. It also prunes the target dir
      # before saving, which is what shrinks the 79-91s "Post Cache cargo"
      # upload these jobs were paying.
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: unit
          workspaces: net/crates/net -> target

      # `--lib` runs EVERY in-source `#[cfg(test)]` unit; the broad
      # `$UNIT_FEATURES` set is what makes feature-gated modules (meshos,
      # port-mapping, …) actually compile + run here rather than only in
      # the non-gating Coverage workflow.
      #
      # DELIBERATELY still `cargo test`, not `cargo nextest run`. This is one
      # large lib-test binary with thousands of tiny in-process units; nextest
      # launches a process per test, which is a clear win for the multi-node
      # integration binaries but is an open question here — process-launch
      # overhead can exceed what the parallel scheduling buys back. The measured
      # split says it would not matter much either way: on the last green master
      # run this job spent 6 minutes almost entirely in rustc. Benchmark
      # `cargo test --lib` against `cargo nextest run --lib` on one SHA
      # (compile / execution / total / peak disk / flake count) before switching;
      # the sccache + rust-cache changes above are the ones that move this job.
      - name: Run unit tests (all in-source units, full feature set)
        run: cargo test --lib --features "$UNIT_FEATURES"

      # Seven modules moved (and the routing-envelope codec)
      # into `net-mesh-wire`, taking their `#[cfg(test)] mod`s with
      # them. `--lib` above is the ROOT crate only, and no other job
      # executes this suite — clippy compiles it, the wasm job runs
      # three `wasm_bindgen_test`s. For one candidate, 196 real tests
      # stopped gating anything. Explicit and `--locked`.
      - name: Run net-mesh-wire unit tests (the moved suite)
        if: ${{ !cancelled() }}
        run: cargo test --locked -p net-mesh-wire --features json

      # …and the count/roster guard, same discipline as the witness
      # floors below: a suite that silently shrinks (a `#[cfg(test)]
      # mod` dropped in a merge, a module renamed out of the build)
      # would otherwise still exit 0 above.
      #
      # MIN is the post-move inventory. REQUIRED pins, by exact name,
      # the two `should_panic` cases (a harness that stops honouring
      # `should_panic` turns two real assertions into silent passes)
      # and one test per moved module. `stream` is absent on purpose:
      # it carries config/error/stats vocabulary and no unit tests of
      # its own — its surface is gated by the core's pinned
      # `--test stream_config_and_error_display`.
      - name: Guard — the moved wire suite is intact
        if: ${{ !cancelled() }}
        run: |
          set -o pipefail
          MIN=275
          out=$(cargo test --locked -p net-mesh-wire --features json 2>&1 | tee /dev/stderr)
          n=$(printf '%s\n' "$out" \
                | grep -oE 'test result: ok\. [0-9]+ passed' \
                | grep -oE '[0-9]+' | head -1)
          if [ -z "$n" ] || [ "$n" -lt "$MIN" ]; then
            echo "::error::expected >= $MIN net-mesh-wire unit tests, ran ${n:-0}."
            echo "These are the suites that moved out of src/adapter/net in Stage 2."
            echo "If tests were intentionally removed, lower MIN in this step in the"
            echo "same commit — do not let the gate pass vacuously."
            exit 1
          fi
          # Cardinality cannot say WHICH suite vanished. A module that
          # stopped being compiled into the test binary takes its whole
          # roster with it and still leaves a plausible-looking count.
          if ! roster=$(cargo test --locked -p net-mesh-wire --features json -- --list 2>&1); then
            echo "::error::could not list net-mesh-wire tests"
            printf '%s\n' "$roster"
            exit 1
          fi
          REQUIRED="pool::tests::build_panics_on_event_count_exceeding_cap
          pool::tests::build_subprotocol_panics_on_event_count_exceeding_cap
          protocol::tests::header_validation_field_isolation
          crypto::tests::crypto_error_display_covers_every_variant
          pool::tests::build_roundtrips_through_decrypt_with_in_place_framing
          batch::tests::test_adaptive_batcher_custom_config
          reliability::tests::adaptive_rto_rfc6298_and_clamps
          session::tests::a_refused_seal_does_not_consume_a_hop_sequence
          route_codec::tests::test_regression_routing_discriminator_survives_magic_collision_node_id
          route_hop::tests::a_duplicate_exactly_one_window_behind_is_refused"
          missing=0
          for name in $REQUIRED; do
            printf '%s\n' "$roster" | grep -qF "$name: test" || {
              echo "::error::required net-mesh-wire test missing from the roster: $name"
              missing=1
            }
          done
          [ "$missing" -eq 0 ] || exit 1
          echo "net-mesh-wire: $n tests, roster complete"

      # OLB-2B-E3c: the production routing-plane wiring witnesses
      # (`src/adapter/net/org_routing_wiring_tests.rs`, included from `mesh.rs`).
      # The step above already runs them — this one exists to make the coverage
      # NAMED and drift-detecting, the `--lib` analogue of the pinned
      # `--test <file>` discipline used for the integration binaries below.
      #
      # A filtered run that matches nothing exits 0, so "the module was renamed,
      # feature-gated, or deleted" would otherwise look identical to "it passed".
      # The count assertion is what closes that: these witnesses are the only
      # proof that ONE global drain is minted, that the dirty stream reaches the
      # real registry, that shutdown joins the routing task before returning, and
      # that the publication gate is a commit pin rather than a reconstruction
      # lock -- plus, since the E3c closure, that shutdown cannot slip between the
      # supervisor spawn and its handle publication, that revocation authority is
      # inside the currentness token, that an unserved scope reads cold rather
      # than authoritatively empty, that cached facts crossing their expiry read
      # cold, that Drop fences rather than detaching, that a concurrent shutdown
      # cannot return while routing registration is unresolved, that revocation
      # authority is pinned through installation and revalidated at read, and that
      # authority-only movement invalidates and requeues -- plus, since the
      # poison closure, that a durability POISON is immobile through settlement
      # in BOTH directions (a production recovery clear cannot land under a live
      # publication pin), and that leaving steady poison is observable: the
      # recovery wakes routing proactively AND a reader retires the stranded
      # `Unserved` reconstruction on its own -- plus, since the E3c-blockers
      # closure, that steady poison itself settles Current over an Unserved
      # source rather than retrying forever, that an empty-raise poison MARK
      # wakes routing as proactively as the clear does, and that terminal
      # authority exhaustion retires its MAX-stamped facts and fences readiness
      # independently of supervisor health -- plus, since review-pass-3, that the
      # OTHER exhaustion arm (an exhausted store publication generation, which
      # the pin ACCEPTS and only the settlement refuses) parks the actor without
      # spinning and without losing its queue, and that an EMPTY registry whose
      # authority moves inside the probe->settle window is re-driven rather than
      # stranded at `Rebuilding`, that the read seam fences a DEAD incarnation's
      # still-retained facts, and that its authority sample cannot straddle a
      # store install -- plus, since OLB-2B.3c step 2, that the node's
      # session/direct-state projection annotates a live peer's provider with
      # the exact session it is, refuses to guess when two sessions claim one
      # provider, treats a mapping without a session (and a session without a
      # mapping) as no annotation at all, moves the projection and the
      # generation naming it as ONE unit, retires exactly the pools a real peer
      # transition supersedes while preserving their discovery facts, refuses a
      # pool that is mispaired OR computed under a superseded view at the
      # validated read seam, and fences the whole pool plane fail-closed when
      # the session-generation space is spent, and that a peer transition which
      # publishes NOTHING publishes no session generation -- plus, since the
      # step-2 HOLD repair, that a peer REPLACED inside the projection build
      # cannot publish the session it replaced (both the session-id and the
      # directness components, each observable on its own, with the stable-peer
      # control), that a send in flight retains no peer shard at the instant the
      # guard is released, and that a projection and the generation naming it are
      # never observed torn -- plus, since the SECOND HOLD repair, that the
      # authoritative peer state cannot move between a build's last revalidation
      # and its store (the schedule the re-read alone does not close), and that
      # the one forwarding snapshot primitive every fan-out sends from retains no
      # peer shard, carrying its own negative control, and that the announce lock
      # an exported entry point takes is acquired under a BOUND and refuses past
      # it (design §18.0g: a wakeup lost between two statically-linked copies of
      # the crate turned that acquire into a ten-minute hang). Losing any of them
      # silently would be worse than losing them loudly.
      #
      # NOTE: they are gated `#[cfg(test)]`, NOT `feature = "fixtures"` —
      # `$UNIT_FEATURES` deliberately excludes `fixtures`, so a fixtures gate
      # would compile this module to a silent 0-test no-op here.
      - name: Sensing routing-plane wiring witnesses
        if: ${{ !cancelled() }}
        run: |
          set -o pipefail
          MIN=93
          out=$(cargo test --lib --features "$UNIT_FEATURES" \
                  org_routing_wiring_tests 2>&1 | tee /dev/stderr)
          n=$(printf '%s\n' "$out" \
                | grep -oE 'test result: ok\. [0-9]+ passed' \
                | grep -oE '[0-9]+' | head -1)
          if [ -z "$n" ] || [ "$n" -lt "$MIN" ]; then
            echo "::error::expected >= $MIN routing-plane wiring witnesses, ran ${n:-0}."
            echo "The module is src/adapter/net/org_routing_wiring_tests.rs, declared"
            echo "in mesh.rs. If witnesses were intentionally removed, lower MIN in"
            echo "this step in the same commit — do not let the gate pass vacuously."
            exit 1
          fi
          # Cardinality alone cannot tell WHICH witness vanished, so pin the
          # names of the ones that carry a security property outright.
          REQUIRED="shutdown_overlapping_registration_cannot_return_unresolved
          a_production_store_swap_cannot_publish_while_a_commit_pin_is_alive
          a_snapshot_cannot_straddle_a_store_publication
          an_authority_install_publishes_the_authority_under_its_own_epoch
          an_authority_rotation_over_the_same_store_still_publishes_inside_the_epoch
          a_handles_lockfree_read_observes_the_registrys_published_artifact
          a_stale_audience_handle_is_unserved_beside_its_installed_sibling
          a_consumer_grant_removal_cannot_occupy_the_gap_between_validation_and_settlement
          a_same_id_grant_replacement_cannot_reauthorize_captured_facts
          the_signed_grant_identity_is_part_of_scope_currentness
          the_audience_handle_is_part_of_scope_currentness
          a_grant_install_between_capture_and_commit_refuses_publication
          unrelated_grant_movement_preserves_the_exact_slot
          an_installed_grants_expiry_colds_its_facts_with_zero_providers
          installing_a_consumer_grant_wakes_the_affected_grant_slot
          removing_a_consumer_grant_wakes_the_affected_grant_slot
          consumer_grant_movement_wakes_only_the_affected_scope
          a_grant_movement_notification_runs_after_publication_and_after_release
          a_non_publishing_grant_outcome_wakes_nothing
          a_delayed_grant_notification_cannot_retire_a_successor_installation
          consumer_grant_movement_preserves_same_id_unaffected_scopes
          a_delayed_install_notification_cannot_retire_a_successor_removal_artifact
          a_delayed_install_notification_preserves_its_own_publication_artifact
          a_delayed_removal_notification_preserves_its_own_absence_artifact
          a_current_lease_removal_publishes_wakes_and_fences
          publication_exhaustion_refuses_an_install_without_publishing
          terminal_withdrawal_retires_the_last_live_identity_and_nothing_else
          a_delayed_terminal_notification_preserves_its_own_absence_artifact
          a_final_ordinary_removal_preserves_the_terminal_absence_it_caused
          a_second_installed_grant_still_withdraws_terminally_after_the_first
          a_publication_cannot_occupy_the_gap_between_validation_and_settlement
          poison_cannot_occupy_the_gap_between_validation_and_settlement
          a_recovery_poison_clear_cannot_land_under_a_publication_pin
          a_poison_recovery_retires_the_unserved_reconstruction_it_left
          a_poison_mark_that_raises_no_floor_wakes_routing_without_a_reader
          a_reader_retires_unserved_facts_once_their_poison_clears
          steady_poison_settles_current_over_an_unserved_source
          an_exhausted_store_generation_stops_certified_emission
          an_exhausted_authority_epoch_fences_rather_than_aliasing
          terminal_exhaustion_retires_max_stamped_facts_and_fences_readiness
          an_exhausted_store_generation_parks_apply_without_spinning_and_recovers
          an_empty_registry_whose_authority_moves_under_the_probe_is_redriven
          the_read_seam_fences_a_dead_incarnations_facts
          the_read_seams_authority_sample_cannot_straddle_a_store_install
          an_exhausted_scoped_generation_fences_the_routing_source
          an_unserved_scope_reads_cold_rather_than_authoritatively_empty
          a_live_peer_session_annotates_the_provider_it_resolves_to
          an_entity_claimed_by_two_live_sessions_is_never_annotated
          a_pin_without_a_live_session_annotates_nothing
          a_republication_moves_the_projection_and_its_generation_together
          a_session_transition_retires_the_pool_and_the_actor_republishes_it
          the_validated_pool_read_refuses_a_mispaired_or_superseded_pool
          an_exhausted_session_generation_fences_the_pool_plane
          a_lost_peer_install_publishes_no_session_generation
          a_peer_replaced_mid_build_cannot_publish_its_old_session
          a_stable_peer_observed_twice_still_publishes_its_row
          a_transport_flipped_mid_build_cannot_publish_its_old_directness
          a_send_in_flight_retains_no_peer_shard
          a_projection_and_its_generation_are_never_observed_torn
          a_peer_snapshot_retains_no_shard_and_drops_the_ingress_peer
          a_peer_replaced_after_revalidation_cannot_publish_its_old_session
          the_announce_lock_is_acquired_under_a_bound_and_refuses_past_it
          one_cold_capture_acquisition_spans_the_owner_and_grant_queries
          an_authority_install_during_a_cold_capture_waits_for_it
          an_unadopted_node_refuses_the_cold_capture
          a_spent_authority_epoch_refuses_the_cold_capture
          a_captured_stamp_compares_the_revocation_floor_generation
          a_cold_capture_cannot_observe_the_pre_publication_window
          a_torn_authority_vector_cannot_compare_current"
          # The pin is the witness's OWN libtest run record —
          # `test [<module>::…::]<name> ... ok`, the name as the final
          # module segment — not the bare name anywhere in the output.
          # Must-fail matrix (all rejected): a line that merely PRINTS the
          # name (an error echo, a panic message),
          # `test <name>::helper ... ok` (the name is a module segment,
          # not the test), `test <name>_extra ... ok`, `test x<name>
          # ... ok`. Must-pass: the run record itself, with or without its
          # module path. The old token regex
          # `(^|[^A-Za-z0-9_])<name>([^A-Za-z0-9_]|$)` accepted the first
          # two.
          for required in $REQUIRED; do
            if ! printf "%s" "$out" | grep -qE "^test ([A-Za-z0-9_]+::)*${required} \.\.\. ok$"; then
              echo "::error::required routing witness missing: $required"
              exit 1
            fi
          done
          echo "routing-plane wiring witnesses: $n passed (min $MIN); all named security witnesses present"

      # OLB-2B-E2/E3c: the SUPERVISOR/incarnation/crash-loop witnesses
      # (`behavior::org_routing::tests`), gated on the same count+name pattern as
      # the wiring witnesses above.
      #
      # review-pass-3 §18: this module runs in the gating `--lib` step only
      # because a2509d8a3 widened its cfg from `all(test, feature = "fixtures")`
      # to plain `test` — the exact regression that already happened once on this
      # branch. The wiring witnesses got a floor and pinned names; these got
      # nothing, so a future "clean up the fixtures seams" re-gating would drop
      # the incarnation fence, the crash-loop budget, the shutdown-ordering
      # proofs and the non-convergence backoff out of every gating job in
      # silence. Same reasoning as the note below: `$UNIT_FEATURES` excludes
      # `fixtures`, so a fixtures gate compiles this module to a silent 0-test
      # no-op here.
      - name: Sensing routing supervisor witnesses
        if: ${{ !cancelled() }}
        run: |
          set -o pipefail
          MIN=24
          out=$(cargo test --lib --features "$UNIT_FEATURES" \
                  behavior::org_routing:: 2>&1 | tee /dev/stderr)
          n=$(printf '%s\n' "$out" \
                | grep -oE 'test result: ok\. [0-9]+ passed' \
                | grep -oE '[0-9]+' | head -1)
          if [ -z "$n" ] || [ "$n" -lt "$MIN" ]; then
            echo "::error::expected >= $MIN routing supervisor witnesses, ran ${n:-0}."
            echo "The module is the #[cfg(test)] mod tests in"
            echo "src/adapter/net/behavior/org_routing.rs. If it was re-gated to"
            echo "feature = \"fixtures\", it compiles to a silent no-op in this job —"
            echo "that is the regression this floor exists to catch."
            exit 1
          fi
          REQUIRED="a_held_stream_fences_instead_of_starting_a_drainless_actor
          only_the_live_incarnations_routes_are_usable
          incarnation_overflow_fences_rather_than_reusing_an_id
          a_deterministic_fault_exhausts_the_restart_budget_and_stays_fenced
          unwind_only_a_panicking_apply_still_runs_the_fence_guard
          shutdown_inside_apply_is_never_followed_by_healthy
          cancelling_the_supervisor_drops_the_incarnation_and_frees_the_lease
          a_closed_watch_without_shutdown_is_loud_and_terminal
          a_sustained_superseded_streak_backs_off_and_reports_degraded"
          # Same run-record anchor and must-fail matrix as the wiring
          # step's pin above: printed names and
          # `test <name>::helper ... ok` must fail it.
          for required in $REQUIRED; do
            if ! printf "%s" "$out" | grep -qE "^test ([A-Za-z0-9_]+::)*${required} \.\.\. ok$"; then
              echo "::error::required routing supervisor witness missing: $required"
              exit 1
            fi
          done
          echo "routing supervisor witnesses: $n passed (min $MIN); all named security witnesses present"

      # OLB-2B.3b: the clone-family routing-state witnesses — the atomic
      # demand-set acquisition in `behavior::org_routing_registry::tests` and the
      # capability index / demand lifecycle / refusal pass-through in
      # `behavior::org_routing_state::tests`.
      #
      # Same reasoning as the two gates above, and the same failure it forecloses:
      # the broad `--lib` step already runs these, but a filtered run that matches
      # nothing exits 0, so "the module was renamed, feature-gated or deleted"
      # would be indistinguishable from "it passed". `org_routing_state` is a NEW
      # module whose entire consumer is still dark (OLB-2B.3d), which makes it
      # exactly the kind of file a future cleanup pass deletes as unreachable.
      #
      # Both filters are asserted SEPARATELY. A combined floor would let the
      # registry witnesses cover the disappearance of the whole state module.
      #
      # The registry floor also covers OLB-2B.3c: step 1's second publication
      # cell and step 2's ACTOR BUILD CYCLE — production pool construction,
      # publish-if-current against the complete source/session stamp, the
      # asymmetric two-cell invalidation in both directions, mixed-generation
      # refusal, the deferred publication-order interleaving, the scoped
      # deadline arm and the structural 256-pool bound.
      #
      # NOTE: `#[cfg(test)]`, NOT `feature = "fixtures"` — `$UNIT_FEATURES`
      # deliberately excludes `fixtures`, so a fixtures gate would compile these
      # to a silent 0-test no-op in this job.
      - name: Sensing routing-state witnesses
        if: ${{ !cancelled() }}
        run: |
          set -o pipefail
          REG_MIN=62
          STATE_MIN=41
          reg=$(cargo test --lib --features "$UNIT_FEATURES" \
                  behavior::org_routing_registry:: 2>&1 | tee /dev/stderr)
          state=$(cargo test --lib --features "$UNIT_FEATURES" \
                  behavior::org_routing_state:: 2>&1 | tee /dev/stderr)
          count() {
            printf '%s\n' "$1" | grep -oE 'test result: ok\. [0-9]+ passed' \
              | grep -oE '[0-9]+' | head -1
          }
          rn=$(count "$reg")
          sn=$(count "$state")
          if [ -z "$rn" ] || [ "$rn" -lt "$REG_MIN" ]; then
            echo "::error::expected >= $REG_MIN org_routing_registry witnesses, ran ${rn:-0}."
            echo "The module is the #[cfg(test)] mod tests in"
            echo "src/adapter/net/behavior/org_routing_registry.rs."
            exit 1
          fi
          if [ -z "$sn" ] || [ "$sn" -lt "$STATE_MIN" ]; then
            echo "::error::expected >= $STATE_MIN org_routing_state witnesses, ran ${sn:-0}."
            echo "The module is src/adapter/net/behavior/org_routing_state_tests.rs,"
            echo "included from org_routing_state.rs. If witnesses were intentionally"
            echo "removed, lower STATE_MIN in this step in the SAME commit — do not"
            echo "let the gate pass vacuously."
            exit 1
          fi
          # Cardinality cannot say WHICH witness vanished. Pin the ones carrying a
          # capacity, lifecycle, concurrency or lock-freedom property outright.
          REQUIRED="a_demand_set_past_the_family_bound_retains_nothing
          a_demand_set_past_the_node_bound_retains_nothing
          a_demand_set_over_retained_slots_costs_no_node_capacity
          an_exhausted_identity_space_refuses_a_whole_demand_set
          a_refusal_after_identities_are_considered_consumes_none
          duplicate_keys_in_a_demand_set_collapse
          the_sixty_fifth_family_handle_is_refused_without_corrupting_the_first_64
          the_two_hundred_fifty_seventh_slot_is_deterministically_unretained
          a_superseded_reader_cannot_read_a_retired_incarnations_facts
          a_common_key_reader_follows_the_successors_ownership
          a_fresh_demand_after_retirement_gets_a_fresh_cell
          a_stale_incarnation_apply_cannot_republish_a_cleared_cell
          release_one_cannot_decrement_a_reference_a_family_does_not_hold
          an_already_transferred_set_cannot_be_replaced_again
          a_demand_handle_couples_both_publication_cells
          a_demand_set_couples_both_cells_per_contributor
          retiring_the_last_reference_clears_both_cells
          a_transfer_leaves_the_common_keys_pool_published
          facts_invalidation_clears_the_derived_pool
          a_stale_observation_invalidates_neither_plane
          installing_newer_facts_clears_the_superseded_pool
          a_replacement_successor_stays_index_aligned_across_both_planes
          an_actor_pass_publishes_the_pool_it_derived
          an_unserved_reconstruction_publishes_no_pool_but_a_served_empty_one_does
          a_session_view_that_moved_during_the_build_publishes_no_pool
          a_source_that_moved_during_the_build_publishes_neither_plane
          a_pool_cannot_compose_two_session_generations
          session_movement_clears_the_pool_and_preserves_the_facts
          an_obsolete_session_invalidator_cannot_delete_a_newer_pool
          session_movement_does_not_requeue_a_slot_with_no_pool
          an_exhausted_session_generation_publishes_no_pool_without_spinning
          no_reader_can_observe_a_pool_beside_foreign_facts
          an_authority_deadline_with_zero_providers_retires_both_planes_and_rearms
          the_two_hundred_fifty_seventh_slot_can_publish_no_pool"
          # Same run-record anchor and must-fail matrix as the wiring
          # step's pin above: printed names and
          # `test <name>::helper ... ok` must fail it.
          for required in $REQUIRED; do
            if ! printf "%s" "$reg" | grep -qE "^test ([A-Za-z0-9_]+::)*${required} \.\.\. ok$"; then
              echo "::error::required org_routing_registry witness missing: $required"
              exit 1
            fi
          done
          REQUIRED_STATE="a_discover_grant_with_no_installed_audience_is_not_a_demand
          an_invoke_only_grant_is_not_a_source_demand
          a_rotated_audience_handle_is_not_leased_under_its_own_id
          a_warmed_lookup_takes_no_lock
          a_warmed_lookup_completes_while_the_mutation_lock_is_held
          concurrent_misses_acquire_one_demand_set
          concurrent_rederivations_spend_one_demand_set
          a_spent_family_budget_refuses_from_the_registry_every_time
          a_wide_refusal_does_not_poison_residual_capacity
          a_full_node_refuses_every_attempt_until_a_retirement
          a_narrowed_demand_warms_on_a_full_node_without_a_retirement
          identity_exhaustion_refuses_a_set_that_needs_a_new_slot
          identity_exhaustion_does_not_refuse_a_set_of_existing_slots
          the_family_bound_counts_demands_not_capabilities
          a_refused_entry_retains_no_partial_demand
          a_newly_leased_audience_joins_a_warmed_entry
          a_removed_audience_leaves_a_warmed_entry
          a_rotated_audience_replaces_the_scope_it_supersedes
          a_rotated_away_scope_is_not_retained_under_its_own_id
          a_refused_rederivation_leaves_the_entry_exactly_as_it_was
          a_current_warmed_entry_with_a_leased_audience_takes_no_lock
          the_capability_index_derives_exactly_what_the_full_scan_derives
          a_narrowing_replacement_at_the_family_bound_is_charged_net
          a_same_width_rotation_at_the_family_bound_is_charged_net
          a_rotation_at_the_node_bound_retires_the_slot_it_transfers
          a_rotation_at_the_node_bound_refuses_when_the_old_slot_is_shared
          identity_exhaustion_during_a_replacement_refuses_with_no_effect
          a_narrowing_replacement_needs_no_identity_after_exhaustion
          a_shared_old_replacement_succeeds_when_the_sharer_releases
          the_under_lock_miss_recheck_validates_the_callers_snapshot
          the_under_lock_miss_recheck_sees_a_removal
          the_under_lock_miss_recheck_sees_a_rotation
          the_under_lock_miss_race_retains_the_newest_snapshot
          a_stalled_older_install_cannot_overwrite_a_newer_removal
          a_stalled_older_removal_cannot_overwrite_a_newer_install
          a_terminal_snapshot_cannot_be_overwritten_by_an_ordinary_one
          two_snapshots_at_one_revision_are_refused_as_an_invariant_breach
          unrelated_newer_movement_advances_freshness_without_churn
          dropping_the_state_releases_every_demand"
          # Same run-record anchor and must-fail matrix as the wiring
          # step's pin above: printed names and
          # `test <name>::helper ... ok` must fail it.
          for required in $REQUIRED_STATE; do
            if ! printf "%s" "$state" | grep -qE "^test ([A-Za-z0-9_]+::)*${required} \.\.\. ok$"; then
              echo "::error::required org_routing_state witness missing: $required"
              exit 1
            fi
          done
          echo "OLB-2B.3b: $rn registry (min $REG_MIN) + $sn state (min $STATE_MIN) passed; all named witnesses present"

      # SELECTOR ↔ TARGET ORG INTAKE (organization exact-provider sensing, the
      # intake slice only). The org-sensing authority gate is the single
      # admission transaction that turns an attacker-controlled 0x0C02 org
      # registration frame into a validated object, so every refusal arm is a
      # security property. This step gates two things:
      #
      #   * `behavior::sensing::org_gate::tests` — the gate's own witnesses,
      #     including the selector ↔ target relation and the authority-free
      #     shape phase;
      #   * `mesh::sensing_authority_witness_tests` — the PRODUCTION dispatch
      #     ordering witness, plus the LOCAL-ORIGIN organization lease-egress
      #     witnesses: an own-org exact lease registers under the
      #     organization-derived proven root (never `sensing_local_root`), the
      #     exactness rule holds on egress, a foreign audience never enters the
      #     org path, a node without authority cannot produce an org lease, and
      #     the legacy lease path is unchanged.
      #
      # This step gates local-origin org lease EGRESS. It does NOT gate
      # projection, ranking, refresh workers, `OrgClient` wiring or any
      # production arm lighting — none of that exists yet.
      #
      # WHY THIS SHAPE. An earlier revision parsed the first
      # `test result: ok. N passed` it could find and checked required names
      # with a substring `grep -q`. Both were spoofable: a test NAME or a panic
      # message containing the summary text could supply the count, and
      # `<required>_extra` satisfied a substring match for `<required>`. The
      # replacement is structurally exact on four independent axes:
      #
      #   0. FAIL CLOSED ON STATUS. Every cargo invocation's exit status is
      #      captured and checked. `accept_exact_run` takes the status as its
      #      FIRST argument and rejects a nonzero one BEFORE reading any output,
      #      so success-looking text can never rescue a failed command — the
      #      previous shape could, because `out=$(cargo ...)` discarded the
      #      status and only the text was examined. An adversarial SELF-TEST at
      #      the top of the step executes that exact predicate against a
      #      nonzero command carrying perfect success text and fails the step if
      #      it is accepted, so this property is proven per run, not asserted.
      #   1. INVENTORY comes from `-- --list`, which EXECUTES NOTHING, so no
      #      test output exists to inject a summary line at all. Each line is
      #      exactly `<fully::qualified::name>: test` and is matched anchored at
      #      both ends with a name charset (`[a-z0-9_]`) that cannot contain
      #      `: test`. A stray diagnostic cannot match `^…$`. The self-test also
      #      runs this pattern against injected/indented/prefixed/decorated
      #      lines and requires zero matches.
      #   2. EXISTENCE of each required witness is an anchored full-path match
      #      against that same inventory, so `<name>_extra` is a different
      #      string and fails.
      #   3. EXECUTION is ONE `-- --exact <fqn> <fqn> …` run naming every
      #      required witness, asserting the zero exit status AND
      #      `running <N> tests` AND a `<N> passed; 0 failed; 0 ignored`
      #      summary for the roster's own N — status, cardinality and verdict
      #      pinned separately. libtest applies `--exact` to every filter, so
      #      `<name>_extra` is not matched; a name that matches NOTHING lowers
      #      the passed count below N and fails the step (verified: libtest
      #      exits 0 with a smaller count when a filter matches nothing, which
      #      is precisely why the count, not the status, carries this proof).
      #      This replaced 58 separate `cargo test` invocations of the same
      #      already-built binary; the roster, the cardinality and the verdict
      #      are unchanged.
      #
      # `cargo test` has NO retry mechanism at all, so no ordering or race
      # witness here can be retried into green (retries exist only under nextest
      # via `.config/nextest.toml`). This job deliberately stays on `cargo test`
      # — see the note at the top of the job.
      #
      # NOTE: `#[cfg(test)]`, NOT `feature = "fixtures"` — `$UNIT_FEATURES`
      # deliberately excludes `fixtures`, so a fixtures gate would compile these
      # modules to a silent 0-test no-op here.
      #
      # FLOOR accounting (verified against `cargo test --lib --features
      # "$UNIT_FEATURES" -- --list`, NOT by hand):
      #   org_gate                        = 60
      #     42 baseline + 7 (selector-target intake) + 5 (local-origin planner)
      #     + 6 (publication-pinned fence, off-lock relay crypto window)
      #   sensing_authority_witness_tests = 67
      #     28 baseline + 1 (dispatch ordering) + 6 (local org lease egress)
      #     + 4 (lease-egress hold repair) + 10 (transition order, release
      #     coherence, phase-2 coverage, currentness fence)
      #     + 2 (release-through-fence, provenance ordering)
      #     + 3 (acquisition transaction: partitioned-tightening restoration,
      #     the partition-to-restoration authority race, the refused
      #     remote-provider inverse)
      #     + 7 (exact-head HOLD repair: 3 inbound-admission fence, 3 bounded
      #     egress + terminal lifecycle, 1 terminal lease identity)
      #     + 5 (exact-head RE-REVIEW repair: grace-expiry settlement, concurrent
      #     teardown, cancelled teardown, the parked-creation/shutdown race, the
      #     parked-enqueue/close race)
      #     + 1 (exact-head THIRD-review repair: post-abort cancellation
      #     recovered and retired exactly once, split off the drain-cancellation
      #     leg it used to share)
      #     The three RETIRED witnesses are already netted out of the groups
      #     above: the two manual-wrapper guard witnesses (replaced by the
      #     production-observed ones) and the cached-floor "rollback plane"
      #     witness (replaced by the two destructive-partition witnesses in the
      #     acquisition-transaction line). The groups sum to 67 = MESH_MIN; keep
      #     it that way when editing.
      # The mesh line previously read 35 while MESH_MIN read 39 — the arithmetic
      # drifted from the pin. Re-derive both from `--list` when you change them.
      #
      # REQUIRED holds 58 names (18 gate + 40 mesh). Count with the loops below,
      # not by eye: a prior comment claimed 34, which was neither the roster size
      # nor any derived figure.
      #
      # A later slice RAISES a floor and APPENDS its names in the same commit
      # that adds the witnesses — never separately, or the gate goes red on a
      # name that does not exist yet. Likewise, RETIRING a witness removes its
      # name here in the same commit, or the anchored existence check fails on a
      # name that no longer exists.
      - name: Selector-target org intake witnesses
        if: ${{ !cancelled() }}
        run: |
          set -uo pipefail
          GATE=adapter::net::behavior::sensing::org_gate::tests
          MESH=adapter::net::mesh::sensing_authority_witness_tests
          GATE_MIN=60
          MESH_MIN=67

          die() { echo "::error::$1"; shift; [ "$#" -gt 0 ] && printf '%s\n' "$@"; exit 1; }

          # ACCEPTANCE PREDICATE for the batch exact-test run. Takes the
          # command's EXIT STATUS first and rejects a nonzero status BEFORE
          # looking at any output, so no amount of success-looking text can
          # rescue a failed command. The expected COUNT is the roster size, so
          # a filter that matched nothing — libtest's silent-skip hazard, which
          # exits 0 — fails here. Factored out precisely so the adversarial
          # self-test below exercises this exact code, not a paraphrase of it.
          accept_batch_run() {   # $1=status  $2=output  $3=expected count
            [ "$1" -eq 0 ] || return 1
            printf '%s\n' "$2" | grep -qE "^running $3 tests?\$" || return 1
            printf '%s\n' "$2" \
              | grep -qE "^test result: ok\. $3 passed; 0 failed; 0 ignored;" || return 1
            return 0
          }

          # ---- ADVERSARIAL SELF-TEST, run before anything is trusted.
          # A command that exits NONZERO while printing perfect success text
          # must be rejected; the same text with status 0 must be accepted;
          # and a run that passed FEWER tests than the roster names — the
          # shape a renamed or deleted witness produces — must be rejected
          # even though libtest exited 0.
          spoof=$(printf 'running 2 tests\ntest adapter::x ... ok\ntest result: ok. 2 passed; 0 failed; 0 ignored; 0 measured; 0 filtered out\n')
          if accept_batch_run 1 "$spoof" 2; then
            die "self-test FAILED: a nonzero command with spoofed success text was accepted"
          fi
          if ! accept_batch_run 0 "$spoof" 2; then
            die "self-test FAILED: a zero-status run with valid success text was rejected"
          fi
          if accept_batch_run 0 "$spoof" 3; then
            die "self-test FAILED: a run covering fewer tests than the roster was accepted — this is the silent-skip hazard"
          fi
          short=$(printf 'running 1 test\ntest result: ok. 1 passed; 0 failed; 0 ignored; 0 measured; 57 filtered out\n')
          if accept_batch_run 0 "$short" 58; then
            die "self-test FAILED: a 1-of-58 run was accepted as the full roster"
          fi
          ignored=$(printf 'running 2 tests\ntest result: ok. 1 passed; 0 failed; 1 ignored; 0 measured; 0 filtered out\n')
          if accept_batch_run 0 "$ignored" 2; then
            die "self-test FAILED: an #[ignore]d witness was accepted as executed"
          fi
          # And the anchored inventory pattern must ignore injected/decorated
          # lines: only a bare, fully-qualified `<fqn>: test` line counts.
          inject=$(printf 'test result: ok. 999 passed; 0 failed\n    %s::indented: test\nnote: %s::prefixed: test\n%s::bad!char: test\n%s::suffixed: test extra\n' "$GATE" "$GATE" "$GATE" "$GATE")
          spoof_n=$(printf '%s\n' "$inject" | grep -cE "^${GATE}::[a-z0-9_]+: test\$" || true)
          if [ "$spoof_n" != "0" ]; then
            die "self-test FAILED: anchored inventory matched $spoof_n injected line(s), expected 0"
          fi
          echo "self-test: fail-closed-on-status, short-roster/ignored rejection and anchored-inventory checks all reject spoofs"

          # (1) structural inventory — `--list` EXECUTES NOTHING, so there is no
          #     test output at all to inject a summary line into. Fail closed on
          #     the cargo status itself.
          if ! list=$(cargo test --lib --features "$UNIT_FEATURES" -- --list 2>&1); then
            die "cargo test -- --list failed" "$list"
          fi
          gate_n=$(printf '%s\n' "$list" | grep -cE "^${GATE}::[a-z0-9_]+: test\$" || true)
          mesh_n=$(printf '%s\n' "$list" | grep -cE "^${MESH}::[a-z0-9_]+: test\$" || true)
          echo "inventory: $gate_n in org_gate::tests (min $GATE_MIN), $mesh_n in sensing_authority_witness_tests (min $MESH_MIN)"
          if [ "${gate_n:-0}" -lt "$GATE_MIN" ]; then
            die "expected >= $GATE_MIN witnesses in $GATE, listed ${gate_n:-0}" \
                "Module: the #[cfg(test)] mod tests in src/adapter/net/behavior/sensing/org_gate.rs." \
                "If witnesses were intentionally removed, lower GATE_MIN in this step in the" \
                "same commit — do not let the gate pass vacuously."
          fi
          if [ "${mesh_n:-0}" -lt "$MESH_MIN" ]; then
            die "expected >= $MESH_MIN witnesses in $MESH, listed ${mesh_n:-0}" \
                "Module: mod sensing_authority_witness_tests in src/adapter/net/mesh.rs." \
                "Same rule as above."
          fi

          # (2)+(3) anchored existence + exact single-test execution, per name.
          GATE_REQUIRED="local_org_admission_refuses_a_selector_that_does_not_name_the_target
          every_non_exact_selector_shape_is_refused_at_intake
          the_selector_target_refusal_bumps_protocol_invalid_and_creates_no_row
          the_selector_target_check_precedes_every_other_authority_refusal
          an_exact_selector_naming_the_target_is_admitted_unchanged
          an_emitted_local_org_frame_passes_the_intake_gate_unmodified
          the_shape_phase_refuses_a_malformed_selector_with_no_authority_input
          the_local_org_planner_emits_only_the_org_variant_with_its_own_membership
          the_local_org_planner_refuses_an_audience_it_did_not_derive
          the_local_org_planner_refuses_a_selector_that_does_not_name_the_target
          a_membership_for_another_org_yields_no_local_egress_plan
          an_emitted_local_org_lease_frame_passes_the_real_intake_gate
          the_fence_pins_the_store_rather_than_sampling_it
          a_floor_publication_landing_in_the_fence_window_never_reaches_the_mutation
          a_poison_landing_in_the_fence_window_never_reaches_the_mutation
          the_relay_crypto_window_runs_with_org_install_released
          an_authority_swap_during_the_relay_crypto_window_is_view_changed
          an_a_b_a_rotation_during_the_relay_crypto_window_is_view_changed"
          # The production dispatch-ordering + LOCAL LEASE EGRESS witnesses:
          MESH_REQUIRED="a_malformed_selector_is_refused_before_any_authority_snapshot
          an_own_org_exact_lease_registers_under_the_org_proven_root
          an_own_org_lease_refuses_a_selector_that_does_not_name_the_target
          a_foreign_org_audience_never_enters_the_local_org_egress
          a_node_without_org_authority_cannot_produce_an_org_lease
          a_legacy_audience_lease_still_registers_under_the_local_root
          an_org_audience_sensing_lease_is_never_laundered_into_a_legacy_frame
          releasing_the_strictest_org_holder_reauthors_at_the_relaxed_cadence
          an_authority_swap_inside_the_capture_window_creates_no_org_row
          a_floor_raise_inside_the_capture_window_creates_no_org_row
          a_self_provider_org_lease_requires_selector_exactness
          a_later_org_transition_cannot_overtake_a_parked_earlier_one
          a_final_deregister_cannot_be_resurrected_by_a_racing_registration
          a_surviving_holder_release_without_authority_is_refused_and_changes_nothing
          a_final_org_release_without_authority_still_tears_the_row_down
          an_owner_org_swap_cannot_reclassify_an_existing_org_lease
          a_below_floor_membership_refuses_a_surviving_holder_release
          a_legacy_lease_stays_legacy_after_an_authority_arrives
          the_production_transaction_identifies_each_guard_it_holds
          a_final_release_reaches_phase_two_holding_nothing
          a_floor_raise_between_preparation_and_the_fence_refuses_the_release
          a_partitioned_tightening_restores_the_row_and_never_moves_the_registry
          an_authority_change_during_a_refused_tightening_leaves_one_state
          a_refused_remote_acquisition_moves_nothing_and_emits_nothing
          an_authority_loss_duplicate_cannot_strand_a_final_release
          an_install_attempted_inside_the_fence_cannot_precede_the_mutation
          a_stale_capture_window_emits_no_frame_at_all
          an_inbound_org_row_mutation_cannot_interleave_with_a_publication
          a_floor_publication_winning_the_inbound_fence_creates_no_row
          a_poison_winning_the_inbound_fence_creates_no_row
          a_stuck_org_send_retires_at_the_deadline_and_the_next_advances
          a_shutdown_egress_can_be_neither_created_nor_enqueued
          an_enqueue_after_close_is_refused_and_strands_no_queue
          an_exhausted_lease_identity_space_moves_no_row_and_keeps_incumbents
          a_grace_expiry_settles_and_releases_every_outstanding_datagram
          concurrent_teardowns_both_observe_settlement
          a_cancelled_teardown_leaves_the_consumer_recoverable
          a_creation_parked_under_the_cell_cannot_be_overtaken_by_shutdown
          an_enqueue_holding_the_queue_lock_blocks_close
          a_post_abort_cancellation_is_recovered_and_retired_exactly_once"

          # (2) ANCHORED EXISTENCE, per name, against the non-executing
          #     inventory: exactly one full-path match, so `<name>_extra` is a
          #     different string and a duplicate record is visible.
          exact_args=""
          roster_n=0
          for fqn in $(printf '%s\n' $GATE_REQUIRED | sed "s|^|${GATE}::|") \
                     $(printf '%s\n' $MESH_REQUIRED | sed "s|^|${MESH}::|"); do
            hits=$(printf '%s\n' "$list" | grep -cE "^${fqn}: test\$" || true)
            if [ "$hits" != "1" ]; then
              die "required witness not found exactly once by anchored full path: $fqn (matched $hits)"
            fi
            exact_args="$exact_args $fqn"
            roster_n=$((roster_n + 1))
          done

          # (3) ONE run naming every required witness. libtest takes many
          #     filters and applies `--exact` to all of them, so this executes
          #     the roster and nothing else; the count is what proves each one
          #     actually ran, since a filter matching nothing would otherwise
          #     be an exit-0 no-op.
          # shellcheck disable=SC2086
          out=$(cargo test --lib --features "$UNIT_FEATURES" -- --exact $exact_args 2>&1)
          st=$?
          if ! accept_batch_run "$st" "$out" "$roster_n"; then
            die "the $roster_n pinned witnesses did not all run and pass (cargo exit $st)" "$out"
          fi
          echo "  exact: $roster_n pinned witnesses ran and passed in one run"

          # Whole-module runs, so a witness cannot be green in isolation while
          # broken beside its siblings. Fail closed on status here too.
          if ! gate_out=$(cargo test --lib --features "$UNIT_FEATURES" "${GATE}::" 2>&1); then
            die "whole-module run failed for $GATE" "$gate_out"
          fi
          if ! mesh_out=$(cargo test --lib --features "$UNIT_FEATURES" "${MESH}::" 2>&1); then
            die "whole-module run failed for $MESH" "$mesh_out"
          fi
          echo "selector-target org intake: self-test + inventory + anchored existence + one batch exact run of $roster_n witnesses + whole-module runs all green"

      # The retained organization exact-provider DEMAND and REFRESH witnesses
      # (`src/adapter/net/behavior/org_sensing_demand.rs`). Same discipline as
      # the step above and for the same reason: these are `#[cfg(test)]` units,
      # so a bare `cargo test --lib -- <filter>` that matched nothing would exit
      # 0 and the coverage loss would be silent.
      #
      # The roster is DERIVED from `--list`, not asserted against a hand count:
      # the floor is "every listed witness must run and pass, and there must be
      # at least the ones this slice named". No future floor is inherited.
      - name: Organization sensing demand + refresh witnesses
        if: ${{ !cancelled() }}
        run: |
          set -uo pipefail
          DEMAND=adapter::net::behavior::org_sensing_demand::tests

          die() { echo "::error::$1"; shift; [ "$#" -gt 0 ] && printf '%s\n' "$@"; exit 1; }

          # `--list` EXECUTES NOTHING, so there is no test output to inject a
          # summary line into. Fail closed on cargo's own status.
          if ! list=$(cargo test --lib --features "$UNIT_FEATURES" -- --list 2>&1); then
            die "cargo test -- --list failed" "$list"
          fi
          # NOT deduplicated: the exactly-once check below is only honest if a
          # duplicated record is visible as a duplicate.
          listed=$(printf '%s\n' "$list" | grep -E "^${DEMAND}::[a-z0-9_]+: test\$" \
                     | sed "s|^${DEMAND}::||; s|: test\$||" | sort)
          n=$(printf '%s\n' "$listed" | grep -c . || true)
          echo "inventory: $n witness(es) in $DEMAND"

          # The invariants this slice is accountable for. Each must be present
          # exactly once; the module may grow beyond them freely.
          #
          # The HOLD-repair outcomes are in here by name: shared-installation
          # retirement, refused-release ownership, node binding, transactional
          # convergence, discovery provenance, stale/postponed re-arm, the
          # in-transaction no-mutation baseline, and cancellation-safe teardown.
          #
          # SECOND-review outcomes, likewise: carried-ownership validation,
          # stale-vs-live retention capacity, capacity-exempt reinstatement,
          # aged-installation adoption, executor fairness under a
          # continuously-due schedule, and a nonempty verified discovery
          # population.
          #
          # THIRD-review outcomes: the ticket/installation/freshness triple
          # coming from one acquisition transaction, membership-based carry
          # validation, adoption of an already-aged row, discharge of retained
          # ownership at the invalidation that killed it, no capacity rejection
          # of a live ticket, and in-window rederivation of a NONEMPTY
          # population.
          #
          # FOURTH-review outcomes: a coherent one-read ownership observation
          # (no cross-observation invariant to trip on legitimate movement),
          # ledger admission closed against the invalidation that discharges
          # it, and a CALLER-path witness that catches a family which stops
          # consuming the acquisition's returned facts.
          #
          # FIFTH-review outcome: the adoption schedule decision is observed
          # under the schedule guard that took it, so a completed renewal's
          # re-arm can never be mistaken for the initial adoption arm.
          REQUIRED="only_the_last_family_owner_retires_retained_demand
          a_nonfinal_family_retirement_keeps_the_shared_installation_refreshing
          a_refused_retirement_release_keeps_the_holder_and_recovers_it
          a_family_only_touches_the_node_it_was_minted_for
          concurrent_convergences_of_one_capability_leak_nothing
          reconciliation_preserves_the_surviving_holders_installation
          a_refused_provider_does_not_cost_the_others_their_demand
          a_retention_without_live_authority_retains_nothing
          the_family_capability_bound_refuses_and_evicts_nothing
          a_population_derived_under_a_moved_view_is_re_derived
          a_verified_discovery_population_retains_and_follows_floor_movement
          an_invalidated_installation_is_reacquired_not_carried_forward
          a_stale_retained_release_cannot_hold_capacity_against_a_live_one
          a_failed_retry_reinstates_its_ticket_even_at_capacity
          a_refresh_renews_without_acquiring_a_holder
          a_rival_acquisition_inside_a_refresh_window_is_not_a_violation
          a_refresh_never_resurrects_retired_or_superseded_demand
          a_stale_rearm_cannot_displace_its_successor
          a_joining_holder_cannot_postpone_a_live_renewal
          adopting_an_unarmed_installation_renews_it_at_once
          an_authority_rotation_renews_and_a_foreign_owner_refuses
          the_single_worker_refreshes_every_retained_installation
          an_earlier_arm_shortens_a_live_park
          a_nanosecond_horizon_cannot_starve_the_runtime
          a_cancelled_refresh_close_leaves_a_recoverable_worker
          an_acquisition_reports_its_own_installation_and_freshness
          a_carried_ticket_is_validated_by_membership_not_identity
          adopting_an_aged_installation_renews_before_it_expires
          an_invalidation_discharges_the_releases_it_killed
          a_fresh_admission_at_the_ceiling_keeps_its_live_ticket
          a_nonempty_population_is_rederived_when_the_view_moves_in_window
          an_invalidation_during_carry_validation_is_legitimate_movement
          an_admission_after_its_invalidation_owns_nothing
          a_concurrent_establishment_cannot_make_a_join_look_established
          a_completed_rearm_is_not_the_adoption_decision"
          required_n=$(printf '%s\n' $REQUIRED | grep -c .)
          if [ "$n" -lt "$required_n" ]; then
            die "expected at least $required_n witnesses in $DEMAND, listed $n" \
                "Module: the #[cfg(test)] mod tests in" \
                "src/adapter/net/behavior/org_sensing_demand.rs." \
                "If witnesses were intentionally removed, remove their names here in the" \
                "same commit — do not let the gate pass vacuously."
          fi
          for required in $REQUIRED; do
            hits=$(printf '%s\n' "$listed" | grep -cE "^${required}\$" || true)
            if [ "$hits" != "1" ]; then
              die "required demand/refresh witness not found exactly once: $required (matched $hits)"
            fi
          done

          # WHOLE-MODULE run, fail closed on status, and every LISTED witness
          # must have passed — the count comes from the inventory above, so an
          # added witness is covered without editing this step.
          out=$(cargo test --lib --features "$UNIT_FEATURES" "${DEMAND}::" 2>&1)
          st=$?
          printf '%s\n' "$out"
          [ "$st" -eq 0 ] || die "whole-module run failed for $DEMAND (cargo exit $st)"
          if ! printf '%s\n' "$out" | grep -qE "^test result: ok\. $n passed; 0 failed;"; then
            die "the whole-module run did not pass exactly the $n inventoried witnesses"
          fi
          echo "organization sensing demand + refresh: $n witness(es) listed, $required_n pinned by name, all green"

      # Doctests live in `///` comment blocks across `src/` and `sdk/src/`.
      # `cargo test --lib` does not execute them — they need a separate
      # `cargo test --doc` invocation. Same broad feature set so doc
      # examples gated on any feature compile + run.
      - name: Run doctests
        if: ${{ !cancelled() }}
        run: cargo test --doc --features "$UNIT_FEATURES"

      # `deck` is a separate workspace member (TUI operator console).
      # It's a binary-only package — `[[bin]]` with no `[lib]` — so
      # `--lib` / `--doc` would fail with "no library targets found".
      # Its `#[test]` modules live alongside the binary sources;
      # `--bins` compiles them into the binary's test harness.
      - name: Run Deck unit tests
        if: ${{ !cancelled() }}
        run: |
          set -o pipefail
          cargo test -p net-deck --bins 2>&1 | tee /tmp/deck.log
          ran=$(grep -c '^test .* \.\.\. ok$' /tmp/deck.log || true)
          echo "deck unit tests: $ran"
          # Floor = what THIS command reports (33), with net-deck's
          # `default = []` (deck/Cargo.toml). The tree carries 35 test
          # attributes (the ICE column's ledger + rollup tests
          # among them); two of the 35 are feature-gated out of this
          # command by design and are excluded from the floor deliberately
          # and by name:
          #   * `the_rollup_the_anchor_column_renders_carries_an_ingested_anchor`
          #     — app.rs, `#[cfg(feature = "webrtc")]` ("off by default");
          #   * `demo_boots_and_logs_appear` — demo/spawn.rs via `mod demo`,
          #     `#[cfg(feature = "demo")]` in main.rs ("dev-only").
          # A floor the pinned command cannot reach (35) false-reds every
          # run and guards nothing; the floor's real purpose — a suite that
          # silently shrinks — is served only by the measured count. Floors
          # follow measured counts: re-measure this exact command
          # and its exact `grep -c` shape when tests move.
          if [ "$ran" -lt 33 ]; then
            echo "::error::net-deck ran $ran tests, floor is 33 — \
          lower the floor deliberately or restore the witness"
            exit 1
          fi

  # ===================================================================
  # Integration suite — split across parallel jobs by FEATURE FAMILY.
  # ===================================================================
  #
  # This used to be ONE job running 14 nextest groups back to back on a single
  # runner, on the theory that sharing a runner shares the compile. It does not:
  # every group passes a different `--features` set, so cargo re-fingerprints
  # and rebuilds `net-mesh` and relinks the test binaries between groups.
  #
  # The measured split on the last green master run was stark — 21 minutes of
  # wall clock against 107 SECONDS of actual test execution (the sum of every
  # nextest `Summary` line). `Dataforts blob e2e` took 71s to run 2 tests in
  # 0.043s; `Transport error-code mirror` 71s to run 7 tests in 0.6s. The steps
  # that happened to reuse the previous step's feature set were the fast ones
  # (`Sensing` 30s, `MeshDB` 3s, `MeshOS + Deck` 4s). Nearly all of the rest was
  # repaid rustc.
  #
  # So the groups are dealt out across parallel jobs, each holding as few
  # DISTINCT feature sets as possible, sized to finish at roughly the same time.
  #
  # Feature sets are NOT merged to shrink that count. Several of these
  # boundaries ARE the gate: the in-memory `dataforts` group is separate from
  # `dataforts redex-disk` precisely so the in-memory paths are proven to
  # compile without the on-disk ones, and `--no-default-features`-shaped
  # distinctions like the bare Bus + FFI group exist for the same reason.
  # Nextest's `--partition` sharding is deliberately unused for that same
  # reason — it would require flattening these into one union-feature build,
  # which would silently retire every one of those distinctions.
  #
  # Cost trade: more aggregate runner minutes, much less wall clock. sccache
  # (below) is what keeps the repeated dependency compilation from eating the
  # difference.

  integration-guard:
    name: Integration test pin guard
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: net/crates/net
    steps:
      - uses: actions/checkout@v7

      # Every OTHER test surface in this workflow is auto-discovered
      # (`cargo test -p <crate>` / bare `pytest` / `go test ./...`), so a
      # new test file there is picked up for free. The `integration-*`
      # jobs are the sole exception: they pin `--test <name>` explicitly,
      # per feature group, to keep the crate from recompiling once per
      # test binary. The cost of that is a silent failure mode — a new
      # `tests/*.rs` runs in NO job until someone remembers to edit this
      # file, and nothing complains. `unit-tests` is `--lib` (never touches `tests/`) and
      # the Coverage workflow, which does auto-discover, only fires on
      # master + PRs and is pinned informational — so on a feature branch
      # an unpinned test is gated by nothing at all.
      #
      # This guard closes that. Any new `tests/*.rs` must either appear in
      # a `--test` flag in one of the `integration-*` jobs below, or be
      # added to UNPINNED_OK with a reason. It runs as its OWN job so the
      # answer arrives in ~15s rather than behind a runner that is busy
      # compiling, and so it stays a single check no matter how the
      # feature families below are re-dealt.
      - name: Guard — every tests/*.rs is pinned to a step
        run: |
          # Tests that intentionally run nowhere in THIS workflow.
          UNPINNED_OK="
          integration_redis      # required-features=[redis]; needs a service container
          integration_jetstream  # required-features=[jetstream]; needs a service container
          natsim                 # runs in natsim.yml (privileged netns harness, --ignored)
          "
          # Scrape the real pins and ATTRIBUTE each one to the crate its
          # invocation targets. `--test <name>` is resolved against the crate
          # the invoking step runs in, so a pin only proves coverage for THAT
          # crate: an explicit `-p <package>` (resolved to the crate it names,
          # so a redundant `-p net-mesh` on a root step is still the root
          # crate), else the step's own `working-directory`, else the job
          # default. Without that attribution a root test would count as
          # pinned merely because an SDK step names the same basename, and a
          # pin placed under the wrong crate's directory (which names a real
          # target somewhere else) would survive as if it covered something.
          #
          # Forms this attribution cannot resolve are REFUSED rather than
          # guessed: a `working-directory:` declared after the `run:` block it
          # would apply to, and a shell `cd` inside a run block before its
          # pins. Both make the effective crate of a `--test` ambiguous to a
          # line-ordered read, and a wrong guess is exactly the silent hole
          # this guard exists to close. A `-p` that names neither crate is
          # reported the same way.
          #
          # Comment lines and this step's own `echo` prose are dropped first:
          # both mention the flag by name and would be scraped as bogus
          # targets.
          sed '/^[[:space:]]*#/d' "$GITHUB_WORKSPACE/.github/workflows/ci.yml" \
            | grep -v 'echo ' \
            | awk '
                # FOLD YAML folded block scalars (`run: >`) onto one physical line.
                #
                # The attribution pass below carries command context across a
                # continuation only when the line ends in a backslash, which is how a
                # LITERAL block (`run: |`) writes one. A FOLDED block never has one -
                # YAML joins its lines itself - so `incargo` was cleared after the first
                # line and a `-p` sitting on any later line was never read. The pin then
                # kept the crate derived from the working directory, which is how a test
                # could be attributed to the wrong crate and counted as covering it.
                #
                # A blank line inside a folded block is a paragraph break, i.e. a real
                # newline in the folded result and therefore a separate command, so it
                # ends the current line instead of joining across it.
                function emit() { if (buf != "") { print buf; buf = "" } }
                /^[[:space:]]*run:[[:space:]]*>/ {
                  emit()
                  match($0, /^[[:space:]]*/); findent = RLENGTH
                  folding = 1
                  next
                }
                folding {
                  if ($0 ~ /^[[:space:]]*$/) { emit(); next }
                  match($0, /^[[:space:]]*/); cur = RLENGTH
                  if (cur > findent) {
                    if (buf == "") { buf = $0 }
                    else { t = $0; sub(/^[[:space:]]+/, "", t); buf = buf " " t }
                    next
                  }
                  emit(); folding = 0
                }
                { print }
                END { emit() }
              ' \
            | awk '
                function crate_of_dir(dir) {
                  if (dir == "net/crates/net") return "root"
                  if (dir == "net/crates/net/sdk") return "sdk"
                  if (dir == "net/crates/net/cli") return "cli"
                  return "dir:" (dir == "" ? "<repo root>" : dir)
                }
                function crate_of_pkg(pkg) {
                  if (pkg == "net-mesh") return "root"
                  if (pkg == "net-mesh-sdk") return "sdk"
                  if (pkg == "net-cli") return "cli"
                  return "pkg:" pkg
                }
                function package_on(line) {
                  if (match(line, /-p [A-Za-z0-9_-]+/)) {
                    return substr(line, RSTART + 3, RLENGTH - 3)
                  }
                  return ""
                }
                /^  [A-Za-z0-9_-]+:[[:space:]]*$/ {
                  jobdir=""; stepdir=""; insteps=0
                  crate=""; incargo=0; steppinned=0; stepcd=0
                  next
                }
                /^    steps:[[:space:]]*$/ { insteps=1; next }
                /^      - / {
                  stepdir=""; crate=""; incargo=0; steppinned=0; stepcd=0
                }
                /working-directory:/ {
                  sub(/^.*working-directory:[[:space:]]*/, "")
                  sub(/[[:space:]]+$/, "")
                  if (insteps) {
                    if (steppinned) {
                      print "unsupported\ta working-directory declared after the run block it applies to"
                    }
                    stepdir=$0
                  } else {
                    jobdir=$0
                  }
                  next
                }
                {
                  line = $0
                  if (line ~ /cargo (test|nextest (run|list))/) {
                    incargo=1
                    pkg = package_on(line)
                    crate = (pkg != "" ? crate_of_pkg(pkg) \
                                       : crate_of_dir(stepdir != "" ? stepdir : jobdir))
                  } else if (incargo) {
                    # A package flag on a CONTINUATION line selects the crate
                    # just as one on the command line does.
                    pkg = package_on(line)
                    if (pkg != "") { crate = crate_of_pkg(pkg) }
                  }
                  if (line ~ /(^|[[:space:](])cd [^[:space:]]/) { stepcd=1 }
                  rest = line
                  while (match(rest, /--test [a-z0-9_]+/)) {
                    name = substr(rest, RSTART + 7, RLENGTH - 7)
                    if (stepcd) {
                      print "unsupported\ta shell cd precedes this pin, so its crate is ambiguous: " name
                    } else {
                      print (crate == "" ? "unattributed" : crate) "\t" name
                    }
                    steppinned=1
                    rest = substr(rest, RSTART + RLENGTH)
                  }
                  if (line !~ /\\[[:space:]]*$/) { incargo=0 }
                }
              ' | sort -u > /tmp/pinned_by_crate.txt
          awk -F'\t' '$1 == "root" { print $2 }' /tmp/pinned_by_crate.txt \
            | sort -u > /tmp/pinned_root.txt
          awk -F'\t' '$1 == "sdk" { print $2 }' /tmp/pinned_by_crate.txt \
            | sort -u > /tmp/pinned_sdk.txt
          awk -F'\t' '$1 == "cli" { print $2 }' /tmp/pinned_by_crate.txt \
            | sort -u > /tmp/pinned_cli.txt
          awk -F'\t' '$1 != "root" && $1 != "sdk" && $1 != "cli" { print $1 ": " $2 }' \
            /tmp/pinned_by_crate.txt | sort -u > /tmp/pinned_foreign.txt
          printf '%s\n' "$UNPINNED_OK" | awk '{print $1}' | grep -v '^$' | sort -u > /tmp/allowed.txt
          # One inventory per crate. The root crate's `tests/` are the ones
          # that MUST be pinned (the `integration-*` jobs pin explicitly). The
          # SDK's `tests/` (`rust-sdk-tests`) and net-cli's (`cli-tests`) are
          # auto-discovered whole-crate, so they are NOT required to appear
          # here — but a pin against either must still name a real test of
          # that crate. That is what lets a scoped run like the keychain
          # step's `--test local_target_inspection` exist without leaving a
          # silent hole behind it: rename that binary and this guard names
          # the break instead of cargo. The next crate that needs a scoped
          # pin joins here and in the two crate maps above.
          ls tests/*.rs | sed 's|tests/||; s|\.rs$||' | sort -u > /tmp/present_root.txt
          ls sdk/tests/*.rs | sed 's|sdk/tests/||; s|\.rs$||' | sort -u > /tmp/present_sdk.txt
          ls cli/tests/*.rs | sed 's|cli/tests/||; s|\.rs$||' | sort -u > /tmp/present_cli.txt
          # UNATTRIBUTABLE pins first, because they are the CAUSE of any
          # inventory verdict below: a pin this read cannot resolve to a crate
          # covers nothing, so the tests it was meant to cover would otherwise
          # be reported as merely unpinned and the real reason - a foreign
          # crate, an unknown package selector, or a form this attribution
          # refuses to guess at - would be left for the reader to find.
          if [ -s /tmp/pinned_foreign.txt ]; then
            echo "::error::CI pin(s) that name no crate this guard inventories, or a form it will not guess at:"
            sed 's/^/  /' /tmp/pinned_foreign.txt
            echo ""
            echo "Attribution resolves an explicit '-p <package>' to its crate,"
            echo "else the step's own working-directory, else the job default."
            echo "A working-directory declared after its run block, and a shell"
            echo "cd before a pin, are refused rather than guessed."
            exit 1
          fi
          missing=$(comm -23 /tmp/present_root.txt <(sort -u /tmp/pinned_root.txt /tmp/allowed.txt))
          if [ -n "$missing" ]; then
            echo "::error::Integration test(s) present in tests/ but pinned to no CI step:"
            printf '  %s\n' $missing
            echo ""
            echo "Add each to the matching feature group below (check the file's"
            echo "#![cfg(...)] gate — a test listed under a feature set that does not"
            echo "satisfy it compiles to a silent 0-test binary), or to UNPINNED_OK."
            exit 1
          fi
          # The reverse drift, checked per crate: a pin that names no test in
          # the crate ITS OWN invocation runs in fails that run with a
          # confusing cargo error, so name it here instead. A pin attributed to
          # any other crate (or to no invocation at all) covers nothing this
          # guard inventories and is reported the same way.
          stale=$(
            comm -13 /tmp/present_root.txt /tmp/pinned_root.txt | sed 's/^/root: /'
            comm -13 /tmp/present_sdk.txt /tmp/pinned_sdk.txt | sed 's/^/sdk: /'
            comm -13 /tmp/present_cli.txt /tmp/pinned_cli.txt | sed 's/^/cli: /'
            cat /tmp/pinned_foreign.txt
          )
          if [ -n "$stale" ]; then
            echo "::error::CI pins --test target(s) that name no test in the crate their own invocation runs in:"
            printf '%s\n' "$stale" | sed 's/^/  /'
            exit 1
          fi
          echo "OK: $(wc -l < /tmp/present_root.txt) root + $(wc -l < /tmp/present_sdk.txt) sdk + $(wc -l < /tmp/present_cli.txt) cli test files; $(wc -l < /tmp/pinned_root.txt) root pin(s) + $(wc -l < /tmp/pinned_sdk.txt) sdk pin(s) + $(wc -l < /tmp/pinned_cli.txt) cli pin(s), each attributed to its own crate."

  # --- Family A: bare bus/FFI + net mesh -------------------------------
  integration-net-core:
    name: Integration — net core (bus/FFI, mesh, capability, subnets, migration, nRPC dispatch)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # sccache trial, part 2 of 3 (with `unit-tests` and `rust-sdk-tests`).
      # All five `integration-*` family jobs carry this block — they are
      # collectively the one job this trial covers.
      #
      # These jobs are compile-bound, not test-bound, so a compiler-object cache
      # is the lever that actually moves them — and unlike the target-dir cache
      # it survives across the differing feature sets and across the parallel
      # jobs this suite was just split into, which is what keeps the split from
      # costing what it saves.
      #
      # `CARGO_INCREMENTAL: 0` is mandatory alongside it, not incidental: cargo's
      # incremental state is large and fragile in CI (it is what produced the
      # disk-full metadata corruption locally), and sccache only caches
      # non-incremental compiler invocations, so leaving it on would silently
      # bypass the cache for exactly the crates we care about.
      #
      # sccache's GHA backend shares the repo's 10 GB Actions cache quota with
      # `rust-cache`. If eviction pressure shows up, that is the first thing to
      # look at. The action prints hit/miss stats at job end — check them before
      # widening this to the remaining Rust jobs.
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: "sccache"
      CARGO_INCREMENTAL: "0"
    defaults:
      run:
        working-directory: net/crates/net
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Set up sccache
        uses: mozilla-actions/sccache-action@v0.0.11

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: integration-net-core
          workspaces: net/crates/net -> target

      # nextest gives us per-test process isolation, smarter scheduling,
      # and `--no-fail-fast` semantics across grouped test binaries.
      # Tests below are batched by feature set so cargo recompiles the
      # library at most once per group instead of once per `--test` flag.
      #
      # `--no-tests=fail` is on every group. A test file listed under a feature
      # set that does not satisfy its `#![cfg]` compiles to an EMPTY test binary
      # and passes vacuously — the same silent-coverage hole the pin guard and
      # the `windows-security-tests` job already close. An empty filterset is
      # now an error, not a pass.
      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: nextest

      # redis and jetstream integration tests are intentionally skipped:
      # `required-features = ["redis" | "jetstream"]` in Cargo.toml excludes
      # them from compilation under this feature set. Wire them in separately
      # once CI service containers are added.

      # === Bus + FFI =======================================================
      # `doc_link_guard` rides here because it needs no features and is pure
      # filesystem work (~1s) — it costs nothing on a compile unit that is
      # already being built, and a doc guard that runs nowhere is a doc guard
      # that rots.
      #
      # FEATURE GRAPH: this step used to pass no `--features` at all, which
      # was never "no features" — cargo still applies `default = [net,
      # nat-traversal, cortex, meshdb, meshos, dataforts]` (Cargo.toml:103-110)
      # unless `--no-default-features` is given, and it is not. The only
      # difference from the next step was `fixtures`, so the two steps paid for
      # TWO full crate compiles and two mass relinks to exercise the same
      # library. They now share one graph. The genuine
      # "compiles without <feature>" proofs — the ones that need
      # `--no-default-features` to mean anything — live in the
      # `narrow-feature-check` job, which asserts them properly for the first
      # time.
      - name: Bus + FFI
        if: ${{ !cancelled() }}
        run: >
          cargo nextest run --no-fail-fast --no-tests=fail --features fixtures
          --test bus_shutdown_drain
          --test bus_stranded_flush
          --test ffi_shutdown_race
          --test ffi_poll_buffer
          --test doc_link_guard
          --test org_cold_plan_surface_guard

      # === Net mesh + capability + discovery + migration + nRPC dispatch ==
      # Same graph as the step above (`default + fixtures`), so this reuses
      # that compile instead of forcing a second one.
      - name: Net mesh, capability, subnets, migration, nRPC dispatch
        if: ${{ !cancelled() }}
        run: >
          cargo nextest run --no-fail-fast --no-tests=fail --features fixtures
          --test integration_net
          --test three_node_integration
          --test channel_auth
          --test channel_auth_hardening
          --test channel_auth_origin_binding
          --test channel_identity_readiness
          --test connect_post_start
          --test handshake_retry_resync
          --test failure_detector_matrix
          --test parallel_bind_stress
          --test peer_death_evicts_peer_map
          --test send_subprotocol_malformed
          --test subnet_enforcement
          --test subnet_axis_demotion
          --test subnet_gateway_auth
          --test subnet_gateway_local_auth
          --test subnet_grant
