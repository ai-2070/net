          gcc -shared -fPIC -o /tmp/libnapi_stub.so /tmp/napi_stub.c

      - name: Run tests (node — napi symbols stubbed)
        if: matrix.crate.name == 'node'
        working-directory: ${{ matrix.crate.path }}
        env:
          RUSTFLAGS: "-C link-arg=-Wl,--unresolved-symbols=ignore-all -C link-arg=-Wl,--allow-shlib-undefined"
          LD_PRELOAD: "/tmp/libnapi_stub.so"
        run: |
          cargo test --lib ${{ matrix.crate.features }}
          cargo test --doc ${{ matrix.crate.features }}

      # The python entry needs no napi-style stub: the crate follows
      # pyo3's optional-extension-module pattern (see its Cargo.toml),
      # so a plain `cargo test` build links the host libpython like
      # any normal crate and the test binary runs standalone. Linking
      # `-lpython3.X` needs the unversioned `.so` symlink from
      # python3-dev; the runner image normally ships it, so this is a
      # cheap guard rather than an unconditional install.
      - name: Ensure libpython is linkable (python)
        if: matrix.crate.name == 'python'
        run: |
          dpkg -s python3-dev >/dev/null 2>&1 || {
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends python3-dev
          }

      # `--doc` as well as `--lib`. Doctests were never run for these
      # crates, and rustdoc treats an INDENTED block in a doc comment as
      # Rust — so a Python usage snippet compiles as Rust, fails, and
      # nobody finds out. `net-python` had accumulated two that broke
      # `cargo test` for anyone running it locally.
      #
      # It costs almost nothing: these crates' doc examples are fenced
      # ```python / ```text, so rustdoc compiles none of them. The value
      # is entirely in catching the next unfenced one.
      - name: Run tests
        if: matrix.crate.name != 'node'
        working-directory: ${{ matrix.crate.path }}
        run: |
          cargo test --lib ${{ matrix.crate.features }}
          cargo test --doc ${{ matrix.crate.features }}

      # org-ffi is the one FFI crate with INTEGRATION targets — the C
      # live cell, which drives the real C ABI end to end (net_mesh_new
      # from JSON, net_mesh_arc_clone per consuming call, the net_subnet_*
      # admin + serve entry points, net_org_credentials_new / _bind /
      # _call_exported, and a process-wide handler trampoline) against the
      # same generated scenario the Node, Python, and Go cells load. The
      # `--lib` step above does not reach those.
      #
      # `--test '*'` on purpose, not `--test <name>`: auto-discovery means a
      # future integration test here runs for free, which is exactly the
      # silent-skip failure mode the "Integration test pin guard" job exists
      # to catch for the core crate's by-name pins. Nothing to enforce if
      # nothing is pinned by name.
      - name: Run integration tests (org-ffi — the C ABI live cell)
        if: matrix.crate.name == 'go-org-ffi'
        working-directory: ${{ matrix.crate.path }}
        run: cargo test --test '*'

  cli-tests:
    # `net-cli`'s test surface is broader than the FFI shims:
    # unit tests inside `src/`, plus integration-test crates under
    # `tests/` that spawn the binary via `assert_cmd`. The crate
    # has no lib target, so `cargo test --lib` would silently skip
    # everything; `cargo test -p net-cli` runs every target cargo
    # auto-discovers, so a new `tests/foo.rs` doesn't need a CI
    # edit.
    #
    # Current surface (informational; not a check):
    #
    #   src/main.rs                  — humantime duration parser
    #   src/output.rs                — format resolver
    #   src/error.rs                 — exit-code discriminator pin
    #   src/parsers.rs               — parse_u64_flexible
    #   src/commands/ice.rs          — confirmation-gate logic
    #   src/commands/identity.rs     — iso8601 formatter
    #   tests/help.rs                — help-text + version surface
    #   tests/exit_codes.rs          — documented exit codes
    #   tests/dry_run.rs             — admin verb `--dry-run` envelope
    name: Net CLI tests
    runs-on: ubuntu-latest
    # Two full net-cli runs (~9 min each: default and rtc-bootstrap), the
    # keychain branch, then the crash-recovery step's own `fixtures` build.
    # 20 minutes cancelled that last step mid-compile (V3 S5/S6 heads).
    timeout-minutes: 35
    defaults:
      run:
        working-directory: net/crates/net
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: cli
          workspaces: net/crates/net -> target

      # Toolchains for the typegen downstream type-checks (E-2 / E-3). Without
      # these, tests/typegen_downstream_{ts,python}.rs self-skip; installing
      # them here makes those checks actually run.
      - name: Install Node + TypeScript
        uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Install tsc
        run: npm install -g typescript@6

      - name: Install Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install mypy + pydantic
        run: python -m pip install --upgrade mypy "pydantic>=2,<3"

      - name: Run net-cli tests
        run: |
          set -o pipefail
          cargo test -p net-cli 2>&1 | tee /tmp/cli_default.log
          # MCP uses two CLI mesh nodes; the native leg uses SDK nodes and a
          # sequential capture CLI. Neither is two-computer evidence. Pin
          # authorization + contract witnesses so they cannot silently vanish.
          for t in two_node_mcp_consent_then_authorized_invocation \
                   two_node_mcp_pin_does_not_override_provider_owner_scope \
                   native_typed_call_and_generated_consumer_reuse_captured_contract_offline \
                   two_node_protected_native_denial_then_authorized_typed_call; do
            grep -q "test $t ... ok" /tmp/cli_default.log || {
              echo "::error::$t did not run"; exit 1; }
          done

      # `cargo test -p net-cli` above builds default features, so the
      # anchor-directory witness (`#![cfg(feature = "rtc-bootstrap")]`)
      # is compiled out of it entirely. Run the crate again WITH the
      # feature, and name the two tests: a filter that matches nothing
      # still exits 0, which is the silent-skip hazard this repo has
      # been bitten by twice. No `--test` pin — the integration-test
      # guard requires pins only for the root crate's `tests/`, and `net-cli` is
      # auto-discovered by design.
      - name: Run net-cli tests with rtc-bootstrap
        run: |
          set -o pipefail
          cargo test -p net-cli --features rtc-bootstrap 2>&1 | tee /tmp/cli_rtc.log
          for t in anchor_ls_lists_a_live_announcing_anchor_and_not_a_plain_peer \
                   anchor_ls_without_a_daemon_refuses_rather_than_printing_nothing; do
            grep -q "test $t ... ok" /tmp/cli_rtc.log || {
              echo "::error::$t did not run"; exit 1; }
          done

      # `keychain` (the OS-keychain secret value store) is explicitly
      # non-default — `cli/Cargo.toml`: "NOT a default: it pulls the `keyring`
      # dependency" — and it CHANGES THE ARGUMENT SURFACE: `forwarding
      # set-value --inspect-target` exists only under
      # `#[cfg(feature = "keychain")]`. So `if cfg!(feature = "keychain")` in
      # `policy_and_pin_execution_use_inspected_paths_and_defaults_stay_distinct`
      # is never true in either step above, its `else` branch is all that ever
      # executes, and half the witness is silently dropped on every run: wrong
      # `keychain_service` / `keychain_account`, wrong stdin provenance, a
      # flipped `ignored_profile_remote_defaults`, or `forwarding set-value`
      # accepting an invalid keychain account all pass today. This step runs the
      # gated branch; the default run above covers the `else` branch, so both
      # halves execute.
      #
      # Scoped to `--test local_target_inspection` — the binary that owns the
      # gated branch — rather than a whole-crate sweep like the `rtc-bootstrap`
      # step above. Deliberate and narrower, not an oversight. Checked and NOT
      # the reason: a whole-crate run would very likely stay green —
      # `readme_commands` extracts only fenced commands (README's keychain
      # example is prose) and `help_is_self_contained` asserts repo-file and
      # installed-binary-name hygiene, not flag sets. The real grounds are cost
      # and verifiability: cargo fingerprints per feature set, so this is a full
      # rebuild either way, but an unscoped `cargo test -p net-cli` additionally
      # LINKS every integration-test binary — ~40 large executables plus PDBs —
      # which produced `LNK1180: insufficient disk space to complete link` on a
      # workstation and is a material extra cost inside this job's 20-minute
      # budget. Raise the scope only together with the job timeout.
      #
      # The name pin is the same silent-skip guard used for the four journey
      # witnesses above: `cargo test -- <filter>` exits 0 when it matches
      # nothing, so a rename would turn an unpinned run into a green no-op.
      #
      # Headless-safe: `forwarding set-value --inspect-target` returns before
      # any `KeychainSecretBackend` is built (`cli/src/commands/forwarding.rs`),
      # so it is inspect-only and never opens a keyring. `net-mesh-mcp`'s
      # `keychain` path is pure Rust on Linux (kernel keyutils; no libdbus), so
      # no system library is needed here.
      - name: Run net-cli keychain inspection branch
        run: |
          set -o pipefail
          cargo test -p net-cli --features keychain --test local_target_inspection \
            2>&1 | tee /tmp/cli_keychain.log
          for t in policy_and_pin_execution_use_inspected_paths_and_defaults_stay_distinct; do
            grep -q "test $t ... ok" /tmp/cli_keychain.log || {
              echo "::error::$t did not run"; exit 1; }
          done

      # Crash recovery at the real durable-write transitions (NET_CLI_PLAN_V3
      # decision 7). `tests/enrollment_crash.rs` is `#![cfg(feature =
      # "fixtures")]`: the `fixtures` feature compiles the core's crash points
      # into `EnrollmentStorage` replacement, and no other run here enables
      # it — so without this step the binary compiles to zero tests and every
      # run above is silently green without it. Scoped to that one binary (a
      # feature set is a full rebuild; see the keychain step's cost note), and
      # each witness is pinned by name: a rename must fail here, not vanish.
      - name: Run net-cli crash-recovery witnesses (fixtures)
        run: |
          set -o pipefail
          cargo test -p net-cli --features fixtures --test enrollment_crash             2>&1 | tee /tmp/cli_crash.log
          for t in an_operator_crash_after_the_issuance_commit_is_recovered_not_reissued                    an_operator_crash_before_the_issuance_commit_issues_exactly_once_on_retry                    a_device_crash_after_installing_its_bundle_resumes_without_redeeming_again; do
            grep -q "test $t ... ok" /tmp/cli_crash.log || {
              echo "::error::$t did not run"; exit 1; }
          done

      # The relay TCP-tunnel fallback through real subprocesses (NET_CLI_PLAN_V3
      # S8). The UDP block on `relay serve` is a `fixtures` seam, so the witness
      # is `#[cfg(feature = "fixtures")]` and only this step runs it; the same
      # build as the step above, so no extra feature-set rebuild.
      - name: Run net-cli relay TCP-tunnel witness (fixtures)
        run: |
          set -o pipefail
          cargo test -p net-cli --features fixtures --test relay_join             2>&1 | tee /tmp/cli_relay_tcp.log
          for t in a_relay_whose_udp_is_blocked_is_reached_over_its_tcp_tunnel; do
            grep -q "test $t ... ok" /tmp/cli_relay_tcp.log || {
              echo "::error::$t did not run"; exit 1; }
          done

  aggregator-daemon-tests:
    # `net-aggregator-daemon` is a lib + bin crate. The lib hosts
    # the `boot` / `run` entry points + config parsing + template
    # validation; the bin is a thin `Cli::parse + run` shim. Unit
    # tests live in `src/lib.rs`'s `#[cfg(test)] mod tests`;
    # integration tests live in `tests/boot_and_query.rs` and
    # drive a real two-node mesh handshake against the daemon's
    # registry-RPC surface. `cargo test -p net-aggregator-daemon`
    # picks up every target automatically — new `tests/foo.rs`
    # entries don't need a CI edit.
    name: Aggregator daemon tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: net/crates/net
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: aggregator-daemon
          workspaces: net/crates/net -> target

      - name: Run net-aggregator-daemon tests
        run: cargo test -p net-aggregator-daemon

  mcp-tests:
    # `net-mesh-mcp` is the MCP <-> mesh bridge adapter. By doctrine
    # it rides on the public `net-mesh-sdk` surface ONLY — the
    # `tests/dependency_boundary.rs` test asserts that boundary, so a
    # regression that reaches past the SDK fails this job. Unit tests
    # live in each `src/**` module's `#[cfg(test)] mod tests`; the
    # `tests/*.rs` integration tests stand up real one/two/three-node
    # meshes (wrap provider + demand-side gateway, incl. a ~20s
    # three-node failover). They spawn the conformance server via
    # `CARGO_BIN_EXE_net-mcp-fixture`, which builds only under the
    # `fixture` feature (kept out of the published artifact), so both
    # commands below pass `--features fixture`. A new fixture-spawning
    # `tests/foo.rs` needs a `[[test]] required-features = ["fixture"]`
    # entry in `Cargo.toml`; a non-fixture test is still auto-discovered.
    #
    # Clippy is `--lib --bins`, NOT `--all-targets`: production code is
    # held to `-D warnings` with `unwrap_used` / `expect_used` denied
    # (see the crate's `[lints.clippy]`), but the integration tests
    # legitimately use `unwrap` / `expect`, so linting test targets
    # under `-D warnings` would fail by design. This is why the crate
    # gets a dedicated job rather than a `ffi-clippy` matrix entry
    # (that matrix hardcodes `--all-targets`).
    name: MCP adapter tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: net/crates/net
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: mcp
          workspaces: net/crates/net -> target

      - name: Run clippy (production code, strict)
        run: cargo clippy -p net-mesh-mcp --lib --bins --features fixture -- -D warnings

      # The `keychain` feature (OS-keychain secret value backend for credential
      # forwarding) is non-default — the published artifact and the tests
      # below never compile it. Build-check it here so its Linux path
      # (pure-Rust kernel keyutils; no libdbus / C system lib) can't silently
      # rot. It is a compile/lint check only, not a test run: the keychain
      # tests need a usable keyring, so building is what catches a break.
      - name: Run clippy (keychain feature, compile check)
        if: ${{ !cancelled() }}
        run: cargo clippy -p net-mesh-mcp --lib --features keychain -- -D warnings

      - name: Run net-mesh-mcp tests
        if: ${{ !cancelled() }}
        run: cargo test -p net-mesh-mcp --features fixture

  windows-security-tests:
    # The ONLY job on a Windows runner.
    #
    # Every other job here is `ubuntu-latest`, which meant every
    # `#[cfg(windows)]` assertion in the tree was dead code: it never
    # compiled, never linked, never ran. That is precisely inverted from where
    # the risk is — Windows is the platform where the file-permission model is
    # WEAKEST for this crate. There is no 0600, so `owner-audience.key`
    # confidentiality rests entirely on the authority directory's DACL and on
    # a stderr warning, and both of those were untested in CI.
    #
    # Concretely, this job is what gates:
    #
    #   * `validate_dacl_view` — the owner check (a foreign owner holds
    #     implicit WRITE_DAC and can re-open the boundary after validation
    #     passes) and the non-simple-ACE fail-closed rule (object / callback
    #     ALLOW ACEs are real grants and were silently skipped);
    #   * `read_object_security` — the binary GetFileSecurityW walk;
    #   * `write_atomic`'s protected-DACL provisioning and the
    #     `<non-simple-ace>` sentinel contract;
    #   * `cli/tests/org_grant.rs`'s two `#[cfg(windows)]` witnesses, which
    #     are the ONLY coverage of `warn_secret_permissions` — the entire
    #     Windows substitute for the 0600 guarantee.
    #
    # Scoped to the org/authority surface rather than the whole matrix: the
    # goal is to gate the platform-specific SECURITY code, not to double the
    # CI bill re-running cross-platform logic ubuntu already covers.
    name: Windows security tests
    runs-on: windows-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: net/crates/net
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: winsec
          workspaces: net/crates/net -> target

      # nextest here for the same reasons the ubuntu jobs use it, plus two
      # that are specific to this job (see `.config/nextest.toml`):
      #
      #   * `slow-timeout` / `terminate-after` turn a hung test into a NAMED
      #     failure. Under plain `cargo test` a hang consumed this job's whole
      #     40-minute budget with no indication of which test stalled — the
      #     exact failure the nextest config was written to prevent, which
      #     this job was bypassing by not using nextest.
      #   * the `retries = 0` override applies to the security suites, so a
      #     deliberate-race regression cannot be retried into a green run.
      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: nextest

      # The lib units carry the DACL validator witnesses (org_authority) plus
      # the authority/revocation/ingest suites. `--features net` is the
      # narrowest set that compiles the org modules.
      #
      # Two hazards, both learned the hard way:
      #
      #  1. `adapter::net::behavior::org` is a PREFIX, and not every
      #     security-relevant module lives under it. `org_admission_gate` sits
      #     at `adapter::net::org_admission_gate` — one level up — and was
      #     silently excluded. Both surfaces are named explicitly below.
      #
      #  2. `cargo test -- <filter>` exits **0** when the filter matches
      #     NOTHING, so a module rename turned this job into a green no-op —
      #     the identical silent-coverage failure that the "every tests/*.rs is
      #     pinned to a step" guard in the integration job exists to prevent.
      #     That guard was never applied to its own neighbour. `--no-tests=fail`
      #     closes it natively: an empty filterset is an error, not a pass.
      #     It is RUN-WIDE, though, so the two surfaces below run as TWO
      #     invocations — a union would hide one arm's empty filterset behind
      #     the other arm's tests, which is exactly how `org_admission_gate`
      #     got silently excluded in the first place.
      #
      # `enrollment_storage` is split into its own step below for the same
      # reason, instead of riding as a third arm of a union: `--no-tests=fail`
      # fires only when the WHOLE filter selects nothing, so a rename or
      # feature-gating of `enrollment_storage` alone would drop that arm to
      # zero while the other surfaces still matched and the step stayed green.
      # Isolated, its disappearance is loud.
      - name: Org + authority unit tests
        shell: bash
        run: |
          set -euo pipefail
          cargo nextest run --features net --lib --no-tests=fail \
            -E 'test(/^adapter::net::behavior::org/)'
          cargo nextest run --features net --lib --no-tests=fail \
            -E 'test(/^adapter::net::org_admission_gate/)'

      # Enrollment storage: the protected snapshot owner's type boundary
      # (private fields, non-Clone, `&mut self` writes, `Busy` on second
      # ownership) and FS boundary (`ensure_secure_authority_dir`,
      # uid/mode/nlink/ACL checks, `open_regular_nofollow`, atomic publish
      # with `Uncertain` fencing on post-rename failure).
      # `.config/nextest.toml` already pins these `retries = 0` as
      # security-critical; a SOLO `--no-tests=fail` filter is what turns a
      # module rename or a silent gating-out into a red step rather than a
      # green no-op. No count floor needed — an empty filterset is the error.
      - name: Enrollment storage unit tests
        if: ${{ !cancelled() }}
        run: >
          cargo nextest run --features net --lib --no-tests=fail
          -E 'test(/^adapter::net::behavior::enrollment_storage::/)'

      # The CLI's Windows witnesses: the DACL warning on `--discover`, and the
      # case-variant no-clobber guard (NTFS is case-insensitive, so a
      # case-variant `--out` names the SAME file as the org key — the exact
      # aliasing the lexical guard cannot catch).
      # This full-crate run includes the journey witnesses, and two of them
      # REQUIRE Python + Pydantic v2 on PATH rather than skipping when it is
      # missing: `native_contract_workflow` and `protected_native_workflow`
      # assert `import pydantic; major == 2` before doing anything. The ubuntu
      # `cli-tests` job installs both; windows-latest's preinstalled Python
      # does not carry pydantic, so without this step the Windows run is red.
      # mypy additionally stops `typegen_downstream_python` from silently
      # self-skipping here.
      - name: Install Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install mypy + pydantic
        run: python -m pip install --upgrade mypy "pydantic>=2,<3"

      - name: Net CLI tests
        run: cargo nextest run -p net-cli --no-tests=fail

      # Windows-only production paths must also LINT here: the DACL reader is
      # `#[cfg(windows)]`, so the ubuntu clippy job never sees it.
      - name: Clippy (production, strict)
        run: cargo clippy --features net --lib --bins -- -D warnings

  fmt:
    name: Format
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: net/crates/net
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --all -- --check

  doc:
    name: Documentation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: net/crates/net
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: doc
          workspaces: net/crates/net -> target

      - name: Build documentation
        run: cargo doc --no-deps --all-features
        env:
          RUSTDOCFLAGS: -D warnings

      # `cargo doc --all-features` only docs the current package
      # (the root `net-mesh` crate). Workspace members live in
      # their own crates; `net-cli` and `deck` both have
      # substantial module-level docstrings that document the
      # subcommand / TUI surface contracts — keep them
      # warning-free.
      - name: Build net-cli documentation
        run: cargo doc -p net-cli --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

      - name: Build deck documentation
        run: cargo doc -p net-deck --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

      - name: Build net-aggregator-daemon documentation
        run: cargo doc -p net-aggregator-daemon --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

      # `net-mesh-sdk` is a substantial workspace member with most
      # of the user-facing AI tool / nrpc / mesh / netdb docstrings.
      # Pinning `--features full` so the full doc surface (tool +
      # macros + nrpc + cortex + compute + groups + meshos + deck
      # + dataforts + meshdb + aggregator + local + nat-traversal
      # + redis + jetstream) is verified warning-free in lockstep
      # with the `ffi-clippy` `rust-sdk` lint job.
      - name: Build net-mesh-sdk documentation
        run: cargo doc -p net-mesh-sdk --no-deps --features full
        env:
          RUSTDOCFLAGS: -D warnings

      # `#[tool]` proc macro crate. User-facing macro docs live
      # here; the SDK depends on them via `pub use net_sdk_macros::tool;`.
      - name: Build net-mesh-sdk-macros documentation
        run: cargo doc -p net-mesh-sdk-macros --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

      # `net-rpc-ffi` is the cgo-facing nRPC shim. Its public
      # surface (extern "C" fn signatures + ABI version constants
      # + handle types) is what `go/mesh_rpc.go` documents against;
      # keep its rustdoc warning-free so the cross-language ABI
      # contract notes stay buildable.
      - name: Build net-rpc-ffi documentation
        run: cargo doc -p net-rpc-ffi --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

      # `net-org-ffi` is the cgo-facing organization capability-auth
      # shim (OSDK-L Workstream C). Its public surface (extern "C" fn
      # signatures + NET_ORG_* constants + handle types + the secret-
      # asymmetry doctrine) is what `go/org.go` and `include/net_org.h`
      # document against; keep its rustdoc warning-free.
      - name: Build net-org-ffi documentation
        run: cargo doc -p net-org-ffi --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

      # `net-mesh-mcp` is the MCP bridge adapter. Its module-level
      # docstrings document the demand/serve/wrap contracts (meta-tool
      # surface, owner-scope gate, describe protocol, failover); keep
      # them warning-free like the other workspace members.
      - name: Build net-mesh-mcp documentation
        run: cargo doc -p net-mesh-mcp --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

      # `net-mesh-wire` is the tokio-free wire layer the core depends
      # on (BROWSER_NATIVE_WEBRTC_TRANSPORT_PLAN.md). It
      # denies `missing_docs`, and every type the core re-exports is
      # documented there rather than in `adapter/net` now, so its
      # rustdoc IS the wire-surface documentation.
      - name: Build net-mesh-wire documentation
        run: cargo doc -p net-mesh-wire --no-deps --features json
        env:
          RUSTDOCFLAGS: -D warnings

      # `net-payments` is a workspace member the bare `cargo doc` above
      # never documents, so its rustdoc has gone unchecked. Build it with
      # `--all-features` (matches the test job — turns on `unsafe-dev-signer`
      # etc. so gated items resolve) and deny warnings like every other
      # member.
      - name: Build net-payments documentation
        run: cargo doc -p net-payments --no-deps --all-features
        env:
          RUSTDOCFLAGS: -D warnings

  wasm-wire:
    # BROWSER_NATIVE_WEBRTC_TRANSPORT_PLAN.md: `net-mesh-wire`
    # is the tokio-free wire layer, and the whole point of extracting it
    # is that a browser leaf can run it. This job is the only place that
    # is enforced.
    #
    # Two steps, and the second is NOT redundant. `cargo check --target
    # wasm32-unknown-unknown` catches a native type leaking into the wire
    # crate, but it CANNOT catch the failure described below: on
    # `wasm32-unknown-unknown`, `std::time::Instant::now()` and
    # `SystemTime::now()` compile fine and then panic at runtime ("time
    # not implemented on this platform"). `session.rs` and
    # `reliability.rs` read the clock on every packet, so a clock site
    # that bypasses the `Clock` seam is a leaf that dies on its first
    # datagram, with a green check job. The executed test also replays
    # the packet-AEAD golden vector on the `chacha20poly1305` backend,
    # which the native `cross_lang_wire` test asserts on the `ring`
    # backend — a divergence there splits the wire format between native
    # and browser nodes.
    #
    # `wasm-bindgen-test-runner` drives the tests under Node (the runner
    # ships Node 24; `getrandom`'s `wasm_js` backend needs
    # `crypto.getRandomValues`, which Node has). Its version MUST match
    # the `wasm-bindgen` version in Cargo.lock or the runner refuses the
    # module — `cargo install --locked` against this workspace's lock is
    # what keeps them in lockstep.
    name: Wasm wire (check + executed tests)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: net/crates/net
    steps:
      - uses: actions/checkout@v7

      # `targets:` on the toolchain action installs into the
      # **stable** installation, but every cargo command below runs
      # under `net/crates/net`, where `rust-toolchain.toml` pins
      # 1.98.1 — a separate installation with its own target set. The
      # first candidate installed the target on stable and then asked
      # 1.98.1 to build for it: `E0463: can't find crate for 'core'`.
      # Install the toolchain the commands actually select, then add
      # the target FROM the pinned directory so rustup resolves the
      # same override file cargo does.
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: wasm-wire
          workspaces: net/crates/net -> target

      - name: Add wasm32 to the pinned toolchain
        run: |
          set -o pipefail
          rustup target add wasm32-unknown-unknown
          rustup show active-toolchain
          rustup target list --installed | tee /dev/stderr | grep -qx wasm32-unknown-unknown || {
            echo "::error::wasm32-unknown-unknown is not installed for the toolchain this directory selects"
            exit 1
          }

      # A wire-only wasm build pays ~260 KB of `wasm-bindgen` describe
      # metadata for `getrandom`'s browser backend. Fine for a
      # test job; it is the `net-leaf` bundle, not this one, that has to
      # care. Cached with the target dir so it is paid once.
      - name: Install wasm-bindgen-test-runner
        run: cargo install wasm-bindgen-cli --locked --version "$(cargo metadata --format-version 1 --locked | python3 -c 'import json,sys; print(next(p["version"] for p in json.load(sys.stdin)["packages"] if p["name"] == "wasm-bindgen"))')"

      # THE LEAN-BUILD GUARD. Featureless and library-only on
      # purpose: no `json` (so the wasm build links no serde_json), no
      # `test-vectors` (so it carries no test data). This is the shape
      # a browser leaf would depend on, and the only step that keeps
      # it honest — every step below deliberately enables more.
      - name: Check net-mesh-wire for wasm32 (portable library, no features)
        run: cargo check -p net-mesh-wire --target wasm32-unknown-unknown

      # `--all-targets` includes `tests/wasm_wire.rs`, which reads the
      # package-owned AEAD vector — `net_wire::test_vectors::AEAD_VECTOR`,
      # behind `test-vectors`. Featureless, this step did not lint the
      # wasm witnesses at all; it failed to compile them
      # (`E0433: cannot find test_vectors in net_wire`) and the job went
      # red. The feature is what makes `--all-targets` actually mean all
      # targets here; the lean-build property is the step above's job,
      # not this one's.
      - name: Clippy net-mesh-wire for wasm32 (all targets, test vectors on)
        if: ${{ !cancelled() }}
        run: cargo clippy -p net-mesh-wire --target wasm32-unknown-unknown --all-targets --features test-vectors -- -D warnings -A clippy::unwrap_used -A clippy::expect_used

      # `--no-tests=fail` has no nextest here (nextest cannot drive a
      # wasm runner), so the grep below is the equivalent guard: a
      # harness that compiled to zero tests would otherwise report
      # success and prove nothing.
      - name: Run the executed wasm tests (Node)
        if: ${{ !cancelled() }}
        env:
          CARGO_TARGET_WASM32_UNKNOWN_UNKNOWN_RUNNER: wasm-bindgen-test-runner
          # Names the capabilities file explicitly rather than
          # relying on a default lookup: it is what carries the
          # `binary` pin the step above wrote.
          WASM_BINDGEN_TEST_WEBDRIVER_JSON: webdriver.json
        run: |
          set -o pipefail
          # `test-vectors` carries the package-owned AEAD golden
          # vector the wasm test replays — the same feature the
          # all-targets clippy step above passes, so what CI lints and
          # what CI runs are the same build. Only the portable-library
          # check stays featureless.
          out=$(cargo test -p net-mesh-wire --target wasm32-unknown-unknown --features test-vectors 2>&1 | tee /dev/stderr)
          for t in routed_round_trip_runs_on_wasm \
                   clock_reads_do_not_panic_on_wasm \
                   aead_golden_vector_matches_on_the_wasm_backend; do
            printf '%s\n' "$out" | grep -q "test $t \.\.\. ok" || {
              echo "::error::wasm test $t did not run or did not pass"
              exit 1
            }
          done

  wasm-wire-no-native-deps:
    # `net-mesh-wire` exists to be linkable without a native runtime.
    # A `tokio` (or `mio` / `socket2` / `net-mesh`) edge would still
    # compile for wasm32 in some configurations and would certainly
    # compile natively, so the wasm job above cannot be relied on to
    # notice it. Assert the dependency graph directly.
    name: Wasm wire (no native dependency)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: net/crates/net
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      # The target the check job builds for resolves a DIFFERENT
      # graph: `[target.'cfg(target_arch = "wasm32")'.dependencies]`
      # swaps ring/snow for chacha20poly1305 + web-time + the two
      # getrandom browser backends. Checking only the host graph would
      # miss a runtime edge that exists solely on wasm32, and vice
      # versa, so both are asserted.
      - name: Add wasm32 to the pinned toolchain
        run: rustup target add wasm32-unknown-unknown

      - name: Assert the wire crate pulls in no runtime (both graphs)
        run: |
          set -o pipefail
          status=0
          for target in host wasm32-unknown-unknown; do
            if [ "$target" = host ]; then
              tree=$(cargo tree -p net-mesh-wire --all-features --edges normal,build)
            else
              tree=$(cargo tree -p net-mesh-wire --all-features --edges normal,build --target "$target")
            fi
            echo "--- $target graph"
            printf '%s\n' "$tree"
            for forbidden in tokio mio socket2 net-mesh; do
              if printf '%s\n' "$tree" | grep -qE "^[^a-z]*${forbidden} v"; then
                echo "::error::net-mesh-wire depends on ${forbidden} in the $target graph; the wire layer must stay runtime-free"
                status=1
              fi
            done
          done
          exit $status

  webrtc-feature:
    # BROWSER_NATIVE_WEBRTC_TRANSPORT_PLAN.md. The `webrtc`
    # feature is OFF by default and is the only feature in this crate
    # with a C build-time dependency: `str0m`'s `rust-crypto` stack
    # pulls `aws-lc-rs`/`aws-lc-sys`, which needs cmake and a C
    # compiler (and NASM on x86_64). The ubuntu runner has all three,
    # so nothing is installed here beyond the toolchain — but that is
    # exactly why this is its own Linux job rather than a feature
    # added to an existing matrix: no default job should start paying
    # for a C build.
    #
    # `fixtures` rides along because the two harnesses use the
    # driver's test-only hooks and `connect_rtc_loopback`, which are
    # `cfg(any(test, feature = "fixtures"))` — a production build
    # cannot reach them.
    name: WebRTC feature (native driver)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: net/crates/net
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: webrtc
          workspaces: net/crates/net -> target

      # Recorded separately so the aws-lc-sys cost stays visible: if
      # it grows, the decision to accept it (option a) can
      # be revisited against a number rather than a memory.
      - name: Build the feature's dependency tree (aws-lc-sys cost)
        run: |
          start=$(date +%s)
          cargo build --features webrtc --lib
          echo "webrtc dependency + lib build: $(( $(date +%s) - start ))s"

      - name: Clippy (production code, strict)
        if: ${{ !cancelled() }}
        run: cargo clippy --features webrtc --lib --bins -- -D warnings

      - name: Clippy (all targets, permissive on test panics)
        if: ${{ !cancelled() }}
        run: >
          cargo clippy --features "webrtc fixtures" --all-targets --
          -D warnings
          -A clippy::unwrap_used -A clippy::expect_used
          -A clippy::undocumented_unsafe_blocks
          -A clippy::multiple_unsafe_ops_per_block

      - name: Documentation
        if: ${{ !cancelled() }}
        run: cargo doc --features webrtc --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

      # The unit surface WITH the feature: the default set plus
      # `webrtc`, so the RTC modules' own units and every existing
      # witness run in the same binary. The default `unit-tests` job
      # is untouched — the point is that both pass.
      - name: Unit tests (UNIT_FEATURES + webrtc)
        if: ${{ !cancelled() }}
        run: cargo test --lib --features "$UNIT_FEATURES webrtc"
        env:
          UNIT_FEATURES: net redex redex-disk cortex netdb meshdb meshos dataforts nat-traversal port-mapping tool batched-ingress cli regex

      - name: Install cargo-nextest
        if: ${{ !cancelled() }}
        uses: taiki-e/install-action@v2
        with:
          tool: nextest

      # The harnesses, pinned by name like every other
      # integration binary (the pin-guard job scrapes these flags).
      #
      # `--retries 0` overrides the profile default of 2: these are
      # acceptance witnesses for races and lifetimes, and a genuine
      # flake in one of them is itself a defect (the same reasoning
      # `.config/nextest.toml` already applies to the org suites).
      #
      # The run's result set is preserved for the inventory step
      # below, which is what turned 100 `cargo nextest list`
      # invocations (one per floor, one per pinned name) into zero.
      - name: RTC harnesses
        if: ${{ !cancelled() }}
        run: |
          set -uo pipefail
          rm -f target/nextest/default/junit.xml
          cargo nextest run --no-fail-fast --no-tests=fail --retries 0 \
            --features "webrtc fixtures cortex nat-traversal" \
            --test rtc_loopback \
            --test rtc_backpressure \
            --test rtc_repairs \
            --test rtc_ice_telemetry \
            --test rtc_routed_restore \
            --test rtc_install_race \
            --test rtc_reclaim \
            --test rtc_classifier \
            --test rtc_admission_probes \
            --test rtc_signalling \
            --test rtc_admission \
            --test rtc_anchor_registry \
            --test rtc_proxy_boundary \
            --test natsim_browser \
            --test rtc_stun_endpoint
          st=$?
          cp target/nextest/default/junit.xml "$RUNNER_TEMP/rtc-junit.xml"
          exit "$st"

      # Per-binary FLOORS and the required names. `--no-tests=fail`
      # catches a whole binary vanishing; it does not catch a witness
      # being deleted or renamed out of the set, which is exactly how
      # coverage is lost quietly.
      #
      # This reads the RESULT SET of the run above
      # (`$RUNNER_TEMP/rtc-junit.xml`, written because
      # `.config/nextest.toml` sets `[profile.default.junit]`) instead
      # of re-listing each binary. The previous shape spent 12
      # `cargo nextest list` calls on the floors and one more per
      # pinned name — 100 in total — to establish that a name was
      # LISTED. The artifact establishes something strictly stronger
      # for free: that the name RAN and PASSED in this job's run, with
      # no `<failure>`, `<skipped>` or `<flakyFailure>` against it.
      #
      # The parser self-check that used to guard this step is gone
      # with the parser: a binary missing from the artifact is an
      # explicit "suite absent from the run" error, so a tooling
      # change still cannot read as "all clear". The checker's own
      # `--self-test` (run in the sensing jobs) covers its predicates.
      - name: RTC witness inventory
        if: ${{ !cancelled() }}
        run: |
          set -uo pipefail
          python3 "$GITHUB_WORKSPACE/.github/scripts/check-witness-results.py" \
            --junit "$RUNNER_TEMP/rtc-junit.xml" --multi \
            --floor rtc_loopback=5 \
            --floor rtc_backpressure=7 \
            --floor rtc_repairs=56 \
            --floor rtc_ice_telemetry=6 \
            --floor rtc_routed_restore=5 \
            --floor rtc_install_race=8 \
            --floor rtc_reclaim=5 \
            --floor rtc_classifier=2 \
            --floor rtc_admission_probes=11 \
            --floor rtc_signalling=14 \
            --floor rtc_admission=26 \
            --floor rtc_anchor_registry=2 \
            --floor rtc_proxy_boundary=2 \
            --floor natsim_browser=41 \
            --floor rtc_stun_endpoint=14 \
            --required-file - <<'REQUIRED'
          rtc_admission:a_registered_client_streaming_provider_refuses_a_provisional_caller
          rtc_admission:a_registered_duplex_provider_refuses_a_provisional_caller
          rtc_admission:a_provisional_peer_cannot_drive_migration
          rtc_admission:a_promotion_inside_the_teardown_window_survives
          rtc_signalling:each_signalling_refusal_is_counted_under_its_own_cause
          rtc_anchor_registry:an_announced_anchor_is_listed_with_its_addresses_and_a_plain_peer_is_not
          rtc_proxy_boundary:an_rtc_peers_routed_envelope_never_reaches_the_proxy
          rtc_proxy_boundary:a_proxy_socket_cannot_become_the_authenticated_adjacency_a_relay_needs
          rtc_stun_endpoint:the_two_announced_endpoints_are_different_sockets
          rtc_stun_endpoint:announcing_one_endpoint_for_both_roles_is_refused
          rtc_stun_endpoint:binding_one_socket_for_both_roles_is_refused
          rtc_stun_endpoint:the_rtc_socket_still_answers_its_own_probe
          rtc_admission:an_outcome_that_only_looks_admitted_promotes_nothing
          rtc_admission:a_claimant_is_not_promoted_by_another_peers_enrollment
          rtc_repairs:scheduled_fire_and_forget_packets_reach_rtc_admission_and_the_peer
          rtc_repairs:the_scheduler_drain_counts_what_it_drops_under_pressure
          rtc_repairs:rtc_admission_pressure_is_retryable_backpressure_not_a_transport_error
          rtc_repairs:a_committed_prefix_is_never_replayed_when_the_suffix_is_refused
          rtc_repairs:a_submit_that_races_a_close_is_refused_and_nothing_is_orphaned
          rtc_repairs:retention_conserves_every_admitted_packet_and_then_delivers_it
          rtc_repairs:node_shutdown_releases_the_rtc_socket
          rtc_repairs:a_wrong_generation_handle_cannot_touch_the_live_session
          rtc_repairs:a_leaf_fragmented_payload_reaches_a_native_peer_as_one_event
          rtc_repairs:a_native_sender_fragments_for_a_peer_that_advertises_reassembly
          rtc_repairs:a_lost_middle_fragment_is_retransmitted_and_the_payload_arrives_once
          rtc_repairs:a_group_over_the_ceiling_is_refused_at_the_first_piece_on_both_sides
          rtc_repairs:a_peer_without_the_reassembly_tag_still_gets_event_too_large
          rtc_repairs:thirty_two_lifetimes_do_not_grow_the_slot_table
          rtc_repairs:a_dead_handle_cannot_be_installed_and_a_close_evicts_the_peer
          rtc_repairs:a_busy_incumbent_survives_an_rtc_upgrade_attempt
          rtc_repairs:serving_stun_does_not_intercept_ice_connectivity_checks
          rtc_repairs:the_rtc_prefilter_admits_exactly_what_dispatch_accepts
          rtc_repairs:a_reliable_stream_delivers_every_value_and_reorders_by_seq
          rtc_repairs:a_locally_deactivated_session_still_receives_its_peers_frames
          rtc_repairs:one_expiry_pass_retains_every_distinct_terminal_owner
          rtc_repairs:a_reassembly_loss_settles_its_own_half_not_the_reverse_direction
          rtc_repairs:a_fire_and_forget_reassembly_loss_is_a_permitted_loss
          rtc_repairs:a_predecessor_fragment_group_cannot_destroy_its_successor
          rtc_repairs:a_native_mixed_producer_states_its_boundary_and_the_old_handle_inherits
          rtc_repairs:concurrent_sends_cannot_break_a_fragment_groups_sequence_ownership
          rtc_repairs:an_oversized_send_is_refused_rather_than_evicting_a_descriptor
          rtc_repairs:a_fire_and_forget_stream_loses_packets_and_never_retransmits
