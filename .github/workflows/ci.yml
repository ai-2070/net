name: CI

on:
  push:
    # Branches only — without this filter GitHub fires `push`
    # events on tag pushes too, so every `cli-v*` / `deck-v*`
    # release tag spawns a duplicate CI run alongside its
    # release workflow. The release workflows themselves run
    # their own build + tests against the same SHA; we don't
    # need CI to repeat them per tag.
    branches: ["**"]
    paths:
      - "net/**"
      - "go/**"
      - ".github/workflows/ci.yml"
      # Three jobs here execute the skill examples — Python in `python-tests`,
      # Go and C in `go-tests` — because those are the only jobs holding the
      # maturin wheel and the libnet cdylib. Without these paths, editing an
      # example would not run the checks that execute it, and a hang could land
      # green. `skills.yml` fires on the same files for the compile floor.
      - ".claude/skills/net-event-bus/examples/**"
      - "docs/data/examples.yaml"
      - ".github/scripts/run-skill-examples.sh"
      - ".github/scripts/skill_examples.py"

env:
  CARGO_TERM_COLOR: always

jobs:
  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    # Wider feature set than before → larger compile; the target cache
    # keeps incremental runs fast, but leave headroom for a cold build.
    timeout-minutes: 40
    env:
      # The widest SERVICE-FREE feature set — every feature except
      # `redis` / `jetstream`, which need running service containers.
      #
      # The gating `--lib` / `--doc` run MUST stay this broad. In-source
      # `#[cfg(test)]` units behind `meshos` / `port-mapping` /
      # `nat-traversal` / `meshdb` / `dataforts` / `cli` … are otherwise
      # gated by NO job: the per-feature `integration-tests` steps pin
      # `--test <file>` (which runs only those integration binaries, not
      # the lib units), and the one job that does run them — the Coverage
      # workflow — is information-only / non-gating. Narrowing this list
      # silently drops every feature-gated unit test out of CI.
      UNIT_FEATURES: "net redex redex-disk cortex netdb meshdb meshos dataforts nat-traversal port-mapping tool batched-ingress cli regex"
      # sccache trial job #1 of 3 (see the shared note in `integration-net-core`).
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: "sccache"
      CARGO_INCREMENTAL: "0"
    defaults:
      run:
        working-directory: net/crates/net
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Set up sccache
        uses: mozilla-actions/sccache-action@v0.0.11

      # Replaces the hand-rolled `actions/cache` block this job used to carry.
      # That block keyed solely on `hashFiles('**/Cargo.lock')` with NO
      # `restore-keys`, and GitHub cache entries are immutable: the first run to
      # save under a given lockfile hash froze the target dir at that moment, and
      # every lockfile bump after it fell back to a fully cold build. The last
      # green master run missed on every single job for exactly that reason
      # (`Cache not found for input keys: Linux-cargo-…`), then recompiled the
      # whole dep graph. `rust-cache` keys on lockfile + rustc version + job and
      # carries prefix `restore-keys`, so a lockfile bump restores the previous
      # entry and rebuilds only what changed. It also prunes the target dir
      # before saving, which is what shrinks the 79-91s "Post Cache cargo"
      # upload these jobs were paying.
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: unit
          workspaces: net/crates/net -> target

      # `--lib` runs EVERY in-source `#[cfg(test)]` unit; the broad
      # `$UNIT_FEATURES` set is what makes feature-gated modules (meshos,
      # port-mapping, …) actually compile + run here rather than only in
      # the non-gating Coverage workflow.
      #
      # DELIBERATELY still `cargo test`, not `cargo nextest run`. This is one
      # large lib-test binary with thousands of tiny in-process units; nextest
      # launches a process per test, which is a clear win for the multi-node
      # integration binaries but is an open question here — process-launch
      # overhead can exceed what the parallel scheduling buys back. The measured
      # split says it would not matter much either way: on the last green master
      # run this job spent 6 minutes almost entirely in rustc. Benchmark
      # `cargo test --lib` against `cargo nextest run --lib` on one SHA
      # (compile / execution / total / peak disk / flake count) before switching;
      # the sccache + rust-cache changes above are the ones that move this job.
      - name: Run unit tests (all in-source units, full feature set)
        run: cargo test --lib --features "$UNIT_FEATURES"

      # OLB-2B-E3c: the production routing-plane wiring witnesses
      # (`src/adapter/net/org_routing_wiring_tests.rs`, included from `mesh.rs`).
      # The step above already runs them — this one exists to make the coverage
      # NAMED and drift-detecting, the `--lib` analogue of the pinned
      # `--test <file>` discipline used for the integration binaries below.
      #
      # A filtered run that matches nothing exits 0, so "the module was renamed,
      # feature-gated, or deleted" would otherwise look identical to "it passed".
      # The count assertion is what closes that: these witnesses are the only
      # proof that ONE global drain is minted, that the dirty stream reaches the
      # real registry, that shutdown joins the routing task before returning, and
      # that the publication gate is a commit pin rather than a reconstruction
      # lock -- plus, since the E3c closure, that shutdown cannot slip between the
      # supervisor spawn and its handle publication, that revocation authority is
      # inside the currentness token, that an unserved scope reads cold rather
      # than authoritatively empty, that cached facts crossing their expiry read
      # cold, that Drop fences rather than detaching, that a concurrent shutdown
      # cannot return while routing registration is unresolved, that revocation
      # authority is pinned through installation and revalidated at read, and that
      # authority-only movement invalidates and requeues -- plus, since the
      # poison closure, that a durability POISON is immobile through settlement
      # in BOTH directions (a production recovery clear cannot land under a live
      # publication pin), and that leaving steady poison is observable: the
      # recovery wakes routing proactively AND a reader retires the stranded
      # `Unserved` reconstruction on its own -- plus, since the E3c-blockers
      # closure, that steady poison itself settles Current over an Unserved
      # source rather than retrying forever, that an empty-raise poison MARK
      # wakes routing as proactively as the clear does, and that terminal
      # authority exhaustion retires its MAX-stamped facts and fences readiness
      # independently of supervisor health -- plus, since review-pass-3, that the
      # OTHER exhaustion arm (an exhausted store publication generation, which
      # the pin ACCEPTS and only the settlement refuses) parks the actor without
      # spinning and without losing its queue, and that an EMPTY registry whose
      # authority moves inside the probe->settle window is re-driven rather than
      # stranded at `Rebuilding`, that the read seam fences a DEAD incarnation's
      # still-retained facts, and that its authority sample cannot straddle a
      # store install. Losing any of them silently would be worse than losing
      # them loudly.
      #
      # NOTE: they are gated `#[cfg(test)]`, NOT `feature = "fixtures"` —
      # `$UNIT_FEATURES` deliberately excludes `fixtures`, so a fixtures gate
      # would compile this module to a silent 0-test no-op here.
      - name: Sensing routing-plane wiring witnesses
        if: ${{ !cancelled() }}
        run: |
          set -o pipefail
          MIN=70
          out=$(cargo test --lib --features "$UNIT_FEATURES" \
                  org_routing_wiring_tests 2>&1 | tee /dev/stderr)
          n=$(printf '%s\n' "$out" \
                | grep -oE 'test result: ok\. [0-9]+ passed' \
                | grep -oE '[0-9]+' | head -1)
          if [ -z "$n" ] || [ "$n" -lt "$MIN" ]; then
            echo "::error::expected >= $MIN routing-plane wiring witnesses, ran ${n:-0}."
            echo "The module is src/adapter/net/org_routing_wiring_tests.rs, declared"
            echo "in mesh.rs. If witnesses were intentionally removed, lower MIN in"
            echo "this step in the same commit — do not let the gate pass vacuously."
            exit 1
          fi
          # Cardinality alone cannot tell WHICH witness vanished, so pin the
          # names of the ones that carry a security property outright.
          REQUIRED="shutdown_overlapping_registration_cannot_return_unresolved
          a_production_store_swap_cannot_publish_while_a_commit_pin_is_alive
          a_snapshot_cannot_straddle_a_store_publication
          an_authority_install_publishes_the_authority_under_its_own_epoch
          an_authority_rotation_over_the_same_store_still_publishes_inside_the_epoch
          a_handles_lockfree_read_observes_the_registrys_published_artifact
          a_stale_audience_handle_is_unserved_beside_its_installed_sibling
          a_consumer_grant_removal_cannot_occupy_the_gap_between_validation_and_settlement
          a_same_id_grant_replacement_cannot_reauthorize_captured_facts
          the_signed_grant_identity_is_part_of_scope_currentness
          the_audience_handle_is_part_of_scope_currentness
          a_grant_install_between_capture_and_commit_refuses_publication
          unrelated_grant_movement_preserves_the_exact_slot
          an_installed_grants_expiry_colds_its_facts_with_zero_providers
          installing_a_consumer_grant_wakes_the_affected_grant_slot
          removing_a_consumer_grant_wakes_the_affected_grant_slot
          consumer_grant_movement_wakes_only_the_affected_scope
          a_grant_movement_notification_runs_after_publication_and_after_release
          a_non_publishing_grant_outcome_wakes_nothing
          a_delayed_grant_notification_cannot_retire_a_successor_installation
          consumer_grant_movement_preserves_same_id_unaffected_scopes
          a_delayed_install_notification_cannot_retire_a_successor_removal_artifact
          a_delayed_install_notification_preserves_its_own_publication_artifact
          a_delayed_removal_notification_preserves_its_own_absence_artifact
          a_current_lease_removal_publishes_wakes_and_fences
          publication_exhaustion_refuses_an_install_without_publishing
          terminal_withdrawal_retires_the_last_live_identity_and_nothing_else
          a_delayed_terminal_notification_preserves_its_own_absence_artifact
          a_final_ordinary_removal_preserves_the_terminal_absence_it_caused
          a_second_installed_grant_still_withdraws_terminally_after_the_first
          a_publication_cannot_occupy_the_gap_between_validation_and_settlement
          poison_cannot_occupy_the_gap_between_validation_and_settlement
          a_recovery_poison_clear_cannot_land_under_a_publication_pin
          a_poison_recovery_retires_the_unserved_reconstruction_it_left
          a_poison_mark_that_raises_no_floor_wakes_routing_without_a_reader
          a_reader_retires_unserved_facts_once_their_poison_clears
          steady_poison_settles_current_over_an_unserved_source
          an_exhausted_store_generation_stops_certified_emission
          an_exhausted_authority_epoch_fences_rather_than_aliasing
          terminal_exhaustion_retires_max_stamped_facts_and_fences_readiness
          an_exhausted_store_generation_parks_apply_without_spinning_and_recovers
          an_empty_registry_whose_authority_moves_under_the_probe_is_redriven
          the_read_seam_fences_a_dead_incarnations_facts
          the_read_seams_authority_sample_cannot_straddle_a_store_install
          an_exhausted_scoped_generation_fences_the_routing_source
          an_unserved_scope_reads_cold_rather_than_authoritatively_empty"
          for required in $REQUIRED; do
            if ! printf "%s" "$out" | grep -q "$required"; then
              echo "::error::required routing witness missing: $required"
              exit 1
            fi
          done
          echo "routing-plane wiring witnesses: $n passed (min $MIN); all named security witnesses present"

      # OLB-2B-E2/E3c: the SUPERVISOR/incarnation/crash-loop witnesses
      # (`behavior::org_routing::tests`), gated on the same count+name pattern as
      # the wiring witnesses above.
      #
      # review-pass-3 §18: this module runs in the gating `--lib` step only
      # because a2509d8a3 widened its cfg from `all(test, feature = "fixtures")`
      # to plain `test` — the exact regression that already happened once on this
      # branch. The wiring witnesses got a floor and pinned names; these got
      # nothing, so a future "clean up the fixtures seams" re-gating would drop
      # the incarnation fence, the crash-loop budget, the shutdown-ordering
      # proofs and the non-convergence backoff out of every gating job in
      # silence. Same reasoning as the note below: `$UNIT_FEATURES` excludes
      # `fixtures`, so a fixtures gate compiles this module to a silent 0-test
      # no-op here.
      - name: Sensing routing supervisor witnesses
        if: ${{ !cancelled() }}
        run: |
          set -o pipefail
          MIN=24
          out=$(cargo test --lib --features "$UNIT_FEATURES" \
                  behavior::org_routing:: 2>&1 | tee /dev/stderr)
          n=$(printf '%s\n' "$out" \
                | grep -oE 'test result: ok\. [0-9]+ passed' \
                | grep -oE '[0-9]+' | head -1)
          if [ -z "$n" ] || [ "$n" -lt "$MIN" ]; then
            echo "::error::expected >= $MIN routing supervisor witnesses, ran ${n:-0}."
            echo "The module is the #[cfg(test)] mod tests in"
            echo "src/adapter/net/behavior/org_routing.rs. If it was re-gated to"
            echo "feature = \"fixtures\", it compiles to a silent no-op in this job —"
            echo "that is the regression this floor exists to catch."
            exit 1
          fi
          REQUIRED="a_held_stream_fences_instead_of_starting_a_drainless_actor
          only_the_live_incarnations_routes_are_usable
          incarnation_overflow_fences_rather_than_reusing_an_id
          a_deterministic_fault_exhausts_the_restart_budget_and_stays_fenced
          unwind_only_a_panicking_apply_still_runs_the_fence_guard
          shutdown_inside_apply_is_never_followed_by_healthy
          cancelling_the_supervisor_drops_the_incarnation_and_frees_the_lease
          a_closed_watch_without_shutdown_is_loud_and_terminal
          a_sustained_superseded_streak_backs_off_and_reports_degraded"
          for required in $REQUIRED; do
            if ! printf "%s" "$out" | grep -q "$required"; then
              echo "::error::required routing supervisor witness missing: $required"
              exit 1
            fi
          done
          echo "routing supervisor witnesses: $n passed (min $MIN); all named security witnesses present"

      # OLB-2B.3b: the clone-family routing-state witnesses — the atomic
      # demand-set acquisition in `behavior::org_routing_registry::tests` and the
      # capability index / demand lifecycle / refusal pass-through in
      # `behavior::org_routing_state::tests`.
      #
      # Same reasoning as the two gates above, and the same failure it forecloses:
      # the broad `--lib` step already runs these, but a filtered run that matches
      # nothing exits 0, so "the module was renamed, feature-gated or deleted"
      # would be indistinguishable from "it passed". `org_routing_state` is a NEW
      # module whose entire consumer is still dark (OLB-2B.3d), which makes it
      # exactly the kind of file a future cleanup pass deletes as unreachable.
      #
      # Both filters are asserted SEPARATELY. A combined floor would let the 36
      # registry witnesses cover the disappearance of the whole state module.
      #
      # NOTE: `#[cfg(test)]`, NOT `feature = "fixtures"` — `$UNIT_FEATURES`
      # deliberately excludes `fixtures`, so a fixtures gate would compile these
      # to a silent 0-test no-op in this job.
      - name: Sensing routing-state witnesses
        if: ${{ !cancelled() }}
        run: |
          set -o pipefail
          REG_MIN=50
          STATE_MIN=41
          reg=$(cargo test --lib --features "$UNIT_FEATURES" \
                  behavior::org_routing_registry:: 2>&1 | tee /dev/stderr)
          state=$(cargo test --lib --features "$UNIT_FEATURES" \
                  behavior::org_routing_state:: 2>&1 | tee /dev/stderr)
          count() {
            printf '%s\n' "$1" | grep -oE 'test result: ok\. [0-9]+ passed' \
              | grep -oE '[0-9]+' | head -1
          }
          rn=$(count "$reg")
          sn=$(count "$state")
          if [ -z "$rn" ] || [ "$rn" -lt "$REG_MIN" ]; then
            echo "::error::expected >= $REG_MIN org_routing_registry witnesses, ran ${rn:-0}."
            echo "The module is the #[cfg(test)] mod tests in"
            echo "src/adapter/net/behavior/org_routing_registry.rs."
            exit 1
          fi
          if [ -z "$sn" ] || [ "$sn" -lt "$STATE_MIN" ]; then
            echo "::error::expected >= $STATE_MIN org_routing_state witnesses, ran ${sn:-0}."
            echo "The module is src/adapter/net/behavior/org_routing_state_tests.rs,"
            echo "included from org_routing_state.rs. If witnesses were intentionally"
            echo "removed, lower STATE_MIN in this step in the SAME commit — do not"
            echo "let the gate pass vacuously."
            exit 1
          fi
          # Cardinality cannot say WHICH witness vanished. Pin the ones carrying a
          # capacity, lifecycle, concurrency or lock-freedom property outright.
          REQUIRED="a_demand_set_past_the_family_bound_retains_nothing
          a_demand_set_past_the_node_bound_retains_nothing
          a_demand_set_over_retained_slots_costs_no_node_capacity
          an_exhausted_identity_space_refuses_a_whole_demand_set
          a_refusal_after_identities_are_considered_consumes_none
          duplicate_keys_in_a_demand_set_collapse
          the_sixty_fifth_family_handle_is_refused_without_corrupting_the_first_64
          the_two_hundred_fifty_seventh_slot_is_deterministically_unretained
          a_superseded_reader_cannot_read_a_retired_incarnations_facts
          a_common_key_reader_follows_the_successors_ownership
          a_fresh_demand_after_retirement_gets_a_fresh_cell
          a_stale_incarnation_apply_cannot_republish_a_cleared_cell
          release_one_cannot_decrement_a_reference_a_family_does_not_hold
          an_already_transferred_set_cannot_be_replaced_again
          a_demand_handle_couples_both_publication_cells
          a_demand_set_couples_both_cells_per_contributor
          retiring_the_last_reference_clears_both_cells
          a_transfer_leaves_the_common_keys_pool_published
          facts_invalidation_clears_the_derived_pool
          a_stale_observation_invalidates_neither_plane
          installing_newer_facts_clears_the_superseded_pool
          a_replacement_successor_stays_index_aligned_across_both_planes"
          for required in $REQUIRED; do
            if ! printf "%s" "$reg" | grep -q "$required"; then
              echo "::error::required org_routing_registry witness missing: $required"
              exit 1
            fi
          done
          REQUIRED_STATE="a_discover_grant_with_no_installed_audience_is_not_a_demand
          an_invoke_only_grant_is_not_a_source_demand
          a_rotated_audience_handle_is_not_leased_under_its_own_id
          a_warmed_lookup_takes_no_lock
          a_warmed_lookup_completes_while_the_mutation_lock_is_held
          concurrent_misses_acquire_one_demand_set
          concurrent_rederivations_spend_one_demand_set
          a_spent_family_budget_refuses_from_the_registry_every_time
          a_wide_refusal_does_not_poison_residual_capacity
          a_full_node_refuses_every_attempt_until_a_retirement
          a_narrowed_demand_warms_on_a_full_node_without_a_retirement
          identity_exhaustion_refuses_a_set_that_needs_a_new_slot
          identity_exhaustion_does_not_refuse_a_set_of_existing_slots
          the_family_bound_counts_demands_not_capabilities
          a_refused_entry_retains_no_partial_demand
          a_newly_leased_audience_joins_a_warmed_entry
          a_removed_audience_leaves_a_warmed_entry
          a_rotated_audience_replaces_the_scope_it_supersedes
          a_rotated_away_scope_is_not_retained_under_its_own_id
          a_refused_rederivation_leaves_the_entry_exactly_as_it_was
          a_current_warmed_entry_with_a_leased_audience_takes_no_lock
          the_capability_index_derives_exactly_what_the_full_scan_derives
          a_narrowing_replacement_at_the_family_bound_is_charged_net
          a_same_width_rotation_at_the_family_bound_is_charged_net
          a_rotation_at_the_node_bound_retires_the_slot_it_transfers
          a_rotation_at_the_node_bound_refuses_when_the_old_slot_is_shared
          identity_exhaustion_during_a_replacement_refuses_with_no_effect
          a_narrowing_replacement_needs_no_identity_after_exhaustion
          a_shared_old_replacement_succeeds_when_the_sharer_releases
          the_under_lock_miss_recheck_validates_the_callers_snapshot
          the_under_lock_miss_recheck_sees_a_removal
          the_under_lock_miss_recheck_sees_a_rotation
          the_under_lock_miss_race_retains_the_newest_snapshot
          a_stalled_older_install_cannot_overwrite_a_newer_removal
          a_stalled_older_removal_cannot_overwrite_a_newer_install
          a_terminal_snapshot_cannot_be_overwritten_by_an_ordinary_one
          two_snapshots_at_one_revision_are_refused_as_an_invariant_breach
          unrelated_newer_movement_advances_freshness_without_churn
          dropping_the_state_releases_every_demand"
          for required in $REQUIRED_STATE; do
            if ! printf "%s" "$state" | grep -q "$required"; then
              echo "::error::required org_routing_state witness missing: $required"
              exit 1
            fi
          done
          echo "OLB-2B.3b: $rn registry (min $REG_MIN) + $sn state (min $STATE_MIN) passed; all named witnesses present"

      # Doctests live in `///` comment blocks across `src/` and `sdk/src/`.
      # `cargo test --lib` does not execute them — they need a separate
      # `cargo test --doc` invocation. Same broad feature set so doc
      # examples gated on any feature compile + run.
      - name: Run doctests
        if: ${{ !cancelled() }}
        run: cargo test --doc --features "$UNIT_FEATURES"

      # `deck` is a separate workspace member (TUI operator console).
      # It's a binary-only package — `[[bin]]` with no `[lib]` — so
      # `--lib` / `--doc` would fail with "no library targets found".
      # Its `#[test]` modules live alongside the binary sources;
      # `--bins` compiles them into the binary's test harness.
      - name: Run Deck unit tests
        if: ${{ !cancelled() }}
        run: cargo test -p net-deck --bins

  # ===================================================================
  # Integration suite — split across parallel jobs by FEATURE FAMILY.
  # ===================================================================
  #
  # This used to be ONE job running 14 nextest groups back to back on a single
  # runner, on the theory that sharing a runner shares the compile. It does not:
  # every group passes a different `--features` set, so cargo re-fingerprints
  # and rebuilds `net-mesh` and relinks the test binaries between groups.
  #
  # The measured split on the last green master run was stark — 21 minutes of
  # wall clock against 107 SECONDS of actual test execution (the sum of every
  # nextest `Summary` line). `Dataforts blob e2e` took 71s to run 2 tests in
  # 0.043s; `Transport error-code mirror` 71s to run 7 tests in 0.6s. The steps
  # that happened to reuse the previous step's feature set were the fast ones
  # (`Sensing` 30s, `MeshDB` 3s, `MeshOS + Deck` 4s). Nearly all of the rest was
  # repaid rustc.
  #
  # So the groups are dealt out across parallel jobs, each holding as few
  # DISTINCT feature sets as possible, sized to finish at roughly the same time.
  #
  # Feature sets are NOT merged to shrink that count. Several of these
  # boundaries ARE the gate: the in-memory `dataforts` group is separate from
  # `dataforts redex-disk` precisely so the in-memory paths are proven to
  # compile without the on-disk ones, and `--no-default-features`-shaped
  # distinctions like the bare Bus + FFI group exist for the same reason.
  # Nextest's `--partition` sharding is deliberately unused for that same
  # reason — it would require flattening these into one union-feature build,
  # which would silently retire every one of those distinctions.
  #
  # Cost trade: more aggregate runner minutes, much less wall clock. sccache
  # (below) is what keeps the repeated dependency compilation from eating the
  # difference.

  integration-guard:
    name: Integration test pin guard
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: net/crates/net
    steps:
      - uses: actions/checkout@v7

      # Every OTHER test surface in this workflow is auto-discovered
      # (`cargo test -p <crate>` / bare `pytest` / `go test ./...`), so a
      # new test file there is picked up for free. The `integration-*`
      # jobs are the sole exception: they pin `--test <name>` explicitly,
      # per feature group, to keep the crate from recompiling once per
      # test binary. The cost of that is a silent failure mode — a new
      # `tests/*.rs` runs in NO job until someone remembers to edit this
      # file, and nothing complains. `unit-tests` is `--lib` (never touches `tests/`) and
      # the Coverage workflow, which does auto-discover, only fires on
      # master + PRs and is pinned informational — so on a feature branch
      # an unpinned test is gated by nothing at all.
      #
      # This guard closes that. Any new `tests/*.rs` must either appear in
      # a `--test` flag in one of the `integration-*` jobs below, or be
      # added to UNPINNED_OK with a reason. It runs as its OWN job so the
      # answer arrives in ~15s rather than behind a runner that is busy
      # compiling, and so it stays a single check no matter how the
      # feature families below are re-dealt.
      - name: Guard — every tests/*.rs is pinned to a step
        run: |
          # Tests that intentionally run nowhere in THIS workflow.
          UNPINNED_OK="
          integration_redis      # required-features=[redis]; needs a service container
          integration_jetstream  # required-features=[jetstream]; needs a service container
          natsim                 # runs in natsim.yml (privileged netns harness, --ignored)
          "
          # Scrape the real pins only: drop YAML comment lines and this
          # step's own `echo` prose, both of which mention the flag by name
          # and would otherwise be scraped as bogus test targets.
          sed '/^[[:space:]]*#/d' "$GITHUB_WORKSPACE/.github/workflows/ci.yml" \
            | grep -v 'echo ' \
            | grep -oE -- '--test [a-z0-9_]+' \
            | sed 's/--test //' | sort -u > /tmp/pinned.txt
          printf '%s\n' "$UNPINNED_OK" | awk '{print $1}' | grep -v '^$' | sort -u > /tmp/allowed.txt
          ls tests/*.rs | sed 's|tests/||; s|\.rs$||' | sort -u > /tmp/present.txt
          missing=$(comm -23 /tmp/present.txt <(sort -u /tmp/pinned.txt /tmp/allowed.txt))
          if [ -n "$missing" ]; then
            echo "::error::Integration test(s) present in tests/ but pinned to no CI step:"
            printf '  %s\n' $missing
            echo ""
            echo "Add each to the matching feature group below (check the file's"
            echo "#![cfg(...)] gate — a test listed under a feature set that does not"
            echo "satisfy it compiles to a silent 0-test binary), or to UNPINNED_OK."
            exit 1
          fi
          # The reverse drift: a --test flag naming a file that no longer exists
          # fails the run with a confusing cargo error, so name it here instead.
          stale=$(comm -13 /tmp/present.txt /tmp/pinned.txt)
          if [ -n "$stale" ]; then
            echo "::error::CI pins --test target(s) with no matching tests/*.rs:"
            printf '  %s\n' $stale
            exit 1
          fi
          echo "OK: $(wc -l < /tmp/present.txt) test files, all accounted for."

  # --- Family A: bare bus/FFI + net mesh -------------------------------
  integration-net-core:
    name: Integration — net core (bus/FFI, mesh, capability, subnets, migration, nRPC dispatch)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # sccache trial, part 2 of 3 (with `unit-tests` and `rust-sdk-tests`).
      # All five `integration-*` family jobs carry this block — they are
      # collectively the one job this trial covers.
      #
      # These jobs are compile-bound, not test-bound, so a compiler-object cache
      # is the lever that actually moves them — and unlike the target-dir cache
      # it survives across the differing feature sets and across the parallel
      # jobs this suite was just split into, which is what keeps the split from
      # costing what it saves.
      #
      # `CARGO_INCREMENTAL: 0` is mandatory alongside it, not incidental: cargo's
      # incremental state is large and fragile in CI (it is what produced the
      # disk-full metadata corruption locally), and sccache only caches
      # non-incremental compiler invocations, so leaving it on would silently
      # bypass the cache for exactly the crates we care about.
      #
      # sccache's GHA backend shares the repo's 10 GB Actions cache quota with
      # `rust-cache`. If eviction pressure shows up, that is the first thing to
      # look at. The action prints hit/miss stats at job end — check them before
      # widening this to the remaining Rust jobs.
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: "sccache"
      CARGO_INCREMENTAL: "0"
    defaults:
      run:
        working-directory: net/crates/net
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Set up sccache
        uses: mozilla-actions/sccache-action@v0.0.11

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: integration-net-core
          workspaces: net/crates/net -> target

      # nextest gives us per-test process isolation, smarter scheduling,
      # and `--no-fail-fast` semantics across grouped test binaries.
      # Tests below are batched by feature set so cargo recompiles the
      # library at most once per group instead of once per `--test` flag.
      #
      # `--no-tests=fail` is on every group. A test file listed under a feature
      # set that does not satisfy its `#![cfg]` compiles to an EMPTY test binary
      # and passes vacuously — the same silent-coverage hole the pin guard and
      # the `windows-security-tests` job already close. An empty filterset is
      # now an error, not a pass.
      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: nextest

      # redis and jetstream integration tests are intentionally skipped:
      # `required-features = ["redis" | "jetstream"]` in Cargo.toml excludes
      # them from compilation under this feature set. Wire them in separately
      # once CI service containers are added.

      # === Bus + FFI (no features) ========================================
      # `doc_link_guard` rides here because it needs no features and is pure
      # filesystem work (~1s) — it costs nothing on a compile unit that is
      # already being built, and a doc guard that runs nowhere is a doc guard
      # that rots.
      - name: Bus + FFI
        if: ${{ !cancelled() }}
        run: >
          cargo nextest run --no-fail-fast --no-tests=fail
          --test bus_shutdown_drain
          --test bus_stranded_flush
          --test ffi_shutdown_race
          --test ffi_poll_buffer
          --test doc_link_guard

      # === Net mesh + capability + discovery + migration + nRPC dispatch ==
      # All --features net tests share one compile.
      - name: Net mesh, capability, subnets, migration, nRPC dispatch
        if: ${{ !cancelled() }}
        run: >
          cargo nextest run --no-fail-fast --no-tests=fail --features "net fixtures"
          --test integration_net
          --test three_node_integration
          --test channel_auth
          --test channel_auth_hardening
          --test channel_auth_origin_binding
          --test connect_post_start
          --test failure_detector_matrix
          --test parallel_bind_stress
          --test peer_death_evicts_peer_map
          --test send_subprotocol_malformed
          --test subnet_enforcement
          --test subnet_axis_demotion
          --test subnet_gateway_auth
          --test subnet_gateway_local_auth
          --test subnet_grant
          --test subnet_grant_hierarchy
          --test subnet_org_boundary
          --test subnet_revocation
          --test subnet_route_hop_alloc
          --test subnet_relay_alloc_e2e
          --test subnet_assign_alloc
          --test subnet_session_auth
          --test subnet_control_facts
          --test integration_placement_filter_callback
          --test capability_broadcast
          --test capability_multihop
          --test capability_scope
          --test capability_auth_call_path
          --test capability_auth_conformance
          --test capability_schema_doc_guard
          --test capability_aggregation_e2e
          --test org_ownership
          --test org_admission_wire
          --test gang_claim_node
          --test gang_alloc_witness
          --test chain_discovery
          --test cross_lang_capability_fixtures
          --test migration_integration
          --test migration_target_failure_mid_chunking
          --test netsocket_production_defaults
          --test parsed_packet_short_input
          --test proxy_coverage_gaps
          --test stream_config_and_error_display
          --test error_kind_mirror
          --test event_pingwave
          --test route_withdraw
          --test routed_transport_availability

  # --- Family B: NAT traversal + port mapping + RedEX ------------------
  integration-nat-redex:
    name: Integration — NAT traversal, port mapping, RedEX
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Same sccache trial as `integration-net-core` — see the note there.
      # All five integration families carry it: reusing compiler objects
      # ACROSS these jobs is what keeps the split from paying for itself in
      # repeated dependency compilation.
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: "sccache"
      CARGO_INCREMENTAL: "0"
    defaults:
      run:
        working-directory: net/crates/net
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Set up sccache
        uses: mozilla-actions/sccache-action@v0.0.11

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: integration-nat-redex
          workspaces: net/crates/net -> target

      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: nextest

      # === NAT traversal ==================================================
      # `fixtures` rides alongside `nat-traversal` because these tests
      # use the gated test seams (`peer_session_for_test` in
      # direct_upgrade). The seams are cfg'd `any(test, fixtures)` ONLY:
      # `nat-traversal` is a production feature and must not expose
      # them, so the tests opt in explicitly here instead.
      - name: NAT traversal
        if: ${{ !cancelled() }}
        run: >
          cargo nextest run --no-fail-fast --no-tests=fail --features "net nat-traversal fixtures"
          --test connect_direct
          --test nat_classify
          --test peer_death_clears_capability_index
          --test punch_keepalive
          --test punch_keepalive_timing
          --test reflex_probe
          --test reflex_override
          --test rendezvous_ack
          --test rendezvous_coordinator
          --test coordinator_selection
          --test direct_upgrade
          --test nat_matrix
          --test rendezvous_introduce_validation
          --test traversal_observability

      # === Port mapping (UPnP-IGD / NAT-PMP / PCP) ========================
      - name: Port mapping
        if: ${{ !cancelled() }}
        run: >
          cargo nextest run --no-fail-fast --no-tests=fail --features "net port-mapping"
          --test port_mapping_null
          --test port_mapping_real_router

      # === RedEX ==========================================================
      # `redex` chains to `net` in Cargo.toml (redex = ["net", ...]) so a
      # single --features redex covers the e2e suite as well.
      - name: RedEX
        if: ${{ !cancelled() }}
        run: >
          cargo nextest run --no-fail-fast --no-tests=fail --features redex
          --test integration_redex
          --test redex_replication_dst
          --test redex_replication_e2e

  # --- Family C: CortEX + nRPC + tools + sensing + NetDB ---------------
  integration-cortex:
    name: Integration — CortEX, nRPC, AI tools, sensing, NetDB
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Same sccache trial as `integration-net-core` — see the note there.
      # All five integration families carry it: reusing compiler objects
      # ACROSS these jobs is what keeps the split from paying for itself in
      # repeated dependency compilation.
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: "sccache"
      CARGO_INCREMENTAL: "0"
    defaults:
      run:
        working-directory: net/crates/net
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Set up sccache
        uses: mozilla-actions/sccache-action@v0.0.11

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: integration-cortex
          workspaces: net/crates/net -> target

      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: nextest

      # === CortEX + nRPC service surface ==================================
      # `tool` chains to `cortex` (see `tool = ["cortex"]` in
      # Cargo.toml), so adding it here is feature-graph-cheap and
      # keeps `integration_tool_announce` — the substrate-side
      # serve_tool / announce / tool_metadata.fetch contract pin —
      # in this group rather than spawning a fourth compile pass.
      - name: CortEX + nRPC + AI Tools
        if: ${{ !cancelled() }}
        run: >
          cargo nextest run --no-fail-fast --no-tests=fail --features "cortex tool fixtures"
          --test integration_cortex_adapter
          --test integration_cortex_tasks
          --test integration_cortex_memories
          --test cortex_ryw_global_cap
          --test integration_mesh_cancel
          --test integration_nrpc_loopback
          --test integration_nrpc_mesh
          --test integration_nrpc_protected
          --test subnet_auth_e2e
          --test integration_nrpc_streaming
          --test integration_nrpc_client_streaming
          --test integration_nrpc_duplex
          --test integration_nrpc_service_discovery
          --test integration_nrpc_predicate_header
          --test integration_nrpc_cross_lang
          --test integration_nrpc_cross_lang_streaming
          --test integration_tool_announce
          --test capability_exposure_revocation
          --test serve_rpc_reannounce_baseline
          --test nrpc_inbound_dispatcher
          --test nrpc_call_hijack
          --test nrpc_registration_order
          --test nrpc_response_routing
          --test nrpc_route_discriminator
          --test nrpc_service_equality
          --test nrpc_streaming_gate
          --test org_admission_gate
          --test queue_group_dispatch
          --test aggregator_fold_query
          --test aggregator_registry_rpc

      # === Sensing (SENSING_INTEREST_COALESCING_PLAN) =====================
      # The SI-* sensing-interest suite. Reuses the CortEX crate build:
      # `cortex` chains cortex → redex → net, which covers every sensing
      # gate — `net` alone (dispatch, failure_plane, fallback,
      # origin_emitter, relay_delivery), `net + redex` (e2e_registration,
      # leader_delivery, rendezvous, resolver, scheduler_bridge), and
      # `net + redex + cortex` (routed_origin). Matching the prior step's
      # `cortex tool` feature set means the crate lib is already built, so
      # only the sensing test binaries compile here (no fresh crate pass;
      # `tool` is inert for these). These are auto-discovered targets with
      # no `required-features`, so they MUST run under a feature set that
      # satisfies their `#![cfg]` — otherwise they build to empty (0-test)
      # binaries that pass without asserting anything.
      - name: Sensing
        if: ${{ !cancelled() }}
        run: >
          cargo nextest run --no-fail-fast --no-tests=fail --features "cortex tool fixtures"
          --test sensing_dispatch
          --test sensing_org_three_node
          --test sensing_lease
          --test sensing_lease_wire
          --test sensing_failure_plane
          --test sensing_fallback
          --test sensing_origin_emitter
          --test sensing_relay_delivery
          --test sensing_e2e_registration
          --test sensing_leader_delivery
          --test sensing_rendezvous
          --test sensing_resolver
          --test sensing_scheduler_bridge
          --test sensing_routed_origin

      # === NetDB ==========================================================
      - name: NetDB
        if: ${{ !cancelled() }}
        run: >
          cargo nextest run --no-fail-fast --no-tests=fail --features netdb
          --test integration_netdb
          --test netdb_builder_and_accessors

  # --- Family D: in-memory Dataforts + the MeshDB/MeshOS stores --------
  # Three of the four groups here are plain `--features dataforts`, so they
  # share one crate compile. The v0.3 conformance group sits with them rather
  # than beside the on-disk blob suites it used to read next to — it needs no
  # `redex-disk`, and grouping by feature set is the whole point. MeshDB and
  # MeshOS ride along because they were 3s and 4s respectively: cheap enough
  # that a dedicated runner would cost more in setup than it saves.
  integration-dataforts:
    name: Integration — Dataforts (in-memory), batched send/recv, MeshDB, MeshOS
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Same sccache trial as `integration-net-core` — see the note there.
      # All five integration families carry it: reusing compiler objects
      # ACROSS these jobs is what keeps the split from paying for itself in
      # repeated dependency compilation.
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: "sccache"
      CARGO_INCREMENTAL: "0"
    defaults:
      run:
        working-directory: net/crates/net
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Set up sccache
        uses: mozilla-actions/sccache-action@v0.0.11

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: integration-dataforts
          workspaces: net/crates/net -> target

      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: nextest

      # === Dataforts (greedy + gravity) + stream SACK ranges ==============
      # `stream_ack_ranges` (STREAM_ACK_BATCHING_AND_RANGES_PLAN R-6)
      # rides this feature set: it drives lossy blob transfers to prove
      # the capability-gated SACK-range path engages
      # (`StreamAckRanges` emitted, transfer completes byte-for-byte),
      # that the gate stays shut without the peer capability (old-peer
      # interop via the legacy cumulative-ACK + NACK path), and that
      # the `enable_stream_ack_ranges` kill switch suppresses the
      # capability advertisement.
      # The blob/dir transfer + transfer fairness/concurrency suites only
      # need `dataforts` (no `redex-disk`), so they batch into this same
      # in-memory dataforts compile rather than the on-disk blob e2e job
      # (`integration-dataforts-disk`).
      - name: Dataforts greedy + gravity + stream SACK ranges + transfers
        if: ${{ !cancelled() }}
        run: >
          cargo nextest run --no-fail-fast --no-tests=fail --features dataforts
          --test dataforts_greedy_e2e
          --test dataforts_gravity_e2e
          --test stream_ack_ranges
          --test blob_transfer
          --test dir_transfer
          --test transfer_concurrency
          --test transfer_fairness

      # === Scheduled-stream batched drain (Linux sendmmsg send path) ======
      # The whole NRPC_SEND_LOOP_BATCHING_PLAN gate, in one compile. The
      # scheduled-stream egress ships packets via the send loop's batched,
      # group-by-destination drain, which calls `sendmmsg` behind
      # `cfg(target_os = "linux")` — a block that does not compile on the
      # macOS dev host, so this Linux job is the gate that actually compiles
      # AND exercises it. `dataforts` pulls in `net`, so all three drain
      # tests build under one feature set:
      #   - send_drain_depth      — floods 16 concurrent scheduled streams,
      #                             prints the packets/syscall-collapse factor;
      #   - scheduled_stream      — pins the scheduled-vs-direct routing;
      #   - scheduled_stream_integrity — fetches blobs over reliable scheduled
      #     streams and asserts BYTE-FOR-BYTE delivery through the batch path
      #     (incl. a tiny-send-buffer phase that forces the sendmmsg partial
      #     -send / EWOULDBLOCK tail), the integrity check the others can't make.
      # `--no-capture` surfaces the measurement + verified-blob/flush counts.
      - name: Scheduled-stream batched drain (Linux sendmmsg path)
        if: ${{ !cancelled() }}
        run: >
          cargo nextest run --no-fail-fast --no-tests=fail --features dataforts --no-capture
          --test send_drain_depth
          --test scheduled_stream
          --test scheduled_stream_integrity

      # === Batched ingress (Linux recvmmsg receive path) ==================
      # The NRPC_RECV_LOOP_BATCHING_PLAN gate. The mesh receive loop drains the
      # socket via `recvmmsg` (BatchedPacketReceiver) when
      # `MeshNodeConfig::with_batched_ingress(true)` is set — a path behind
      # `cfg(target_os = "linux")` that does not compile on the macOS dev host,
      # so this Linux job is the gate that compiles AND exercises it.
      #   - batched_ingress_integrity — fetches blobs concurrently into a
      #     fetcher built with batched ingress and asserts BYTE-FOR-BYTE
      #     delivery, then that the batched recv path actually carried the bulk
      #     (`recv_batch_stats().syscalls > 0`) — the assertion that only fires
      #     on Linux where the recvmmsg path is live.
      #   - recv_drain_depth — floods a node with fire-and-forget datagrams (no
      #     reliability, so no retransmit-exhaustion flakiness) and asserts the
      #     recvmmsg path collapsed syscalls (`packets > syscalls`), printing the
      #     packets/syscall factor — the heavy-load recv analogue of
      #     send_drain_depth.
      # `--no-capture` surfaces the packets/recvmmsg-batch collapse counts.
      - name: Batched ingress (Linux recvmmsg path)
        if: ${{ !cancelled() }}
        run: >
          cargo nextest run --no-fail-fast --no-tests=fail --features dataforts,batched-ingress --no-capture
          --test batched_ingress_integrity
          --test recv_drain_depth

      # === Dataforts blob v0.3 conformance (Tree + CDC + RS) ==============
      # Phase-pinned end-to-end conformance tests for the v0.3 blob
      # storage track. Each test runs at CI-feasible scale (default
      # parameters tuned for the runner's per-test memory budget; the
      # 100 GiB real-scale variant in the Tree test is `#[ignore]`'d
      # and opt-in via `-- --ignored` for release validators):
      #
      # - Tree (Phase A8): byte-identical round-trip, determinism,
      #   manifest LRU effectiveness, manifest-body-explosion guard.
      # - CDC (Phase B4): end-to-end determinism, dedup-after-edit
      #   ratio under one-byte flip + suffix-shift insert.
      # - RS (Phase C9): round-trip with all chunks present, m-chunk-
      #   loss reconstruction, m+1-loss unrecoverable, cross-adapter
      #   determinism.
      - name: Dataforts blob v0.3 conformance
        if: ${{ !cancelled() }}
        run: >
          cargo nextest run --no-fail-fast --no-tests=fail --features dataforts
          --test dataforts_blob_v3_tree_conformance
          --test dataforts_blob_v3_cdc_conformance
          --test dataforts_blob_v3_rs_conformance
          --test dataforts_blob_v3_composed_conformance

      # === MeshDB =========================================================
      # `meshdb` chains to cortex → redex → net, so a single
      # --features meshdb covers the test's `feature = "net" + "meshdb"`
      # gate.
      - name: MeshDB
        if: ${{ !cancelled() }}
        run: cargo nextest run --no-fail-fast --no-tests=fail --features meshdb --test meshdb_subprotocol_wire

      # === MeshOS + Deck ==================================================
      # `meshos` chains to cortex → redex → net. The pipeline test pins
      # the contract between MeshOsLoop reconcile → admit →
      # ActionDispatcher across phases; the deck test pins the operator
      # surface (DeckClient → AdminCommands → in-process MeshOsRuntime)
      # that Deck-the-binary composes against. scheduler_bridge_driver
      # exercises the MeshOS ↔ Scheduler bridge end-to-end (the
      # SchedulerBridgeDriver over a live MeshOsLoop + MeshNode +
      # WorkflowAdapter). All three share the same `meshos` gate — which
      # transitively enables net/cortex/redex (`meshos → cortex → redex →
      # net`), everything the driver test needs — and run in one cargo
      # invocation.
      - name: MeshOS + Deck
        if: ${{ !cancelled() }}
        run: >
          cargo nextest run --no-fail-fast --no-tests=fail --features meshos
          --test meshos_pipeline
          --test deck_pipeline
          --test scheduler_bridge_driver

  # --- Family E: on-disk Dataforts + the CLI/ABI surfaces --------------
  # The three groups that need something the in-memory family deliberately
  # does NOT have — `redex-disk` for the real on-disk RedEX per node, and
  # `cli` for clap. Kept in their own job for the same reason they were kept
  # in their own steps: merging them into the plain `dataforts` family would
  # retire the proof that the in-memory paths compile without them.
  integration-dataforts-disk:
    name: Integration — Dataforts (on-disk blob e2e), transport ABI, net-blob CLI
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Same sccache trial as `integration-net-core` — see the note there.
      # All five integration families carry it: reusing compiler objects
      # ACROSS these jobs is what keeps the split from paying for itself in
      # repeated dependency compilation.
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: "sccache"
      CARGO_INCREMENTAL: "0"
    defaults:
      run:
        working-directory: net/crates/net
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Set up sccache
        uses: mozilla-actions/sccache-action@v0.0.11

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: integration-dataforts-disk
          workspaces: net/crates/net -> target

      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: nextest

      # === Dataforts blob e2e (multi-node + migration) ====================
      # `redex-disk` is required so MeshBlobAdapter can spin up a real
      # on-disk RedEX per node — separate from the in-memory dataforts
      # family so the on-disk paths get compiled.
      - name: Dataforts blob e2e
        if: ${{ !cancelled() }}
        run: cargo nextest run --no-fail-fast --no-tests=fail --features "dataforts redex-disk" --test dataforts_blob_e2e

      # === Transport C ABI error-code mirror ==============================
      # Parses `include/net_transport.h` and asserts every `#define
      # NET_*` matches its Rust `pub const NET_*` sibling. Gated on
      # `net + dataforts + netdb + redex-disk` per the test's cfg.
      - name: Transport error-code mirror
        if: ${{ !cancelled() }}
        run: cargo nextest run --no-fail-fast --no-tests=fail --features "net dataforts netdb redex-disk" --test transport_error_codes

      # === Dataforts net-blob CLI =========================================
      # Pulls in clap via the `cli` feature; kept separate so the
      # non-CLI dataforts groups don't pay the clap compile cost.
      - name: Dataforts net-blob CLI
        if: ${{ !cancelled() }}
        run: cargo nextest run --no-fail-fast --no-tests=fail --features "dataforts cli" --test net_blob_cli

  loom-tests:
    name: Loom concurrency models
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: net/crates/net
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      # Loom builds need their own cache key — the `--cfg loom`
      # RUSTFLAGS pulls in a different set of dev-deps (`loom`
      # itself is `[target.'cfg(loom)'.dev-dependencies]`) and
      # rebuilds every atomic-touching crate with loom's
      # substitute primitives. Sharing the cache with non-loom
      # jobs would just thrash both — hence the distinct
      # `shared-key`. `rust-cache` folds `RUST*` env vars into its
      # key automatically, but RUSTFLAGS is set at STEP level here,
      # not job level, so the action never sees it; the explicit
      # key is what actually keeps the two families apart.
      #
      # No sccache on this job: `--cfg loom` is a global rustc flag that
      # invalidates every object anyway, so there is nothing to reuse and
      # the wrapper would only add overhead. This job runs in ~1 minute.
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: loom
          workspaces: net/crates/net -> target

      # Loom tests exhaustively explore thread interleavings; release
      # mode is mandatory (debug builds are too slow to converge in CI
      # time budget). The models in `loom_models.rs` use loom's
      # substitute atomics standalone, not the production types, so
      # the test only imports from `loom` itself.
      #
      # `--no-default-features` skips compiling the `net` feature's
      # `adapter::net` module: tokio gates `tokio::net::*` out under
      # `#![cfg(not(loom))]`, and `adapter::net::{proxy, router,
      # transport}` use `tokio::net::UdpSocket` extensively. Trying
      # to compile the lib's net stack under `--cfg loom` fails on
      # the missing tokio::net module. The loom test itself doesn't
      # touch the net stack, so this is purely a build-time gate
      # for the lib that the test target implicitly depends on.
      - name: Run loom models
        run: cargo test --release --no-default-features --test loom_models
        env:
          RUSTFLAGS: --cfg loom

  rust-sdk-tests:
    name: Rust SDK tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # sccache trial job #3 of 3 (see the note in `integration-net-core`).
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: "sccache"
      CARGO_INCREMENTAL: "0"
    defaults:
      run:
        working-directory: net/crates/net/sdk
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Set up sccache
        uses: mozilla-actions/sccache-action@v0.0.11

      # `sdk` and `payments` are members of the `net/crates/net` workspace, so
      # both build into the one shared `net/crates/net/target` — a single
      # `workspaces` entry covers this whole job.
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: sdk
          workspaces: net/crates/net -> target

      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: nextest

      # Feature set covers every SDK integration test except
      # `redis_dedup_contract` (gated on `redis`, deferred until CI
      # service containers land — same policy as the main crate's
      # `integration_redis`). Without this width, tests gated on
      # `cortex` / `testing` / `compute` / `nat-traversal` /
      # `port-mapping` / `tool` / `macros` compile to empty test
      # binaries and the contract goes silently unverified.
      # nextest auto-discovers every `tests/*.rs` file under `sdk/tests/`
      # exactly as `cargo test` did; the step name calls out the load-bearing
      # ones so a missing test binary is obvious in the CI log:
      #   - mesh_stream_backpressure — substrate flow-control pin
      #   - mesh_rpc_bidi_typed     — Phase E client-streaming +
      #     duplex typed SDK surface (5 tests). Gated on
      #     `feature = "net" + "cortex"`, both present here.
      #   - tool_serve_round_trip   — Mesh::serve_tool + call_tool +
      #     watch_tools live two-mesh path. Gated on
      #     `feature = "tool" + "cortex"`.
      #   - tool_format_golden_vectors — T-1 byte-equality
      #     verifier (openai / anthropic / mcp / gemini lowering +
      #     reverse). Gated on `feature = "tool"`.
      #   - tool_event_golden_vectors  — T-2 ToolEvent envelope
      #     round-trip verifier. Gated on `feature = "tool"`.
      #   - tool_macro              — `#[tool]` proc-macro
      #     expansion + serve-helper round-trip. Gated on
      #     `feature = "macros" + "cortex"`.
      #
      # nextest rather than `cargo test`: the SDK has 35 separate integration
      # test binaries and `cargo test` runs them ONE AT A TIME, so the suite
      # was serialising ~64s of execution that overlaps almost completely.
      # This is the shape nextest's process scheduling is actually for. It also
      # brings this job under `.config/nextest.toml` — the `terminate-after`
      # hang guard (a stalled test becomes a named failure instead of eating
      # the 20-minute budget) and the `retries = 0` override that keeps the
      # security-race binaries from being retried into green.
      - name: Run Rust SDK tests (includes mesh_stream_backpressure, mesh_rpc_bidi_typed, tool_*)
        run: cargo nextest run --no-fail-fast --no-tests=fail --features "net cortex dataforts testing compute nat-traversal port-mapping aggregator tool macros"

      # SDK doctests — `///` examples in `sdk/src/`. nextest does NOT run
      # doctests, so this `cargo test --doc` step is load-bearing, not a
      # duplicate of the step above.
      #
      # The feature set MUST stay identical to that step's. It used to be
      # narrower (no `dataforts`, no `aggregator`) and got away with it only
      # because the old `cargo test` above ran the doctest target itself with
      # the wide set. Under nextest it no longer does, so anything gated on
      # those two would have compiled to nothing and gone silently unverified.
      - name: Run Rust SDK doctests
        if: ${{ !cancelled() }}
        run: cargo test --doc --features "net cortex dataforts testing compute nat-traversal port-mapping aggregator tool macros"

      # net-payments — x402 envelope model unit tests plus
      # `payments_golden_vectors`, the Rust source-of-truth verifier for
      # `tests/cross_lang_payments/` (the Node / Python / Go verifiers run
      # in their own jobs off the same fixture; see the fixture README).
      # Rides this job to share the sdk cargo cache — the crate depends on
      # net-mesh + net-mesh-sdk, both already built here. `--all-features`
      # turns on `mcp-gate`, whose composition tests drive the real
      # `gated_invoke` payment gate end to end — without it they compile
      # to an empty test binary and the WS4 contract goes unverified.
      - name: Run net-payments tests (includes payments_golden_vectors + mcp_gate_composition)
        if: ${{ !cancelled() }}
        working-directory: net/crates/net/payments
        run: cargo nextest run --no-fail-fast --no-tests=fail --all-features

      # Same reason as the SDK doctest step: nextest does not run doctests, and
      # the `cargo test --all-features` this replaced was running net-payments'
      # `///` examples as a side effect. Without this they stop being gated.
      - name: Run net-payments doctests
        if: ${{ !cancelled() }}
        working-directory: net/crates/net/payments
        run: cargo test --doc --all-features

  # net-payments benchmark-rot gate: compile (do not run) every bench so a
  # harness/API drift breaks CI, not the next person to run numbers.
  # See docs/internal/plans/PAYMENTS_BENCHMARKS_PLAN.md. `--no-run` means no
  # measurement, just typeck + link.
  #
  # Split out of `rust-sdk-tests`, where it was 696 of that job's 1140 seconds
  # — 61% of the wall clock of a job whose actual tests take ~64s — and sat on
  # the critical path for a gate that shares nothing with the SDK suite.
  #
  # It was also SEVEN cargo invocations, and the last one flipped `--features
  # mesh`, which re-fingerprints the crate and forces a fresh compile of the
  # payments tree. Collapsed to two, which is the floor:
  #
  #   * `--benches` selects every bench target in one pass, and silently skips
  #     the ones whose `required-features` are unmet — which is exactly
  #     `mesh_paid_invoke`. It also replaces the hand-maintained list of six
  #     `--bench <name>` flags, so a NEW bench is gated the day it lands
  #     instead of the day someone remembers to add it here. (It does pull the
  #     lib in as a bench harness too; that is one small extra artifact and
  #     worth the auto-discovery.)
  #   * The second invocation is the only one that needs `mesh`.
  #
  # Keeping the first invocation featureless is deliberate — it is what proves
  # the other benches have not silently acquired a dependency on `mesh`.
  # Folding everything into a single `--features mesh` build would be one
  # compile instead of two, and would retire that proof.
  payments-bench-compile:
    name: net-payments bench compile gate
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: net/crates/net/payments
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: payments-bench
          workspaces: net/crates/net -> target

      - name: Compile net-payments benches (--no-run)
        run: |
          cargo bench --benches --no-run
          cargo bench --features mesh --bench mesh_paid_invoke --no-run

  node-tests:
    name: Node bindings tests (vitest)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: net/crates/net/bindings/node
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: node
          workspaces: net/crates/net -> target

      - name: Install npm dependencies
        run: npm i

      # Build napi binding with the features the vitest suite covers:
      # `net` for the mesh surface + `nat-traversal` for the
      # `traversalStats` / `connectDirectAuto` surface (stage 5 —
      # `traversal_stats.test.ts`; the impl block is `#[cfg]`-gated on
      # this feature, so omitting it compiles those methods out and the
      # test hits `traversalStats is not a function`) + `cortex` for the
      # CortEX / NetDB tests + `compute` for the MeshDaemon / migration
      # tests + `groups` for the `ReplicaGroup` / `ForkGroup` /
      # `StandbyGroup` tests (Stages 3 + 4 of `SDK_COMPUTE_SURFACE_PLAN`
      # and `SDK_GROUPS_SURFACE_PLAN`) + `test-helpers` so
      # `_testInjectSyntheticPeer` is exported for the group-placement
      # fixtures.
      #
      # `cortex` transitively enables redex + netdb via the binding's
      # feature graph. Skip the `redis` default — the Node suite
      # doesn't hit it, and pulling it in would need a service
      # container.
      #
      # Invoke napi directly (not `npm run build:test`) so we can pass
      # `--no-default-features` to suppress `redis`; the package.json
      # scripts bake `redis` in for consumers who want the full
      # surface from source. NOTE: `--no-default-features` means every
      # feature the suite needs must be listed explicitly here — the
      # crate default set (which includes `nat-traversal`) is NOT active.
      - name: Build native module
        working-directory: net/crates/net/bindings/node
        run: npx napi build --platform --no-default-features --features net,nat-traversal,cortex,compute,groups,meshos,deck,meshdb,aggregator,tool,consent,mcp,publish,payments,payments-http,delegation,a2a,org,test-helpers

      # Compile the sibling .ts shims (meshdb.ts, mesh_rpc.ts, errors.ts)
      # into .js so `require('../meshdb')` in the test suite resolves.
      # `napi build` only produces the native `.node` artifact; the
      # AsyncIterable shim that augments MeshQueryStream is plain TS
      # that needs its own tsc pass.
      - name: Build TypeScript shims
        working-directory: net/crates/net/bindings/node
        run: npm run build:ts

      - name: Run tests
        run: npm test

  sdk-ts-tests:
    name: TypeScript SDK tests (vitest + tsc)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: net/crates/net/sdk-ts
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      # `sdk-ts` resolves `@net-mesh/core` through a `file:` devDependency,
      # which carries no version — so a peerDependency range that excludes
      # the core it ships with is invisible to every other step in this job.
      # It surfaces only at `npm install` on a user's machine. Non-strict
      # here: a floor aimed at an unreleased version is fine as long as the
      # CHANGELOG says so. `release-npm-sdk.yml` runs the strict form.
      # A `run:` step naming a script by path needs the executable bit in
      # git's INDEX. The bit is not in the working tree, and a Windows
      # checkout has core.filemode off — so `chmod +x` there is a no-op
      # against the index and the script commits as 100644 with nothing
      # locally to show for it. Every test passes on the author's machine
      # and the step still cannot start:
      #
      #   .../check-ts-consumer.sh: Permission denied
      #   Error: Process completed with exit code 126.
      #
      # Cheap, no network, and it runs early because a 126 wastes a whole job.
      - name: Guard — workflow scripts invoked by path are executable
        working-directory: ${{ github.workspace }}
        run: |
          python3 -m pip install --quiet pyyaml
          python3 .github/scripts/check-script-permissions.py
          python3 .github/scripts/check-script-permissions.py --self-test

      - name: Guard — SDK peer range admits the in-tree core
        working-directory: ${{ github.workspace }}
        run: python3 .github/scripts/check-npm-peer-range.py

      # `@net-mesh/cli` and `@net-mesh/deck` ship nothing themselves — each is
      # a launcher plus per-platform packages in optionalDependencies. npm
      # SKIPS an optional dependency it cannot resolve without failing, so a
      # missing platform package installs with exit 0, reports success, and
      # only surfaces when someone runs the command and gets exit 127.
      #
      # Three lists have to agree for that not to happen: optionalDependencies,
      # the triples the launcher resolves, and the release build matrix. This
      # is the no-network half; the release workflows additionally verify each
      # package is really on the registry before publishing the aggregate.
      - name: Guard — npm aggregates name platform packages that get built
        working-directory: ${{ github.workspace }}
        run: |
          python3 .github/scripts/check-npm-platform-packages.py
          python3 .github/scripts/check-npm-platform-packages.py --self-test

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: sdk-ts
          workspaces: net/crates/net -> target

      # `sdk-ts/package.json` carries `@net-mesh/core: file:../bindings/node`
      # as a devDependency, so `npm i` over there picks up the sibling
      # binding from the working tree. The binding's `.node` cdylib has
      # to be built first or `npm test` will fail to load it.
      #
      # Feature flags MUST include `redis` even though the suite never
      # opens a Redis connection: `sdk-ts/src/redis-dedup.ts` does a
      # real `export { RedisStreamDedup } from '@net-mesh/core'`, and the
      # napi-generated `index.d.ts` only carries the `RedisStreamDedup`
      # declaration when the binding was built with the `redis`
      # feature. Without it, tsc fails the SDK build with
      # `Module '"@net-mesh/core"' has no exported member
      # 'RedisStreamDedup'`. The runtime side is also satisfied — the
      # `.node` cdylib carries the class — but the runtime never opens
      # a connection because no SDK code instantiates the helper in
      # the test suite.
      #
      # `test-helpers` is required so `_testInjectSyntheticPeer` is
      # exported for the group-placement fixtures —
      # `sdk-ts/test/groups.test.ts` uses the same hook the bindings
      # suite does.
      - name: Build native module
        working-directory: net/crates/net/bindings/node
        run: |
          npm i --ignore-scripts
          npx napi build --platform --no-default-features --features redis,net,cortex,compute,groups,meshos,deck,meshdb,aggregator,tool,org,test-helpers,dataforts

      - name: Install npm dependencies
        run: npm i

      # `tsc` first — the v0.11 `originHash` widening (u32 → u64,
      # number → bigint) cascaded through every method signature and
      # interface in the SDK's source. Type-check failures here mean
      # the SDK's type surface drifted away from the binding's
      # generated `.d.ts`; surface them as a CI failure rather than
      # only as a `npm run build` failure on a developer workstation.
      - name: Type-check (tsc)
        run: npm run build

      # The step above compiles the SDK's own sources with
      # `skipLibCheck: true`, which is exactly the blind spot: a declaration
      # file that names a type nothing declares type-checks fine as long as
      # nobody reads it. A consumer who turns skipLibCheck off reads it, and
      # the errors land in OUR shipped files where they cannot fix them:
      #
      #   @net-mesh/core/index.d.ts(507,48): error TS2304:
      #       Cannot find name 'DaemonBridgeTsfns'.
      #   @net-mesh/sdk/dist/meshdb.d.ts(67,10): error TS2305:
      #       Module '"@net-mesh/core"' has no exported member 'InMemoryChainReader'.
      #
      # This runs the check a careful consumer runs — a trivial program
      # against the built pair, dependency declarations checked.
      - name: Type-check a trivial consumer against the shipped declarations
        run: "$GITHUB_WORKSPACE/.github/scripts/check-ts-consumer.sh"

      # The skill's TypeScript hello-world, type-checked against this same
      # surface. It runs here because it needs the napi-generated `index.d.ts`
      # the step above produced — that file is gitignored, so a clean checkout
      # does not have it and skills.yml's `examples` job cannot resolve
      # `@net-mesh/core` at all.
      #
      # The check itself lives in a script because skills.yml runs the identical
      # check as a publication gate: `needs` does not cross workflows, so this
      # job alone could not stop the mirror publishing a TypeScript example that
      # no longer compiles.
      - name: Type-check the skill hello-world example
        run: "$GITHUB_WORKSPACE/.github/scripts/check-skill-example-ts.sh"

      # vitest auto-discovers everything under `test/`. Notable
      # deck-specific coverage exercised by this step:
      #   - test/deck.test.ts — Symbol.asyncDispose hook shape +
      #     runtime drain. The runtime test promotes the "binding
      #     stale" skip to a hard failure when CI=true, so a
      #     misconfigured --features list (missing `deck`) above
      #     fails loudly rather than silently skipping.
      - name: Run vitest
        run: npm test

  python-tests:
    name: Python bindings tests (pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: net/crates/net/bindings/python
    steps:
      - uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # This job's wheel enables features the *release* wheel did not,
      # so everything below could pass against a surface users cannot
      # install. `org` and `deck` shipped that way. Compare the two
      # feature sets before trusting any of it.
      - name: Guard — release wheel carries what this job tests
        working-directory: ${{ github.workspace }}
        run: python3 .github/scripts/check-python-wheel-features.py

      # Match `net/crates/net/rust-toolchain.toml` directly so the
      # pinned 1.96.0 toolchain is installed up-front rather than
      # auto-fetched mid-`maturin develop` by rustup (which has flaked
      # — partial download leaves `rustc` absent on the new toolchain).
      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97.1"
          components: clippy, rustfmt, llvm-tools-preview

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: python
          workspaces: net/crates/net -> target

      # maturin develop requires a virtualenv (refuses to install into
      # the system Python). Create one and prepend it to PATH so every
      # subsequent step resolves `maturin`, `pip`, `pytest`, and the
      # installed `net` extension from the venv.
      - name: Create virtualenv
        run: |
          python -m venv .venv
          echo "${PWD}/.venv/bin" >> "$GITHUB_PATH"
          echo "VIRTUAL_ENV=${PWD}/.venv" >> "$GITHUB_ENV"

      - name: Install maturin, pytest and PyYAML
        # pytest-timeout surfaces the offending test on hangs —
        # without it, a deadlock anywhere in the suite ticks the
        # job-level timeout-minutes and the CI log gives no hint
        # which test was stuck. 60 s is generous for unit/integration
        # mesh tests on GHA; the longest legitimate test in the
        # suite is well under that.
        #
        # PyYAML for the "Run the Python skill examples" step below:
        # `run-skill-examples.sh` reads `docs/data/examples.yaml` through
        # `skill_examples.py`, which imports yaml and exits 1 without it.
        # The venv above is what makes this job need the explicit install —
        # it goes on PATH ahead of the runner's system python3, and the
        # system one is where ubuntu-latest's preinstalled PyYAML lives.
        # `go-tests` calls the same script for --lang go / --lang c and
        # passes because it never shadows that interpreter. Same fix, and
        # same reasoning, as the `examples` job in skills.yml.
        run: pip install --upgrade pip maturin pytest pytest-timeout pyyaml

      # `net,cortex,compute,groups,meshdb,meshos,deck` mirrors the
      # Node binding's feature set for tests. `groups` is needed so
      # `test_groups.py` can import `ReplicaGroup` / `ForkGroup` /
      # `StandbyGroup` / `GroupError`; `meshdb` / `meshos` / `deck`
      # enable the corresponding test modules (each guarded by
      # `pytest.skip` when the feature is absent) plus the stub-drift
      # test's MeshDB class coverage. `delegation` (a shipped default
      # feature) surfaces `derive_child_identity` / `DelegationChain` /
      # `RevocationRegistry` for `test_delegation.py`. Default `redis` is
      # omitted because the suite doesn't exercise the Redis adapter.
      # `extension-module` (the cdylib must not link libpython) has to
      # ride along explicitly: `--no-default-features` + an explicit
      # feature list, so nothing else re-enables it here and we don't
      # rely on maturin merging `[tool.maturin] features` with CLI args.
      - name: Build and install bindings
        # `publish` (V2 Phase 2 — NetMesh.publish_tools) and `a2a` (V2 Phase 3 —
        # NetMesh.serve_a2a / submit_task / task_status / cancel_task) are shipped
        # default features but this job builds `--no-default-features`, so they
        # must be listed explicitly or `test_publish.py` / `test_a2a.py` fail with
        # `AttributeError: 'NetMesh' object has no attribute ...`.
        # `payments-http` (the outbound HTTP-402 client, WS-P2) IS in the
        # default feature set now — it moved there when `PaymentProvider`
        # began requiring an explicit settlement backend, since without it
        # `facilitator_url` can only error and the mock is the only
        # reachable one. This job builds `--no-default-features`, so it
        # still has to be listed, and test_payment_http.py's rows depend on
        # it (they skip cleanly if the class is absent).
        run: maturin develop --no-default-features --features net,cortex,compute,groups,meshdb,meshos,deck,aggregator,tool,consent,mcp,delegation,publish,a2a,payments,payments-http,org,extension-module

      # `--timeout-method=thread` is critical for this FFI-heavy
      # suite: the default `signal` method only works while Python
      # is between bytecode instructions, so a deadlock inside a
      # pyo3 call (or in a Rust-spawned thread we're waiting on)
      # never gets interrupted. Thread-mode wakes a watchdog after
      # the deadline regardless of where the test is blocked and
      # dumps a full Python + C frame for the hung test.
      #
      # `--timeout=30` so even if a hang lands 19 min into the
      # run, the watchdog still has a minute of budget to dump the
      # offender before the 20-minute job ceiling fires.
      #
      # `-s` (`--capture=no`) disables pytest's stdout/stderr
      # capture so timeout dumps + faulthandler traces appear in
      # the GHA log live, not buffered behind a hung test's exit.
      # `PYTHONFAULTHANDLER=1` enables faulthandler at interpreter
      # startup so a hard hang in a Rust FFI call (where the
      # pytest-timeout thread can't print through pytest's capture)
      # still dumps a C-level stack when SIGSEGV/SIGABRT fires or
      # when the watchdog sends the dump signal.
      - name: Run tests
        env:
          PYTHONFAULTHANDLER: "1"
          PYTHONUNBUFFERED: "1"
        run: pytest -v -s --timeout=30 --timeout-method=thread

      # The skill examples import `net_sdk`, the ergonomic wrapper, which sits
      # on the binding `maturin develop` just built. This is the only job with
      # both layers: sdk-py-tests installs the wrapper `--no-deps` on purpose
      # (so its suite needs no maturin), and this job had the binding but not
      # the wrapper. One pure-Python editable install closes the gap.
      - name: Install the sdk-py wrapper
        run: pip install --no-deps -e ../../sdk-py

      # Executed, not just type-checked. hello.py's siblings in Rust and
      # TypeScript both compiled clean for months while hanging forever on a
      # subscribe that could never yield; only running them found it. The
      # runner bounds every example with a timeout, so a hang is reported
      # rather than reproduced.
      - name: Run the Python skill examples
        working-directory: ${{ github.workspace }}
        run: .github/scripts/run-skill-examples.sh --lang python

  sdk-py-tests:
    name: Python SDK tests (sdk-py, pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: net/crates/net/sdk-py
    steps:
      - uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # sdk-py is the pure-Python layer over the `net-mesh` bindings.
      # Its `tests/conftest.py` stubs the native `net` extension before
      # any SDK module loads, so the test run does not need maturin or
      # the Rust toolchain. `--no-deps` skips resolving the runtime
      # requirement against PyPI.
      - name: Install sdk-py (no deps) + test deps
        run: |
          pip install --upgrade pip
          pip install --no-deps -e .
          pip install pytest pydantic

      # pytest auto-discovers `tests/` per pyproject.toml's
      # `testpaths`. Notable deck-specific coverage:
      #   - tests/test_deck_wrapper.py — wrapper-level
      #     DeckClient.from_seed kwarg forwarding +
      #     __enter__/__exit__ dunder dispatch (stubs the raw
      #     pyo3 class so this stays a pure-Python test).
      - name: Run tests
        run: pytest -v

  go-tests:
    name: Go bindings tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go/go.mod

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: go
          workspaces: net/crates/net -> target

      # ONE cdylib, for every consumer. `net-ffi` links `net-mesh` and the seven
      # C-ABI surfaces (compute, deck, mcp, meshdb, meshos, org, rpc) into
      # `libnet.so`; `go/*.go` links `-lnet` and the C skill example links
      # `-lnet`, and neither links anything else. `net-mesh` gave up its own
      # `cdylib` crate-type so `net-ffi` could take the `net` lib name, which is
      # why every existing `-lnet` in the docs stayed correct.
      #
      # This replaced eight separately-linked cdylibs, each of which embedded
      # and re-exported its own copy of `net::ffi`. Link order unified the
      # FUNCTIONS, which is why it looked fine for months. It does not unify
      # `static`s, and `parking_lot_core` keeps its parked-thread registry in
      # one — so a thread that parked on `MeshNode::announce_mu` through one
      # copy was never woken by an unlock through another. That was the Go CI
      # hang, and the same arrangement was documented for C consumers.
      #
      # The seven surfaces are `rlib`-only now, so there is no second cdylib
      # left to link by accident.
      #
      # Features live in `net-ffi/Cargo.toml`, not here. Relying on cargo
      # unifying the siblings' requests made the feature set a property of this
      # command line, so building any subset silently produced a
      # differently-configured `net-mesh`.
      - name: Build the single libnet cdylib
        working-directory: net/crates/net
        env:
          # Line tables + frame pointers so a core from a hung run unwinds.
          # Without them gdb reports "missing debugging information" and the
          # one thread that matters stops two frames in — which is how three
          # captures in a row came back unreadable.
          #
          # Set through the cargo profile variable rather than `-Cdebuginfo` in
          # RUSTFLAGS so a `rustflags` key in `.cargo/config.toml` cannot
          # displace it. `1` is line tables, not full DWARF.
          #
          # Diagnostic setting, kept while the fix is confirmed. Drop it after
          # a few green runs; shipped cdylibs should not carry it.
          CARGO_PROFILE_RELEASE_DEBUG: "1"
          RUSTFLAGS: "-Cforce-frame-pointers=yes"
        run: cargo build --release -p net-ffi --features net-ffi/test-helpers

      # The public nRPC header must describe the library being built.
      #
      # `net_rpc.h` shipped at ABI 0x0002 against a 0x0004
      # implementation, declaring both cancellation functions without
      # the leading `MeshRpcHandle*` that 0x0004 added — so a consumer
      # compiled against it passed whatever was in the first argument
      # register as a mesh pointer. The only guard was
      # `net_rpc_check_abi_version`, which compared `runtime >=
      # expected` and therefore passed the stale header. Text-only, so
      # it runs before the build finishes mattering.
      - name: Guard — nRPC header matches the implementation ABI
        if: ${{ !cancelled() }}
        run: python3 "$GITHUB_WORKSPACE/.github/scripts/check-rpc-abi-parity.py"

      # The invariant this hang cost a lot to find: the Go binary loads exactly
      # one copy of `net::ffi`.
      #
      # Three ways it can regress, so three assertions — "does it build" passes
      # through all of them:
      #
      #   1. a `go/*.go` file reintroduces a second `-l...` and links a sibling
      #      surface directly again;
      #   2. an `extern crate` line goes missing from `net-ffi/src/lib.rs`, in
      #      which case that surface's symbols are silently absent and the
      #      failure surfaces as a link error somewhere unrelated;
      #   3. the cdylib builds without DWARF — not a correctness bug, but it
      #      makes the next hang unreadable while still looking like success.
      - name: Assert the Go binding links exactly one net::ffi
        if: ${{ !cancelled() }}
        run: |
          cd "$GITHUB_WORKSPACE"
          fail=0

          # (1) every cgo directive names net_go and nothing else.
          if grep -h "cgo LDFLAGS" go/*.go | grep -qv -- "-lnet$"; then
            echo "::error::a go/*.go cgo directive links something other than -lnet"
            grep -h "cgo LDFLAGS" go/*.go | grep -v -- "-lnet$"
            echo "Every surface is in libnet.so. Linking a sibling cdylib beside it"
            echo "puts a second copy of net::ffi in the process, which is the hang."
            fail=1
          fi

          cd net/crates/net/target/release

          # (2) every surface actually made it into the one library.
          for pfx in net_mesh_ net_org_ net_rpc_ net_compute_ net_meshdb_ net_meshos_ net_deck_ net_mcp_; do
            n=$(nm -D --defined-only libnet.so 2>/dev/null | grep -c " T $pfx" || true)
            echo "  $pfx exported: ${n:-0}"
            if [ "${n:-0}" -eq 0 ]; then
              echo "::error::libnet.so exports no ${pfx}* symbols; the matching extern crate line in bindings/go/net-ffi/src/lib.rs is probably gone"
              fail=1
            fi
          done

          # (3) no sibling cdylib exists to be linked beside it. They are
          # rlib-only now; a crate-type regression would silently make the old
          # two-copies arrangement buildable again.
          stray=$(ls libnet_*.so 2>/dev/null || true)
          if [ -n "$stray" ]; then
            echo "::error::a sibling FFI crate emitted a cdylib again:"
            echo "$stray"
            echo "Those surfaces belong inside libnet.so via bindings/go/net-ffi."
            echo "A second cdylib carrying net::ffi is the announce_mu hang."
            fail=1
          fi

          # (4) unwind data, so a hang dump is readable.
          if ! readelf -S libnet.so 2>/dev/null | grep -q debug_; then
            echo "::error::libnet.so has no DWARF; a hang dump will not unwind past the FFI entry point"
            echo "CARGO_PROFILE_RELEASE_DEBUG on the build step above is what sets this."
            fail=1
          fi

          exit $fail

      # `integration_test.go` gates its suite behind RUN_INTEGRATION_TESTS=1
      # so local developers can run quick unit-style passes without the
      # full mesh setup. CI wants the full coverage.
      #
      # Through the shared runner so a hang reports NATIVE frames rather than
      # stopping at the cgo boundary — see that script for why, and for why
      # every Go suite entry point in this job has to go through it.
      - name: Run Go tests
        working-directory: go
        env:
          LD_LIBRARY_PATH: ${{ github.workspace }}/net/crates/net/target/release
          RUN_INTEGRATION_TESTS: "1"
        run: $GITHUB_WORKSPACE/.github/scripts/go-test-with-native-stacks.sh

      # Run again with `-tags test_helpers` so the test-only files
      # (`groups_testhelpers.go`, `groups_test.go`,
      # `capability_aggregation_e2e_test.go`) compile and execute.
      # These reference FFI symbols gated behind the `test-helpers`
      # cargo feature on `net-compute-ffi` (already enabled in the
      # build step above) — without the Go build tag they're
      # excluded from the package compile and silently skipped.
      - name: Run Go tests (test_helpers)
        working-directory: go
        env:
          LD_LIBRARY_PATH: ${{ github.workspace }}/net/crates/net/target/release
          RUN_INTEGRATION_TESTS: "1"
        run: $GITHUB_WORKSPACE/.github/scripts/go-test-with-native-stacks.sh test_helpers

      # `abi_stability_cgo_test.go` (+ its self-contained `_cgo.go`
      # helper) is gated behind the DISTINCT `abi_stability` build tag —
      # cgo directives can't live in a `_test.go`, so the helper sits in a
      # tagged regular `.go` file kept out of shipped SDK builds, and a
      # separate tag avoids pulling in the `test_helpers` groups FFI
      # symbols. Neither run above passes `-tags abi_stability`, so the
      # cgo u64 ABI round-trip (TEST_COVERAGE_PLAN §P3-15) was silently
      # excluded from CI. `-run` keeps this to just that test — it's a
      # fast unit test, no need to re-run the integration suite.
      - name: Run Go ABI-stability cgo test
        working-directory: go
        env:
          LD_LIBRARY_PATH: ${{ github.workspace }}/net/crates/net/target/release
        run: go test -v -tags abi_stability -run TestABIStabilityU64FFIRoundTrip ./...

      # With CGO_ENABLED=0 — the default on a Go install with no C compiler
      # on PATH — the toolchain drops every cgo file in this package and
      # compiles it down to the few plain-Go type declarations that remain.
      # The package still exists, so the caller gets type-checked against an
      # almost-empty API and told `undefined: net.New` about their OWN file,
      # with nothing anywhere naming cgo. `go/cgo_disabled.go` replaces that
      # with a message that does. Assert the guard is still wired: the build
      # must fail, the failure must name cgo, and the misleading diagnostic
      # must be gone.
      - name: Assert the cgo-disabled build explains itself
        working-directory: go
        run: |
          set +e
          out=$(CGO_ENABLED=0 go build ./... 2>&1)
          rc=$?
          set -e
          printf '%s\n' "$out"

          if [ "$rc" -eq 0 ]; then
            echo "::error::CGO_ENABLED=0 build succeeded — the cgo_disabled.go guard is gone"
            exit 1
          fi
          if ! printf '%s' "$out" | grep -q "requires_cgo"; then
            echo "::error::the cgo-disabled build failed without naming cgo"
            exit 1
          fi
          if printf '%s' "$out" | grep -q "undefined: net\."; then
            echo "::error::the misleading 'undefined: net.New' diagnostic is back"
            exit 1
          fi

      # `go/example` is the checked-in "run this and watch it work" program,
      # and until now NOTHING in this workflow compiled it. So its manifest
      # drifted: it still declared `go 1.21` long after `go/go.mod` moved to
      # `go 1.26`, and since it consumes that module through a local
      # `replace`, running it as supplied failed before reaching main:
      #
      #   $ go run .
      #   go: module .. requires go >= 1.26 (running go 1.25.5)
      #
      # The directive comparison is the readable diagnostic; building and
      # RUNNING it is what proves the example still works against the module
      # it replaces. Running matters now that the example asserts its own
      # success condition — the producer boundary accepted all 7 events —
      # rather than printing `Done!` over an empty poll. Both are cheap: the
      # library is already built by this job.
      - name: Build and run the checked-in Go example
        working-directory: go/example
        env:
          CGO_LDFLAGS: -L${{ github.workspace }}/net/crates/net/target/release
          LD_LIBRARY_PATH: ${{ github.workspace }}/net/crates/net/target/release
        run: |
          sdk=$(awk '/^go /{print $2; exit}' ../go.mod)
          ex=$(awk '/^go /{print $2; exit}' go.mod)
          echo "go/go.mod declares go $sdk; go/example/go.mod declares go $ex"
          # The example may declare a NEWER language version than the module
          # it replaces, but never an older one — that combination cannot
          # resolve at all. `sort -V` puts the lower version first.
          if [ "$(printf '%s\n%s\n' "$sdk" "$ex" | sort -V | head -1)" != "$sdk" ]; then
            echo "::error::go/example/go.mod declares go $ex but replaces a module requiring go $sdk"
            echo "A local-replace example cannot consume a module with a higher go directive."
            exit 1
          fi
          go run .

      # The Go and C skill examples, executed against the cdylibs built above.
      # This job is the only place they can run: cgo links against libnet, and
      # the C example links against it directly, so the *compile* checks
      # elsewhere use `go vet` and `gcc -fsyntax-only` — neither of which
      # links, let alone runs.
      #
      # C rides along here rather than in ffi-tests because ffi-tests is a
      # cargo-test matrix per FFI crate and never produces a linkable libnet
      # plus a C toolchain in one place. This job already has both.
      - name: Run the Go and C skill examples
        env:
          LD_LIBRARY_PATH: ${{ github.workspace }}/net/crates/net/target/release
          NET_LIB_DIR: ${{ github.workspace }}/net/crates/net/target/release
        run: |
          .github/scripts/run-skill-examples.sh --lang go
          .github/scripts/run-skill-examples.sh --lang c

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: net/crates/net
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: clippy
          workspaces: net/crates/net -> target

      # Stage 4 of PANIC_AUDIT_AND_LINT_HARDENING_PLAN.md: production
      # code (lib + bins) is denied for the four panic-hygiene + unsafe
      # lints declared in `Cargo.toml`'s `[lints.clippy]` table. This
      # step has no `-A` overrides — any new `.unwrap()` /
      # `.expect()` / undocumented `unsafe` block / multi-op unsafe
      # block in lib / bin code fails CI here. `--all-targets`
      # coverage for OTHER clippy lints lives in the next step.
      - name: Run clippy (production code, strict)
        run: cargo clippy --all-features --lib --bins -- -D warnings

      # `--all-features` above lints exactly ONE configuration, and it is not
      # one anybody ships: it force-enables every opt-in feature, including
      # `fixtures` (the test/bench seam). That made CI structurally blind to
      # breakage in the configurations people actually build — `cargo build`,
      # `--features net`, `--features cortex` — none of which enable
      # `fixtures`.
      #
      # This is not hypothetical. Gating `apply_legacy_announcement` behind
      # `#[cfg(any(test, feature = "fixtures"))]` left the two imports that
      # type its signature dangling in every non-`fixtures` build. The
      # `--all-features` job stayed green while `cargo clippy --lib --features
      # cortex -- -D warnings` failed, and so did the Windows security job
      # below (which pins `--features net`) — so the platform-specific
      # security suites it exists to gate silently ran in NO job.
      #
      # `--no-default-features` and the default set are the two ends of the
      # range; between them they catch a cfg that only compiles under a
      # feature nobody enables by default.
      - name: Run clippy (default features, strict)
        run: cargo clippy --lib --bins -- -D warnings

      - name: Run clippy (no default features, strict)
        run: cargo clippy --no-default-features --lib --bins -- -D warnings

      # `--all-targets` adds clippy coverage for tests / benches /
      # examples. Tests are allowed to `.unwrap()` / `.expect()` freely
      # (~5000 sites across the test surface) and rarely contain
      # `unsafe`. The four lints from `[lints.clippy]` are silenced
      # here with `-A`. The `clippy::disallowed_methods` rule
      # (driven by `clippy.toml`) is silenced inside each test module
      # via inner `#![allow(clippy::disallowed_methods)]` attributes
      # — Cargo's `[lints]`-table-vs-CLI precedence quirks make a
      # blanket `-A` flag here unreliable. Every OTHER clippy lint
      # still fails on warning across all targets via `-D warnings`.
      - name: Run clippy (all targets, test surface allowed to panic)
        run: >
          cargo clippy --all-features --all-targets --
          -D warnings
          -A clippy::unwrap_used
          -A clippy::expect_used
          -A clippy::undocumented_unsafe_blocks
          -A clippy::multiple_unsafe_ops_per_block

      # net-payments is a workspace member, not the root `net-mesh`
      # crate, so the bare `cargo clippy` above (no `-p` / `--workspace`,
      # no `default-members`) never lints it — leaving the panic-hygiene
      # warnings in its own `[lints.clippy]` table unpromoted to `-D
      # warnings`, contrary to what that table's comment promises. Lint
      # it explicitly, mirroring the two-step split above: strict on
      # lib/bins, panic lints relaxed on the unwrap-heavy test surface.
      - name: Run clippy — net-payments (production code, strict)
        if: ${{ !cancelled() }}
        working-directory: net/crates/net/payments
        run: cargo clippy --all-features --lib --bins -- -D warnings

      - name: Run clippy — net-payments (all targets, test surface allowed to panic)
        if: ${{ !cancelled() }}
        working-directory: net/crates/net/payments
        run: >
          cargo clippy --all-features --all-targets --
          -D warnings
          -A clippy::unwrap_used
          -A clippy::expect_used
          -A clippy::undocumented_unsafe_blocks
          -A clippy::multiple_unsafe_ops_per_block

  # The `clippy` job above lints the root `net` package and net-payments
  # — `cargo clippy` without `--workspace` doesn't traverse the other
  # workspace members,
  # and the bindings each need a different feature combination so a
  # single `--workspace --all-features` invocation isn't workable
  # either (the Python and Node bindings carry build-tool-specific
  # default features that conflict in CI). This matrix lints each
  # FFI / SDK crate with the same feature flags its build / test job
  # uses, so a clippy regression in any binding fails CI before it
  # lands.
  ffi-clippy:
    name: FFI clippy (${{ matrix.crate.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        crate:
          - name: rust-sdk
            path: net/crates/net/sdk
            # `full` is misleadingly named — it is `local + nat-traversal
            # + redis + jetstream + meshos + deck + tool + macros` and
            # OMITS `port-mapping`, `dataforts`, `meshdb`. Add those three
            # code surfaces explicitly so clippy lints them too (clippy
            # only compiles, so the service-adapter features are fine).
            features: --features "full port-mapping dataforts meshdb"
          - name: node
            path: net/crates/net/bindings/node
            # The widest service-free NAPI surface (no redis default).
            # `test-helpers` keeps the test-only FFI symbols in the lint
            # set; `dataforts` / `nat-traversal` / `port-mapping` are
            # included because the TS-SDK ships with `dataforts` (and the
            # transfer / traversal NAPI surfaces would otherwise go
            # unlinted — that gap hid a dead-code lint on the transfer
            # stream-id helpers).
            features: --no-default-features --features net,cortex,compute,groups,meshos,deck,meshdb,aggregator,tool,consent,mcp,publish,payments,payments-http,test-helpers,dataforts,nat-traversal,port-mapping
          - name: python
            path: net/crates/net/bindings/python
            # The widest service-free pyo3 surface. `meshdb` /
            # `dataforts` / `nat-traversal` / `port-mapping` are included
            # because the python build / test jobs compile them (the
            # earlier set even omitted `meshdb`, which `python-tests`
            # builds) — without them those pyo3 surfaces went unlinted.
            # `consent` / `mcp` are the P1 consent + bridge-helper modules.
            # `delegation` / `publish` / `a2a` add the V2 enrollment, local-tool
            # publication, and A2A binding modules so clippy lints them (they
            # match the `python-tests` build set).
            features: --no-default-features --features net,cortex,compute,groups,meshos,deck,aggregator,tool,meshdb,dataforts,nat-traversal,port-mapping,consent,mcp,delegation,publish,a2a
          - name: go-compute-ffi
            path: net/crates/net/bindings/go/compute-ffi
            # Default features only — the cdylib production build
            # ships without `test-helpers`, and that is the surface
            # we want CI to enforce against. The `test-helpers`
            # symbols are exercised by the `go test` suite, not by
            # consumers.
            features: ""
          - name: go-rpc-ffi
            # nRPC FFI shim — carries the dispatcher trampolines
            # (`net_rpc_set_handler_dispatcher`,
            # `net_rpc_set_client_streaming_handler_dispatcher`,
            # `net_rpc_set_duplex_handler_dispatcher`,
            # `net_rpc_set_streaming_handler_dispatcher`) consumed
            # by `go/mesh_rpc.go`. Lint-coverage gap closed when the
            # streaming-serve dispatcher landed (G-1 of
            # NET_GO_NRPC_PORT).
            path: net/crates/net/bindings/go/rpc-ffi
            features: ""
          - name: go-meshdb-ffi
            path: net/crates/net/bindings/go/meshdb-ffi
            features: ""
          - name: go-meshos-ffi
            path: net/crates/net/bindings/go/meshos-ffi
            features: ""
          - name: go-deck-ffi
            path: net/crates/net/bindings/go/deck-ffi
            features: ""
          - name: go-mcp-ffi
            # MCP bridge pure helpers + consent/pin C ABI, consumed by
            # `go/mcp.go` (MCP_BRIDGE_SDK_PLAN P3). Default features only.
            path: net/crates/net/bindings/go/mcp-ffi
            features: ""
          - name: go-org-ffi
            # Organization capability-auth verb facade C ABI, consumed
            # by `go/org.go` (OSDK-L Workstream C). Default features only.
            path: net/crates/net/bindings/go/org-ffi
            features: ""
          - name: sdk-macros
            # `net-mesh-sdk-macros` ships the `#[tool]` attribute
            # proc-macro. Linted separately from the SDK because the
            # proc-macro crate doesn't inherit feature flags from
            # its consumers — its public surface is the macro's
            # generated code, which the SDK's `tool_macro`
            # integration test covers separately at runtime.
            path: net/crates/net/sdk-macros
            features: ""
          - name: cli
            path: net/crates/net/cli
            # `net-cli` pulls the SDK in with the explicit feature
            # set its Cargo.toml declares; clippy honors that.
            # `--all-targets` covers the bin + integration test
            # crates under `tests/`.
            features: ""
          - name: deck
            path: net/crates/net/deck
            # The deck TUI binary's `unit-tests` step at the top
            # of this workflow runs its `#[cfg(test)] mod tests`
            # blocks, but clippy lints + module-level dead-code
            # checks weren't covered until this matrix entry.
            # Default features only — matches the cargo invocation
            # the test step uses, so what the binary ships gets
            # linted (not the `demo` feature, which is dev-only).
            features: ""
          - name: aggregator-daemon
            path: net/crates/net/aggregator-daemon
            # `net-aggregator-daemon` is a lib + bin crate that
            # hosts an AggregatorRegistry + the
            # `aggregator.registry` RPC service. `--all-targets`
            # covers the bin, lib, and the integration test crate
            # under `tests/`. Default features — the crate's
            # Cargo.toml pins its SDK feature set.
            features: ""
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: clippy-ffi-${{ matrix.crate.name }}
          workspaces: net/crates/net -> target

      - name: Run clippy
        working-directory: ${{ matrix.crate.path }}
        run: cargo clippy ${{ matrix.crate.features }} --all-targets -- -D warnings

  ffi-tests:
    # Executes `cargo test --lib` for each FFI shim crate. The
    # `ffi-clippy` matrix above lints these but never runs their
    # internal `#[cfg(test)] mod tests {}` blocks; pre-fix, ~85
    # Rust unit tests in `bindings/go/*-ffi` and ~32 in the
    # node/python NAPI/PyO3 surfaces were silently uncovered. The
    # `rust-sdk` member is omitted — the dedicated `rust-sdk-tests`
    # job already covers its tests with a broader feature set.
    #
    # Notable deck-specific coverage in `go-deck-ffi`:
    #   - ice_simulate_unknown_variant_leaves_husk_retryable
    #   - ice_commit_unknown_variant_leaves_husk_retryable
    #     (both use a thread-local fault-injection switch on
    #     `build_core_proposal` to exercise the failure-branch
    #     invariant — the husk stays retry-able when the variant
    #     is unrecognised)
    #   - audit_query_setters_set_last_error_on_null_query
    #     (pins the last-error envelope on every NULL-arm return)
    name: FFI tests (${{ matrix.crate.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        crate:
          - name: node
            path: net/crates/net/bindings/node
            features: --no-default-features --features net,cortex,compute,groups,meshos,deck,aggregator,tool,consent,mcp,publish,payments,payments-http,test-helpers
          - name: python
            path: net/crates/net/bindings/python
            features: --no-default-features --features net,cortex,compute,groups,meshos,deck,aggregator,tool,consent,mcp,payments
          - name: go-compute-ffi
            path: net/crates/net/bindings/go/compute-ffi
            features: ""
          - name: go-rpc-ffi
            path: net/crates/net/bindings/go/rpc-ffi
            features: ""
          - name: go-meshdb-ffi
            path: net/crates/net/bindings/go/meshdb-ffi
            features: ""
          - name: go-meshos-ffi
            path: net/crates/net/bindings/go/meshos-ffi
            features: ""
          - name: go-deck-ffi
            path: net/crates/net/bindings/go/deck-ffi
            features: ""
          - name: go-mcp-ffi
            # MCP bridge C ABI — its #[cfg(test)] mod tests drive the
            # net_mcp_* symbols directly (classify/lower parity, secret-
            # negative, pin-store round-trip + concurrent mutations).
            path: net/crates/net/bindings/go/mcp-ffi
            features: ""
          - name: go-org-ffi
            # Organization capability-auth C ABI — its #[cfg(test)] mod
            # tests drive net_org_* directly (caller layout, credential
            # refusal wire, ABI stamp, header↔Rust numeric mirror).
            path: net/crates/net/bindings/go/org-ffi
            features: ""
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: test-ffi-${{ matrix.crate.name }}
          workspaces: net/crates/net -> target

      # napi-rs links `napi_*` runtime symbols at load time (Node
      # provides them inside its embedded V8); a standalone
      # `cargo test --lib` binary can't resolve them at link time.
      # Lazy-linking flags (`-z lazy`, `--allow-shlib-undefined`,
      # `LD_BIND_NOT=1`) defer resolution but modern Ubuntu's
      # `-z now` hardening still trips before main() and the
      # binary fails with `undefined symbol: napi_get_reference_value`
      # / exit 127.
      #
      # Hard fix: build a tiny `libnapi_stub.so` that exports every
      # napi symbol the binding references as a no-op, then
      # `LD_PRELOAD` it before running cargo test. The dynamic
      # linker finds the symbol in the stub, the process starts,
      # and the tests run their pure-Rust helpers
      # (`bigint_u64`, capability conversion, etc.) without ever
      # invoking the stubs at runtime — none of these tests reach
      # the napi-rs runtime code path.
      #
      # Other matrix members don't need this and would silently
      # mask real link-time bugs if the stub were set globally.
      - name: Build napi stub library
        if: matrix.crate.name == 'node'
        working-directory: ${{ matrix.crate.path }}
        run: |
          cat > /tmp/napi_stub.c <<'CEOF'
          // No-op stubs for every napi_* symbol the napi-rs runtime
          // references. The cargo-test binary calls none of these at
          // runtime — the pure-Rust unit tests this matrix entry
          // covers don't exercise napi-rs's JS-bridge code path —
          // but the dynamic linker needs symbol *definitions* to load
          // the binary at all. Every stub returns 0 (napi_ok) so
          // even if a stub IS called by accident, the caller sees a
          // benign "success with no value" result.
          #include <stddef.h>
          typedef int napi_status;
          #define NAPI_STUB(name) napi_status name() { return 0; }
          NAPI_STUB(napi_get_reference_value)
          NAPI_STUB(napi_create_reference)
          NAPI_STUB(napi_delete_reference)
          NAPI_STUB(napi_reference_ref)
          NAPI_STUB(napi_reference_unref)
          NAPI_STUB(napi_module_register)
          NAPI_STUB(napi_set_instance_data)
          NAPI_STUB(napi_get_instance_data)
          NAPI_STUB(napi_create_function)
          NAPI_STUB(napi_throw)
          NAPI_STUB(napi_throw_error)
          NAPI_STUB(napi_throw_type_error)
          NAPI_STUB(napi_get_undefined)
          NAPI_STUB(napi_get_null)
          NAPI_STUB(napi_get_global)
          NAPI_STUB(napi_create_object)
          NAPI_STUB(napi_create_array)
          NAPI_STUB(napi_create_array_with_length)
          NAPI_STUB(napi_create_string_utf8)
          NAPI_STUB(napi_create_string_latin1)
          NAPI_STUB(napi_create_string_utf16)
          NAPI_STUB(napi_create_double)
          NAPI_STUB(napi_create_int32)
          NAPI_STUB(napi_create_uint32)
          NAPI_STUB(napi_create_int64)
          NAPI_STUB(napi_create_bigint_int64)
          NAPI_STUB(napi_create_bigint_uint64)
          NAPI_STUB(napi_create_bigint_words)
          NAPI_STUB(napi_get_value_bigint_int64)
          NAPI_STUB(napi_get_value_bigint_uint64)
          NAPI_STUB(napi_get_value_bigint_words)
          NAPI_STUB(napi_get_value_bool)
          NAPI_STUB(napi_get_value_double)
          NAPI_STUB(napi_get_value_int32)
          NAPI_STUB(napi_get_value_uint32)
          NAPI_STUB(napi_get_value_int64)
          NAPI_STUB(napi_get_value_string_utf8)
          NAPI_STUB(napi_get_value_string_latin1)
          NAPI_STUB(napi_get_value_string_utf16)
          NAPI_STUB(napi_get_boolean)
          NAPI_STUB(napi_typeof)
          NAPI_STUB(napi_get_property)
          NAPI_STUB(napi_set_property)
          NAPI_STUB(napi_has_property)
          NAPI_STUB(napi_delete_property)
          NAPI_STUB(napi_define_class)
          NAPI_STUB(napi_define_properties)
          NAPI_STUB(napi_get_property_names)
          NAPI_STUB(napi_get_all_property_names)
          NAPI_STUB(napi_call_function)
          NAPI_STUB(napi_new_instance)
          NAPI_STUB(napi_instanceof)
          NAPI_STUB(napi_is_array)
          NAPI_STUB(napi_get_array_length)
          NAPI_STUB(napi_get_element)
          NAPI_STUB(napi_set_element)
          NAPI_STUB(napi_create_buffer)
          NAPI_STUB(napi_create_buffer_copy)
          NAPI_STUB(napi_create_external_buffer)
          NAPI_STUB(napi_get_buffer_info)
          NAPI_STUB(napi_is_buffer)
          NAPI_STUB(napi_create_arraybuffer)
          NAPI_STUB(napi_create_external_arraybuffer)
          NAPI_STUB(napi_get_arraybuffer_info)
          NAPI_STUB(napi_is_arraybuffer)
          NAPI_STUB(napi_wrap)
          NAPI_STUB(napi_unwrap)
          NAPI_STUB(napi_remove_wrap)
          NAPI_STUB(napi_create_error)
          NAPI_STUB(napi_create_type_error)
          NAPI_STUB(napi_create_range_error)
          NAPI_STUB(napi_get_and_clear_last_exception)
          NAPI_STUB(napi_is_exception_pending)
          NAPI_STUB(napi_open_handle_scope)
          NAPI_STUB(napi_close_handle_scope)
          NAPI_STUB(napi_open_escapable_handle_scope)
          NAPI_STUB(napi_close_escapable_handle_scope)
          NAPI_STUB(napi_escape_handle)
          NAPI_STUB(napi_run_script)
          NAPI_STUB(napi_get_node_version)
          NAPI_STUB(napi_get_version)
          NAPI_STUB(napi_create_promise)
          NAPI_STUB(napi_resolve_deferred)
          NAPI_STUB(napi_reject_deferred)
          NAPI_STUB(napi_is_promise)
          NAPI_STUB(napi_get_uv_event_loop)
          NAPI_STUB(napi_create_threadsafe_function)
          NAPI_STUB(napi_get_threadsafe_function_context)
          NAPI_STUB(napi_call_threadsafe_function)
          NAPI_STUB(napi_acquire_threadsafe_function)
          NAPI_STUB(napi_release_threadsafe_function)
          NAPI_STUB(napi_ref_threadsafe_function)
          NAPI_STUB(napi_unref_threadsafe_function)
          NAPI_STUB(napi_add_env_cleanup_hook)
          NAPI_STUB(napi_remove_env_cleanup_hook)
          NAPI_STUB(napi_add_async_cleanup_hook)
          NAPI_STUB(napi_remove_async_cleanup_hook)
          NAPI_STUB(napi_fatal_error)
          NAPI_STUB(napi_fatal_exception)
          NAPI_STUB(napi_async_init)
          NAPI_STUB(napi_async_destroy)
          NAPI_STUB(napi_make_callback)
          NAPI_STUB(napi_create_async_work)
          NAPI_STUB(napi_delete_async_work)
          NAPI_STUB(napi_queue_async_work)
          NAPI_STUB(napi_cancel_async_work)
          NAPI_STUB(napi_open_callback_scope)
          NAPI_STUB(napi_close_callback_scope)
          NAPI_STUB(napi_create_date)
          NAPI_STUB(napi_get_date_value)
          NAPI_STUB(napi_is_date)
          NAPI_STUB(napi_object_freeze)
          NAPI_STUB(napi_object_seal)
          NAPI_STUB(napi_strict_equals)
          NAPI_STUB(napi_coerce_to_bool)
          NAPI_STUB(napi_coerce_to_number)
          NAPI_STUB(napi_coerce_to_string)
          NAPI_STUB(napi_coerce_to_object)
          NAPI_STUB(napi_is_error)
          NAPI_STUB(napi_get_named_property)
          NAPI_STUB(napi_set_named_property)
          NAPI_STUB(napi_has_named_property)
          NAPI_STUB(napi_get_prototype)
          NAPI_STUB(napi_get_cb_info)
          NAPI_STUB(napi_get_new_target)
          NAPI_STUB(napi_add_finalizer)
          NAPI_STUB(napi_create_typedarray)
          NAPI_STUB(napi_is_typedarray)
          NAPI_STUB(napi_get_typedarray_info)
          NAPI_STUB(napi_create_dataview)
          NAPI_STUB(napi_is_dataview)
          NAPI_STUB(napi_get_dataview_info)
          NAPI_STUB(napi_create_symbol)
          NAPI_STUB(napi_check_object_type_tag)
          NAPI_STUB(napi_type_tag_object)
          NAPI_STUB(node_api_get_module_file_name)
          NAPI_STUB(node_api_create_external_string_latin1)
          NAPI_STUB(node_api_create_external_string_utf16)
          NAPI_STUB(node_api_symbol_for)
          NAPI_STUB(node_api_create_property_key_latin1)
          NAPI_STUB(node_api_create_property_key_utf16)
          NAPI_STUB(node_api_create_property_key_utf8)
          NAPI_STUB(node_api_create_buffer_from_arraybuffer)
          CEOF
          gcc -shared -fPIC -o /tmp/libnapi_stub.so /tmp/napi_stub.c

      - name: Run tests (node — napi symbols stubbed)
        if: matrix.crate.name == 'node'
        working-directory: ${{ matrix.crate.path }}
        env:
          RUSTFLAGS: "-C link-arg=-Wl,--unresolved-symbols=ignore-all -C link-arg=-Wl,--allow-shlib-undefined"
          LD_PRELOAD: "/tmp/libnapi_stub.so"
        run: cargo test --lib ${{ matrix.crate.features }}

      # The python entry needs no napi-style stub: the crate follows
      # pyo3's optional-extension-module pattern (see its Cargo.toml),
      # so a plain `cargo test` build links the host libpython like
      # any normal crate and the test binary runs standalone. Linking
      # `-lpython3.X` needs the unversioned `.so` symlink from
      # python3-dev; the runner image normally ships it, so this is a
      # cheap guard rather than an unconditional install.
      - name: Ensure libpython is linkable (python)
        if: matrix.crate.name == 'python'
        run: |
          dpkg -s python3-dev >/dev/null 2>&1 || {
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends python3-dev
          }

      - name: Run tests
        if: matrix.crate.name != 'node'
        working-directory: ${{ matrix.crate.path }}
        run: cargo test --lib ${{ matrix.crate.features }}

      # org-ffi is the one FFI crate with INTEGRATION targets — the S4 C
      # live cell, which drives the real C ABI end to end (net_mesh_new
      # from JSON, net_mesh_arc_clone per consuming call, the net_subnet_*
      # admin + serve entry points, net_org_credentials_new / _bind /
      # _call_exported, and a process-wide handler trampoline) against the
      # same generated scenario the Node, Python, and Go cells load. The
      # `--lib` step above does not reach those.
      #
      # `--test '*'` on purpose, not `--test <name>`: auto-discovery means a
      # future integration test here runs for free, which is exactly the
      # silent-skip failure mode the "Integration test pin guard" job exists
      # to catch for the core crate's by-name pins. Nothing to enforce if
      # nothing is pinned by name.
      - name: Run integration tests (org-ffi — the S4 C ABI live cell)
        if: matrix.crate.name == 'go-org-ffi'
        working-directory: ${{ matrix.crate.path }}
        run: cargo test --test '*'

  cli-tests:
    # `net-cli`'s test surface is broader than the FFI shims:
    # unit tests inside `src/`, plus integration-test crates under
    # `tests/` that spawn the binary via `assert_cmd`. The crate
    # has no lib target, so `cargo test --lib` would silently skip
    # everything; `cargo test -p net-cli` runs every target cargo
    # auto-discovers, so a new `tests/foo.rs` doesn't need a CI
    # edit.
    #
    # Current surface (informational; not a check):
    #
    #   src/main.rs                  — humantime duration parser
    #   src/output.rs                — format resolver
    #   src/error.rs                 — exit-code discriminator pin
    #   src/parsers.rs               — parse_u64_flexible
    #   src/commands/ice.rs          — confirmation-gate logic
    #   src/commands/identity.rs     — iso8601 formatter
    #   tests/help.rs                — help-text + version surface
    #   tests/exit_codes.rs          — documented exit codes
    #   tests/dry_run.rs             — admin verb `--dry-run` envelope
    name: Net CLI tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: net/crates/net
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: cli
          workspaces: net/crates/net -> target

      # Toolchains for the typegen downstream type-checks (E-2 / E-3). Without
      # these, tests/typegen_downstream_{ts,python}.rs self-skip; installing
      # them here makes those checks actually run.
      - name: Install Node + TypeScript
        uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Install tsc
        run: npm install -g typescript@6

      - name: Install Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install mypy + pydantic
        run: python -m pip install --upgrade mypy pydantic

      - name: Run net-cli tests
        run: cargo test -p net-cli

  aggregator-daemon-tests:
    # `net-aggregator-daemon` is a lib + bin crate. The lib hosts
    # the `boot` / `run` entry points + config parsing + template
    # validation; the bin is a thin `Cli::parse + run` shim. Unit
    # tests live in `src/lib.rs`'s `#[cfg(test)] mod tests`;
    # integration tests live in `tests/boot_and_query.rs` and
    # drive a real two-node mesh handshake against the daemon's
    # registry-RPC surface. `cargo test -p net-aggregator-daemon`
    # picks up every target automatically — new `tests/foo.rs`
    # entries don't need a CI edit.
    name: Aggregator daemon tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: net/crates/net
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: aggregator-daemon
          workspaces: net/crates/net -> target

      - name: Run net-aggregator-daemon tests
        run: cargo test -p net-aggregator-daemon

  mcp-tests:
    # `net-mesh-mcp` is the MCP <-> mesh bridge adapter. By doctrine
    # it rides on the public `net-mesh-sdk` surface ONLY — the
    # `tests/dependency_boundary.rs` test asserts that boundary, so a
    # regression that reaches past the SDK fails this job. Unit tests
    # live in each `src/**` module's `#[cfg(test)] mod tests`; the
    # `tests/*.rs` integration tests stand up real one/two/three-node
    # meshes (wrap provider + demand-side gateway, incl. a ~20s
    # three-node failover). They spawn the conformance server via
    # `CARGO_BIN_EXE_net-mcp-fixture`, which builds only under the
    # `fixture` feature (kept out of the published artifact), so both
    # commands below pass `--features fixture`. A new fixture-spawning
    # `tests/foo.rs` needs a `[[test]] required-features = ["fixture"]`
    # entry in `Cargo.toml`; a non-fixture test is still auto-discovered.
    #
    # Clippy is `--lib --bins`, NOT `--all-targets`: production code is
    # held to `-D warnings` with `unwrap_used` / `expect_used` denied
    # (see the crate's `[lints.clippy]`), but the integration tests
    # legitimately use `unwrap` / `expect`, so linting test targets
    # under `-D warnings` would fail by design. This is why the crate
    # gets a dedicated job rather than a `ffi-clippy` matrix entry
    # (that matrix hardcodes `--all-targets`).
    name: MCP adapter tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: net/crates/net
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: mcp
          workspaces: net/crates/net -> target

      - name: Run clippy (production code, strict)
        run: cargo clippy -p net-mesh-mcp --lib --bins --features fixture -- -D warnings

      # The `keychain` feature (OS-keychain secret value backend for credential
      # forwarding) is non-default — the published artifact and the tests
      # below never compile it. Build-check it here so its Linux path
      # (pure-Rust kernel keyutils; no libdbus / C system lib) can't silently
      # rot. It is a compile/lint check only, not a test run: the keychain
      # tests need a usable keyring, so building is what catches a break.
      - name: Run clippy (keychain feature, compile check)
        if: ${{ !cancelled() }}
        run: cargo clippy -p net-mesh-mcp --lib --features keychain -- -D warnings

      - name: Run net-mesh-mcp tests
        if: ${{ !cancelled() }}
        run: cargo test -p net-mesh-mcp --features fixture

  windows-security-tests:
    # The ONLY job on a Windows runner.
    #
    # Every other job here is `ubuntu-latest`, which meant every
    # `#[cfg(windows)]` assertion in the tree was dead code: it never
    # compiled, never linked, never ran. That is precisely inverted from where
    # the risk is — Windows is the platform where the file-permission model is
    # WEAKEST for this crate. There is no 0600, so `owner-audience.key`
    # confidentiality rests entirely on the authority directory's DACL and on
    # a stderr warning, and both of those were untested in CI.
    #
    # Concretely, this job is what gates:
    #
    #   * `validate_dacl_view` — the owner check (a foreign owner holds
    #     implicit WRITE_DAC and can re-open the boundary after validation
    #     passes) and the non-simple-ACE fail-closed rule (object / callback
    #     ALLOW ACEs are real grants and were silently skipped);
    #   * `read_object_security` — the binary GetFileSecurityW walk;
    #   * `write_atomic`'s protected-DACL provisioning and the
    #     `<non-simple-ace>` sentinel contract;
    #   * `cli/tests/org_grant.rs`'s two `#[cfg(windows)]` witnesses, which
    #     are the ONLY coverage of `warn_secret_permissions` — the entire
    #     Windows substitute for the 0600 guarantee.
    #
    # Scoped to the org/authority surface rather than the whole matrix: the
    # goal is to gate the platform-specific SECURITY code, not to double the
    # CI bill re-running cross-platform logic ubuntu already covers.
    name: Windows security tests
    runs-on: windows-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: net/crates/net
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: winsec
          workspaces: net/crates/net -> target

      # nextest here for the same reasons the ubuntu jobs use it, plus two
      # that are specific to this job (see `.config/nextest.toml`):
      #
      #   * `slow-timeout` / `terminate-after` turn a hung test into a NAMED
      #     failure. Under plain `cargo test` a hang consumed this job's whole
      #     40-minute budget with no indication of which test stalled — the
      #     exact failure the nextest config was written to prevent, which
      #     this job was bypassing by not using nextest.
      #   * the `retries = 0` override applies to the security suites, so a
      #     deliberate-race regression cannot be retried into a green run.
      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: nextest

      # The lib units carry the DACL validator witnesses (org_authority) plus
      # the authority/revocation/ingest suites. `--features net` is the
      # narrowest set that compiles the org modules.
      #
      # Two hazards, both learned the hard way:
      #
      #  1. `adapter::net::behavior::org` is a PREFIX, and not every
      #     security-relevant module lives under it. `org_admission_gate` sits
      #     at `adapter::net::org_admission_gate` — one level up — and was
      #     silently excluded. Both surfaces are named explicitly below.
      #
      #  2. `cargo test -- <filter>` exits **0** when the filter matches
      #     NOTHING, so a module rename turned this job into a green no-op —
      #     the identical silent-coverage failure that the "every tests/*.rs is
      #     pinned to a step" guard in the integration job exists to prevent.
      #     That guard was never applied to its own neighbour. `--no-tests=fail`
      #     closes it natively: an empty filterset is an error, not a pass.
      - name: Org + authority unit tests
        run: >
          cargo nextest run --features net --lib --no-tests=fail
          -E 'test(/^adapter::net::behavior::org/) + test(/^adapter::net::org_admission_gate/)'

      # The CLI's Windows witnesses: the DACL warning on `--discover`, and the
      # case-variant no-clobber guard (NTFS is case-insensitive, so a
      # case-variant `--out` names the SAME file as the org key — the exact
      # aliasing the lexical guard cannot catch).
      - name: Net CLI tests
        run: cargo nextest run -p net-cli --no-tests=fail

      # Windows-only production paths must also LINT here: the DACL reader is
      # `#[cfg(windows)]`, so the ubuntu clippy job never sees it.
      - name: Clippy (production, strict)
        run: cargo clippy --features net --lib --bins -- -D warnings

  fmt:
    name: Format
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: net/crates/net
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --all -- --check

  doc:
    name: Documentation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: net/crates/net
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: doc
          workspaces: net/crates/net -> target

      - name: Build documentation
        run: cargo doc --no-deps --all-features
        env:
          RUSTDOCFLAGS: -D warnings

      # `cargo doc --all-features` only docs the current package
      # (the root `net-mesh` crate). Workspace members live in
      # their own crates; `net-cli` and `deck` both have
      # substantial module-level docstrings that document the
      # subcommand / TUI surface contracts — keep them
      # warning-free.
      - name: Build net-cli documentation
        run: cargo doc -p net-cli --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

      - name: Build deck documentation
        run: cargo doc -p net-deck --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

      - name: Build net-aggregator-daemon documentation
        run: cargo doc -p net-aggregator-daemon --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

      # `net-mesh-sdk` is a substantial workspace member with most
      # of the user-facing AI tool / nrpc / mesh / netdb docstrings.
      # Pinning `--features full` so the full doc surface (tool +
      # macros + nrpc + cortex + compute + groups + meshos + deck
      # + dataforts + meshdb + aggregator + local + nat-traversal
      # + redis + jetstream) is verified warning-free in lockstep
      # with the `ffi-clippy` `rust-sdk` lint job.
      - name: Build net-mesh-sdk documentation
        run: cargo doc -p net-mesh-sdk --no-deps --features full
        env:
          RUSTDOCFLAGS: -D warnings

      # `#[tool]` proc macro crate. User-facing macro docs live
      # here; the SDK depends on them via `pub use net_sdk_macros::tool;`.
      - name: Build net-mesh-sdk-macros documentation
        run: cargo doc -p net-mesh-sdk-macros --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

      # `net-rpc-ffi` is the cgo-facing nRPC shim. Its public
      # surface (extern "C" fn signatures + ABI version constants
      # + handle types) is what `go/mesh_rpc.go` documents against;
      # keep its rustdoc warning-free so the cross-language ABI
      # contract notes stay buildable.
      - name: Build net-rpc-ffi documentation
        run: cargo doc -p net-rpc-ffi --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

      # `net-org-ffi` is the cgo-facing organization capability-auth
      # shim (OSDK-L Workstream C). Its public surface (extern "C" fn
      # signatures + NET_ORG_* constants + handle types + the secret-
      # asymmetry doctrine) is what `go/org.go` and `include/net_org.h`
      # document against; keep its rustdoc warning-free.
      - name: Build net-org-ffi documentation
        run: cargo doc -p net-org-ffi --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

      # `net-mesh-mcp` is the MCP bridge adapter. Its module-level
      # docstrings document the demand/serve/wrap contracts (meta-tool
      # surface, owner-scope gate, describe protocol, failover); keep
      # them warning-free like the other workspace members.
      - name: Build net-mesh-mcp documentation
        run: cargo doc -p net-mesh-mcp --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

      # `net-payments` is a workspace member the bare `cargo doc` above
      # never documents, so its rustdoc has gone unchecked. Build it with
      # `--all-features` (matches the test job — turns on `unsafe-dev-signer`
      # etc. so gated items resolve) and deny warnings like every other
      # member.
      - name: Build net-payments documentation
        run: cargo doc -p net-payments --no-deps --all-features
        env:
          RUSTDOCFLAGS: -D warnings
