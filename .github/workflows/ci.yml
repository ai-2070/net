      # R5-A: a downstream consumer may enable `net-mesh-wire/webrtc`
      # without the core's `webrtc`. Three configurations, all of
      # which must build; the failing leg is the middle one.
      - name: Wire-feature consumer graph (R5-A)
        if: ${{ !cancelled() }}
        working-directory: spikes/tools/feature_consumer
        run: |
          cargo check --locked
          cargo check --locked --features wire-only
          cargo check --locked --features core-rtc

      # The wire crate's own `webrtc` feature adds the `PeerAddr::Rtc`
