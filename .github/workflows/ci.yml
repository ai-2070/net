  leaf-wasm:
    # The `net-mesh-leaf` crate. Its own job for the same
    # reason `webrtc-browser` is one — it pays for a wasm32
    # toolchain, a bindgen CLI, a browser and a chromedriver, and it
    # builds a crate that is deliberately NOT a member of the mesh
    # workspace (the leaf pulls wasm-bindgen/web-sys; a native
    # `cargo build --workspace` must never resolve them).
    #
    # Four things are gated here, and the third is not redundant with
    # the second: the native tests (the protocol logic is sans-IO and
    # runs without a browser), the wasm32 *check*, the wasm32
    # *clippy* — which is the only thing that catches a `RefCell`
    # borrow held across an await, and did — and the executed wasm
    # tests, because `Instant::now()` COMPILES on wasm32 and panics
    # at runtime, so a check job alone cannot guard that seam.
    name: Leaf crate + wasm test runner
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: net/crates/net/leaf
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      # This job's steps already run inside the pinned directory,
      # but the assertion is the point: `rustup target add` is silent
      # about WHICH installation it added to, and the browser job's
      # `E0463: can't find crate for 'core'` is what that silence
      # looks like one step later.
      - name: Add wasm32 to the pinned toolchain
        run: |
          set -o pipefail
          rustup target add wasm32-unknown-unknown
          rustup show active-toolchain
          rustup target list --installed | tee /dev/stderr | grep -qx wasm32-unknown-unknown || {
            echo "::error::wasm32-unknown-unknown is not installed for the toolchain this directory selects"
            exit 1
          }

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: leaf-wasm
          workspaces: net/crates/net/leaf -> target

      # The bindgen CLI version must EQUAL the crate version the leaf
      # pins (`wasm-bindgen = "=0.2.129"`).
      - name: Install wasm-bindgen-cli 0.2.129
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen-cli@0.2.129

      # `wasm-bindgen-test-runner` drives a real browser over
      # WebDriver, and chromedriver refuses a Chrome whose major
      # version differs from its own. `install-chromedriver: true`
      # alone did NOT keep them in step on the candidate -
      # it paired ChromeDriver 153 with Chrome 152 and every wasm
      # test failed before it ran. Pin ONE version for both, from
      # Chrome-for-Testing, and then assert the two majors match:
      # the pin is a request, the assertion is the guarantee.
      - name: Install Chrome + a matching chromedriver
        id: chrome
        uses: browser-actions/setup-chrome@v2
        with:
          chrome-version: "153"
          install-chromedriver: true

      # …and the runner must launch THAT Chrome. chromedriver starts
      # whatever `google-chrome` it finds on PATH, and the hosted
      # image ships its own — which is how a matched 153/153 pair
      # still produced "This version of ChromeDriver only supports
      # Chrome version 153" against a 152 binary. The webdriver
      # capabilities name the binary explicitly.
      - name: Point the wasm runner at the installed Chrome
        env:
          CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}
        run: |
          set -o pipefail
          python3 - "$CHROME_BIN" <<'PY'
          import json, sys
          path = "webdriver.json"
          with open(path) as f:
              caps = json.load(f)
          caps.setdefault("goog:chromeOptions", {})["binary"] = sys.argv[1]
          with open(path, "w") as f:
              json.dump(caps, f, indent=2)
          print(json.dumps(caps, indent=2))
          PY

      - name: Assert Chrome and chromedriver agree
        env:
          CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}
        run: |
          set -o pipefail
          chrome_v=$("$CHROME_BIN" --version)
          driver_v=$(chromedriver --version)
          echo "$chrome_v"
          echo "$driver_v"
          chrome_major=$(printf '%s' "$chrome_v" | grep -oE '[0-9]+' | head -1)
          driver_major=$(printf '%s' "$driver_v" | grep -oE '[0-9]+' | head -1)
          if [ "$chrome_major" != "$driver_major" ]; then
            echo "::error::chromedriver $driver_major cannot drive Chrome $chrome_major — \
          the wasm suite would fail before running a single test"
            exit 1
          fi

      - name: Formatting
        run: cargo fmt -- --check

      # Kyra's review probes, landed VERBATIM (assertions
      # untouched) and pinned by name. They reproduced 12 failures
      # out of 15 when they landed; a repair that regresses one must
      # fail here by name rather than shrink the roster.
      - name: Leaf review probes
        run: |
          set -uo pipefail
          REQUIRED="
            kyra_small_reliable_control
            kyra_reliable_fragmented_payload_is_delivered
            kyra_session_replacement_resets_receive_sequence
            kyra_channel_publication_is_not_misclassified_as_stream
            kyra_reply_from_another_session_cannot_complete_call
            kyra_same_peer_wrong_reply_route_cannot_complete_call
            kyra_reordered_stream_events_keep_their_own_sequences
            kyra_correct_peer_and_route_reply_control
            kyra_fire_and_forget_fragment_control
            kyra_session_replacement_fails_old_pending_call
            kyra_other_entity_cannot_replace_victim_and_authorize_signal
            kyra_two_distinct_ice_candidates_in_one_dialog_survive_dedup
            kyra_expired_announcement_is_not_discovery_or_signal_authority
            kyra_incomplete_fragment_coverage_is_rejected
            kyra_reliable_packet_build_retains_retransmit_owner
            kyra_subscribe_then_publish_consumes_one_sequence_space
            kyra_other_channel_membership_control
            kyra_retransmitted_fragment_does_not_destroy_acknowledged_partial
            kyra_reliable_reorder_overflow_delivers_all_or_fails_typed
            kyra_correct_inner_route_does_not_authorize_wrong_outer_channel
            kyra_old_leaf_stream_handle_is_refused_after_replacement
            kyra_fresh_handle_after_replacement_control
            kyra_fragment_group_cannot_change_stream_or_provenance
            kyra_unexpired_signal_replay_stays_refused_under_capacity_pressure
            kyra_lossfree_fragment_delivery_control
            kyra_same_session_close_reopen_preserves_receive_progress
            kyra_control_overdraft_grant_does_not_refund_withheld_application
            kyra_control_debit_below_window_control
            kyra_expired_acknowledged_partial_delivers_or_fails_typed
            kyra_unexpired_partial_delivery_control
            kyra_promotion_lossfree_control
            kyra_promotion_delayed_packet_still_delivers_control
            kyra_promotion_lost_reliable_boundary_delivers_or_fails
            kyra_promotion_wire_ack_does_not_claim_missing_sequence
            kyra_promotion_past_lost_faf_boundary_settles_consumer
            kyra_reliable_fragment_head_promotes_consumer_before_faf_tail_traffic
            kyra_faf_fragment_loss_does_not_kill_following_faf_messages
            kyra_explicit_epoch_debit_replacement_control
            kyra_implicit_epoch_debit_cannot_rewind_successor
            kyra_large_cumulative_grant_retires_all_control_debt
            kyra_deadline_shaped_application_bytes_other_route_control
            kyra_deadline_shaped_application_bytes_matching_route_are_data
            kyra_real_faf_loss_before_promotion_ordered
            kyra_real_faf_loss_before_promotion_reordered
            kyra_partial_faf_expiry_after_promotion_ordered
            kyra_partial_faf_expiry_after_promotion_reordered
            kyra_reset_replaces_receive_boundary_not_send_half
            kyra_native_flags_cannot_false_ack_lost_reliable_head
            kyra_completed_fragment_duplicate_does_not_terminal
            kyra_completed_fragment_no_duplicate_control
            kyra_rpc_carrier_cannot_silently_shadow_admitted_stream
            kyra_unowned_carrier_application_control
            an_impostor_with_the_domain_psk_is_refused_the_identity_it_claims
            the_honest_initiator_is_installed_after_its_establishment_proof
            a_wrong_domain_psk_is_still_refused_before_any_admission
            a_proof_from_another_establishment_cannot_promote_this_one
            a_proof_arriving_after_the_attempt_expired_installs_nothing
            the_periodic_sweep_retires_an_abandoned_attempt
            a_superseded_attempt_loses_its_right_to_install
            closing_the_peer_revokes_an_unproven_establishment
            the_direct_path_demands_the_same_proof_as_the_routed_one
            retiring_the_attempt_revokes_an_unproven_establishment
            application_bytes_on_an_unproven_establishment_are_never_delivered
          "
          set -o pipefail
          # A pin that names nothing can never be satisfied and reads
          # exactly like a regression when it fails. Check the roster
          # against the source BEFORE running anything.
          python3 "$GITHUB_WORKSPACE/.github/scripts/check-roster.py" \
            --label "leaf review probes" --mode fn \
            --source tests/kyra_review.rs \
            --source tests/kyra_followup.rs \
            --source tests/kyra_round2_review.rs \
            --source tests/kyra_round3_review.rs \
            --source tests/kyra_round4_parent.rs \
            --source tests/establishment_identity.rs \
            $REQUIRED
          # No `--test` form: the integration-test pin guard
          # inventories only the root, SDK and net-cli crates, and the leaf is
          # its own workspace, so a `--test kyra_review` pin reads to
          # that guard as a pin naming a crate it cannot attribute.
          # Running the whole crate covers the same binary, and the
          # by-name loop below is what keeps the roster honest.
          cargo test --features mock-control-plane 2>&1 \
            | tee /tmp/kyra-review.log
          for required in $REQUIRED; do
            grep -q "^test $required \.\.\. ok$" /tmp/kyra-review.log || {
              echo "::error::Kyra's probe $required did not run and pass"; exit 1; }
          done
          echo "Kyra's Stage 5 probes and the S6-01 establishment-identity witnesses: 63/63"

      - name: Native tests (the sans-IO half)
        run: |
          set -o pipefail
          cargo test --features mock-control-plane 2>&1 | tee /tmp/leaf-native.log
          total=$(grep -c '^test .* \.\.\. ok$' /tmp/leaf-native.log || true)
          echo "leaf native tests: $total"
          # FLOOR is the measured inventory of this exact command: 286 lib
          # units + 183 across the fourteen native integration binaries (the four
          # `wasm_*` binaries compile to 0 tests natively, by design, and
          # doctests are 0). No test in the leaf is `#[cfg(unix)]`/
          # `#[cfg(windows)]`, so the count is platform-independent.
          # Raise it in the SAME commit as the witnesses it counts.
          if [ "$total" -lt 469 ]; then
            echo "::error::the leaf's native surface ran $total tests, floor is 469 — \
          lower the floor deliberately or restore the witness"
            exit 1
          fi
          # === the org streaming suite floors
          # The three org suites' counts, fail-closed (a suite that silently
          # shrinks must not read as green). Floor accounting from the source
          # rosters at the pinned head. One documented rename inside
          # org_streaming_lifecycle:
          # `response_credit_parks_the_sender_and_each_grant_releases_exactly_its_chunks`
          # replaced `…the_pump…` when the instrument moved to sender-parking
          # (strengthened — the property moved with it).
          for spec in org_authority:22 nrpc_streaming_parity:21 org_streaming_lifecycle:29; do
            name="${spec%%:*}"; floor="${spec##*:}"
            out=$(cargo test --features mock-control-plane --test "$name" 2>&1 | tee /dev/stderr)
            n=$(printf '%s\n' "$out" | grep -oE 'test result: ok\. [0-9]+ passed' | grep -oE '[0-9]+' | head -1)
            echo "$name: ${n:-0} (floor $floor)"
            if [ -z "$n" ] || [ "$n" -lt "$floor" ]; then
              echo "::error::$name ran ${n:-0} tests, floor is $floor — \
          lower the floor deliberately or restore the witness"
              exit 1
            fi
          done

      - name: wasm32 check
        run: cargo check --target wasm32-unknown-unknown --all-targets

      - name: Clippy, both targets
        run: |
          cargo clippy --all-targets --features mock-control-plane -- -D warnings
          cargo clippy --target wasm32-unknown-unknown --all-targets -- -D warnings

      # Both documentation configurations, because half the crate is
      # `#[cfg(target_arch = "wasm32")]`: a link that resolves in one
      # is an unresolved link in the other, and rustdoc denies it.
      - name: Documentation, both targets
        env:
          RUSTDOCFLAGS: -D warnings
        run: |
          cargo doc --no-deps
          cargo doc --no-deps --target wasm32-unknown-unknown

      # The exit criterion: the `cross_lang_wire` fixtures replayed
      # INSIDE wasm, plus the anchorless session and the leader
      # lifecycle, in a real headless Chromium.
      - name: wasm test runner (headless Chromium)
        env:
          CARGO_TARGET_WASM32_UNKNOWN_UNKNOWN_RUNNER: wasm-bindgen-test-runner
          # wasm-bindgen-test-runner kills the DRIVER at 20s per test,
          # which surfaces as `driver status: exit code: 1` and a red
          # job rather than as a test failure. One witness waits out
          # the leaf's own 30s DEFAULT_CALL_TIMEOUT_MS, because that
          # constant IS the thing under test: a follower call with no
          # explicit timeout must expire on the default. Raise the
          # runner's ceiling; do not shorten the witness.
          WASM_BINDGEN_TEST_TIMEOUT: "120"
        run: |
          set -o pipefail
          # Both wasm rosters are declared ONCE here and used twice:
          # checked against their source before anything runs, and
          # verified by name against the run's log afterwards. A
          # pinned name that no source declares can never pass, and
          # its failure reads exactly like a witness that regressed —
          # which is how an invented 18-name roster produced a red job
          # whose suite was 24/24 green.
          REPLAYS="
          the_net_header_vector_replays_inside_wasm
          the_routing_header_vector_replays_inside_wasm
          the_event_frame_vector_replays_inside_wasm
          the_stream_control_vectors_replay_inside_wasm
          the_aead_vector_replays_on_the_wasm_backend
          the_leaf_announcement_vector_replays_inside_wasm
          the_nrpc_frame_vector_replays_inside_wasm
          the_enrollment_request_replays_inside_wasm
          "
          LEADER_WITNESSES="
          a_cancelled_bootstraps_real_rtc_connection_is_closed_before_the_lock_moves
          a_cancelled_duplex_call_yields_the_cancelled_terminal_to_every_consumer
          a_custodial_identity_is_used_verbatim_and_never_stored
          a_follower_call_expires_on_its_own_deadline_as_an_indeterminate_outcome
          a_follower_call_without_a_timeout_expires_on_the_leafs_default_deadline
          a_leader_revalidates_its_generation_against_the_store_and_stands_down
          a_leaders_own_announcement_keeps_its_followers_capabilities
          a_permanent_serve_registration_refusal_reaches_the_page_without_a_retry_storm
          a_promotion_whose_backend_fails_reattaches_instead_of_stranding_the_tab
          a_promotion_whose_generation_transaction_fails_requeues_instead_of_stranding_the_tab
          a_proxied_send_broadcasts_another_streams_terminal_event_instead_of_panicking
          a_retained_stream_handle_cannot_address_a_same_id_successor
          a_follower_owns_its_streams_independently_under_one_wire_id
          a_forged_accept_claim_is_never_served_to_the_handler_as_the_caller
          a_well_formed_proxied_accept_dispatches_exactly_one_handler
          an_accept_whose_caller_cannot_resolve_is_settled_not_stranded
          two_peers_under_one_wire_id_own_their_streams_independently
          a_runtime_announcement_is_restored_by_the_promoted_tab
          a_second_duplex_stream_observes_the_latched_admission_denial_not_a_fabricated_completion
          a_second_duplex_stream_observes_the_latched_refusal_not_a_fabricated_completion
          a_second_duplex_stream_observes_the_latched_revoked_terminal_not_a_fabricated_completion
          a_superseded_session_is_refused_by_the_leader_and_by_storage
          a_tampered_identity_record_does_not_decrypt
          an_aborted_generation_transaction_is_a_typed_failure_and_moves_nothing
          an_attach_during_the_initial_backend_await_is_replayed
          an_explicitly_retired_leader_goes_quiet_at_its_peer_while_its_page_stays_alive
          an_unchanged_follower_announcement_keeps_the_published_union
          closing_a_promoting_tab_cancels_its_parked_bootstrap_and_frees_the_lock
          closing_a_tab_during_its_promotion_never_publishes_a_lock_holding_leader
          closing_the_leader_promotes_a_follower_fails_its_calls_and_restores_its_channels
          concurrent_consumers_both_observe_the_one_latched_terminal
          standing_down_fences_then_retires_the_node_then_releases_the_lock
          the_generation_counter_is_monotonic_and_fences_a_stale_holder
          the_last_capability_declaring_followers_tag_is_withdrawn
          the_stored_identity_is_stable_and_encrypted_under_a_non_extractable_key
          the_wrapping_key_refuses_export
          two_concurrent_first_creations_converge_on_one_identity
          two_sessions_share_one_identity_without_evicting_each_other
          "
          CHECK="$GITHUB_WORKSPACE/.github/scripts/check-roster.py"
          # R14's production refusal: the anchor control plane does NOT
          # carry signalling envelopes, and this is the witness that
          # the refusal is real rather than a claim in a document.
          LEAF_WITNESSES="
          the_anchor_control_plane_refuses_to_carry_a_signalling_envelope
          "
          python3 "$CHECK" --label wasm_leaf --mode fn \
            --source tests/wasm_leaf.rs $REPLAYS $LEAF_WITNESSES
          python3 "$CHECK" --label wasm_leader --mode fn \
            --source tests/wasm_leader.rs $LEADER_WITNESSES
          for suite in wasm_leaf wasm_anchorless wasm_leader wasm_rtc_conservation; do
            cargo test --target wasm32-unknown-unknown --features mock-control-plane \
              --test "$suite" -- --nocapture 2>&1 | tee "/tmp/$suite.log"
            grep -q "test result: ok" "/tmp/$suite.log" || {
              echo "::error::$suite did not report a passing result"; exit 1; }
            ran=$(sed -n 's/.*test result: ok\. \([0-9]*\) passed.*/\1/p' "/tmp/$suite.log" | tail -1)
            echo "$suite: $ran passed"
            # Per-suite FLOORS, not just "more than zero": a suite
            # that lost half its witnesses would otherwise still pass
            # this step.
            case "$suite" in
              wasm_leaf)       floor=16 ;;
              wasm_leader)     floor=38 ;;
              wasm_anchorless) floor=2  ;;
              # The leaf half. `leaf/src/rtc.rs` is
              # `#![cfg(target_arch = "wasm32")]` in its entirety, so
              # a native test could only re-implement `PeerLink` and
              # assert the copy — and the claim is precisely "every
              # production path that destroys a link performs the
              # discard accounting", which a fake link cannot carry.
              # This suite is therefore the ONLY witness for that
              # half, and it first executes here: the author could
              # compile it for wasm32 but not run it.
              wasm_rtc_conservation) floor=2 ;;
            esac
            if [ "${ran:-0}" -lt "$floor" ]; then
              echo "::error::$suite ran ${ran:-0} tests, floor is $floor — \
          lower the floor deliberately or restore the witness"
              exit 1
            fi
          done
          # The LIB target, which nothing here ran until recently.
          #
          # The loop above passes `--test <name>`, so it reaches only
          # `leaf/tests/*.rs`. `wasm.rs`'s own `#[cfg(test)]` child
          # module (`wasm_witnesses.rs`) is a LIB test and therefore
          # executed nowhere — the attempt-ownership, terminality and
          # candidate-retention witnesses would have compiled, been
          # committed, been pinned, and run zero times. That is the
          # same silent-skip shape as a filter that matches nothing,
          # which this repository has already paid for twice.
          #
          # The floor is the count, not "> 0": these witnesses exist
          # because a reviewer reproduced the defects they cover, and
          # losing one quietly is the failure that matters.
          cargo test --target wasm32-unknown-unknown --features mock-control-plane \
            --lib -- --nocapture 2>&1 | tee /tmp/wasm_lib.log
          grep -q "test result: ok" /tmp/wasm_lib.log || {
            echo "::error::the leaf's wasm32 lib tests did not report a passing result"; exit 1; }
          lib_ran=$(sed -n 's/.*test result: ok\. \([0-9]*\) passed.*/\1/p' /tmp/wasm_lib.log | tail -1)
          echo "wasm lib: ${lib_ran:-0} passed"
          if [ "${lib_ran:-0}" -lt 13 ]; then
            echo "::error::the leaf's wasm32 lib tests ran ${lib_ran:-0}, floor is 13 — \
          lower the floor deliberately or restore the witness"
            exit 1
          fi
          # The cross_lang replay is the named exit criterion, so
          # assert the witnesses BY NAME rather than trusting the
          # suite's total — or a renamed vector would leave the
          # criterion silently unmet. (The first cut grepped for the
          # string "cross_lang", which appears in the fixtures' paths
          # but in none of the test names.)
          for replay in $REPLAYS; do
            grep -q "^test $replay \.\.\. ok$" /tmp/wasm_leaf.log || {
              echo "::error::the cross_lang replay witness $replay did not run and pass inside wasm"
              exit 1
            }
          done
          echo "cross_lang replay: 8 vectors replayed inside wasm"
          for witness in $LEAF_WITNESSES; do
            grep -q "^test $witness \.\.\. ok$" /tmp/wasm_leaf.log || {
              echo "::error::the leaf wasm witness $witness did not run and pass inside wasm"
              exit 1
            }
          done
          # E1 (Kyra, round 2): `wasm_leader` had a floor of 6
          # against 18 witnesses and pinned none of them by name, so
          # twelve lifecycle tests could vanish and the job would stay
          # green. Every name is pinned, exactly as the leaf and
          # anchorless rosters are. (2026-09-25: the roster caught up
          # with reality again — the LEAF-1 latched-terminal quartet
          # and the three accept-claim/registration witnesses ran here
          # unpinned since their slices landed; all 36 tests of the
          # suite are name-pinned and the floor is the real count. The
          # §23 audit added the concurrent-consumer LEAF-1 witness and the
          # unresolved-accept settlement witness: 38.)
          for witness in $LEADER_WITNESSES; do
            grep -q "^test $witness \.\.\. ok$" /tmp/wasm_leader.log || {
              echo "::error::the leader lifecycle witness $witness did not run and pass inside wasm"
              exit 1
            }
          done
          echo "leader lifecycle: 38 witnesses executed in headless Chromium"

      # Exit criterion: the shipped bundle stays under 1.5 MB gzipped.
      - name: Bundle size
        run: |
          cargo build --release --target wasm32-unknown-unknown
          wasm-bindgen --target web --out-dir pkg \
            target/wasm32-unknown-unknown/release/net_leaf.wasm
          raw=$(stat -c%s pkg/net_leaf_bg.wasm)
          gz=$(gzip -9 -c pkg/net_leaf_bg.wasm | wc -c)
          echo "leaf wasm: raw=$raw gz=$gz (ceiling 1500000 gz)"
          echo "### Stage 5 leaf bundle" >> "$GITHUB_STEP_SUMMARY"
          echo "raw=$raw gz=$gz ceiling=1500000" >> "$GITHUB_STEP_SUMMARY"
          if [ "$gz" -gt 1500000 ]; then
            echo "::error::the leaf bundle is $gz bytes gzipped, over the 1.5 MB exit criterion"
            exit 1
          fi

  browser-package:
    # `@net-mesh/browser`. A sibling package to
    # `@net-mesh/sdk` precisely because the SDK's graph contains the
    # napi addon; this job therefore never touches `bindings/node`.
    name: "@net-mesh/browser"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: net/crates/net/browser-ts
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Add wasm32 to the pinned toolchain
        working-directory: net/crates/net/leaf
        run: |
          set -o pipefail
          rustup target add wasm32-unknown-unknown
          rustup target list --installed | grep -qx wasm32-unknown-unknown || {
            echo "::error::wasm32-unknown-unknown is not installed for the toolchain this directory selects"
            exit 1
          }
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: leaf-wasm
          workspaces: net/crates/net/leaf -> target
      - name: Install wasm-bindgen-cli 0.2.129
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen-cli@0.2.129

      # The size assertion is about the bundle a page downloads, so
      # the wasm has to be the real one, built here.
      - name: Build the leaf bundle
        working-directory: net/crates/net/leaf
        run: |
          cargo build --release --target wasm32-unknown-unknown
          wasm-bindgen --target web --out-dir pkg \
            target/wasm32-unknown-unknown/release/net_leaf.wasm

      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      # `npm install`, not `npm ci`: the repo ignores package-lock.json,
      # so there is no committed lockfile (same as sdk-ts).
      - name: Install
        run: npm install --no-audit --no-fund

      - name: Build
        run: npm run build

      - name: Unit tests
        run: |
          set -o pipefail
          npm test 2>&1 | tee /tmp/browser-ts-tests.log
          n=$(sed 's/\x1b\[[0-9;]*m//g' /tmp/browser-ts-tests.log | grep -oE '^ *Tests +[0-9]+ passed' | grep -oE '[0-9]+' | tail -1)
          echo "browser-ts tests passed: ${n:-0} (floor 728)"
          if [ -z "$n" ] || [ "$n" -lt 728 ]; then
            echo "::error::browser-ts ran ${n:-0} tests, floor is 728 — \
          lower the floor deliberately or restore the witness"
            exit 1
          fi

      # R11: the TS/Rust ABI asserted through the artefacts a page
      # actually loads — the built `dist/` and the wasm-bindgen `pkg`
      # beside it. The unit suite was green against a test
      # double written from the hand-maintained declarations, so
      # every place those declarations were wrong the double was
      # wrong identically. Pinned by name: a probe that stops running
      # is a failure, not a smaller roster.
      - name: TS/Rust ABI through the real built package (R11)
        run: |
          set -o pipefail
          REQUIRED="
            real_package_decodes_every_pinned_stream_event
            real_package_decodes_the_same_events_on_a_proxied_stream
            real_package_matches_hex_handle_ids_against_decimal_event_ids
            real_package_drops_another_streams_event
            real_wasm_exposes_the_effective_option_readers
            real_wasm_parses_rtc_ice_server_objects
            real_wasm_refuses_an_ice_server_shape_it_cannot_configure
            real_wasm_reads_stream_options_the_way_the_package_declares_them
            real_wasm_refuses_a_channel_hash_it_would_otherwise_silence
            real_wasm_keeps_u64_stream_ids_off_the_number_path
            real_wasm_reads_a_peer_addressed_stream_in_the_id_spelling_it_hands_out
            real_package_exports_every_symbol_the_browser_harness_imports
            real_package_re_types_the_leafs_closed_node_fence
            real_package_ends_a_parked_iterator_when_the_direct_node_closes
            real_package_refuses_a_stream_on_the_closed_direct_node
            real_package_completes_teardown_when_a_child_close_throws
            real_package_keys_a_stream_on_its_peer_as_well_as_its_id
            real_package_refuses_a_built_in_stream_that_spells_no_peer
            real_package_owner_serves_a_join_and_binds_the_caller
            real_package_reconciles_an_own_proto_key_with_an_empty_value
            real_package_owner_and_replica_complete_a_round_trip
            real_package_resync_is_authorized_and_recovery_is_not_ready
            real_package_action_executes_once_and_replays_its_outcome
            real_package_narrows_the_audience_before_the_owner_agrees
            real_package_hosts_and_joins_a_store_over_a_transport
          "
          # The roster is checked against the probe file before the
          # probes run: a pinned name the file does not contain can
          # never pass, and reads exactly like a regression.
          python3 "$GITHUB_WORKSPACE/.github/scripts/check-roster.py" \
            --label "browser package ABI" --mode literal \
            --source tests/abi_real_package.mjs $REQUIRED
          node tests/abi_real_package.mjs | tee /tmp/abi-real.log
          # The pin is the probe's own JSON run record — the `"name"`
          # field of a `records` entry, exactly the shape
          # `JSON.stringify({…, records}, null, 2)` prints — at least as
          # tight as the quoted grep (`grep -q "\"$required\""`) this was
          # once replaced by the looser token regex with. Must-fail matrix
          # (all rejected): a bare print of the name, the name inside the
          # evidence text, the name inside an `error` message. Must-pass:
          # `      "name": "<name>",`.
          for required in $REQUIRED; do
            grep -qE "^[[:space:]]*\"name\": \"${required}\",?\$" /tmp/abi-real.log || {
              echo "::error::ABI probe $required did not run"; exit 1; }
          done
          if grep -q '"pass": false' /tmp/abi-real.log; then
            echo "::error::an ABI probe failed against the built package"; exit 1
          fi
          echo "R11 ABI probes: all pinned witnesses ran against the real package"

      # Kyra's JS probes, landed verbatim beside her leaf ones.
      - name: Browser-package review probes
        run: |
          set -o pipefail
          node tests/kyra_review.mjs | tee /tmp/kyra-js.log
          for required in typescript_byte_callback_control \
                          typescript_real_rust_callback_shape \
                          firefox_unseeded_launch_control \
                          firefox_successfully_seeded_profile_reaches_launch; do
            grep -q "\"$required\"" /tmp/kyra-js.log || {
              echo "::error::Kyra's JS probe $required did not run"; exit 1; }
          done
          if grep -q '"pass": false' /tmp/kyra-js.log; then
            echo "::error::a Kyra JS probe failed"; exit 1
          fi
          echo "Kyra's JS probes: 4/4"

      - name: Download size (exit criterion)
        run: node scripts/size.mjs --assert --require-leaf

  webrtc-browser:
    # Exit criterion 1: the six §12 admission witnesses, the
    # MITM witness and the mDNS measurement, against a REAL Chromium
    # and a REAL native anchor served by the production bootstrap
    # listener. 4a could only witness §12 with a native stand-in;
    # this job is the browser that replaces it.
    #
    # Its own job rather than a step on `webrtc-feature` for the same
    # reason that job exists: it pays for a browser download, a
    # wasm32 toolchain and an NSS trust store on top of the
    # aws-lc-sys C build, and no default job should pay any of that.
    #
    # NOTE ON TLS: there is no `--ignore-certificate-errors` here or
    # in the harness, and there cannot be — `BootstrapTls` has no
    # self-signed variant. The harness issues a CA + `localhost` leaf
    # with rcgen and installs the CA into the NSS database Chromium
    # reads (`$HOME/.pki/nssdb`), removing it again on exit. A
    # harness that skipped verification would prove something no
    # deployment can rely on.
    name: Browser matrix (Chromium + Firefox)
    runs-on: ubuntu-latest
    # The job budget is the SUM of its steps, not less. The four engine legs
    # carry 20+20+20+15 = 75 minutes of step caps on top of the
    # browser/toolchain/build preamble and the evidence steps; at 45 one slow
    # (or hung, running out its step cap) engine pushed the cumulative over
    # the job cap and the VM died with the completed engines' logs still
    # un-uploaded — the evidence loss this job exists to prevent. 75 + ~25
    # preamble + the evidence tail = 105.
    timeout-minutes: 105
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      # `targets:` on the toolchain action, and a bare `rustup
      # target add` from the repo root, install into the STABLE
      # installation — but every cargo command here runs under
      # `net/crates/net`, whose `rust-toolchain.toml` pins 1.98.1,
      # a separate installation with its own target set. The
      # candidate hit exactly that: `E0463: can't find crate for
      # 'core'` when building the leaf bundle. Add the target FROM
      # the pinned directory, and assert it, as the wasm-wire job
      # already does.
      - name: Add wasm32 to every toolchain that builds for it
        run: |
          set -o pipefail
          # THREE directories build for wasm32 in this job and they do
          # not all resolve the same toolchain: the leaf and
          # the harness leaf sit under `net/crates/net`
          # (pinned by `rust-toolchain.toml`), while anything the
          # runner spawns from the repo root gets `stable`. The
          # candidate installed the target for one of them and then
          # asked another to build: `E0463: can't find crate for
          # 'core'`. Install it for both, and assert from each
          # directory that actually runs a wasm build.
          rustup target add --toolchain stable wasm32-unknown-unknown
          for dir in net/crates/net net/crates/net/leaf net/crates/net/tests/rtc_browser/leaf; do
            ( cd "$dir"
              rustup target add wasm32-unknown-unknown
              echo "== $dir: $(rustup show active-toolchain)"
              rustup target list --installed | grep -qx wasm32-unknown-unknown || {
                echo "::error::wasm32-unknown-unknown is missing for the toolchain $dir selects"
                exit 1
              } ) || exit 1
          done

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: webrtc-browser
          workspaces: |
            net/crates/net/tests/rtc_browser/runner -> target
            net/crates/net/tests/rtc_browser/leaf -> target

      # `certutil` is how the CA reaches Chromium's trust store on
      # Linux. Without it the harness REFUSES to run rather than
      # falling back to ignoring certificate errors, so a missing
      # package is a loud failure, not a silently weakened witness.
      - name: Install libnss3-tools (certutil)
        run: sudo apt-get update && sudo apt-get install -y libnss3-tools

      # Chromium from Playwright's cache, the same build measured
      # against. `--with-deps` pulls the shared libraries headless
      # Chromium needs on a bare runner.
      # Both GATE engines. This job owns the matrix, and Firefox is a
      # gate rather than a courtesy: it is the only engine here that
      # is not Chromium, and the leaf's transport assumptions are
      # engine-visible.
      - name: Install Chromium and Firefox from Playwright's cache
        run: npx --yes playwright@1.56.0 install --with-deps chromium firefox

      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      # The first half of the runner drives `@net-mesh/browser`
      # over the real leaf bundle; both are built here so a witness
      # can never run against a stale artefact.
      - name: Install the Playwright driver's dependencies
        working-directory: net/crates/net/tests/rtc_browser/driver
        run: npm install --no-audit --no-fund

      # The UDP-blocked witness needs a real rule on Linux; the
      # runner refuses to record that verdict without one rather
      # than substituting a weaker mechanism.
      - name: Install nftables (the UDP-blocked profile)
        run: sudo apt-get install -y nftables

      # The bindgen CLI version must EQUAL the crate version the leaf
      # pins (`wasm-bindgen = "=0.2.129"`); a mismatch is a hard error
      # at bindgen time, which is exactly what we want it to be.
      - name: Install wasm-bindgen-cli 0.2.129
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen-cli@0.2.129

      - name: Build the leaf bundle and @net-mesh/browser
        run: |
          set -euo pipefail
          cd net/crates/net/leaf
          cargo build --release --target wasm32-unknown-unknown
          wasm-bindgen --target web --out-dir pkg \
            target/wasm32-unknown-unknown/release/net_leaf.wasm
          cd ../browser-ts
          npm install --no-audit --no-fund
          npm run build

      # One command. It builds the wasm leaf against `net-mesh-wire`,
      # issues and installs the CA, starts the anchor + the impostor +
      # the real listeners, launches Chromium WITHOUT
      # `--disable-features=WebRtcHideLocalIpsWithMdns` (slice 3's
      # measurement is the point), drives every witness through the
      # browser, and exits non-zero on any failed one.
      - name: Browser harness — Chromium
        if: ${{ !cancelled() }}
        timeout-minutes: 20
        run: |
          # No `-e`: the exit code is taken from PIPESTATUS below, so
          # a failing harness still leaves a complete log for the
          # inventory step to read.
          set -uo pipefail
          # `--stage7` on THIS engine only. The store witnesses have
          # run green on Chromium (52/0, twice) and have never been
          # run on Firefox at all — the Firefox leg below keeps the
          # 47-witness surface until somebody runs them there, which
          # is why the floors below are per engine rather than one
          # number. A flag whose witnesses are unproven on an engine
          # does not belong in that engine's gate.
          net/crates/net/tests/rtc_browser/run.sh --engine chromium --stage7 2>&1 \
            | tee "$RUNNER_TEMP/rtcb.log"
          exit "${PIPESTATUS[0]}"

      - name: Browser harness — Firefox
        if: ${{ !cancelled() }}
        timeout-minutes: 20
        run: |
          set -uo pipefail
          net/crates/net/tests/rtc_browser/run.sh --engine firefox 2>&1 \
            | tee "$RUNNER_TEMP/rtcb-firefox.log"
          exit "${PIPESTATUS[0]}"

      # Firefox + the store witnesses, RECORDED and not a gate — yet.
      #
      # The Chromium leg gates them (floor 55). They have never run on
      # Firefox: the local workstation cannot seed a Firefox profile's
      # NSS database (the `certutil` on PATH there is Microsoft's, and
      # the only other prompt-free mechanism, an enterprise policy, is
      # not profile-scoped and would defeat this harness's own TLS
      # control), so this job is the first place they can execute at
      # all. Gating them here before a single observed run would make
      # the gate red about a blocker rather than a regression, which
      # is the rule that kept them behind a flag in the first place.
      #
      # So: run them, keep the log, and promote this to the gate — a
      # `--stage7` on the leg above and a Firefox floor of 55 — on the
      # first green run. If it is NOT green, the log says what the
      # engine does differently, which is the point.
      - name: Browser harness — Firefox (recorded, not a gate)
        if: ${{ !cancelled() }}
        timeout-minutes: 20
        continue-on-error: true
        run: |
          set -uo pipefail
          net/crates/net/tests/rtc_browser/run.sh --engine firefox --stage7 2>&1 \
            | tee "$RUNNER_TEMP/rtcb-firefox-stage7.log" || true

      # WebKit is recorded, never a gate: Playwright's WebKit build
      # is not the engine Safari ships, so its verdicts are evidence
      # about a related engine, not about Safari.
      - name: Browser harness — WebKit (recorded, not a gate)
        if: ${{ !cancelled() }}
        timeout-minutes: 15
        continue-on-error: true
        run: |
          set -uo pipefail
          net/crates/net/tests/rtc_browser/run.sh --engine webkit 2>&1 \
            | tee "$RUNNER_TEMP/rtcb-webkit.log" || true

      # The floor and the pinned names, on the same discipline the
      # other RTC jobs use. The harness exiting 0 is the
      # `--no-tests=fail` equivalent for a binary that could in
      # principle emit ZERO witnesses and still succeed; this step is
      # what makes that impossible, and what makes a witness being
      # renamed or dropped a failure rather than a quiet shrink.
      #
      # Same parser self-check as the earlier inventory: prove the
      # grep finds a KNOWN line before believing any count, so a
      # changed output format reads as "fix the parser", never as
      # "all clear" or "the witnesses are gone".
      - name: Browser witness inventory (both gate engines)
        # Unconditional on purpose: a cancelled or timed-out run still
        # verifies whatever evidence exists and NAMES what is missing —
        # `!cancelled()` let a dying job skip its own floor check.
        if: ${{ always() }}
        run: |
          set -euo pipefail
          REQUIRED="
          enrollment_exchange_promotes_this_session
          provisional_announcement_is_refused
          provisional_subscribe_to_an_unrelated_channel_is_refused
          provisional_call_to_another_service_is_refused
          provisional_transit_is_refused
          local_envelope_accepted_redirected_denied
          enrolled_without_authority_is_still_denied
          mitm_anchor_fails_the_handshake_and_installs_nothing
          mdns_candidate_pair_measured
          mdns_on_pair_formed
          browser_enrollment_survives_replacement
          browser_session_bounds_are_enforced
          stage5_leaf_handshake_over_the_real_listener
          stage5_reliable_round_trip
          stage5_nrpc_call_to_a_native_service
          stage5_fire_and_forget_tolerates_injected_loss
          stage5_find_best_node_returns_the_browser_node
          stage5_two_tabs_share_one_identity_without_eviction
          stage5_udp_blocked_surfaces_a_typed_failure
          stage5_reconnect_displaces_a_busy_incumbent
          stage5_direct_event_callback_may_reenter_the_node
          stage5_direct_stream_carries_native_bytes_to_callback_and_iterator
          stage5_native_stream_sustains_traffic_beyond_the_credit_window
          stage5_reliable_stream_recovers_injected_loss_and_reorder
          stage5_large_messages_cross_the_public_api_in_both_directions
          stage5_native_fragments_to_an_announced_leaf
          stage5_leaf_fragments_above_one_event_to_the_native_anchor
          stage5_direct_close_ends_a_parked_iterator_in_the_live_package
          stage5_direct_close_refuses_a_later_open_with_the_leafs_typed_fence
          stage5_a_follower_observes_the_leaders_terminal_broadcast
          stage5_a_refused_connect_closes_rtc_and_hands_back_its_attempt
          stage5_leader_proxied_stream_carries_native_bytes_both_ways
          stage6_two_isolated_contexts_reach_a_direct_session
          stage6_each_leaf_learns_the_others_keys_from_a_signed_announcement
          stage6_the_four_wasm_methods_drive_one_attempt_end_to_end
          stage6_peer_handshake_takes_a_peer_id_and_nothing_else
          stage6_an_undiscovered_peer_is_refused_before_an_offer_exists
          stage6_an_offer_nobody_answers_leaves_the_pair_relayed
          stage6_a_second_offer_supersedes_the_live_attempt
          stage6_the_ice_attempt_ledger_partitions_on_both_leaves
          stage6_a_handshake_the_peer_cannot_answer_is_typed_handshake_failed
          stage6_routed_peer_app_data_moves_the_anchors_per_pair_counter
          stage6_direct_peer_app_data_leaves_that_counter_flat_while_the_anchor_is_live
          stage6_forcing_the_direct_channel_down_moves_the_counter_again
          stage6_a_network_change_drives_exactly_one_re_attempt
          stage6_rtc_stats_uses_the_native_field_names_and_names_what_it_cannot_measure
          stage6_one_node_id_spelling_across_both_signalling_surfaces
          org_browser_call_unary_same_org
          org_browser_call_unary_granted
          org_browser_call_streaming_same_org
          org_browser_call_streaming_granted
          org_browser_call_client_stream_same_org
          org_browser_call_client_stream_granted
          org_browser_call_duplex_same_org
          org_browser_call_duplex_granted
          org_native_call_unary_same_org
          org_native_call_unary_granted
          org_native_call_streaming_same_org
          org_native_call_streaming_granted
          org_native_call_client_stream_same_org
          org_native_call_client_stream_granted
          org_native_call_duplex_same_org
          org_native_call_duplex_granted
          org_browser_pair_unary
          org_browser_pair_streaming
          org_browser_pair_client_stream
          org_browser_pair_duplex
          org_browser_pair_granted
          org_wrong_peer_frames_refused
          org_old_session_frames_refused
          org_replayed_opening_refused
          org_streaming_backpressure_and_window
          org_client_stream_backpressure_half_close
          org_duplex_backpressure_half_close
          org_midstream_revocation_retires_with_denied
          org_revocation_refuses_new_openings
          org_tab_teardown_retires_without_resume
          org_leader_proxied_call_preserves_follower_attribution
          org_leader_replacement_preserves_attribution
          org_leader_teardown_fails_pending_typed
          org_handler_completion_after_retirement_emits_nothing
          org_parity_codec_round_trip_both_codecs
          org_parity_leaf_proof_verifies_under_core
          org_parity_core_proof_verifies_under_leaf
          "
          # The roster is checked against the harness source before the
          # logs are read: a witness name that the runner never emits
          # can never be found, and its absence reads identically to a
          # witness that failed.
          python3 "$GITHUB_WORKSPACE/.github/scripts/check-roster.py" \
            --label "browser matrix" --mode literal \
            --source net/crates/net/tests/rtc_browser/runner/src/main.rs \
            --source net/crates/net/tests/rtc_browser/runner/src/stage5.rs \
            --source net/crates/net/tests/rtc_browser/runner/src/stage6.rs \
            --source net/crates/net/tests/rtc_browser/runner/src/stage7.rs \
            --source net/crates/net/tests/rtc_browser/runner/src/org_stream.rs \
            $REQUIRED
          # The ELEVEN witnesses, required on the engine that
          # runs them. They carry the plan's B2' composition gate — the
          # store's chunker on the REAL stream transport, under
          # injected loss and reorder — the property that a
          # duplicated wire message moves a view exactly once, and
          # criterion 3's two refusal clauses, which run on a
          # topology of their own (`stage7.rs`'s `refusals`), and
          # criterion 4's media clause — data-only use asks for no
          # camera or microphone, measured with an instrument the
          # witness proves fires.
          STAGE7="
          stage7_store_snapshot_installs_over_the_real_stream
          stage7_store_snapshot_installs_through_injected_loss_and_reorder
          stage7_an_action_round_trip_crosses_the_real_transport
          stage7_a_duplicated_store_frame_moves_the_view_once
          stage7_store_traffic_moves_the_anchors_per_pair_counter_when_routed
          stage7_store_traffic_leaves_the_counter_flat_once_the_pair_is_direct
          stage7_narrowing_an_audience_withholds_only_that_replicas_view
          stage7_a_reconnect_recovers_without_replaying_and_a_leave_frees_the_handle
          stage7_an_unauthorized_write_is_refused_while_the_replica_still_reads
          stage7_a_handle_from_a_replaced_owner_is_refused
          stage7_data_only_use_asks_for_no_media_permission
          "
          python3 "$GITHUB_WORKSPACE/.github/scripts/check-roster.py" \
            --label "browser matrix stage 7" --mode literal \
            --source net/crates/net/tests/rtc_browser/runner/src/stage7.rs \
            $STAGE7
          for engine in chromium firefox; do
            # Floors are PER ENGINE: Chromium runs the store stage,
            # Firefox does not (see the harness step above).
            case "$engine" in
              chromium) log="$RUNNER_TEMP/rtcb.log"; floor=95; extra="$STAGE7" ;;
              firefox)  log="$RUNNER_TEMP/rtcb-firefox.log"; floor=84; extra="" ;;
            esac
            # Prove the parser finds a KNOWN line before believing
            # any count, so a changed output format reads as "fix the
            # parser", never as "all clear".
            probe=$(grep -c '^RTCB PASS enrollment_exchange_promotes_this_session ' "$log" || true)
            if [ "$probe" -eq 0 ]; then
              echo "::error::[$engine] witness-verdict parser found no known PASS line — the \
          harness output format changed; fix the parser before trusting any floor"
              tail -40 "$log"
              exit 1
            fi
            passes=$(grep -c '^RTCB PASS ' "$log" || true)
            fails=$(grep -c '^RTCB FAIL ' "$log" || true)
            echo "[$engine] $passes passed, $fails failed (floor $floor)"
            if [ "$fails" -ne 0 ]; then
              grep '^RTCB FAIL ' "$log"
              echo "::error::[$engine] a browser witness failed"
              exit 1
            fi
            if [ "$passes" -lt "$floor" ]; then
              echo "::error::[$engine] emitted $passes witnesses, floor is $floor — \
          lower the floor deliberately or restore the witness"
              exit 1
            fi
            for required in $REQUIRED $extra; do
              if ! grep -q "^RTCB PASS $required " "$log"; then
                echo "::error::[$engine] required browser witness missing or failed: $required"
                exit 1
              fi
            done
            # Chromium also carries the store witnesses;
            # Firefox does not gate them (see the harness step).
            echo "[$engine] inventory complete: 12 Stage 4b + 20 Stage 5 + 15 Stage 6 \
          (+ 11 Stage 7 on chromium)"
          done

      # The recorded Firefox leg, PRINTED and never gated.
      # These numbers are what a promotion decision reads — a
      # `--stage7` on the Firefox harness step and a Firefox floor of
      # 55 — and no floor consults them today. A missing log is not a
      # failure: the step above is `continue-on-error`.
      - name: Firefox evidence (recorded, no floor)
        if: ${{ !cancelled() }}
        run: |
          set -uo pipefail
          log="$RUNNER_TEMP/rtcb-firefox-stage7.log"
          if [ ! -f "$log" ]; then
            echo "[firefox+stage7] no log — the recorded step did not run"
            exit 0
          fi
          passes=$(grep -c '^RTCB PASS ' "$log" || true)
          fails=$(grep -c '^RTCB FAIL ' "$log" || true)
          echo "[firefox+stage7] $passes passed, $fails failed (RECORDED, no floor)"
          for required in \
            stage7_store_snapshot_installs_over_the_real_stream \
            stage7_store_snapshot_installs_through_injected_loss_and_reorder \
            stage7_an_action_round_trip_crosses_the_real_transport \
            stage7_a_duplicated_store_frame_moves_the_view_once \
            stage7_store_traffic_moves_the_anchors_per_pair_counter_when_routed \
            stage7_store_traffic_leaves_the_counter_flat_once_the_pair_is_direct \
            stage7_narrowing_an_audience_withholds_only_that_replicas_view \
            stage7_a_reconnect_recovers_without_replaying_and_a_leave_frees_the_handle \
            stage7_an_unauthorized_write_is_refused_while_the_replica_still_reads \
            stage7_a_handle_from_a_replaced_owner_is_refused \
            stage7_data_only_use_asks_for_no_media_permission; do
            if grep -q "^RTCB PASS $required " "$log"; then
              echo "[firefox+stage7] PASS $required"
            else
              echo "[firefox+stage7] NOT PASSING $required"
              grep "^RTCB FAIL $required " "$log" || true
            fi
          done

      # WebKit's verdicts are surfaced, never gated.
      - name: WebKit evidence (recorded)
        if: ${{ !cancelled() }}
        run: |
          {
            echo '### Browser matrix — WebKit (recorded, not a gate)'
            echo '```'
            grep -E '^RTCB (PASS|FAIL) ' "$RUNNER_TEMP/rtcb-webkit.log" || \
              echo "the WebKit leg produced no verdicts; see the job log for the reason it gave"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # The mDNS measurement is evidence, not a gate: surface it in
      # the job summary so a regression in which candidate pair forms
      # is visible without opening the log.
      - name: mDNS candidate-pair evidence
        if: ${{ !cancelled() }}
        run: |
          {
            echo '### Stage 4b — mDNS candidate pair'
            echo '```'
            grep -E '^\[mdns\]|^\[browser\] \[cand ' "$RUNNER_TEMP/rtcb.log" || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload harness logs (every engine, gating or not)
        # Unconditional on purpose: the logs of the engines that DID finish
        # are the evidence for a run that died later, and a cancelled job
        # must not take them with it.
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: rtc-browser-harness-log
          # Firefox is a GATE, so its log is evidence, not a curiosity —
          # uploading only Chromium's meant half the gated matrix could
          # only be read by scrolling the job log. WebKit is recorded
          # rather than gated and its log is uploaded for the same
          # reason: a launch failure is a fact about the run.
          path: |
            ${{ runner.temp }}/rtcb.log
            ${{ runner.temp }}/rtcb-firefox.log
            ${{ runner.temp }}/rtcb-firefox-stage7.log
            ${{ runner.temp }}/rtcb-webkit.log
          if-no-files-found: warn

  browser-demo:
    # The runnable artefact: two real browser tabs whose pages
    # find each other, go direct, and exchange 60 Hz positions over
    # the PUBLIC `@net-mesh/browser` surface — no harness hooks, no
    # private methods. It gates because a demo that has rotted is
    # worse than no demo: it is a promise the README keeps making.
    #
    # `--check` is the same binary the by-hand `run.ps1`/`run.sh`
    # path runs, headless, asserting four rows and exiting non-zero
    # on any of them. Its own job for the same reason the matrix is:
    # it pays for a browser download and a wasm32 toolchain.
    #
    # CHROMIUM ONLY, deliberately and on the record. The demo's
    # driver needs Chromium's throttling-defeat flags and SwiftShader
    # for WebGL, and neither has a Firefox equivalent here. Engine
    # coverage is the browser matrix's job; a one-engine demo is not
    # a matrix and is not described as one.
    name: Browser demo (Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Add wasm32 to every toolchain that builds for it
        run: |
          set -o pipefail
          rustup target add --toolchain stable wasm32-unknown-unknown
          for dir in net/crates/net net/crates/net/leaf; do
            ( cd "$dir"
              rustup target add wasm32-unknown-unknown
              rustup target list --installed | grep -qx wasm32-unknown-unknown || {
                echo "::error::wasm32-unknown-unknown is missing for the toolchain $dir selects"
                exit 1
              } ) || exit 1
          done

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: browser-demo
          workspaces: |
            net/crates/net/examples/browser-demo/host -> target
            net/crates/net/leaf -> target

      - name: Install Chromium from Playwright's cache
        run: npx --yes playwright@1.56.0 install --with-deps chromium

      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Install wasm-bindgen-cli 0.2.129
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen-cli@0.2.129

      # Exactly what the browser matrix builds, plus the demo's own
      # deps: the page loads the real bundle, so a stale artefact
      # would make the demo prove something about a build nobody
      # ships.
      - name: Build the leaf bundle, @net-mesh/browser and the demo
        run: |
          set -euo pipefail
          cd net/crates/net/leaf
          cargo build --release --target wasm32-unknown-unknown
          wasm-bindgen --target web --out-dir pkg \
            target/wasm32-unknown-unknown/release/net_leaf.wasm
          cd ../browser-ts
          npm install --no-audit --no-fund
          npm run build
          cd ../examples/browser-demo
          npm install --no-audit --no-fund
          cargo build --release --manifest-path host/Cargo.toml

      - name: Demo — Chromium, headless
        if: ${{ !cancelled() }}
        timeout-minutes: 15
        run: |
          set -uo pipefail
          net/crates/net/examples/browser-demo/host/target/release/net-browser-demo \
            --check --seconds 6 2>&1 | tee "$RUNNER_TEMP/demo.log"
          exit "${PIPESTATUS[0]}"

      # Same discipline as the browser matrix: the roster is checked
      # against the source before any log is read, the parser proves
      # it can find a KNOWN line before a count is believed, and the
      # binary's own `NOT REACHED` line means an early exit cannot
      # read as a smaller green count.
      - name: Demo witness inventory
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          REQUIRED="
          demo_the_pair_counter_moves_while_the_anchor_carries_the_pair
          demo_the_pair_counter_is_flat_while_the_pair_is_direct
          demo_positions_sustain_60_hz_over_the_direct_path
          demo_announcements_keep_arriving_while_the_counter_is_flat
          demo_public_signalling_moves_the_anchor_signal_counter_in_the_flat_window
          "
          python3 "$GITHUB_WORKSPACE/.github/scripts/check-roster.py" \
            --label "browser demo" --mode literal \
            --source net/crates/net/examples/browser-demo/host/src/main.rs \
            $REQUIRED
          log="$RUNNER_TEMP/demo.log"
          probe=$(grep -c '^DEMO PASS demo_the_pair_counter_is_flat_while_the_pair_is_direct ' "$log" || true)
          if [ "$probe" -eq 0 ]; then
            echo "::error::demo verdict parser found no known PASS line — the output \
          format changed; fix the parser before trusting any floor"
            tail -40 "$log"
            exit 1
          fi
          if grep -q '^\[demo\] NOT REACHED' "$log"; then
            grep '^\[demo\] NOT REACHED' "$log"
            echo "::error::the demo exited before every row ran"
            exit 1
          fi
          passes=$(grep -c '^DEMO PASS ' "$log" || true)
          fails=$(grep -c '^DEMO FAIL ' "$log" || true)
          echo "demo: $passes passed, $fails failed (floor 5)"
          if [ "$fails" -ne 0 ]; then
            grep '^DEMO FAIL ' "$log"
            echo "::error::a demo witness failed"
            exit 1
          fi
          if [ "$passes" -lt 5 ]; then
            echo "::error::emitted $passes demo witnesses, floor is 5 — \
          lower the floor deliberately or restore the witness"
            exit 1
          fi
          for required in $REQUIRED; do
            if ! grep -q "^DEMO PASS $required " "$log"; then
              echo "::error::required demo witness missing or failed: $required"
              exit 1
            fi
          done

      - name: Upload the demo log
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: browser-demo-log
          path: ${{ runner.temp }}/demo.log
          if-no-files-found: warn

  acme-cold-start:
    # R4a: a COLD-CACHE ACME order against a real local directory,
    # then a verifying TLS client. The defect this exists for is that
    # `serve_bootstrap` used to wait for a certificate before binding
    # anything, so HTTP-01 could never be answered on a cold cache —
    # a listener that can only start when it is already started.
    #
    # pebble is Let's Encrypt's own test ACME server. Two things this
    # job has to provision, and previously provisioned neither:
    #
    # 1. **Directory trust.** Pebble serves `:14000` and `:15000`
    #    over `test/certs/localhost/cert.pem`, signed by its own
    #    `test/certs/pebble.minica.pem`. Nothing on a runner trusts
    #    that CA, so the ACME client's handshake was refused —
    #    `client error (Connect)` on our side, `remote error: tls:
    #    unknown certificate authority` in pebble's log. The minica
    #    is extracted from the SAME pinned image that is then run, so
    #    the trust material cannot drift from the server presenting
    #    it, and it is handed to `AcmeConfig::directory_roots`, which
    #    scopes it to the directory connection alone. No verifier is
    #    relaxed anywhere: the `--cacert` fetch below would fail if
    #    the chain, the hostname or the validity window were wrong.
    #
    # 2. **The validation reverse path.** Pebble's VA resolves the
    #    identifier itself and dials `<identifier>:5002` from its own
    #    network namespace (`va/va.go` builds the URL from the
    #    identifier and dials `addrs[0]` — a single address, no
    #    fallback). The challenge ingress, though, is a socket the
    #    Rust test binds on the runner. Under GitHub's `services:`
    #    block those are different namespaces and the identifier
    #    resolves to nothing that can reach the host; `services:`
    #    also cannot set `--network`, and its `options:` cannot
    #    compute the docker-bridge gateway address at job scope. So
    #    pebble is started here instead, with **host networking**:
    #    one namespace, `localhost` means the same interface to the
    #    VA and to the listener, and no DNS server, `--add-host`
    #    mapping or gateway discovery is needed at all. The runner's
    #    `/etc/hosts` — which docker reuses in host mode — maps
    #    `localhost` to `127.0.0.1` only, so `addrs[0]` is
    #    unambiguous; the preflight step asserts exactly that rather
    #    than assuming it.
    #
    # `PEBBLE_VA_NOSLEEP` removes the random validation delay;
    # `PEBBLE_VA_ALWAYS_VALID=0` keeps validation REAL (with it on,
    # pebble issues without ever fetching the challenge and the
    # witness would prove nothing); `PEBBLE_WFE_NONCEREJECT=0` turns
    # off pebble's deliberate 5% nonce rejection, which is a client
    # retry exercise and not what this job is about.
    name: ACME cold start (pebble)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      # Pinned by digest as well as tag: the minica extracted from
      # this image is the trust anchor the test is handed.
      PEBBLE_IMAGE: ghcr.io/letsencrypt/pebble:2.7.0@sha256:c156cabea562e43ed0060bddc03539c07de40e311b52c6b0e5ea710a496e56b8
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: acme-cold-start
          workspaces: net/crates/net -> target
      - uses: taiki-e/install-action@nextest

      - name: Start pebble on the host network
        run: |
          set -euo pipefail
          docker pull "$PEBBLE_IMAGE"
          # The image is FROM scratch — no shell, no cat. `docker cp`
          # out of a created (never started) container is how its
          # test CA comes out.
          cid=$(docker create "$PEBBLE_IMAGE")
          docker cp "$cid:/test/certs/pebble.minica.pem" "$RUNNER_TEMP/pebble.minica.pem"
          docker rm "$cid" >/dev/null
          test -s "$RUNNER_TEMP/pebble.minica.pem"
          docker run -d --name pebble --network host \
            -e PEBBLE_VA_NOSLEEP=1 \
            -e PEBBLE_VA_ALWAYS_VALID=0 \
            -e PEBBLE_WFE_NONCEREJECT=0 \
            "$PEBBLE_IMAGE" -config test/config/pebble-config.json

      - name: Wait for pebble, and verify its certificate against that CA
        run: |
          set -euo pipefail
          # No `-k`. A successful fetch IS the evidence that the
          # extracted minica verifies pebble's serving certificate for
          # the name the ACME client will use — i.e. that the trust
          # fix is sound before any Rust runs.
          for _ in $(seq 1 60); do
            if curl -sS --cacert "$RUNNER_TEMP/pebble.minica.pem" \
                 https://localhost:15000/roots/0 -o "$RUNNER_TEMP/pebble-root.pem"; then
              break
            fi
            sleep 1
          done
          test -s "$RUNNER_TEMP/pebble-root.pem"
          curl -sS --cacert "$RUNNER_TEMP/pebble.minica.pem" \
            https://localhost:14000/dir >/dev/null
          {
            echo "PEBBLE_MINICA_PEM=$RUNNER_TEMP/pebble.minica.pem"
            echo "PEBBLE_ROOT_PEM=$RUNNER_TEMP/pebble-root.pem"
            echo "PEBBLE_DIRECTORY_URL=https://localhost:14000/dir"
            echo "PEBBLE_DOMAIN=localhost"
            echo "PEBBLE_HTTP01_ADDR=0.0.0.0:5002"
          } >> "$GITHUB_ENV"

      - name: Assert the HTTP-01 reverse path resolves to this host
        run: |
          set -euo pipefail
          # Pebble is a static Go binary using the pure-Go resolver:
          # `resolveIP` -> `net.DefaultResolver.LookupHost`, which
          # answers from /etc/hosts in FILE ORDER, and the VA then
          # dials `addrs[0]` with no fallback. Docker mounts the
          # host's own /etc/hosts into a `--network host` container
          # (that is why `--add-host` is rejected in this mode), so
          # the file below is the one the VA reads. Assert the first
          # entry naming `localhost` is 127.0.0.1 rather than assume
          # it: if it were ::1 the challenge fetch would go to a
          # socket the test does not bind, and the only symptom would
          # be an opaque validation timeout.
          echo "--- /etc/hosts"
          cat /etc/hosts
          first=$(awk '{ sub(/#.*/, ""); for (i = 2; i <= NF; i++) if ($i == "localhost") { print $1; exit } }' /etc/hosts)
          echo "pebble will dial: ${first:-<unresolved>}:5002"
          if [ "$first" != "127.0.0.1" ]; then
            echo "::error::pebble would dial '${first:-<unresolved>}':5002, not the challenge ingress the test binds on 0.0.0.0:5002"
            exit 1
          fi
          # 5002 must be free for the listener the test binds.
          if ss -ltn "( sport = :5002 )" | grep -q 5002; then
            echo "::error::something already holds :5002"
            exit 1
          fi

      - name: Cold-cache order + verifying TLS client
        working-directory: net/crates/net
        run: |
          set -uo pipefail
          out=$(cargo nextest run --color never -p net-mesh-sdk --no-fail-fast \
                  --no-tests=fail --retries 0 --features "rtc-bootstrap acme-pebble" \
                  --test acme_cold_start 2>&1) \
            || { printf '%s\n' "$out"; echo "::error::the cold-start ACME witness did not pass"; exit 1; }
          printf '%s\n' "$out" | tail -5
          # The pin is the witness's own nextest run record —
          # `PASS [time] <binary-id> <name>`, the name at end of line — not
          # the bare name anywhere in the output. Must-fail matrix (all
          # rejected): a line that merely PRINTS the name,
          # `PASS [time] <id> <name>::helper`, `PASS [time] <id>
          # <name>_extra`. Must-pass: the run record itself; `FAIL`/`SKIP`
          # lines end the same way and are excluded by the `PASS` anchor
          # (a failing run already exits nonzero above).
          printf '%s\n' "$out" \
            | grep -qE '^ *PASS \[.* [^ ]+ a_cold_cache_orders_a_certificate_and_then_serves_tls$' \
            || { echo "::error::the cold-start witness did not run"; exit 1; }

      - name: Pebble log
        if: always()
        run: docker logs pebble 2>&1 | tail -100 || true
