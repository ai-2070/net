          rtc_repairs:a_connection_reset_is_swallowed_by_the_production_arm_with_siblings_intact
          rtc_repairs:a_busy_peer_cannot_starve_a_sibling_or_the_socket
          rtc_repairs:a_stalled_driver_is_aborted_and_joined_before_shutdown_returns
          rtc_repairs:two_concurrent_joiners_both_observe_completed_teardown
          rtc_repairs:dropping_a_node_tears_down_the_transport_not_just_the_socket
          rtc_repairs:an_acknowledged_fragment_groups_expiry_is_terminal_not_silent
