      # === the two-OS-process scoped-discovery witness (R4CoreFix) ===
      # The step above EXECUTED it (tests/org_scoped_cross_process.rs — the
      # natsim.rs re-exec idiom: 1 passing witness + 1 #[ignore]
      # spawned-provider role); this step PINS it: both names must appear
      # with their verdicts and the floor is 1 passing + 1 ignored (never
      # 0 passing). It is the permanent regression guard for the property
      # F-S4Vectors-1 wrongly alleged (scoped discovery DOES cross
      # OS-process boundaries — proven here, with the handle-discard
      # mutation as its inverse).
      - name: Witness floor — org_scoped_cross_process (1 passing + 1 ignored)
        run: |
          set -o pipefail
          out=$(cargo test --test org_scoped_cross_process 2>&1 | tee /dev/stderr)
          printf '%s\n' "$out" | grep -q '^test scoped_discovery_crosses_an_os_process_boundary \.\.\. ok$' || {
