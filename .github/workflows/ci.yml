      # === CortEX + nRPC service surface ==================================
      # `tool` chains to `cortex` (see `tool = ["cortex"]` in
      # Cargo.toml), so adding it here is feature-graph-cheap and
      # keeps `integration_tool_announce` — the substrate-side
      # serve_tool / announce / tool_metadata.fetch contract pin —
      # in this group rather than spawning a fourth compile pass.
      - name: CortEX + nRPC + AI Tools
        if: ${{ !cancelled() }}
        run: >
          cargo nextest run --no-fail-fast --no-tests=fail --features "cortex tool fixtures"
          --test integration_cortex_adapter
          --test integration_cortex_tasks
          --test integration_cortex_memories
          --test cortex_ryw_global_cap
          --test integration_mesh_cancel
          --test integration_nrpc_loopback
          --test integration_nrpc_mesh
          --test integration_nrpc_protected
          --test subnet_auth_e2e
          --test integration_nrpc_streaming
          --test integration_nrpc_client_streaming
          --test integration_nrpc_duplex
          --test integration_nrpc_service_discovery
          --test integration_nrpc_predicate_header
          --test integration_nrpc_cross_lang
          --test integration_nrpc_cross_lang_streaming
          --test integration_tool_announce
          --test capability_exposure_revocation
          --test serve_rpc_reannounce_baseline
          --test nrpc_inbound_dispatcher
          --test nrpc_call_hijack
          --test nrpc_registration_order
          --test nrpc_response_routing
          --test nrpc_route_discriminator
          --test nrpc_service_equality
          --test nrpc_streaming_gate
          --test org_admission_gate
          --test org_rpc_streaming
          --test queue_group_dispatch
          --test aggregator_fold_query
          --test aggregator_registry_rpc

      # === Sensing (SENSING_INTEREST_COALESCING_PLAN) =====================
      # The SI-* sensing-interest suite. Reuses the CortEX crate build:
      # `cortex` chains cortex → redex → net, which covers every sensing
      # gate — `net` alone (dispatch, failure_plane, fallback,
      # origin_emitter, relay_delivery), `net + redex` (e2e_registration,
      # leader_delivery, rendezvous, resolver, scheduler_bridge), and
      # `net + redex + cortex` (routed_origin). Matching the prior step's
      # `cortex tool` feature set means the crate lib is already built, so
      # only the sensing test binaries compile here (no fresh crate pass;
      # `tool` is inert for these). These are auto-discovered targets with
      # no `required-features`, so they MUST run under a feature set that
      # satisfies their `#![cfg]` — otherwise they build to empty (0-test)
      # binaries that pass without asserting anything.
      - name: Sensing
        if: ${{ !cancelled() }}
        run: >
          cargo nextest run --no-fail-fast --no-tests=fail --features "cortex tool fixtures"
          --test sensing_dispatch
          --test sensing_org_three_node
          --test sensing_lease
          --test sensing_lease_wire
          --test sensing_failure_plane
          --test sensing_fallback
          --test sensing_origin_emitter
          --test sensing_relay_delivery
          --test sensing_e2e_registration
          --test sensing_leader_delivery
          --test sensing_rendezvous
          --test sensing_resolver
          --test sensing_scheduler_bridge
          --test sensing_routed_origin

      # === Sensing — organization lease WIRE (independent) =================
      # `sensing_org_lease_wire` gets its OWN invocation rather than riding the
      # group above. `--no-tests=fail` is RUN-WIDE, not per-binary: with fifteen
      # `--test` targets in one command, this binary compiling to zero tests
      # (its `#![cfg]` unsatisfied, or every witness renamed away) is invisible
      # as long as any sibling still runs something. Alone, that same flag is
      # exact — zero tests here is a failed step.
      #
      # `--retries 0` deliberately: `.config/nextest.toml` grants retries to
      # absorb loopback-UDP transport-saturation flake, but these witnesses are
      # ORDERING and EXCLUSION proofs whose signal is intermittent by
      # construction — a "flake" here is the defect. Same feature set as the
      # group, so no extra crate compile: these witnesses drive
      # `fixtures`-gated seams (`org_egress_state_for_test`,
      # `set_org_egress_send_observer_for_test`,
      # `set_sensing_phase_two_seam_for_test`) and an integration test is a
      # separate crate, so `test` is not set on `net` — only `fixtures` exposes
      # them, and without it this binary is exactly the 0-test no-op above.
      #
      # === WHY THE VERDICT COMES FROM JUnit, NOT FROM THE TRANSCRIPT =======
      # Run 34149650635 at cea2fbc9 failed here with all nine tests PASSED and
      # zero skipped: the job sets `CARGO_TERM_COLOR: always`, nextest coloured
      # its records, and ANSI escapes landed around the binary and test names,
      # so a `<binary><sep><name>$` regex matched nothing. The ~150 lines of
      # ANSI stripping, summary-grammar parsing and adversarial transcript
      # fixtures that incident produced are gone: this step now reads the
      # STRUCTURED result set nextest writes for the run
      # (`[profile.default.junit]` in `.config/nextest.toml`) via
      # `.github/scripts/check-witness-results.py`. A colour escape cannot
      # appear in an XML attribute, and there is no transcript to inject a
      # summary line into.
      #
      # The checker is at least as strict as the loop it replaces, per name:
      # present exactly once as a `<testcase>` of THIS suite (full path, so
      # `<name>_extra` fails), carrying no `<failure>`, `<error>`, `<skipped>`
      # or `<rerunFailure>` child, with the suite's own `failures`/`errors` at
      # zero and its `tests` attribute agreeing with the elements counted. It
      # additionally rejects `<flakyFailure>` — a witness that passed only on a
      # second attempt — which the per-name re-runs could not observe. Its
      # `--self-test` drives every rejection path against synthetic XML and
      # runs first, so the predicates are proven per run, not asserted.
      #
      # The `--test` target is spelled LITERALLY: the "Integration test pin
      # guard" job scrapes real `--test <name>` flags out of this workflow to
      # prove every `tests/*.rs` runs somewhere, and a shell variable is
      # invisible to it. Run 34158104154 failed exactly there.
      - name: Sensing — organization lease wire
        if: ${{ !cancelled() }}
        run: |
          set -uo pipefail
          CHECK="$GITHUB_WORKSPACE/.github/scripts/check-witness-results.py"
          FEATURES="cortex tool fixtures"
          python3 "$CHECK" --self-test || exit 1

          rm -f target/nextest/default/junit.xml
          cargo nextest run --color never --no-fail-fast --no-tests=fail --retries 0 \
            --features "$FEATURES" --test sensing_org_lease_wire \
            || { echo "::error::sensing_org_lease_wire did not pass as a whole"; exit 1; }

          python3 "$CHECK" \
            --junit target/nextest/default/junit.xml \
            --suite sensing_org_lease_wire \
            --min 9 \
            an_org_lease_reaches_the_provider_through_real_intake \
            releasing_the_strictest_org_holder_relaxes_the_provider_row \
            releasing_the_last_org_holder_deregisters_the_provider_row \
            a_stale_org_capture_refuses_and_puts_nothing_on_the_wire \
            the_later_org_cadence_decision_is_what_the_provider_finally_holds \
            a_parked_org_teardown_cannot_be_overtaken_by_its_own_reacquisition \
            the_production_send_boundary_is_strictly_serial_in_enqueue_order \
            the_ordered_egress_is_bounded_and_keeps_the_latest_decision \
            the_egress_consumer_does_not_survive_node_shutdown

      # === Sensing — organization exact-provider PROJECTION (independent) ==
      # OA-4's request-relative projection witnesses
      # (`tests/sensing_org_exact_projection.rs`). Its own invocation for the
      # same reason as the lease-wire step above: `--no-tests=fail` is RUN-wide,
      # so this binary compiling to zero tests — its `#![cfg(all(feature =
      # "net", feature = "fixtures"))]` unsatisfied, or every witness renamed
      # away — would be invisible while a sibling target still ran something.
      # The checker's absent-suite error covers the same hole from the result
      # side.
      #
      # `--retries 0` deliberately: one witness drives a concurrent readiness
      # writer against repeated captures, one parks a writer INSIDE the capture
      # and requires it to find the observation mutex held, and another proves
      # no sensing guard is held during the actual route/classification work.
      # All three are properties of a specific interleaving, so a retry could
      # only convert a real coherence or lock-order defect into a green run —
      # and the checker rejects a `<flakyFailure>` even if that flag is ever
      # dropped.
      - name: Sensing — organization exact projection
        if: ${{ !cancelled() }}
        run: |
          set -uo pipefail
          CHECK="$GITHUB_WORKSPACE/.github/scripts/check-witness-results.py"
          FEATURES="cortex tool fixtures"

          rm -f target/nextest/default/junit.xml
          cargo nextest run --color never --no-fail-fast --no-tests=fail --retries 0 \
            --features "$FEATURES" --test sensing_org_exact_projection \
            || { echo "::error::sensing_org_exact_projection did not pass as a whole"; exit 1; }

          python3 "$CHECK" \
            --junit target/nextest/default/junit.xml \
            --suite sensing_org_exact_projection \
            --min 13 \
            counts_ranking_and_rows_agree_under_concurrent_status_change \
            one_acquisition_captures_every_row_while_a_writer_is_excluded \
            unknown_never_prunes_and_an_over_budget_ready_stays_potential \
            expiry_without_a_new_beat_maps_unknown_and_an_expired_not_ready_never_prunes \
            a_provider_removed_before_the_snapshot_resolves_unknown_from_current_state \
            a_provider_removed_after_the_snapshot_is_advisory_and_cannot_authorize \
            an_unrelated_interest_for_the_same_provider_never_contributes_readiness \
            no_sensing_lock_is_held_during_route_budget_or_sort_work \
            the_off_lock_observer_itself_holds_nothing \
            an_unrelated_owner_does_not_make_off_lock_work_look_locked \
            the_sensed_order_is_a_stable_class_permutation_of_the_complete_list \
            a_candidate_list_beyond_the_sensing_cap_keeps_every_unsensed_member \
            the_population_clamp_bounds_rows_but_never_drops_a_candidate

      # === Sensing — organization exact COMPOSITION (OA-5) ================
      # The fixtures-only seam assembly: authorized owner-private discovery ->
      # the exact organization sensing lease on real loopback UDP -> the
      # provider's signed observations -> one coherent projection and candidate
      # order -> one protected invocation with real organization admission.
      # Plus the dark-boundary guards for the bridge those witnesses reach
      # through, and the per-binary floor for the three-node transport family.
      #
      # One run per binary, `--retries 0`: these are transport-timing AND
      # ordering proofs, and a retry could turn a real regression (a dropped
      # registration, a projection that stopped reading real observations, an
      # order that stopped consuming the projection) into a green run. Each
      # binary runs alone so `--no-tests=fail` is exact per binary, and every
      # witness is then verified BY NAME against that run's result set, so a
      # rename or an `#[ignore]` fails the step instead of shrinking the roster
      # silently.
      - name: Sensing — organization exact composition
        if: ${{ !cancelled() }}
        run: |
          set -uo pipefail
          CHECK="$GITHUB_WORKSPACE/.github/scripts/check-witness-results.py"
          FEATURES="cortex tool fixtures"

          run_binary() {   # $1=binary  $2=floor  $3..=required names
            bin="$1"; floor="$2"; shift 2
            rm -f target/nextest/default/junit.xml
            cargo nextest run --color never --no-fail-fast --no-tests=fail --retries 0 \
              --features "$FEATURES" --test "$bin" \
              || { echo "::error::$bin did not pass as a whole"; return 1; }
            python3 "$CHECK" --junit target/nextest/default/junit.xml \
              --suite "$bin" --min "$floor" "$@" || return 1
          }

          # Literal `--test` flags for the pin guard, which scrapes this file.
          cargo nextest list --color never --features "$FEATURES" \
            --test sensing_org_exact_seam --test sensing_org_exact_guards \
            --test org_rpc_streaming >/dev/null \
            || { echo "::error::the pinned binaries do not even list"; exit 1; }

          run_binary sensing_org_exact_seam 8 \
            discovery_transport_observations_projection_and_admission_compose \
            a_stale_local_preparation_mints_no_intent_and_sends_nothing \
            an_unproven_call_to_the_sensed_provider_is_denied \
            sensing_is_advisory_and_neither_plane_lets_it_authorize \
            real_sensed_evidence_orders_the_complete_candidate_list \
            an_all_pruned_order_falls_back_to_the_callers_own_order \
            a_granted_only_provider_is_never_sensed_and_a_dual_plane_provider_is_sensed_once \
            an_unpinned_authorized_provider_is_neither_sensed_nor_callable || exit 1

          run_binary sensing_org_exact_guards 3 \
            every_bridge_declaration_is_gated_hidden_and_marked_unstable \
            the_bridge_is_declared_once_and_is_absent_from_mesh \
            the_fixtures_off_probe_covers_every_bridge_declaration || exit 1

          run_binary sensing_org_three_node 2 \
            relay_reauthors_org_provider_under_its_own_membership \
            a_floored_peer_with_sensing_off_drops_the_org_frame_and_stays_unknown || exit 1

          # Protected server-streaming
          # (binary tests/org_rpc_streaming.rs). Floor = the count the binary
          # reports at the pinned head (51, RE-DERIVED from the binary's real
          # test list — the old comment decomposed to 41 against a pin of 42,
          # and a wrong re-derivation baseline invites lowering the floor):
          # the 42-witness S1.2–S1.5 estate = the 30-roster preserved verbatim
          # + 12 CS/DX, duplex-flow and half-close witnesses; plus the 7
          # wave-1–3 repair witnesses (WIRE-1's displaced-carrier refusal,
          # SDK-2's three token-cancel terminals, SDK-1's three typed deadline
          # retirements) and the 2 frozen-chain witnesses (TESTS-1's unary
          # admission half of §1.4, TESTS-4's extraction-hash recomputation).
          # Every witness is name-pinned below; a new one joins the roster AND
          # this count in its own commit.
          run_binary org_rpc_streaming 51 \
            stream_opening_admits_same_org \
            stream_opening_admits_cross_org \
            unary_context_proof_is_binding_invalid_on_stream_registration \
            stream_proof_on_unary_registration_is_not_supported \
            frozen_old_provider_refuses_stream_proof_with_not_supported \
            replayed_opening_on_new_session_is_session_binding_mismatch \
            late_chunk_from_replaced_session_is_dropped \
            omitted_deadline_gets_default_and_expires_idle \
            requested_deadline_over_cap_is_refused_with_zero_effects \
            requested_deadline_within_cap_is_honoured \
            pump_parked_on_zero_credit_is_retired_at_deadline_with_one_terminal \
            serve_handle_drop_retires_live_stream_and_sibling_survives \
            credential_clamp_expiry_is_admission_denied_not_timeout \
            public_ss_nonzero_deadline_expires_with_typed_timeout \
            public_client_stream_deadline_expiry_is_typed_timeout \
            floor_raise_retires_blocked_stream_before_publish_returns \
            sibling_stream_of_other_org_sends_next_item_after_publication \
            poisoned_store_retires_all_protected_streams \
            store_replacement_retires_all_and_resubscribes \
            session_replacement_retires_old_call \
            active_call_id_reuse_after_replay_window_is_refused \
            raise_between_reserve_and_install_denies_with_zero_effects \
            queued_bytes_over_call_budget_park_send_wait_and_wake_on_retire \
            node_shutdown_retires_live_protected_streams \
            forbidden_stream_opening_causes_zero_handler_effects \
            streaming_denial_is_not_fanned_out_to_the_reply_roster \
            provider_policy_veto_denies_before_effects \
            completed_stream_drains_queued_items_in_order_with_content_and_end_terminal \
            cross_org_completed_stream_drains_correlated_items_with_end_terminal \
            response_after_session_replacement_reaches_only_the_live_session \
            client_stream_aggregate_with_valid_proof \
            client_stream_opening_binds_first_chunk \
            cross_direction_grant_is_ignored \
            duplex_exchange_with_valid_proof \
            duplex_response_window_blocks_until_grant \
            end_cannot_cancel_another_stream_or_reopen_terminal_half \
            opening_body_budget_refusal_completes_the_record \
            pre_admission_chunks_are_never_delivered \
            retire_unblocks_both_directions \
            upload_end_then_remaining_output_completes \
            wrong_session_grant_does_not_release_credit \
            early_handler_return_refuses_late_input_without_resource_exhausted \
            displaced_carrier_opening_is_refused_and_leaks_no_registry_record \
            token_cancel_on_live_server_stream_is_a_terminal_error_never_clean_eof \
            token_cancel_on_live_duplex_is_a_terminal_error_never_clean_eof \
            token_cancel_classifies_client_stream_finish_as_cancelled_not_transport \
            server_stream_deadline_retirement_is_typed_timeout_not_server_error \
            duplex_deadline_retirement_is_typed_timeout_not_server_error \
            client_stream_deadline_retirement_is_typed_timeout_not_server_error \
            frozen_old_provider_admits_a_well_formed_unary \
            frozen_85ecc77c9::every_vendored_body_window_recomputes_to_its_recorded_extraction_sha256 || exit 1

      # === The fixtures-off DARKNESS probe (external consumer) =============
      # No test inside this workspace can observe a fixtures-off build of the
      # core crate: dev-dependency feature unification turns the feature on for
      # every dev target that shares the graph. So the darkness claim is proved
      # by an EXTERNAL crate with its own workspace root, compiled twice:
      #
      #   * WITHOUT `fixtures` it must FAIL to resolve the bridge module, and
      #     the failure must be a resolution error (E0432/E0433) - not a typo,
      #     a missing manifest or an unrelated build break;
      #   * WITH `fixtures` it must compile, which is what keeps the negative
      #     leg from passing for the wrong reason.
      #
      # `tests/sensing_org_exact_guards.rs` separately asserts the probe names
      # exactly the bridge's declarations, so it cannot cover fewer symbols.
      #
      # Both legs run `--locked` against the probe's OWN committed
      # `Cargo.lock`. Its workspace root is separate, so it resolves
      # independently of the parent lockfile: without a committed lockfile and
      # this flag, a fresh CI run could pick different compatible transitive
      # versions than the one this probe was verified against.
      - name: Sensing — organization exact bridge darkness
        if: ${{ !cancelled() }}
        working-directory: net/crates/net/guards/fixtures_off_probe
        run: |
          set -uo pipefail
          die() { echo "::error::$1"; shift; [ "$#" -gt 0 ] && printf '%s\n' "$@"; exit 1; }

          # The negative leg is EXPECTED to fail, and the runner's shell has
          # errexit on: `set -uo pipefail` does not clear an inherited `-e`, so
          # a bare assignment from a failing command would exit the step right
          # here - before the diagnostic classification and before the positive
          # control ever ran. Capturing it inside an `if` is what suppresses
          # errexit for exactly this one command, and nothing else.
          negative=""
          if negative=$(cargo check --locked --message-format short 2>&1); then
            die "the fixtures-off probe COMPILED: the bridge is reachable in a \
                 build without the feature" "$negative"
          fi
          printf '%s\n' "$negative" \
            | grep -qE 'error\[E043[23]\].*org_exact_sensing_bridge' \
            || die "the fixtures-off probe failed for the WRONG reason: expected an \
                    E0432/E0433 resolution failure naming the bridge module" "$negative"
          echo "negative leg: bridge unresolvable without \`fixtures\`"

          cargo check --locked --features fixtures \
            || die "the positive leg must compile, or the negative leg proves nothing"
          echo "positive leg: bridge resolves with \`fixtures\`"

          # The probe resolves independently of the workspace, so its
          # lockfile drifts every time the workspace gains or bumps a
          # dependency the probe also reaches — and `--locked` then
          # fails BEFORE either leg runs, which reads as "the guard
          # broke" rather than "the lockfile is stale". A
          # `wasm-bindgen` pin did it for the second time (the first
          # was 64b0256c9). Say so precisely, and only when it is
          # actually the cause.
          if ! cargo metadata --locked --format-version 1 >/dev/null 2>&1; then
            die "the probe's Cargo.lock is stale — regenerate it with \
                 \`cargo generate-lockfile --offline\` in \
                 net/crates/net/guards/fixtures_off_probe and commit it"
          fi

      # === The org + streaming API probe (external consumer) ===============
      # The org-scoped streaming plan changes public org and streaming types
      # (Compatibility ledger C1/C3/C4). Every in-workspace caller of those
      # types is edited in the same commit as the type itself, so no test in
      # this repository fails when a DOWNSTREAM build would. This probe is
      # that downstream: a second external crate, with its own workspace root
      # and its own committed lockfile, that does nothing but name, construct
      # and exhaustively match the surface.
      #
      # Unlike the fixtures-off probe above it has no negative leg to
      # classify - every command is positive, and they run in this order on
      # purpose:
      #
      #   * `cargo metadata --locked` FIRST. The probe resolves independently
      #     of the workspace, so its lockfile drifts whenever the workspace
      #     gains or bumps a dependency it also reaches; running it first is
      #     what makes a stale lockfile read as "regenerate the lockfile"
      #     instead of surfacing as an unexplained failure of the compile
      #     leg, which is `--locked` too.
      #   * `cargo check --locked` must COMPILE. When C1/C3/C4 land
      #     it will stop compiling - that failure IS the named source break,
      #     and `guards/org_api_probe` is updated in the same commit, which
      #     is exactly the review signal the ledger asks for.
      #   * `cargo test --locked` must RUN (TESTS-5/TESTS-6): the probe's
      #     behavioral claim and its MANIFEST binding are `#[test]`s now, and
      #     a claim that executes nowhere is not a claim.
      - name: Organizations — external org/streaming API probe
        if: ${{ !cancelled() }}
        working-directory: net/crates/net/guards/org_api_probe
        run: |
          set -uo pipefail
          die() { echo "::error::$1"; shift; [ "$#" -gt 0 ] && printf '%s\n' "$@"; exit 1; }

          if ! cargo metadata --locked --format-version 1 >/dev/null 2>&1; then
            die "the probe's Cargo.lock is stale — regenerate it with \
                 \`cargo generate-lockfile --offline\` in \
                 net/crates/net/guards/org_api_probe and commit it"
          fi

          # Captured inside an `if` for the same reason the step above does
          # it: the runner's shell has errexit on, and `set -uo pipefail`
          # does not clear it, so a bare assignment from a failing command
          # would exit before the diagnostic ever printed.
          probe=""
          if ! probe=$(cargo check --locked --message-format short 2>&1); then
            die "the external org/streaming API probe no longer compiles: a \
                 public org or streaming signature changed. If this is an \
                 INTENDED source break (ORG_SCOPED_STREAMING_PLAN.md ledger \
                 C1/C3/C4), update net/crates/net/guards/org_api_probe in \
                 the SAME commit and record it in the migration notes; if it \
                 is not, this is an unannounced break of a downstream \
                 consumer." "$probe"
          fi
          echo "external consumer compiles: org + typed-streaming API pinned"

          # TESTS-6: EXECUTED, not merely compiled. The `cargo check` leg
          # proves the pins type-check; the probe's `#[test]`s RUN its body
          # (the ledger C1/Q2 behavioral claim — `RpcStreamingContext::new`
          # fabricates no admitted org facts, previously an `assert!` sealed
          # inside a `main` this workflow never invoked) and bind `MANIFEST`
          # to the pins in `main.rs` in both directions, with a pin-count
          # floor (TESTS-5). `cargo test` builds the same target set as
          # `cargo check`, so this leg adds execution, no second compile of
          # the probe's own sources.
          tests=""
          if ! tests=$(cargo test --locked --message-format short 2>&1); then
            die "the org/streaming API probe's tests failed: either its runtime \
                 claim (the RpcStreamingContext constructor fabricates no \
                 admitted org facts) is false, or MANIFEST drifted from the \
                 pins in src/main.rs (the binding check or its pin-count \
                 floor)." "$tests"
          fi
          echo "external consumer runs: behavioral claim + MANIFEST binding witnessed"

      # === NetDB ==========================================================
      - name: NetDB
        if: ${{ !cancelled() }}
        run: >
          cargo nextest run --no-fail-fast --no-tests=fail --features netdb
          --test integration_netdb
          --test netdb_builder_and_accessors

  # --- Family D: in-memory Dataforts + the MeshDB/MeshOS stores --------
  # Three of the four groups here are plain `--features dataforts`, so they
  # share one crate compile. The v0.3 conformance group sits with them rather
  # than beside the on-disk blob suites it used to read next to — it needs no
  # `redex-disk`, and grouping by feature set is the whole point. MeshDB and
  # MeshOS ride along because they were 3s and 4s respectively: cheap enough
  # that a dedicated runner would cost more in setup than it saves.
  integration-dataforts:
    name: Integration — Dataforts (in-memory), batched send/recv, MeshDB, MeshOS
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Same sccache trial as `integration-net-core` — see the note there.
      # All five integration families carry it: reusing compiler objects
      # ACROSS these jobs is what keeps the split from paying for itself in
      # repeated dependency compilation.
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: "sccache"
      CARGO_INCREMENTAL: "0"
    defaults:
      run:
        working-directory: net/crates/net
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Set up sccache
        uses: mozilla-actions/sccache-action@v0.0.11

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: integration-dataforts
          workspaces: net/crates/net -> target

      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: nextest

      # === Dataforts (greedy + gravity) + stream SACK ranges ==============
      # `stream_ack_ranges` (STREAM_ACK_BATCHING_AND_RANGES_PLAN R-6)
      # rides this feature set: it drives lossy blob transfers to prove
      # the capability-gated SACK-range path engages
      # (`StreamAckRanges` emitted, transfer completes byte-for-byte),
      # that the gate stays shut without the peer capability (old-peer
      # interop via the legacy cumulative-ACK + NACK path), and that
      # the `enable_stream_ack_ranges` kill switch suppresses the
      # capability advertisement.
      # The blob/dir transfer + transfer fairness/concurrency suites only
      # need `dataforts` (no `redex-disk`), so they batch into this same
      # in-memory dataforts compile rather than the on-disk blob e2e job
      # (`integration-dataforts-disk`).
      - name: Dataforts greedy + gravity + stream SACK ranges + transfers
        if: ${{ !cancelled() }}
        run: >
          cargo nextest run --no-fail-fast --no-tests=fail --features batched-ingress
          --test dataforts_greedy_e2e
          --test dataforts_gravity_e2e
          --test stream_ack_ranges
          --test blob_transfer
          --test dir_transfer
          --test transfer_concurrency
          --test transfer_fairness

      # === Scheduled-stream batched drain (Linux sendmmsg send path) ======
      # The whole NRPC_SEND_LOOP_BATCHING_PLAN gate, in one compile. The
      # scheduled-stream egress ships packets via the send loop's batched,
      # group-by-destination drain, which calls `sendmmsg` behind
      # `cfg(target_os = "linux")` — a block that does not compile on the
      # macOS dev host, so this Linux job is the gate that actually compiles
      # AND exercises it. `dataforts` pulls in `net`, so all three drain
      # tests build under one feature set:
      #   - send_drain_depth      — floods 16 concurrent scheduled streams,
      #                             prints the packets/syscall-collapse factor;
      #   - scheduled_stream      — pins the scheduled-vs-direct routing;
      #   - scheduled_stream_integrity — fetches blobs over reliable scheduled
      #     streams and asserts BYTE-FOR-BYTE delivery through the batch path
      #     (incl. a tiny-send-buffer phase that forces the sendmmsg partial
      #     -send / EWOULDBLOCK tail), the integrity check the others can't make.
      # `--no-capture` surfaces the measurement + verified-blob/flush counts.
      - name: Scheduled-stream batched drain (Linux sendmmsg path)
        if: ${{ !cancelled() }}
        run: >
          cargo nextest run --no-fail-fast --no-tests=fail --features batched-ingress --no-capture
          --test send_drain_depth
          --test scheduled_stream
          --test scheduled_stream_integrity

      # === Batched ingress (Linux recvmmsg receive path) ==================
      # The NRPC_RECV_LOOP_BATCHING_PLAN gate. The mesh receive loop drains the
      # socket via `recvmmsg` (BatchedPacketReceiver) when
      # `MeshNodeConfig::with_batched_ingress(true)` is set — a path behind
      # `cfg(target_os = "linux")` that does not compile on the macOS dev host,
      # so this Linux job is the gate that compiles AND exercises it.
      #   - batched_ingress_integrity — fetches blobs concurrently into a
      #     fetcher built with batched ingress and asserts BYTE-FOR-BYTE
      #     delivery, then that the batched recv path actually carried the bulk
      #     (`recv_batch_stats().syscalls > 0`) — the assertion that only fires
      #     on Linux where the recvmmsg path is live.
      #   - recv_drain_depth — floods a node with fire-and-forget datagrams (no
      #     reliability, so no retransmit-exhaustion flakiness) and asserts the
      #     recvmmsg path collapsed syscalls (`packets > syscalls`), printing the
      #     packets/syscall factor — the heavy-load recv analogue of
      #     send_drain_depth.
      # `--no-capture` surfaces the packets/recvmmsg-batch collapse counts.
      # FEATURE GRAPH for this whole job: `default + batched-ingress`. Every
      # step below used to declare its own set (`dataforts`,
      # `dataforts,batched-ingress`, `meshdb`, `meshos`) but none passed
      # `--no-default-features`, and `dataforts`, `meshdb` and `meshos` are all
      # already in `default` — so the only distinguisher was
      # `batched-ingress`, bought at the price of a second crate compile and a
      # second mass relink. Compiling it in is not the same as enabling it:
      # `MeshNodeConfig::batched_ingress` defaults to `false`, so the
      # per-packet path stays the one under test everywhere except the two
      # binaries below, which opt in explicitly.
      - name: Batched ingress (Linux recvmmsg path)
        if: ${{ !cancelled() }}
        run: >
          cargo nextest run --no-fail-fast --no-tests=fail --features batched-ingress --no-capture
          --test batched_ingress_integrity
          --test recv_drain_depth

      # === Dataforts blob v0.3 conformance (Tree + CDC + RS) ==============
      # Phase-pinned end-to-end conformance tests for the v0.3 blob
      # storage track. Each test runs at CI-feasible scale (default
      # parameters tuned for the runner's per-test memory budget; the
      # 100 GiB real-scale variant in the Tree test is `#[ignore]`'d
      # and opt-in via `-- --ignored` for release validators):
      #
      # - Tree (Phase A8): byte-identical round-trip, determinism,
      #   manifest LRU effectiveness, manifest-body-explosion guard.
      # - CDC (Phase B4): end-to-end determinism, dedup-after-edit
      #   ratio under one-byte flip + suffix-shift insert.
      # - RS (Phase C9): round-trip with all chunks present, m-chunk-
      #   loss reconstruction, m+1-loss unrecoverable, cross-adapter
      #   determinism.
      - name: Dataforts blob v0.3 conformance
        if: ${{ !cancelled() }}
        run: >
          cargo nextest run --no-fail-fast --no-tests=fail --features batched-ingress
          --test dataforts_blob_v3_tree_conformance
          --test dataforts_blob_v3_cdc_conformance
          --test dataforts_blob_v3_rs_conformance
          --test dataforts_blob_v3_composed_conformance

      # === MeshDB =========================================================
      # `meshdb` chains to cortex → redex → net, so a single
      # --features meshdb covers the test's `feature = "net" + "meshdb"`
      # gate.
      - name: MeshDB
        if: ${{ !cancelled() }}
        run: cargo nextest run --no-fail-fast --no-tests=fail --features batched-ingress --test meshdb_subprotocol_wire

      # === MeshOS + Deck ==================================================
      # `meshos` chains to cortex → redex → net. The pipeline test pins
      # the contract between MeshOsLoop reconcile → admit →
      # ActionDispatcher across phases; the deck test pins the operator
      # surface (DeckClient → AdminCommands → in-process MeshOsRuntime)
      # that Deck-the-binary composes against. scheduler_bridge_driver
      # exercises the MeshOS ↔ Scheduler bridge end-to-end (the
      # SchedulerBridgeDriver over a live MeshOsLoop + MeshNode +
      # WorkflowAdapter). All three share the same `meshos` gate — which
      # transitively enables net/cortex/redex (`meshos → cortex → redex →
      # net`), everything the driver test needs — and run in one cargo
      # invocation.
      - name: MeshOS + Deck
        if: ${{ !cancelled() }}
        run: >
          cargo nextest run --no-fail-fast --no-tests=fail --features batched-ingress
          --test meshos_pipeline
          --test deck_pipeline
          --test scheduler_bridge_driver

  # --- Family E: on-disk Dataforts + the CLI/ABI surfaces --------------
  # Kept as its own job because `cli` pulls clap and the ABI mirror wants
  # `netdb`, and because this job's runner should not also carry the
  # in-memory family's binaries.
  #
  # The previous rationale — "merging them into the plain `dataforts` family
  # would retire the proof that the in-memory paths compile without them" —
  # did not hold: `dataforts` ALREADY enables `redex-disk`
  # (Cargo.toml:205-207), and no step here passes `--no-default-features`, so
  # there was no fixtures-off/disk-off configuration being proved anywhere.
  # The `narrow-feature-check` job now asserts those proofs for real.
  integration-dataforts-disk:
    name: Integration — Dataforts (on-disk blob e2e), transport ABI, net-blob CLI
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Same sccache trial as `integration-net-core` — see the note there.
      # All five integration families carry it: reusing compiler objects
      # ACROSS these jobs is what keeps the split from paying for itself in
      # repeated dependency compilation.
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: "sccache"
      CARGO_INCREMENTAL: "0"
    defaults:
      run:
        working-directory: net/crates/net
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Set up sccache
        uses: mozilla-actions/sccache-action@v0.0.11

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: integration-dataforts-disk
          workspaces: net/crates/net -> target

      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: nextest

      # === Dataforts blob e2e (multi-node + migration) ====================
      # `redex-disk` is required so MeshBlobAdapter can spin up a real
      # on-disk RedEX per node — separate from the in-memory dataforts
      # family so the on-disk paths get compiled.
      - name: Dataforts blob e2e
        if: ${{ !cancelled() }}
        run: cargo nextest run --no-fail-fast --no-tests=fail --features "netdb cli" --test dataforts_blob_e2e

      # === Transport C ABI error-code mirror ==============================
      # Parses `include/net_transport.h` and asserts every `#define
      # NET_*` matches its Rust `pub const NET_*` sibling. Gated on
      # `net + dataforts + netdb + redex-disk` per the test's cfg.
      - name: Transport error-code mirror
        if: ${{ !cancelled() }}
        run: cargo nextest run --no-fail-fast --no-tests=fail --features "netdb cli" --test transport_error_codes

      # === Dataforts net-blob CLI =========================================
      # Pulls in clap via the `cli` feature; kept separate so the
      # non-CLI dataforts groups don't pay the clap compile cost.
      - name: Dataforts net-blob CLI
        if: ${{ !cancelled() }}
        run: cargo nextest run --no-fail-fast --no-tests=fail --features "netdb cli" --test net_blob_cli

  # === The narrow-configuration COMPILE proofs ==========================
  # These used to be claimed by the integration families ("the bare bus
  # compiles without `net`", "the in-memory paths compile without the on-disk
  # ones") and were vacuous: a family step that passes `--features dataforts`
  # still gets `default = [net, nat-traversal, cortex, meshdb, meshos,
  # dataforts]` — cargo only drops the default set for
  # `--no-default-features`, which no family step passed — and `dataforts`
  # itself enables `redex-disk` (Cargo.toml:205-207). So the narrow builds
  # were never narrow, and the families paid for one full crate compile and
  # one mass relink per "narrow" set to prove nothing.
  # The proofs live here instead, stated the only way that makes them true,
  # and as `cargo check --lib`: a compile proof needs metadata, not a linked
  # test binary. Each row is a configuration a downstream `cargo add net-mesh`
  # can actually select.
  #
  # WHAT THE FIRST HONEST RUN FOUND, and what it fixed. Seven of the thirteen
  # configurations did not compile at all — every `net`-without-`cortex`
  # selection — from one defect with two sites:
  #
  #   src/adapter/net/channel/config.rs imported
  #     `crate::adapter::net::mesh_rpc::ServeError` unconditionally while
  #     `mesh_rpc` is `#[cfg(feature = "cortex")]` (src/adapter/net/mod.rs);
  #   src/adapter/net/mesh.rs named
  #     `crate::adapter::net::cortex::RpcInboundDispatcher` in an ungated type
  #     alias, and carried `rpc_local_services` under a `redex` cfg while its
  #     type `LocalServiceRegistry` is `cortex`-gated — `cortex` implies
  #     `redex`, not the reverse.
  #
  # `dataforts` additionally exposed `blob::transfer_rpc`, an nRPC service
  # definition, without `cortex`. All repaired; every row below is now a
  # must-build row, which is the state this job exists to hold. If you gate
  # something new on `cortex`, this job is what tells you that a downstream
  # `cargo add net-mesh --no-default-features --features net` broke.
  #
  # This is deliberately NOT a behavior gate. Anything that must be OBSERVED
  # with a feature off needs a real test run, not a row here — add it to a
  # family with its own `--no-default-features` invocation and say why.
  narrow-feature-check:
    name: Narrow feature configurations (compile)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: net/crates/net
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: narrow-feature-check
          workspaces: net/crates/net -> target

      - name: Every narrow configuration builds
        run: |
          set -uo pipefail
          check() {   # $1=feature set ("" = none)  $2=why
            echo "==> --no-default-features --features '${1:-<none>}'  ($2)"
            if [ -z "$1" ]; then
              cargo check --locked --lib --no-default-features
            else
              cargo check --locked --lib --no-default-features --features "$1"
            fi
          }
          rc=0
          check "" "the bare event bus, no mesh at all" || rc=1
          check "net" "the mesh transport with no nRPC, CortEX or storage" || rc=1
          check "net nat-traversal" "traversal without port mapping" || rc=1
          check "net batched-ingress" "the batched receive path on a bare mesh" || rc=1
          check "net regex" "regex capability matching on a bare mesh" || rc=1
          check "net tool" "the AI tool surface (tool pulls cortex)" || rc=1
          check "redex" "the in-memory log with no on-disk segment" || rc=1
          check "redex redex-disk" "the on-disk log without CortEX" || rc=1
          check "cortex" "folded state without NetDb, MeshDB or MeshOS" || rc=1
          check "netdb" "NetDb without MeshDB or MeshOS" || rc=1
          check "meshdb" "the query layer alone" || rc=1
          check "meshos" "the cluster-behavior engine alone" || rc=1
          check "dataforts" "blob storage (pulls redex-disk by definition)" || rc=1
          [ "$rc" -eq 0 ] || { echo "::error::a narrow configuration does not build"; exit 1; }
          echo "every narrow configuration builds"

  loom-tests:
    name: Loom concurrency models
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: net/crates/net
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      # Loom builds need their own cache key — the `--cfg loom`
      # RUSTFLAGS pulls in a different set of dev-deps (`loom`
      # itself is `[target.'cfg(loom)'.dev-dependencies]`) and
      # rebuilds every atomic-touching crate with loom's
      # substitute primitives. Sharing the cache with non-loom
      # jobs would just thrash both — hence the distinct
      # `shared-key`. `rust-cache` folds `RUST*` env vars into its
      # key automatically, but RUSTFLAGS is set at STEP level here,
      # not job level, so the action never sees it; the explicit
      # key is what actually keeps the two families apart.
      #
      # No sccache on this job: `--cfg loom` is a global rustc flag that
      # invalidates every object anyway, so there is nothing to reuse and
      # the wrapper would only add overhead. This job runs in ~1 minute.
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: loom
          workspaces: net/crates/net -> target

      # Loom tests exhaustively explore thread interleavings; release
      # mode is mandatory (debug builds are too slow to converge in CI
      # time budget). The models in `loom_models.rs` use loom's
      # substitute atomics standalone, not the production types, so
      # the test only imports from `loom` itself.
      #
      # `--no-default-features` skips compiling the `net` feature's
      # `adapter::net` module: tokio gates `tokio::net::*` out under
      # `#![cfg(not(loom))]`, and `adapter::net::{proxy, router,
      # transport}` use `tokio::net::UdpSocket` extensively. Trying
      # to compile the lib's net stack under `--cfg loom` fails on
      # the missing tokio::net module. The loom test itself doesn't
      # touch the net stack, so this is purely a build-time gate
      # for the lib that the test target implicitly depends on.
      - name: Run loom models
        run: cargo test --release --no-default-features --test loom_models
        env:
          RUSTFLAGS: --cfg loom

  rust-sdk-tests:
    name: Rust SDK tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # sccache trial job #3 of 3 (see the note in `integration-net-core`).
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: "sccache"
      CARGO_INCREMENTAL: "0"
    defaults:
      run:
        working-directory: net/crates/net/sdk
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Set up sccache
        uses: mozilla-actions/sccache-action@v0.0.11

      # `sdk` and `payments` are members of the `net/crates/net` workspace, so
      # both build into the one shared `net/crates/net/target` — a single
      # `workspaces` entry covers this whole job.
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: sdk
          workspaces: net/crates/net -> target

      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: nextest

      # Feature set covers every SDK integration test except
      # `redis_dedup_contract` (gated on `redis`, deferred until CI
      # service containers land — same policy as the main crate's
      # `integration_redis`). Without this width, tests gated on
      # `cortex` / `testing` / `compute` / `nat-traversal` /
      # `port-mapping` / `tool` / `macros` compile to empty test
      # binaries and the contract goes silently unverified.
      # nextest auto-discovers every `tests/*.rs` file under `sdk/tests/`
      # exactly as `cargo test` did; the step name calls out the load-bearing
      # ones so a missing test binary is obvious in the CI log:
      #   - mesh_stream_backpressure — substrate flow-control pin
      #   - mesh_rpc_bidi_typed     — Phase E client-streaming +
      #     duplex typed SDK surface (5 tests). Gated on
      #     `feature = "net" + "cortex"`, both present here.
      #   - tool_serve_round_trip   — Mesh::serve_tool + call_tool +
      #     watch_tools live two-mesh path. Gated on
      #     `feature = "tool" + "cortex"`.
      #   - tool_format_golden_vectors — T-1 byte-equality
      #     verifier (openai / anthropic / mcp / gemini lowering +
      #     reverse). Gated on `feature = "tool"`.
      #   - tool_event_golden_vectors  — T-2 ToolEvent envelope
      #     round-trip verifier. Gated on `feature = "tool"`.
      #   - tool_macro              — `#[tool]` proc-macro
      #     expansion + serve-helper round-trip. Gated on
      #     `feature = "macros" + "cortex"`.
      #   - sensing_provider        — capability-sensing provider
      #     lifecycle: registration ownership, the publication fence
      #     (an in-flight evaluation released after a close or a
      #     replacement), state-edge notification, and terminal
      #     registration-identity exhaustion. Gated on
      #     `feature = "net"`.
      #
      # nextest rather than `cargo test`: the SDK has 35 separate integration
      # test binaries and `cargo test` runs them ONE AT A TIME, so the suite
      # was serialising ~64s of execution that overlaps almost completely.
      # This is the shape nextest's process scheduling is actually for. It also
      # brings this job under `.config/nextest.toml` — the `terminate-after`
      # hang guard (a stalled test becomes a named failure instead of eating
      # the 20-minute budget) and the `retries = 0` override that keeps the
      # security-race binaries from being retried into green.
      #
      # `sensing_provider` and `sensing_consumer` are both in that zero-retry
      # override, and
      # `net_sdk::sensing::tests::the_sensing_witness_binaries_are_excluded_from_retries`
      # reads `.config/nextest.toml` and fails if either ever drops out — the
      # override is a filter expression, so it would otherwise stop matching
      # silently.
      #   - sensing_consumer        — capability-sensing CONSUMER
      #     lifecycle for own-organization exact providers: signed
      #     readiness into one snapshot, a state edge waking a parked
      #     watcher, a change placed INSIDE a capture not being lost,
      #     quiet expiry and withdrawal, node-global ownership across
      #     separately constructed wrappers, authority loss/recovery,
      #     and the structured refusals. Gated on
      #     `feature = "net" + "cortex" + "fixtures"` (owner-scoped
      #     service discovery, plus the refresh-schedule and
      #     authority-clearing observations).
      #   - org_exact_sensing       — production organization
      #     exact-sensing call edge (22 tests). Needs the SDK's own
      #     `fixtures` feature, which is what gates `OrgClient`'s
      #     test-only sensing observation accessors; without it the
      #     binary does not compile, which is loud rather than silent.
      #
      # ONE exclusion, and it is not a gap in the gate. The reviewer's C4 probe
      # `review_aborted_startup_writer_cannot_outlive_its_owner` only reaches
      # its subject under her scheduling overlay
      # (docs/internal/reviews/startup-barrier.patch). Run bare — which is what
      # this auto-discovering sweep does — it fails its own precondition with
      # "startup reached publication barrier", which she explicitly warns must
      # not be mistaken for the ownership counterexample. Wiring the overlay in
      # would mean shipping review instrumentation in the product, which the
      # packet forbids; weakening her assertion is likewise not allowed. So the
      # row stays in the tree byte-identical and is excluded HERE by name, with
      # its acceptance recorded in the round-3 commit: with the barrier alone
      # and no owner-control patch, it passes. Its three self-contained
      # siblings are pinned with a floor in the "reviewer repair probes
      # (provider)" step below.
      - name: Run Rust SDK tests (includes mesh_stream_backpressure, mesh_rpc_bidi_typed, tool_*, sensing_provider, sensing_consumer, org_exact_sensing)
        run: |
          set -uo pipefail
          # This job's steps run from `net/crates/net/sdk`, but nextest writes
          # its JUnit under the WORKSPACE target directory
          # (`net/crates/net/target`) — a member crate has no target dir of
          # its own. A relative `target/nextest/...` here names a path that
          # never exists, which is why the artifact was reported missing
          # rather than the run being reported bad.
          JUNIT="$(cargo metadata --format-version 1 --no-deps \
            | python3 -c 'import json,sys;print(json.load(sys.stdin)["target_directory"])')/nextest/default/junit.xml"
          rm -f "$JUNIT"
          st=0
          cargo nextest run --no-fail-fast --no-tests=fail \
            --features "net cortex dataforts testing compute nat-traversal port-mapping aggregator tool macros fixtures" \
            -E 'not test(=review_aborted_startup_writer_cannot_outlive_its_owner)' \
            || st=$?
          # PRESERVE this run's result set before any later step's run
          # overwrites it. The named-witness steps below verify against this
          # artifact instead of re-executing each witness by name.
          #
          # `|| st=$?`, never a bare invocation followed by `st=$?`: this
          # block runs under the runner's `bash -e`, which ABORTS at the
          # failing run and skips this copy entirely — a red run then reads
          # downstream as "no JUnit artifact ... the run did not produce
          # results" instead of as the result set it actually produced.
          cp "$JUNIT" "$RUNNER_TEMP/sdk-suite-junit.xml"
          exit "$st"

      # === the org_streaming facade lifecycle
      #
      # The step above already EXECUTED this binary (the SDK sweep runs every
      # test in its own process); this gate PINS its result set — a witness
      # must not disappear silently. Fail-closed on identity/verdict/retries/
      # anti-vacuity per the gate contract above; `--self-test` proves the
      # predicates first. Floor = 14 (the 10-roster + the four
      # closure witnesses: the Granted-arm rows, the Q1 default deadline,
      # the OrgStreamRaw error items, the CS-seam typed terminal); raised with
      # each landing, names extended in the same commit as the witnesses.
      - name: Witness floor — org_streaming (14)
        if: ${{ !cancelled() }}
        run: |
          set -uo pipefail
          CHECK="$GITHUB_WORKSPACE/.github/scripts/check-witness-results.py"
          python3 "$CHECK" --self-test || exit 1
          python3 "$CHECK" --junit "$RUNNER_TEMP/sdk-suite-junit.xml" \
            --suite org_streaming --min 14 \
            live_same_org_streaming_through_the_facade \
            live_same_org_client_stream_through_the_facade \
            live_same_org_duplex_through_the_facade \
            live_cross_org_streaming_through_the_facade \
            live_cross_org_client_stream_through_the_facade \
            live_cross_org_duplex_through_the_facade \
            facade_stream_against_unary_only_provider_is_not_supported \
            dropping_org_stream_emits_one_cancel \
            handler_receives_verified_org_caller_not_origin \
            revocation_surfaces_as_final_admission_denied_item \
            granted_facade_streaming_serve_rows_complete_cross_org \
            facade_default_deadline_at_zero_outlives_a_shorter_provider_default \
            org_stream_raw_surfaces_midstream_errors_as_items \
            call_client_stream_bytes_deadline_reaches_a_typed_terminal || exit 1

      # === the CONSUMER observation lifecycle ==========================
      #
      # WHAT THIS GATES, and why it is no longer a per-name re-run loop.
      #
      # The step above already executed this binary — nextest runs every test
      # in its OWN process, so those executions are as isolated as a
      # `-E 'test(=name)'` run is. What the roster adds is the pin: a witness
      # must not disappear silently. This step therefore verifies the RESULT
      # SET that run produced (`$RUNNER_TEMP/sdk-suite-junit.xml`, written by
      # `[profile.default.junit]` in `.config/nextest.toml`) rather than
      # spending 27 more runner invocations re-proving what already ran.
      #
      # `check-witness-results.py` is fail-closed on every axis and is
      # STRICTER than the loop it replaces:
      #   - identity: each name must match a `<testcase>` of THIS suite
      #     exactly once, full-path, so `<name>_extra` is a different string;
      #   - execution + verdict: listed is not enough — a `<failure>`,
      #     `<error>`, `<skipped>` or `<rerunFailure>` child, or a nonzero
      #     suite-level `failures`/`errors`, fails the gate;
      #   - NO RETRY CONSUMED: JUnit records a retried-then-passed test as
      #     `<flakyFailure>`, which is rejected. The old loop passed
      #     `--retries 0` and could see only its own attempt; this sees the
      #     suite run's attempts too, so a weakened `.config/nextest.toml`
      #     override (this binary is in the `retries = 0` list) can no longer
      #     launder an ordering defect into green;
      #   - anti-vacuity: `--min` is the floor on EXECUTED cases, cross-checked
      #     against the suite's own `tests` attribute, and a suite missing
      #     altogether (renamed target, feature set that compiled it away) is
      #     an error rather than a zero-test success.
      #
      # The script's `--self-test` drives every one of those rejection paths
      # against synthetic XML and runs first, so the predicates are proven per
      # run rather than asserted.
      #
      # Three of these names carry each other and must all stay:
      # `a_change_landing_inside_a_capture_is_never_lost` fails if a change
      # placed inside a capture is swallowed;
      # `a_quiet_park_does_not_return_inside_the_wake_bound` fails if a park
      # returns inside a window QUALIFIED against the floor deadline actually
      # in force — dropping the control would let the first pass vacuously;
      # and `the_population_floor_wakes_a_quiet_parked_consumer` holds the
      # default-floor liveness statement the control no longer makes, since it
      # widens the floor to qualify its negative window.
      - name: Sensing — consumer observation lifecycle
        if: ${{ !cancelled() }}
        run: |
          set -uo pipefail
          CHECK="$GITHUB_WORKSPACE/.github/scripts/check-witness-results.py"
          python3 "$CHECK" --self-test || exit 1
          python3 "$CHECK" \
            --junit "$RUNNER_TEMP/sdk-suite-junit.xml" \
            --suite sensing_consumer \
            --min 27 \
            --required-file - <<'REQUIRED'
          signed_readiness_reaches_the_snapshot_and_an_edge_wakes_the_watcher
          an_already_parked_watcher_is_woken_by_a_provider_edge
          a_change_landing_inside_a_capture_is_never_lost
          a_quiet_park_does_not_return_inside_the_wake_bound
          timed_continuity_expiry_publishes_a_wake_and_clears_the_estimate
          a_departed_provider_ages_out_rather_than_being_replaced
          withdrawn_readiness_reads_unknown_and_keeps_the_provider
          one_attestation_yields_two_verdicts_under_two_budgets
          the_query_asks_the_provider_start_bound_it_names
          a_row_never_reports_economics_its_verdict_did_not_use
          independent_wrappers_share_ownership_and_the_last_close_stops_the_refresh
          a_dropped_watch_stops_pinning_the_cadence
          a_slower_raw_holder_survives_the_sdk_watch_release
          an_idle_watch_is_actually_renewed_and_stops_after_the_last_close
          an_unavailable_authority_hides_the_population_and_recovery_restores_it
          a_self_revoked_observer_is_refused_on_existing_and_new_reads
          each_unsupported_request_is_refused_by_its_own_variant
          a_capacity_refused_provider_reads_unknown_and_later_recovers
          a_retracted_provider_leaves_the_next_snapshot_inside_the_floor
          an_expired_announcement_leaves_the_population_and_a_live_one_stays
          the_population_follows_authorization_and_never_widens_past_it
          a_new_signed_estimate_reverses_the_sdk_rank_while_both_stay_ready
          one_view_movement_in_the_capture_spends_a_retry_and_still_answers
          a_continuously_moving_view_refuses_after_the_bound
          a_granted_only_provider_is_never_sensed_and_the_owner_one_is
          a_partial_acquisition_keeps_its_own_state_and_another_owners
          the_population_floor_wakes_a_quiet_parked_consumer
          REQUIRED

      # === the PRODUCTION organization exact-sensing call edge =======
      #
      # Same shape and same reasoning as the gate above: the suite step already ran
      # this binary, one process per test, so this gate verifies that run's
      # result set instead of re-invoking the runner 22 more times. The
      # `<flakyFailure>` rejection matters here in particular — the
      # `.config/nextest.toml` override keeps this binary at `retries = 0`
      # because a retry could turn a lost readiness observation into green,
      # and the checker now enforces that property from the artifact rather
      # than trusting the override to still be there.
      #
      # Feature note: this crate's dev-dependency on net-mesh enables
      # `fixtures`, so this step is NOT a fixtures-off proof. The production
      # path's independence from that feature is the separate lib-only build
      # below, which compiles no dev-dependencies.
      - name: Sensing — organization exact production call edge
        if: ${{ !cancelled() }}
        run: |
          set -uo pipefail
          python3 "$GITHUB_WORKSPACE/.github/scripts/check-witness-results.py" \
            --junit "$RUNNER_TEMP/sdk-suite-junit.xml" \
            --suite org_exact_sensing \
            --min 22 \
            --required-file - <<'REQUIRED'
          the_production_call_lands_on_the_sensed_provider
          the_production_call_follows_the_sensed_rank_between_viable_providers
          a_deadline_below_every_estimate_falls_back_to_the_deterministic_order
          a_provider_discovered_after_the_first_call_enters_the_population
          a_departed_provider_leaves_the_warmed_population
          a_capacity_refused_holder_is_recovered_by_a_later_call
          a_holder_that_dies_after_convergence_is_reacquired
          unknown_services_strand_no_sensing_capacity
          contending_clones_produce_exactly_one_convergence
          within_attempt_narrowing_is_not_certified_as_agreement
          within_attempt_widening_is_not_certified_as_agreement
          a_capped_population_agrees_with_a_wider_expectation
          a_missing_canonical_member_is_recovered_under_an_unchanged_expectation
          a_same_org_grant_only_provider_is_outside_the_sensing_expectation
          live_evidence_stops_vouching_at_a_later_instant
          withdrawn_readiness_reads_unknown_and_plans_deterministically
          an_all_not_ready_population_still_calls_in_the_deterministic_order
          the_binding_owns_the_acquisition_and_the_last_owner_retires_it
          a_refused_mint_binds_inert_and_never_remints
          a_pinned_but_locally_dead_session_is_still_the_sensed_selection
          a_consumer_without_sensing_plans_the_deterministic_order
          the_sdk_sensed_adapter_adds_no_ordering_structure
          REQUIRED

      # The DARK-BOUNDARY fact for the production path: the SDK library builds
      # with net-mesh's `fixtures` feature OFF. `--lib` compiles no
      # dev-dependencies, and the SDK's own `[dependencies]` entry for net-mesh
      # enables no features - so if the sensed call path ever reached a
      # fixtures-gated seam, this step is what fails.
      # The in-crate half of the evidence: the sensed step inside the
      # authority window, the Granted-mode mapping and selection under an
      # actual reordering, and the reconciliation trigger's decision table.
      # Named because a `--lib` run would otherwise absorb a rename silently.
      - name: Sensing — organization exact planning unit witnesses
        if: ${{ !cancelled() }}
        run: |
          set -uo pipefail
          # ONE run of the lib witnesses under this crate's own feature graph
          # (`net cortex fixtures`, `--lib`), then a per-name verdict from its
          # result set. A union filterset alone would be green as long as
          # SOMETHING in it ran — the checker closes that hole by requiring
          # each name to appear exactly once as a PASSED case, which the old
          # five separate runs established at the cost of five build-graph
          # walks.
          # Same workspace-target rule as the suite step above.
          JUNIT="$(cargo metadata --format-version 1 --no-deps \
            | python3 -c 'import json,sys;print(json.load(sys.stdin)["target_directory"])')/nextest/default/junit.xml"
          rm -f "$JUNIT"
          cargo nextest run --color never --no-fail-fast --no-tests=fail \
            --retries 0 --features "net cortex fixtures" --lib \
            -E 'test(=org::tests_call::authority_movement_inside_sensed_planning_is_still_fenced)
                + test(=org::tests_call::the_sensed_adapter_never_ranks_or_prunes_a_granted_candidate)
                + test(=org::tests_call::selection_and_its_errors_follow_the_reordered_list)
                + test(=org::tests_call::the_reconciliation_trigger_certifies_the_installed_demand)
                + test(=org::tests_call::a_refused_wave_paces_but_a_restored_authority_does_not_wait)' \
            || { echo "::error::the OA-6 planning-unit witnesses did not pass"; exit 1; }
          python3 "$GITHUB_WORKSPACE/.github/scripts/check-witness-results.py" \
            --junit "$JUNIT" \
            --min 5 \
            --required-file - <<'REQUIRED'
          org::tests_call::authority_movement_inside_sensed_planning_is_still_fenced
          org::tests_call::the_sensed_adapter_never_ranks_or_prunes_a_granted_candidate
          org::tests_call::selection_and_its_errors_follow_the_reordered_list
          org::tests_call::the_reconciliation_trigger_certifies_the_installed_demand
          org::tests_call::a_refused_wave_paces_but_a_restored_authority_does_not_wait
          REQUIRED

      # === A2A paid admission =======================================
      #
      # Same discipline as the two steps above, same reason: the
      # auto-discovery run has already executed this binary, so this step
      # exists to keep the roster from shrinking silently. The floor is the
      # count the binary reports (`cargo nextest list` lists 43; the floor
      # below is `>= 43`), and the pinned names carry a financial or
      # once-only property outright — cardinality cannot say WHICH witness
      # vanished.
      #
      # `testing` is what gates the journal's `fail_next_write` fault hook,
      # and it is already in the feature list above; without it
      # `a_failed_claim_write_never_launches_and_a_retry_launches_once`
      # cannot inject the failed write it is named for.
      #
      # Two of these carry each other and must both stay:
      # `a_revoked_preflight_with_headers_enters_reconciliation_not_unpaid_rejection`
      # fails if post-payment revocation is rendered as an ordinary unpaid
      # rejection, and
      # `a_revoked_preflight_without_headers_is_an_unpaid_rejection_and_keeps_the_reservation`
      # is the control that keeps the first from passing for a provider that
      # simply reconciles everything.
      - name: A2A — paid admission witnesses
        if: ${{ !cancelled() }}
        run: |
          set -uo pipefail
          FEATURES="net cortex dataforts testing compute nat-traversal port-mapping aggregator tool macros fixtures"
          REQUIRED="
            a_paid_service_refuses_to_start_without_a_gate
            a_paid_service_refuses_to_start_without_a_journal
            a_paid_service_refuses_to_start_without_pricing
            a_free_service_refuses_pricing
            a_free_service_without_a_journal_runs_preflight_on_direct_submit
            a_free_service_without_a_journal_enforces_capacity_on_direct_submit
            prepare_rejects_invalid_oversized_or_unauthorized_briefs_without_reserving
            an_unpaid_submit_to_a_paid_service_is_refused_before_the_executor
            a_bearer_submit_is_refused_binding_required
            a_paid_submit_without_a_reservation_is_refused_before_the_gate
            a_revoked_preflight_with_headers_enters_reconciliation_not_unpaid_rejection
            a_revoked_preflight_without_headers_is_an_unpaid_rejection_and_keeps_the_reservation
            a_gate_denial_keeps_the_reservation_and_a_valid_retry_launches_once
            a_paid_record_resumes_without_a_second_redeem
            a_paid_record_refuses_a_different_quote_header
            every_handler_path_performs_only_its_table_transition
            a_paid_submit_redeems_once_and_runs_once
            an_identical_retry_returns_the_original_task_without_a_second_redeem
            concurrent_identical_submits_converge_on_one_admission
            an_altered_brief_under_the_same_id_is_rejected_before_payment
            a_reused_proof_from_another_peer_is_refused_and_never_launches
            a_retry_after_result_retention_never_relaunches_or_redeems
            a_failed_claim_write_never_launches_and_a_retry_launches_once
            the_owner_outlives_a_running_executor
            another_peer_cannot_read_or_cancel_a_paid_task
            status_cancel_prepare_and_describe_are_uncharged
            a_restart_after_payment_before_claim_surfaces_paid_not_started_and_resumes_once
            a_restart_after_claim_surfaces_outcome_unknown_and_never_reruns
            a_restart_with_a_reconcile_record_keeps_refusing_until_resolved
            legacy_serve_a2a_ignores_the_service_and_revision_fields
          "
          out=$(cargo nextest run --color never --no-fail-fast --no-tests=fail \
                  --retries 0 --features "$FEATURES" --test a2a_paid_admission 2>&1) \
            || { printf '%s\n' "$out"; echo "::error::the WS-C paid admission witnesses did not pass"; exit 1; }
          printf '%s\n' "$out" | tail -3
          listed=$(printf '%s\n' "$out" | grep -cE '^ +(PASS|FAIL)')
          pinned=0
          for required in $REQUIRED; do
            single=$(cargo nextest run --color never --no-fail-fast --no-tests=fail \
                       --retries 0 --features "$FEATURES" --test a2a_paid_admission \
                       -E "test(=$required)" 2>&1) \
              || { printf '%s\n' "$single"; echo "::error::$required did not run and pass as exactly one test"; exit 1; }
            pinned=$((pinned + 1))
          done
          # Floor kept AT the reported count, so `$listed` equals it on a
          # healthy run; `-ge` is what keeps ADDING a witness from tripping
          # the gate, while a lower floor would let a dropped one pass.
          [ "$listed" -ge 43 ] \
            || { echo "::error::expected at least 43 paid admission witnesses executed, saw $listed"; exit 1; }
          echo "A2A paid admission: $listed executed, $pinned pinned by name, all green"

      # === A2A admission journal ====================================
      #
      # The durability half: the lifetime-exclusive `.owner` lock (including
      # the cross-process probe that re-execs this binary), the CAS
      # transition table, the atomic launch claim + ledger write, the three
      # retention classes, and the successor owner's recovery reading. These
      # are what stop a second charge or a second run after a crash, so the
      # roster is pinned rather than left to auto-discovery.
      - name: A2A — admission journal durability
        if: ${{ !cancelled() }}
        run: |
          set -uo pipefail
          FEATURES="net cortex dataforts testing compute nat-traversal port-mapping aggregator tool macros fixtures"
          REQUIRED="
            a_second_owner_is_excluded_after_a_journal_replacement
            a_second_open_in_the_same_process_is_refused
            every_transition_outside_the_table_is_a_conflict
            the_memory_store_and_the_journal_agree_on_the_transition_table
            a_gate_denial_note_does_not_change_state
            claim_launch_writes_the_launched_state_and_the_ledger_atomically
            unresolved_paid_launched_and_reconcile_records_survive_result_retention
            an_unpaid_reservation_is_pruned_after_reservation_retention_only
            a_retired_result_still_answers_ledger_has
            a_failed_write_leaves_the_journal_untouched
            a_successor_owner_surfaces_paid_not_started_and_outcome_unknown_without_relaunching
            capacity_counts_only_in_flight_admissions
          "
          out=$(cargo nextest run --color never --no-fail-fast --no-tests=fail \
                  --retries 0 --features "$FEATURES" --test a2a_admission_journal 2>&1) \
            || { printf '%s\n' "$out"; echo "::error::the WS-C admission journal witnesses did not pass"; exit 1; }
          printf '%s\n' "$out" | tail -3
          listed=$(printf '%s\n' "$out" | grep -cE '^ +(PASS|FAIL)')
          pinned=0
          for required in $REQUIRED; do
            single=$(cargo nextest run --color never --no-fail-fast --no-tests=fail \
                       --retries 0 --features "$FEATURES" --test a2a_admission_journal \
                       -E "test(=$required)" 2>&1) \
              || { printf '%s\n' "$single"; echo "::error::$required did not run and pass as exactly one test"; exit 1; }
            pinned=$((pinned + 1))
          done
          [ "$listed" -ge 12 ] \
            || { echo "::error::expected at least 12 admission journal witnesses executed, saw $listed"; exit 1; }
          echo "A2A admission journal: $listed executed, $pinned pinned by name, all green"

      # Two defects hid behind one symptom: the A2A wire's array-of-bytes
      # envelope quadruples a brief, so one past ~2 KB overflowed a packet and
      # was never delivered — and because `CallOptions::deadline` defaults to
      # `None`, the caller then waited for a reply that could not come. These
      # witnesses pin both halves, and `a_brief_at_the_wire_limit_round_trips`
      # additionally guards the mirrored packet-budget constant: it sends a
      # brief of exactly the limit over a real wire, so a shrinking budget
      # fails here instead of silently losing requests again.
      - name: A2A — call size and deadline bounds
        if: ${{ !cancelled() }}
        run: |
          set -uo pipefail
          FEATURES="net cortex dataforts testing compute nat-traversal port-mapping aggregator tool macros fixtures"
          REQUIRED="
            a_brief_at_the_wire_limit_round_trips
            a_brief_over_the_wire_limit_is_refused_locally_and_never_sent
            a_brief_past_the_packet_cliff_is_refused_instead_of_vanishing
            prepare_refuses_an_over_limit_brief_before_reserving
            a_service_announcing_an_undeliverable_prompt_bound_refuses_to_serve
            a_delivered_request_that_is_never_answered_times_out
            a_healthy_peer_answers_well_inside_the_deadline
          "
          out=$(cargo nextest run --color never --no-fail-fast --no-tests=fail \
                  --retries 0 --features "$FEATURES" --test a2a_call_bounds 2>&1) \
            || { printf '%s\n' "$out"; echo "::error::the A2A call-bounds witnesses did not pass"; exit 1; }
          printf '%s\n' "$out" | tail -3
          listed=$(printf '%s\n' "$out" | grep -cE '^ +(PASS|FAIL)')
          pinned=0
          for required in $REQUIRED; do
            single=$(cargo nextest run --color never --no-fail-fast --no-tests=fail \
                       --retries 0 --features "$FEATURES" --test a2a_call_bounds \
                       -E "test(=$required)" 2>&1) \
              || { printf '%s\n' "$single"; echo "::error::$required did not run and pass as exactly one test"; exit 1; }
            pinned=$((pinned + 1))
          done
          [ "$listed" -ge 14 ] \
            || { echo "::error::expected at least 14 A2A call-bounds witnesses executed, saw $listed"; exit 1; }
          echo "A2A call bounds: $listed executed, $pinned pinned by name, all green"

      # ===================================================================
      # The independent reviewer's counterexample probes.
      #
      # These arrived as a HOLD packet: each row asserts the SAFE behaviour,
      # so a failure reproduces a defect rather than describing one. They are
      # committed verbatim — no assertion in a `review_*` row has been
      # weakened, reworded or retargeted — and they are pinned here because a
      # counterexample that is only ever run by hand stops being a gate the
      # moment someone is busy. They were RED when they landed and are GREEN
      # only because the defects are fixed; if one reddens again, a repair has
      # been undone.
      # ===================================================================
      - name: A2A — reviewer counterexample probes (provider + wire)
        if: ${{ !cancelled() }}
        run: |
          set -uo pipefail
          FEATURES="net cortex dataforts testing compute nat-traversal port-mapping aggregator tool macros fixtures"
          REQUIRED="
            review_distinct_prepares_cannot_overbook_one_slot
            review_stale_financial_transition_rejects_replacement_admission
            review_accepted_description_is_discoverable
            review_short_description_control
          "
          out=$(cargo nextest run --color never --no-fail-fast --no-tests=fail \
                  --retries 0 --features "$FEATURES" \
                  --test review_a2a_provider --test review_a2a_wire 2>&1) \
            || { printf '%s\n' "$out"; echo "::error::a reviewer counterexample probe reddened — a repair has regressed"; exit 1; }
          printf '%s\n' "$out" | tail -3
          listed=$(printf '%s\n' "$out" | grep -cE '^ +(PASS|FAIL)')
          pinned=0
          for required in $REQUIRED; do
            single=$(cargo nextest run --color never --no-fail-fast --no-tests=fail \
                       --retries 0 --features "$FEATURES" \
                       --test review_a2a_provider --test review_a2a_wire \
                       -E "test(=$required)" 2>&1) \
              || { printf '%s\n' "$single"; echo "::error::$required did not run and pass as exactly one test"; exit 1; }
            pinned=$((pinned + 1))
          done
          [ "$listed" -ge 45 ] \
            || { echo "::error::expected at least 45 reviewer provider+wire rows executed, saw $listed"; exit 1; }
          echo "A2A reviewer probes (provider+wire): $listed executed, $pinned pinned by name, all green"

      # The identity/generation repair (reviewer findings R1-R3, R9-R11): a CAS
      # that checked a state TAG where the invariant needs an immutable record
      # IDENTITY. Several of these are the only executed evidence for
      # schedules the reviewer could reach only by source-tracing.
      - name: A2A — admission identity and journal transaction safety
        if: ${{ !cancelled() }}
        run: |
          set -uo pipefail
          FEATURES="net cortex dataforts testing compute nat-traversal port-mapping aggregator tool macros fixtures"
          REQUIRED="
            a_decision_holds_its_capacity_slot_across_an_expiring_reservation
            a_decision_opens_only_on_the_incarnation_it_names
            a_failed_durability_barrier_is_ambiguous_not_untouched
            a_gate_barrier_prune_and_reprepare_cannot_replace_a_deciding_admission
            a_generation_is_never_reused_after_a_prune_and_a_restart
            a_superseded_redemption_is_retained_against_its_own_admission
            an_aborted_mutation_completes_its_write_under_its_own_guards
            concurrent_admissions_of_distinct_tasks_cannot_pass_a_ceiling_of_one
            concurrent_submits_converge_on_the_deciders_retryable_verdict
            two_same_stem_journals_never_share_a_temp_file
            an_installed_org_identity_reaches_a_protected_a2a_lifecycle
            an_installed_org_identity_refuses_an_unauthorized_target_locally
          "
          out=$(cargo nextest run --color never --no-fail-fast --no-tests=fail \
                  --retries 0 --features "$FEATURES" --test a2a_admission_identity 2>&1) \
            || { printf '%s\n' "$out"; echo "::error::the A2A admission identity witnesses did not pass"; exit 1; }
          printf '%s\n' "$out" | tail -3
          listed=$(printf '%s\n' "$out" | grep -cE '^ +(PASS|FAIL)')
          pinned=0
          for required in $REQUIRED; do
            single=$(cargo nextest run --color never --no-fail-fast --no-tests=fail \
                       --retries 0 --features "$FEATURES" --test a2a_admission_identity \
                       -E "test(=$required)" 2>&1) \
              || { printf '%s\n' "$single"; echo "::error::$required did not run and pass as exactly one test"; exit 1; }
            pinned=$((pinned + 1))
          done
          [ "$listed" -ge 15 ] \
            || { echo "::error::expected at least 15 admission identity witnesses executed, saw $listed"; exit 1; }
          echo "A2A admission identity: $listed executed, $pinned pinned by name, all green"

      # The reviewer's SECOND HOLD packet (candidate 0743ca779): C2 stale-clock
      # capacity reacquisition, C3 launch retargeting, C5 ambiguous operator
      # resolution. Committed verbatim, red when they landed, green only
      # because those repairs hold.
      #
      # `review_aborted_startup_writer_cannot_outlive_its_owner` (C4) is
      # DELIBERATELY EXCLUDED and is not a gap in the gate. It only reaches its
      # subject under the reviewer's scheduling overlay
      # (docs/internal/reviews/startup-barrier.patch); run bare it fails its own
      # precondition with "startup reached publication barrier", which she warns
      # against mistaking for the ownership counterexample. Its acceptance is
      # recorded in the round-3 commit: with the barrier alone and NO
      # owner-control patch, it passes — verified by hand, since the production
      # fix moved the patch's context lines. Wiring an overlay-dependent row
      # into CI would mean committing review instrumentation into the product,
      # which the packet explicitly forbids.
      - name: A2A — reviewer repair probes (provider)
        if: ${{ !cancelled() }}
        run: |
          set -uo pipefail
          FEATURES="net cortex dataforts testing compute nat-traversal port-mapping aggregator tool macros fixtures"
          REQUIRED="
            review_pre_pin_stale_clock_cannot_reacquire_an_occupied_slot
            review_operator_replacement_cannot_retarget_a_live_launch
            review_provider_resolution_refuses_ambiguous_incarnations
          "
          SKIP='test(=review_aborted_startup_writer_cannot_outlive_its_owner)'
          out=$(cargo nextest run --color never --no-fail-fast --no-tests=fail \
                  --retries 0 --features "$FEATURES" --test review_repair_provider \
                  -E "not $SKIP" 2>&1) \
            || { printf '%s\n' "$out"; echo "::error::a reviewer repair probe (provider) reddened — a repair has regressed"; exit 1; }
          printf '%s\n' "$out" | tail -3
          listed=$(printf '%s\n' "$out" | grep -cE '^ +(PASS|FAIL)')
          pinned=0
          for required in $REQUIRED; do
            single=$(cargo nextest run --color never --no-fail-fast --no-tests=fail \
                       --retries 0 --features "$FEATURES" --test review_repair_provider \
                       -E "test(=$required)" 2>&1) \
              || { printf '%s\n' "$single"; echo "::error::$required did not run and pass as exactly one test"; exit 1; }
            pinned=$((pinned + 1))
          done
          [ "$listed" -ge 15 ] \
            || { echo "::error::expected at least 15 reviewer provider repair rows executed, saw $listed"; exit 1; }
          echo "A2A reviewer repair probes (provider): $listed executed, $pinned pinned by name, all green"

      # === A2A — reviewer round-4 probes (provider) =========================
      #
      # D1/C2: an older reservation reacquiring its slot must contribute
      # clock-floor evidence, so a competitor re-presenting a pre-expiry
      # sample cannot also acquire and put the service over `max_in_flight`.
      # Paid and free are separate rows because the capacity path differs.
      #
      # Landed byte-identical (sha256 fceb89bda2bd…) and proven
      # discriminating: deleting the single `note_acquisition` call in
      # `open_decision` reddens both with "reacquiring old B did not advance
      # the slot floor, so stale A also acquired".
      - name: A2A — reviewer round-4 probes (provider)
        if: ${{ !cancelled() }}
        run: |
          set -uo pipefail
          REQUIRED="
            review_paid_capacity_survives_old_competitor_reacquisition
            review_free_capacity_survives_old_competitor_reacquisition
          "
          FEATURES="net cortex dataforts testing compute nat-traversal port-mapping aggregator tool macros fixtures"
          out=$(cargo nextest run --color never --no-fail-fast --no-tests=fail \
                  --retries 0 --features "$FEATURES" --test review_round3_provider \
                  -E 'test(review_)' 2>&1) \
            || { printf '%s\n' "$out"; echo "::error::the round-4 provider probes did not pass"; exit 1; }
          printf '%s\n' "$out" | tail -3
          for required in $REQUIRED; do
            printf '%s\n' "$out" | grep -qE "PASS .*$required\$" \
              || { echo "::error::$required did not run and pass"; exit 1; }
          done
          echo "round-4 provider probes: both executed and green"

      # The SDK's `fixtures` feature must mean the same thing STANDALONE as it
      # does inside a workspace dev build: it forwards core's own `fixtures`
      # seam, and a dev-dependency used to hide the missing forwarding. This is
      # the configuration the Go FFI jobs build, and the one that broke.
      - name: Sensing — the fixtures observers build standalone
        if: ${{ !cancelled() }}
        run: cargo check --lib --features "net cortex fixtures"

      - name: Sensing — the production call path needs no fixtures seam
        if: ${{ !cancelled() }}
        run: cargo check --lib --features "net cortex"

      # SDK doctests — `///` examples in `sdk/src/`. nextest does NOT run
      # doctests, so this `cargo test --doc` step is load-bearing, not a
      # duplicate of the step above.
      #
      # The feature set MUST stay identical to that step's. It used to be
      # narrower (no `dataforts`, no `aggregator`) and got away with it only
      # because the old `cargo test` above ran the doctest target itself with
      # the wide set. Under nextest it no longer does, so anything gated on
      # those two would have compiled to nothing and gone silently unverified.
      - name: Run Rust SDK doctests
        if: ${{ !cancelled() }}
        run: cargo test --doc --features "net cortex dataforts testing compute nat-traversal port-mapping aggregator tool macros fixtures"

      # === the streaming-opening fixture authority ======
      # The generator IS the Rust-side conformance verifier for
      # tests/cross_lang_org/streaming_opening_vectors.json (--check:
      # deterministic-regeneration drift guard + all 130 conformance rows;
      # a9178e580's VEC-8/VEC-9 repair regenerated the fixture from
      # `samples()` at 130 and left this pin at 120 -- §23 audit).
      # A fixture that stops regenerating identically or a row that stops
      # conforming fails here — the authority every other runtime consumes.
      - name: streaming-opening fixture authority (cross-lang vectors)
        run: |
          set -o pipefail
          out=$(cargo run -p net-mesh-sdk --features net,cortex,fixtures \
                  --example gen_org_error_fixtures -- --check 2>&1 | tee /dev/stderr)
          printf '%s\n' "$out" | grep -q "== 130 rows, 0 failed" || {
            echo "::error::the streaming-opening fixture authority did not report 130 rows 0 failed"
            exit 1
          }

      # === the SDK's RTC enrollment binary ======================
      #
      # `enrollment_over_rtc` is gated on the SDK's OWN `webrtc` feature,
      # which forwards to `net-mesh/webrtc`. Every step above runs with a
      # feature list that does NOT contain it, so the binary compiled to
      # nothing and CI proved nothing about the SDK's WebRTC surface — the
      # `--no-tests=fail` discipline used everywhere else cannot help when
      # the binary itself is cfg'd out.
      #
      # Both witnesses are pinned by name and must each run and pass as
      # exactly one test:
      #   - a_real_sdk_enrollment_promotes_the_exact_session — the whole
      #     §12 path through the public SDK: raw enrollment service,
      #     provisional install, one permitted call, promotion of that
      #     exact incarnation.
      #   - a_rejected_sdk_enrollment_leaves_the_session_provisional — the
      #     negative half; a refusal admits nothing.
      - name: SDK WebRTC enrollment
        if: ${{ !cancelled() }}
        run: |
          set -uo pipefail
          FEATURES="net webrtc"
          REQUIRED="
            a_real_sdk_enrollment_promotes_the_exact_session
            a_rejected_sdk_enrollment_leaves_the_session_provisional
          "
          out=$(cargo nextest run --color never --no-fail-fast --no-tests=fail \
                  --retries 0 --features "$FEATURES" --test enrollment_over_rtc 2>&1) \
            || { printf '%s\n' "$out"; echo "::error::the SDK RTC enrollment witnesses did not pass"; exit 1; }
          printf '%s\n' "$out" | tail -3
          for required in $REQUIRED; do
            single=$(cargo nextest run --color never --no-fail-fast --no-tests=fail \
                       --retries 0 --features "$FEATURES" --test enrollment_over_rtc \
                       -E "test(=$required)" 2>&1) \
              || { printf '%s\n' "$single"; echo "::error::$required did not run and pass as exactly one test"; exit 1; }
          done
          echo "SDK RTC enrollment: both witnesses green"

      # === the bootstrap listener's witnesses ===================
      #
      # `rtc_bootstrap_listener` needs the SDK's `rtc-bootstrap`
      # feature (axum + rustls), which no other step turns on, so
      # without this step the whole binary compiles to nothing —
      # the same silent-skip hazard the RTC step above exists for.
      #
      # The six `kyra_*` names are the review's probes,
      # landed verbatim. They reproduced 0/6 before the repairs and
      # are pinned individually: a repair that regresses must fail
      # here by name, not shrink the roster.
      - name: SDK bootstrap listener
        if: ${{ !cancelled() }}
        run: |
          set -uo pipefail
          FEATURES="rtc-bootstrap"
          REQUIRED="
            kyra_uncredentialed_websocket_cannot_retire_another_offer
            kyra_bootstrap_candidates_must_keep_the_native_size_bound
            kyra_bootstrap_candidates_must_keep_the_native_frame_budget
            kyra_expired_credential_holder_cannot_extend_its_own_deadlines
            kyra_acme_cache_must_match_the_requested_domain
            kyra_offer_debug_must_not_expose_the_encoded_credential
            an_http_offer_reaches_the_production_dialog_path_and_is_answered
            the_listener_serves_browser_trusted_tls_and_a_client_verifies_it
            the_trickle_socket_refuses_a_foreign_origin_before_upgrading
          "
          out=$(cargo nextest run --color never --no-fail-fast --no-tests=fail \
                  --retries 0 --features "$FEATURES" --test rtc_bootstrap_listener \
                  --test bootstrap_dep_boundary 2>&1) \
            || { printf '%s\n' "$out"; echo "::error::the Stage 4b listener witnesses did not pass"; exit 1; }
          printf '%s\n' "$out" | tail -3
          for required in $REQUIRED; do
            single=$(cargo nextest run --color never --no-fail-fast --no-tests=fail \
                       --retries 0 --features "$FEATURES" --test rtc_bootstrap_listener \
                       -E "test(=$required)" 2>&1) \
              || { printf '%s\n' "$single"; echo "::error::$required did not run and pass as exactly one test"; exit 1; }
          done
          echo "Stage 4b listener: all pinned witnesses green"

      # The listener step above selects INTEGRATION tests only, and the
      # main SDK suite's feature list has no `rtc-bootstrap` — so the
      # library witnesses that live inside `sdk/src` (the ACME cache
      # qualification, the private key's protection check, the renewal
      # horizon) were compiled out of every job. On Linux the Unix
      # branch of that protection check is real code, which is exactly
      # where it has to run.
      - name: SDK library witnesses under rtc-bootstrap
        if: ${{ !cancelled() }}
        run: |
          set -uo pipefail
          REQUIRED="
            rtc_bootstrap_acme::tests::a_key_that_fails_its_protection_check_is_an_error_and_is_removed
            rtc_bootstrap_acme::tests::the_private_key_is_created_0600_and_a_wrong_mode_is_fatal
            rtc_bootstrap_acme::tests::a_certificate_that_is_not_valid_yet_is_not_served
            rtc_bootstrap_acme::tests::a_matching_common_name_cannot_override_a_wrong_san
            rtc_bootstrap_acme::tests::a_failed_publication_leaves_the_previous_pair_intact
            rtc_bootstrap_acme::tests::a_cached_pair_is_reused_only_when_it_qualifies
          "
          out=$(cargo nextest run --color never --no-fail-fast --no-tests=fail \
                  --retries 0 --features rtc-bootstrap --lib 2>&1) \
            || { printf '%s\n' "$out"; echo "::error::the SDK library witnesses did not pass"; exit 1; }
          printf '%s\n' "$out" | tail -3
          for required in $REQUIRED; do
            single=$(cargo nextest run --color never --no-fail-fast --no-tests=fail \
                       --retries 0 --features rtc-bootstrap --lib \
                       -E "test(=$required)" 2>&1) \
              || { printf '%s\n' "$single"; echo "::error::$required did not run and pass as exactly one test"; exit 1; }
          done
          echo "Stage 4b SDK library witnesses: green, with the Unix protection branch compiled"

      # The SDK's `webrtc` surface under the same lint bar as the rest of
      # the crate, and its rustdoc — neither was reachable from any step's
      # feature list before that step.
      - name: Lint and document the SDK's WebRTC surface
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          cargo clippy --features "net webrtc" --lib -- -D warnings
          RUSTDOCFLAGS="-D warnings" cargo doc -p net-mesh-sdk --no-deps --features "net webrtc"

      # net-payments — x402 envelope model unit tests plus
      # `payments_golden_vectors`, the Rust source-of-truth verifier for
      # `tests/cross_lang_payments/` (the Node / Python / Go verifiers run
      # in their own jobs off the same fixture; see the fixture README).
      # Rides this job to share the sdk cargo cache — the crate depends on
      # net-mesh + net-mesh-sdk, both already built here. `--all-features`
      # turns on `mcp-gate`, whose composition tests drive the real
      # `gated_invoke` payment gate end to end — without it they compile
      # to an empty test binary and the WS4 contract goes unverified.
      # TWO EXCLUSIONS, both named, neither a weakened assertion.
      #
      #   * `review_seed_python_history` is not a test. It is the fixture the
      #     C5 Python witness shells out to, and it requires
      #     `NET_REVIEW_PURCHASE_PATH` to point at a throwaway store. Run bare
      #     by this auto-discovering sweep it fails on the missing variable,
      #     which says nothing about the product. The Python job builds and
      #     drives it for real.
      #
      #   * `review_round3_caller`'s NON-`review_` tests are the reviewer's
      #     vendored copies of our own round-3 tests, snapshotted BEFORE the
      #     D3 repair. D3 was her own requirement — keep the operator's opaque
      #     document whole inside an outer envelope instead of writing
      #     generated fields into it — so the evidence shape those copies pin
      #     is exactly the shape she asked us to change. The live counterparts
      #     in `a2a_caller_identity` were updated with the repair and are
      #     gated below. Her file stays byte-identical; the filter is her own
      #     documented one, `test(review_)`.
      - name: Run net-payments tests (includes payments_golden_vectors + mcp_gate_composition)
        if: ${{ !cancelled() }}
        working-directory: net/crates/net/payments
        run: |
          cargo nextest run --no-fail-fast --no-tests=fail --all-features \
            -E 'not test(=review_seed_python_history)
                and not (binary(review_round3_caller) and not test(review_))'

      # === A2A — reviewer round-4 probes (caller) ===========================
      #
      # D2, D3 and D4 from the fourth review packet, landed byte-identical
      # (sha256 841fdf242db6…). Pinned by name because each one is the only
      # executed evidence for its finding, and each was proven discriminating
      # by reverting the production change and watching it redden:
      #
      #   D2  a live operator disposition is inherited by late settlement,
      #       rather than minting a second unresolved item for one charge
      #   D3  generated late evidence never overwrites operator-owned JSON
      #   D4  a prior-format persisted archive is still exactly addressable
      #
      # Filtered to `test(review_)`, which is the reviewer's own documented
      # command — see the exclusion note on the sweep above for why the
      # vendored non-`review_` copies in this binary are not run.
      - name: A2A — reviewer round-4 probes (caller)
        if: ${{ !cancelled() }}
        working-directory: net/crates/net/payments
        run: |
          set -uo pipefail
          REQUIRED="
            review_late_settlement_preserves_a_live_operator_disposition
            review_late_settlement_preserves_arbitrary_operator_evidence
            review_prior_format_archive_is_still_exactly_addressable
          "
          out=$(cargo nextest run --color never --no-fail-fast --no-tests=fail \
                  --retries 0 --all-features \
                  -E 'binary(review_round3_caller) and test(review_)' 2>&1) \
            || { printf '%s\n' "$out"; echo "::error::the round-4 caller probes did not pass"; exit 1; }
          printf '%s\n' "$out" | tail -3
          for required in $REQUIRED; do
            printf '%s\n' "$out" | grep -qE "PASS .*$required\$" \
              || { echo "::error::$required did not run and pass"; exit 1; }
          done
          echo "round-4 caller probes: all 3 executed and green"

      # === A2A — reviewer round-4b probe (disposition inheritance) ==========
      #
      # The re-review of the round-4 repair found D2 half-closed: the
      # archive-ABSENT branch consumed the live operator disposition, the
      # archive-EXISTING branch dropped it. Which one late evidence meets is
      # only an ordering accident — whether the archive was created before or
      # after the operator resolved the live row — so the same charge came out
      # `Resolved` or `PaidUnexecutable` depending on scheduling.
      #
      # Landed byte-identical (sha256 8758f47dc61a29e5…). Proven
      # discriminating: forcing `inherit = false` in the existing-archive
      # branch reddens it with "existing archive bypassed the live disposition
      # of the same charge", left `PaidUnexecutable`, right `Resolved`.
      #
      # No exclusion needed here: all 16 tests in this binary pass, so the
      # whole file runs rather than a filtered subset.
      - name: A2A — reviewer round-4b probe (disposition inheritance)
        if: ${{ !cancelled() }}
        working-directory: net/crates/net/payments
        run: |
          set -uo pipefail
          required=review_existing_archive_inherits_live_disposition_on_late_success
          out=$(cargo nextest run --color never --no-fail-fast --no-tests=fail \
                  --retries 0 --all-features -E 'binary(review_round4_disposition)' 2>&1) \
            || { printf '%s\n' "$out"; echo "::error::the round-4b disposition probe did not pass"; exit 1; }
          printf '%s\n' "$out" | tail -3
          printf '%s\n' "$out" | grep -qE "PASS .*$required\$" \
            || { echo "::error::$required did not run and pass"; exit 1; }
          listed=$(printf '%s\n' "$out" | grep -cE '^ +(PASS|FAIL)')
          [ "$listed" -ge 16 ] \
            || { echo "::error::expected at least 16 rows in review_round4_disposition, saw $listed"; exit 1; }
          echo "round-4b disposition probe: $listed executed, the named one green"

      # === A2A caller purchase + task redeem =========================
      #
      # The step above ran both binaries by auto-discovery. These two exist so
      # the roster cannot shrink silently, and because this is the money half:
      # one authoritative attempt per intent key, a lost reply resumed rather
      # than re-quoted, an exposed refusal that is NOT proof of
      # non-settlement, and a redemption bound to one reservation of one
      # brief.
      #
      # Floors are the counts the binaries report (`cargo nextest list` said
      # 22 and 6 when they landed), kept AT that count for the reason the
      # sibling SDK steps give.
      #
      # Two pairs carry each other:
      # `an_exposed_bearer_refusal_keeps_the_spend_reservation_and_marks_the_attempt_ambiguous`
      # and `an_unexposed_refusal_releases_and_may_prepare_again` — without
      # the second, the first passes for an implementation that treats every
      # refusal as ambiguous and never lets a caller retry;
      # `redeem_for_task_is_idempotent_for_the_same_purchase_hash` and
      # `a_second_purchase_hash_on_a_redeemed_quote_is_already_redeemed` —
      # without the second, the first passes for a quote that is infinitely
      # redeemable.
      #
      # `-E 'binary(NAME)'` and NOT `--test NAME`, deliberately: the
      # "Integration test pin guard" job attributes every `--test <name>`
      # pin to a crate and inventories only the ROOT crate and the SDK, so a
      # `--test` pin under this step's `working-directory` resolves to
      # `dir:net/crates/net/payments`, which that guard refuses rather than
      # guesses at — a hard failure on a pin that is perfectly correct. A
      # filterset carries no `--test` token, and `--no-tests=fail` is the
      # stronger guarantee anyway: a `binary()` that matches nothing FAILS
      # here at run time, where the guard's check is only lexical.
      - name: A2A — caller purchase store witnesses
        if: ${{ !cancelled() }}
        working-directory: net/crates/net/payments
        run: |
          set -uo pipefail
          REQUIRED="
            prepare_task_moves_no_money_and_reserves_no_spend
            purchase_consumes_the_prepared_quote_not_a_fresh_one
            purchase_never_requotes_while_an_attempt_is_unresolved
            a_lost_pay_reply_is_resumed_by_resending_the_identical_payload
            a_pending_settlement_purchase_stays_unknown_then_resolves_to_paid
            unknown_recovers_automatically_through_the_stored_payment_never_a_new_quote
            a_caller_restart_mid_purchase_resumes_the_stored_attempt
            an_expired_unpaid_quote_is_requoted_only_through_prepare_with_the_same_admission_id
            an_expired_awaiting_approval_quote_requires_fresh_approval_after_reprepare
            an_operator_rejection_of_a_held_quote_is_an_unexposed_refusal
            concurrent_prepares_converge_on_one_quote
            concurrent_purchases_send_one_payload
            a_conflicting_commitment_under_the_same_key_is_rejected
            a_stale_preparing_lease_is_taken_over_and_a_live_one_is_not
            two_processes_share_one_attempt
            an_exposed_bearer_refusal_keeps_the_spend_reservation_and_marks_the_attempt_ambiguous
            an_unexposed_refusal_releases_and_may_prepare_again
            every_caller_transition_outside_the_table_is_a_conflict
            a_late_paid_submit_becomes_paid_unexecutable_and_keeps_its_evidence
            a_retryable_submit_refusal_keeps_the_attempt_paid
            unresolved_financial_attempts_are_never_pruned
            the_task_gate_refuses_a_proof_bought_for_another_reservation
          "
          out=$(cargo nextest run --color never --no-fail-fast --no-tests=fail \
                  --retries 0 --all-features -E 'binary(a2a_caller_purchase)' 2>&1) \
            || { printf '%s\n' "$out"; echo "::error::the WS-B caller purchase witnesses did not pass"; exit 1; }
          printf '%s\n' "$out" | tail -3
          listed=$(printf '%s\n' "$out" | grep -cE '^ +(PASS|FAIL)')
          pinned=0
          for required in $REQUIRED; do
            single=$(cargo nextest run --color never --no-fail-fast --no-tests=fail \
                       --retries 0 --all-features \
                       -E "binary(a2a_caller_purchase) and test(=$required)" 2>&1) \
              || { printf '%s\n' "$single"; echo "::error::$required did not run and pass as exactly one test"; exit 1; }
            pinned=$((pinned + 1))
          done
          [ "$listed" -ge 23 ] \
            || { echo "::error::expected at least 23 caller purchase witnesses executed, saw $listed"; exit 1; }
          echo "A2A caller purchase: $listed executed, $pinned pinned by name, all green"

      - name: A2A — task redeem witnesses
        if: ${{ !cancelled() }}
        working-directory: net/crates/net/payments
        run: |
          set -uo pipefail
          REQUIRED="
            a_quote_carries_the_purchase_hash_into_its_id
            redeem_for_task_refuses_a_mismatched_purchase_hash
            redeem_for_task_is_idempotent_for_the_same_purchase_hash
            a_second_purchase_hash_on_a_redeemed_quote_is_already_redeemed
            a_bearer_task_redeem_is_binding_required_even_when_the_engine_allows_bearer_tools
            an_approved_quote_resumes_only_for_its_own_purchase_hash
          "
          out=$(cargo nextest run --color never --no-fail-fast --no-tests=fail \
                  --retries 0 --all-features -E 'binary(a2a_task_redeem)' 2>&1) \
            || { printf '%s\n' "$out"; echo "::error::the WS-B task redeem witnesses did not pass"; exit 1; }
          printf '%s\n' "$out" | tail -3
          listed=$(printf '%s\n' "$out" | grep -cE '^ +(PASS|FAIL)')
          pinned=0
          for required in $REQUIRED; do
            single=$(cargo nextest run --color never --no-fail-fast --no-tests=fail \
                       --retries 0 --all-features \
                       -E "binary(a2a_task_redeem) and test(=$required)" 2>&1) \
              || { printf '%s\n' "$single"; echo "::error::$required did not run and pass as exactly one test"; exit 1; }
            pinned=$((pinned + 1))
          done
          [ "$listed" -ge 6 ] \
            || { echo "::error::expected at least 6 task redeem witnesses executed, saw $listed"; exit 1; }
          echo "A2A task redeem: $listed executed, $pinned pinned by name, all green"

      # The payment channel's own deadline. Both verbs were built with
      # `Default::default()`, i.e. no deadline, so a request delivered to a
      # live `net.payments.pay.v1` whose handler never replied parked the
      # caller forever — the worst possible place for an unbounded wait, since
      # the payload has already left the process and the ambiguity can never
      # be recorded. The witness stages a genuinely wedged handler (an
      # unserved service fails fast with no-route instead, which is NOT the
      # defect) and requires a retryable verdict, which is what drives a
      # durable attempt to `Unknown` rather than to a false "did not happen".
      - name: A2A — payment channel deadline
        if: ${{ !cancelled() }}
        working-directory: net/crates/net/payments
        run: |
          set -uo pipefail
          REQUIRED="
            an_unanswered_pay_times_out_retryably_instead_of_hanging
            a_responsive_provider_answers_well_inside_the_deadline
          "
          out=$(cargo nextest run --color never --no-fail-fast --no-tests=fail \
                  --retries 0 --all-features -E 'binary(payment_channel_deadline)' 2>&1) \
            || { printf '%s\n' "$out"; echo "::error::the payment channel deadline witnesses did not pass"; exit 1; }
          printf '%s\n' "$out" | tail -3
          listed=$(printf '%s\n' "$out" | grep -cE '^ +(PASS|FAIL)')
          pinned=0
          for required in $REQUIRED; do
            single=$(cargo nextest run --color never --no-fail-fast --no-tests=fail \
                       --retries 0 --all-features \
                       -E "binary(payment_channel_deadline) and test(=$required)" 2>&1) \
              || { printf '%s\n' "$single"; echo "::error::$required did not run and pass as exactly one test"; exit 1; }
            pinned=$((pinned + 1))
          done
          [ "$listed" -ge 2 ] \
            || { echo "::error::expected at least 2 payment channel deadline witnesses executed, saw $listed"; exit 1; }
          echo "A2A payment channel deadline: $listed executed, $pinned pinned by name, all green"

      # The reviewer's caller-side counterexamples, same standing as the
      # provider pair above: committed verbatim, red when they landed, green
      # only because R1/R4/R5/R6/R7 are fixed. `a_lost_pay_reply_is_resumed_
      # by_resending_the_identical_payload` is her CONTROL — it passed before
      # any repair, so it is pinned to catch a "fix" that breaks the ordinary
      # lost-reply path while satisfying the counterexamples.
      - name: A2A — reviewer counterexample probes (caller)
        if: ${{ !cancelled() }}
        working-directory: net/crates/net/payments
        run: |
          set -uo pipefail
          REQUIRED="
            review_stale_signer_cannot_pay_unapproved_replacement_quote
            review_wrong_input_hash_is_refused_before_payment
            review_paying_survives_retention
            review_lost_reply_recovers_after_quote_expiry
            review_redeem_recovery_survives_engine_retention
            a_lost_pay_reply_is_resumed_by_resending_the_identical_payload
          "
          out=$(cargo nextest run --color never --no-fail-fast --no-tests=fail \
                  --retries 0 --all-features -E 'binary(review_a2a_caller)' 2>&1) \
            || { printf '%s\n' "$out"; echo "::error::a reviewer caller counterexample reddened — a repair has regressed"; exit 1; }
          printf '%s\n' "$out" | tail -3
          listed=$(printf '%s\n' "$out" | grep -cE '^ +(PASS|FAIL)')
          pinned=0
          for required in $REQUIRED; do
            single=$(cargo nextest run --color never --no-fail-fast --no-tests=fail \
                       --retries 0 --all-features \
                       -E "binary(review_a2a_caller) and test(=$required)" 2>&1) \
              || { printf '%s\n' "$single"; echo "::error::$required did not run and pass as exactly one test"; exit 1; }
            pinned=$((pinned + 1))
          done
          [ "$listed" -ge 27 ] \
            || { echo "::error::expected at least 27 reviewer caller rows executed, saw $listed"; exit 1; }
          echo "A2A reviewer probes (caller): $listed executed, $pinned pinned by name, all green"

      # The reviewer's SECOND HOLD packet, caller side: C1 an expired retry
      # declaring a settlement-in-flight unpaid, C6 archive keys colliding with
      # live task ids, C7 late ambiguity erasing retained settlement.
      # `a_later_authoritative_success_survives_a_duplicates_ambiguity` is her
      # control from round 1 — it passed before these repairs and is pinned so a
      # C1 "fix" cannot break the ordinary Unknown-to-Paid convergence while
      # satisfying the new rows.
      - name: A2A — reviewer repair probes (caller)
        if: ${{ !cancelled() }}
        working-directory: net/crates/net/payments
        run: |
          set -uo pipefail
          REQUIRED="
            review_expired_in_flight_payment_is_not_proven_unpaid
            review_superseded_key_cannot_overwrite_a_live_purchase
            review_retained_success_cannot_be_downgraded_by_late_ambiguity
            a_later_authoritative_success_survives_a_duplicates_ambiguity
          "
          out=$(cargo nextest run --color never --no-fail-fast --no-tests=fail \
                  --retries 0 --all-features -E 'binary(review_repair_expiry)' 2>&1) \
            || { printf '%s\n' "$out"; echo "::error::a reviewer repair probe (caller) reddened — a repair has regressed"; exit 1; }
          printf '%s\n' "$out" | tail -3
          listed=$(printf '%s\n' "$out" | grep -cE '^ +(PASS|FAIL)')
          pinned=0
          for required in $REQUIRED; do
            single=$(cargo nextest run --color never --no-fail-fast --no-tests=fail \
                       --retries 0 --all-features \
                       -E "binary(review_repair_expiry) and test(=$required)" 2>&1) \
              || { printf '%s\n' "$single"; echo "::error::$required did not run and pass as exactly one test"; exit 1; }
            pinned=$((pinned + 1))
          done
          [ "$listed" -ge 12 ] \
            || { echo "::error::expected at least 12 reviewer caller repair rows executed, saw $listed"; exit 1; }
          echo "A2A reviewer repair probes (caller): $listed executed, $pinned pinned by name, all green"

      # The caller half of the identity repair, plus the retention/recovery
      # witnesses the reviewer asked for by name (a real in-flight payment
      # surviving caller death and retention; a settled-but-superseded charge
      # retained against its own incarnation).
      - name: A2A — caller attempt identity and recovery
        if: ${{ !cancelled() }}
        working-directory: net/crates/net/payments
        run: |
          set -uo pipefail
          REQUIRED="
            a_settled_purchase_whose_key_was_recreated_is_retained_for_reconciliation
            a_defaulted_generation_matches_only_the_row_it_was_read_from
            a_quote_bound_to_another_purchase_is_refused_before_payment
            a_correctly_bound_quote_is_purchased_and_redeemed
            an_unstructured_rejected_ack_does_not_strand_a_paid_purchase
            concurrent_submitters_of_a_retryable_refusal_both_keep_the_purchase_paid
            a_later_authoritative_success_survives_a_duplicates_ambiguity
            a_retired_paid_submit_is_terminal_with_its_evidence_kept
            an_exposed_payment_survives_caller_death_and_retention
          "
          out=$(cargo nextest run --color never --no-fail-fast --no-tests=fail \
                  --retries 0 --all-features -E 'binary(a2a_caller_identity)' 2>&1) \
            || { printf '%s\n' "$out"; echo "::error::the A2A caller identity witnesses did not pass"; exit 1; }
          printf '%s\n' "$out" | tail -3
          listed=$(printf '%s\n' "$out" | grep -cE '^ +(PASS|FAIL)')
          pinned=0
          for required in $REQUIRED; do
            single=$(cargo nextest run --color never --no-fail-fast --no-tests=fail \
                       --retries 0 --all-features \
                       -E "binary(a2a_caller_identity) and test(=$required)" 2>&1) \
              || { printf '%s\n' "$single"; echo "::error::$required did not run and pass as exactly one test"; exit 1; }
            pinned=$((pinned + 1))
          done
          [ "$listed" -ge 15 ] \
            || { echo "::error::expected at least 15 caller identity witnesses executed, saw $listed"; exit 1; }
          echo "A2A caller identity: $listed executed, $pinned pinned by name, all green"

      # === A2A paid end to end ======================================
      #
      # The whole slice against the REAL engine rather than a scripted gate:
      # provider = `PaymentEngine` + mock facilitator + the engine-backed
      # admission gate + a journal; requester = the caller flow over a mesh
      # payment channel + spend policy + purchase store. It is the only
      # binary here where a "one charge, one run" claim is made end to end,
      # which is why it is named rather than left to auto-discovery.
      #
      # Floor 6 is the count the binary reports (`6 tests run: 6 passed`).
      # All six are platform-independent (loopback UDP + tempdirs).
      - name: A2A — paid end to end with the real engine
        if: ${{ !cancelled() }}
        working-directory: net/crates/net/payments
        run: |
          set -uo pipefail
          REQUIRED="
            prepare_then_purchase_then_submit_runs_the_task_once
            a_pending_approval_resumes_after_approve_payment_for_the_same_purchase_only
            a_lost_pay_reply_is_reconciled_without_a_second_quote_or_charge
            a_lost_submit_reply_is_reconciled_by_resubmitting_the_same_proof
            a_provider_restart_between_redeem_and_claim_reconciles_the_original_payment
            a_caller_restart_between_pay_and_submit_resumes_from_the_purchase_store
          "
          out=$(cargo nextest run --color never --no-fail-fast --no-tests=fail \
                  --retries 0 --all-features -E 'binary(a2a_paid_end_to_end)' 2>&1) \
            || { printf '%s\n' "$out"; echo "::error::the WS-D end-to-end witnesses did not pass"; exit 1; }
          printf '%s\n' "$out" | tail -3
          listed=$(printf '%s\n' "$out" | grep -cE '^ +(PASS|FAIL)')
          pinned=0
          for required in $REQUIRED; do
            single=$(cargo nextest run --color never --no-fail-fast --no-tests=fail \
                       --retries 0 --all-features \
                       -E "binary(a2a_paid_end_to_end) and test(=$required)" 2>&1) \
              || { printf '%s\n' "$single"; echo "::error::$required did not run and pass as exactly one test"; exit 1; }
            pinned=$((pinned + 1))
          done
          [ "$listed" -ge 6 ] \
            || { echo "::error::expected at least 6 end-to-end witnesses executed, saw $listed"; exit 1; }
          echo "A2A paid end to end: $listed executed, $pinned pinned by name, all green"

      # Same reason as the SDK doctest step: nextest does not run doctests, and
      # the `cargo test --all-features` this replaced was running net-payments'
      # `///` examples as a side effect. Without this they stop being gated.
      - name: Run net-payments doctests
        if: ${{ !cancelled() }}
        working-directory: net/crates/net/payments
        run: cargo test --doc --all-features

  # net-payments benchmark-rot gate: compile (do not run) every bench so a
  # harness/API drift breaks CI, not the next person to run numbers.
  # See docs/internal/plans/PAYMENTS_BENCHMARKS_PLAN.md. `--no-run` means no
  # measurement, just typeck + link.
  #
  # Split out of `rust-sdk-tests`, where it was 696 of that job's 1140 seconds
  # — 61% of the wall clock of a job whose actual tests take ~64s — and sat on
  # the critical path for a gate that shares nothing with the SDK suite.
  #
  # It was also SEVEN cargo invocations, and the last one flipped `--features
  # mesh`, which re-fingerprints the crate and forces a fresh compile of the
  # payments tree. Collapsed to two, which is the floor:
  #
  #   * `--benches` selects every bench target in one pass, and silently skips
  #     the ones whose `required-features` are unmet — which is exactly
  #     `mesh_paid_invoke`. It also replaces the hand-maintained list of six
  #     `--bench <name>` flags, so a NEW bench is gated the day it lands
  #     instead of the day someone remembers to add it here. (It does pull the
  #     lib in as a bench harness too; that is one small extra artifact and
  #     worth the auto-discovery.)
  #   * The second invocation is the only one that needs `mesh`.
  #
  # Keeping the first invocation featureless is deliberate — it is what proves
  # the other benches have not silently acquired a dependency on `mesh`.
  # Folding everything into a single `--features mesh` build would be one
  # compile instead of two, and would retire that proof.
  payments-bench-compile:
    name: net-payments bench compile gate
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: net/crates/net/payments
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: payments-bench
          workspaces: net/crates/net -> target

      - name: Compile net-payments benches (--no-run)
        run: |
          cargo bench --benches --no-run
          cargo bench --features mesh --bench mesh_paid_invoke --no-run

  node-tests:
    name: Node bindings tests (vitest)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: net/crates/net/bindings/node
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: node
          workspaces: net/crates/net -> target

      - name: Install npm dependencies
        run: npm i

      # Build napi binding with the features the vitest suite covers:
      # `net` for the mesh surface + `nat-traversal` for the
      # `traversalStats` / `connectDirectAuto` surface (stage 5 —
      # `traversal_stats.test.ts`; the impl block is `#[cfg]`-gated on
      # this feature, so omitting it compiles those methods out and the
      # test hits `traversalStats is not a function`) + `cortex` for the
      # CortEX / NetDB tests + `compute` for the MeshDaemon / migration
      # tests + `groups` for the `ReplicaGroup` / `ForkGroup` /
      # `StandbyGroup` tests (Stages 3 + 4 of `SDK_COMPUTE_SURFACE_PLAN`
      # and `SDK_GROUPS_SURFACE_PLAN`) + `test-helpers` so
      # `_testInjectSyntheticPeer` is exported for the group-placement
      # fixtures.
      #
      # `cortex` transitively enables redex + netdb via the binding's
      # feature graph. Skip the `redis` default — the Node suite
      # doesn't hit it, and pulling it in would need a service
      # container.
      #
      # Invoke napi directly (not `npm run build:test`) so we can pass
      # `--no-default-features` to suppress `redis`; the package.json
      # scripts bake `redis` in for consumers who want the full
      # surface from source. NOTE: `--no-default-features` means every
      # feature the suite needs must be listed explicitly here — the
      # crate default set (which includes `nat-traversal`) is NOT active.
      - name: Build native module
        working-directory: net/crates/net/bindings/node
        run: npx napi build --platform --no-default-features --features net,nat-traversal,cortex,compute,groups,meshos,deck,meshdb,aggregator,tool,consent,mcp,publish,payments,payments-http,delegation,a2a,org,test-helpers

      # Compile the sibling .ts shims (meshdb.ts, mesh_rpc.ts, errors.ts,
      # tool.ts, …) into the CJS `.js` + `.d.ts` pair consumers
      # `require()`. `napi build` only produces the native `.node`
      # artifact; the AsyncIterable shim that augments MeshQueryStream is
      # plain TS that needs its own tsc pass.
      #
      # This is a BUILD step, not a test prerequisite. It used to be both:
      # vitest resolved `../tool` to the compiled `tool.js` before the
      # `tool.ts` beside it, so the suite tested whatever this step last
      # emitted. `vitest.config.ts` now prefers `.ts`, so the tests read
      # the sources and a stale artifact can no longer pass for a fresh
      # one. Keep the step — it still has to compile, and `noEmitOnError`
      # means a type error here is a red job.
      - name: Build TypeScript shims
        working-directory: net/crates/net/bindings/node
        run: npm run build:ts

      - name: Run tests
        run: npm test

      # === the Node org facade witnesses ==
      # The vitest run above EXECUTED these; this step PINS them (a witness
      # must not disappear silently): lexical name-existence, fail-closed,
      # over the two test files (vitest names are literal `it(...)` strings).
      # Floor/roster: 16 (12 in org_live + 3 in mesh_rpc_live + 1 in
      # consumer_compile); extended in the same commit as new witnesses.
      # The §23 audit added the NODE-3 breadth: the org server-stream and
      # client-stream forced-drop witnesses and the three public-bridge ones.
      - name: Witness roster — Node org facade (16)
        working-directory: ${{ github.workspace }}
        run: |
          set -uo pipefail
          python3 "$GITHUB_WORKSPACE/.github/scripts/check-roster.py" --label org_live.test --mode literal \
            --source net/crates/net/bindings/node/test/org_live.test.ts \
            live_same_org_streaming_call_and_serve \
            live_same_org_client_stream_call_and_serve \
            live_same_org_duplex_call_and_serve \
            a_stream_call_against_a_unary_only_provider_is_refused_not_supported \
            midstream_outcomes_route_through_classify_org_error \
            forced_drop_releases_both_handler_handles_promptly \
            forced_drop_releases_the_org_server_stream_sink_promptly \
            forced_drop_releases_the_org_client_stream_requests_promptly \
            live_granted_streaming_call_and_serve \
            live_granted_client_stream_call_and_serve \
            live_granted_duplex_call_and_serve \
            closing_client_and_serve_handle_lets_both_meshes_shut_down_cleanly || exit 1
          python3 "$GITHUB_WORKSPACE/.github/scripts/check-roster.py" --label mesh_rpc_live.test --mode literal \
            --source net/crates/net/bindings/node/test/mesh_rpc_live.test.ts \
            server_streaming_forced_drop_releases_the_sink \
            client_streaming_forced_drop_releases_the_request_stream \
            duplex_forced_drop_releases_both_handles || exit 1
          python3 "$GITHUB_WORKSPACE/.github/scripts/check-roster.py" --label consumer_compile.test --mode literal \
            --source net/crates/net/bindings/node/test/consumer_compile.test.ts \
            a_consumer_program_compiles_against_the_shipped_org_surface || exit 1

      # === the Node cross-language vectors rows =========
      # The npm test run above EXECUTED these 119 rows; this step runs the
      # file scoped (it is native-free) and PINS it: the count floor + the
      # structural roster (the describe, the seven it.each family anchors,
      # the three standalone names), fail-closed.
      - name: Witness roster + floor — Node cross-lang vectors (119)
        working-directory: net/crates/net/bindings/node
        run: |
          set -o pipefail
          python3 "$GITHUB_WORKSPACE/.github/scripts/check-roster.py" --label org_streaming_opening_vectors --mode text \
            --source test/org_streaming_opening_vectors.test.ts \
            'org streaming opening vectors (cross-language fixture)' \
            'loads the fixture with the expected shape' \
            'it.each(byteRows)' \
            'it.each(callerRows)' \
            'it.each(providerRows)' \
            'it.each(rejectRows)' \
            'it.each(classifyRows)' \
            'it.each(grammarRows)' \
            'it.each(unclassifiedRows)' \
            'narrowed ids never match a full id' \
            'u64 strings round-trip exactly' || exit 1
          out=$(npx vitest run test/org_streaming_opening_vectors.test.ts 2>&1 | tee /dev/stderr)
          n=$(printf '%s\n' "$out" | sed 's/\x1b\[[0-9;]*m//g' | grep -oE '^ *Tests +[0-9]+ passed' | grep -oE '[0-9]+' | tail -1)
          echo "node cross-lang vectors: ${n:-0} (floor 119)"
          if [ -z "$n" ] || [ "$n" -lt 119 ]; then
            echo "::error::the node cross-lang vectors ran ${n:-0} rows, floor is 119 — \
          lower the floor deliberately or restore the witness"
            exit 1
          fi

      # The tool-serving cleanup journey needs a real mesh: the property
      # under test is that closing every handle the SDK hands you releases
      # the node's last reference, and a fake `ServeHandle` cannot fail to
      # do that. Reuses the binding built above — a second `napi build`
      # solely for one file would double this job's cost for nothing.
      #
      # Named explicitly rather than flipping RUN_INTEGRATION_TESTS on for
      # the whole `npm test` run: the other integration-gated suites want
      # a two-node handshake and their own budget, and folding them in
      # here would change what this step means when it goes red.
      - name: Run live tool-lifecycle witness
        env:
          RUN_INTEGRATION_TESTS: "1"
        run: npm test -- --run test/tool_lifecycle_live.test.ts

  sdk-ts-tests:
    name: TypeScript SDK tests (vitest + tsc)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: net/crates/net/sdk-ts
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      # `sdk-ts` resolves `@net-mesh/core` through a `file:` devDependency,
      # which carries no version — so a peerDependency range that excludes
      # the core it ships with is invisible to every other step in this job.
      # It surfaces only at `npm install` on a user's machine. Non-strict
      # here: a floor aimed at an unreleased version is fine as long as the
      # CHANGELOG says so. `release-npm-sdk.yml` runs the strict form.
      # A `run:` step naming a script by path needs the executable bit in
      # git's INDEX. The bit is not in the working tree, and a Windows
      # checkout has core.filemode off — so `chmod +x` there is a no-op
      # against the index and the script commits as 100644 with nothing
      # locally to show for it. Every test passes on the author's machine
      # and the step still cannot start:
      #
      #   .../check-ts-consumer.sh: Permission denied
      #   Error: Process completed with exit code 126.
      #
      # Cheap, no network, and it runs early because a 126 wastes a whole job.
      - name: Guard — workflow scripts invoked by path are executable
        working-directory: ${{ github.workspace }}
        run: |
          python3 -m pip install --quiet pyyaml
          python3 .github/scripts/check-script-permissions.py --require-yaml
          python3 .github/scripts/check-script-permissions.py --self-test

      - name: Guard — SDK peer range admits the in-tree core
        working-directory: ${{ github.workspace }}
        run: python3 .github/scripts/check-npm-peer-range.py

      # `@net-mesh/cli` and `@net-mesh/deck` ship nothing themselves — each is
      # a launcher plus per-platform packages in optionalDependencies. npm
      # SKIPS an optional dependency it cannot resolve without failing, so a
      # missing platform package installs with exit 0, reports success, and
      # only surfaces when someone runs the command and gets exit 127.
      #
      # Three lists have to agree for that not to happen: optionalDependencies,
      # the triples the launcher resolves, and the release build matrix. This
      # is the no-network half; the release workflows additionally verify each
      # package is really on the registry before publishing the aggregate.
      - name: Guard — npm aggregates name platform packages that get built
        working-directory: ${{ github.workspace }}
        run: |
          python3 .github/scripts/check-npm-platform-packages.py
          python3 .github/scripts/check-npm-platform-packages.py --self-test

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: sdk-ts
          workspaces: net/crates/net -> target

      # `sdk-ts/package.json` carries `@net-mesh/core: file:../bindings/node`
      # as a devDependency, so `npm i` over there picks up the sibling
      # binding from the working tree. The binding's `.node` cdylib has
      # to be built first or `npm test` will fail to load it.
      #
      # Feature flags MUST include `redis` even though the suite never
      # opens a Redis connection: `sdk-ts/src/redis-dedup.ts` does a
      # real `export { RedisStreamDedup } from '@net-mesh/core'`, and the
      # napi-generated `index.d.ts` only carries the `RedisStreamDedup`
      # declaration when the binding was built with the `redis`
      # feature. Without it, tsc fails the SDK build with
      # `Module '"@net-mesh/core"' has no exported member
      # 'RedisStreamDedup'`. The runtime side is also satisfied — the
      # `.node` cdylib carries the class — but the runtime never opens
      # a connection because no SDK code instantiates the helper in
      # the test suite.
      #
      # `test-helpers` is required so `_testInjectSyntheticPeer` is
      # exported for the group-placement fixtures —
      # `sdk-ts/test/groups.test.ts` uses the same hook the bindings
      # suite does.
      - name: Build native module
        working-directory: net/crates/net/bindings/node
        run: |
          npm i --ignore-scripts
          npx napi build --platform --no-default-features --features redis,net,cortex,compute,groups,meshos,deck,meshdb,aggregator,tool,org,test-helpers,dataforts

      - name: Install npm dependencies
        run: npm i

      # `tsc` first — the v0.11 `originHash` widening (u32 → u64,
      # number → bigint) cascaded through every method signature and
      # interface in the SDK's source. Type-check failures here mean
      # the SDK's type surface drifted away from the binding's
      # generated `.d.ts`; surface them as a CI failure rather than
      # only as a `npm run build` failure on a developer workstation.
      - name: Type-check (tsc)
        run: npm run build

      # The step above compiles the SDK's own sources with
      # `skipLibCheck: true`, which is exactly the blind spot: a declaration
      # file that names a type nothing declares type-checks fine as long as
      # nobody reads it. A consumer who turns skipLibCheck off reads it, and
      # the errors land in OUR shipped files where they cannot fix them:
      #
      #   @net-mesh/core/index.d.ts(507,48): error TS2304:
      #       Cannot find name 'DaemonBridgeTsfns'.
      #   @net-mesh/sdk/dist/meshdb.d.ts(67,10): error TS2305:
      #       Module '"@net-mesh/core"' has no exported member 'InMemoryChainReader'.
      #
      # This runs the check a careful consumer runs — a trivial program
      # against the built pair, dependency declarations checked.
      - name: Type-check a trivial consumer against the shipped declarations
        run: "$GITHUB_WORKSPACE/.github/scripts/check-ts-consumer.sh"

      # The skill's TypeScript hello-world, type-checked against this same
      # surface. It runs here because it needs the napi-generated `index.d.ts`
      # the step above produced — that file is gitignored, so a clean checkout
      # does not have it and skills.yml's `examples` job cannot resolve
      # `@net-mesh/core` at all.
      #
      # The check itself lives in a script because skills.yml runs the identical
      # check as a publication gate: `needs` does not cross workflows, so this
      # job alone could not stop the mirror publishing a TypeScript example that
      # no longer compiles.
      - name: Type-check the skill hello-world example
        run: "$GITHUB_WORKSPACE/.github/scripts/check-skill-example-ts.sh"

      # vitest auto-discovers everything under `test/`. Notable
      # deck-specific coverage exercised by this step:
      #   - test/deck.test.ts — Symbol.asyncDispose hook shape +
      #     runtime drain. The runtime test promotes the "binding
      #     stale" skip to a hard failure when CI=true, so a
      #     misconfigured --features list (missing `deck`) above
      #     fails loudly rather than silently skipping.
      - name: Run vitest
        run: |
          set -o pipefail
          npm test 2>&1 | tee /tmp/sdk-ts-tests.log
          n=$(sed 's/\x1b\[[0-9;]*m//g' /tmp/sdk-ts-tests.log | grep -oE '^ *Tests +[0-9]+ passed' | grep -oE '[0-9]+' | tail -1)
          echo "sdk-ts tests passed: ${n:-0} (floor 567)"
          if [ -z "$n" ] || [ "$n" -lt 567 ]; then
            echo "::error::sdk-ts ran ${n:-0} tests, floor is 567 — \
          lower the floor deliberately or restore the witness"
            exit 1
          fi
          # === the sdk-ts org facade witnesses
          # The vitest run above EXECUTED these 11 (the executable consumer
          # + 8 shape x authority cells over all four shapes + the midstream
          # org-vocabulary pin + strict disposal); this step PINS them: lexical
          # name-existence, fail-closed.
          python3 "$GITHUB_WORKSPACE/.github/scripts/check-roster.py" \
            --label org_live.test --mode text \
            --source test/org_live.test.ts \
            consumer_program_compiles_against_the_shipped_org_surface \
            same_org_unary_call_and_serve \
            same_org_streaming_call_and_serve \
            same_org_client_stream_call_and_serve \
            same_org_duplex_call_and_serve \
            granted_unary_call_and_serve \
            granted_streaming_call_and_serve \
            granted_client_stream_call_and_serve \
            granted_duplex_call_and_serve \
            midstream_outcomes_surface_an_org_error_never_a_false_clean_eof \
            closing_client_and_serve_handle_lets_both_meshes_shut_down_cleanly || exit 1

  python-tests:
    name: Python bindings tests (pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: net/crates/net/bindings/python
    steps:
      - uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # This job's wheel enables features the *release* wheel did not,
      # so everything below could pass against a surface users cannot
      # install. `org` and `deck` shipped that way. Compare the two
      # feature sets before trusting any of it.
      - name: Guard — release wheel carries what this job tests
        working-directory: ${{ github.workspace }}
        run: python3 .github/scripts/check-python-wheel-features.py

      # Match `net/crates/net/rust-toolchain.toml` directly so the
      # pinned 1.96.0 toolchain is installed up-front rather than
      # auto-fetched mid-`maturin develop` by rustup (which has flaked
      # — partial download leaves `rustc` absent on the new toolchain).
      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.98.1"
          components: clippy, rustfmt, llvm-tools-preview

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: python
          workspaces: net/crates/net -> target

      # maturin develop requires a virtualenv (refuses to install into
      # the system Python). Create one and prepend it to PATH so every
      # subsequent step resolves `maturin`, `pip`, `pytest`, and the
      # installed `net` extension from the venv.
      - name: Create virtualenv
        run: |
          python -m venv .venv
          echo "${PWD}/.venv/bin" >> "$GITHUB_PATH"
          echo "VIRTUAL_ENV=${PWD}/.venv" >> "$GITHUB_ENV"

      - name: Install maturin, pytest and PyYAML
        # pytest-timeout surfaces the offending test on hangs —
        # without it, a deadlock anywhere in the suite ticks the
        # job-level timeout-minutes and the CI log gives no hint
        # which test was stuck. 60 s is generous for unit/integration
        # mesh tests on GHA; the longest legitimate test in the
        # suite is well under that.
        #
        # PyYAML for the "Run the Python skill examples" step below:
        # `run-skill-examples.sh` reads `docs/data/examples.yaml` through
        # `skill_examples.py`, which imports yaml and exits 1 without it.
        # The venv above is what makes this job need the explicit install —
        # it goes on PATH ahead of the runner's system python3, and the
        # system one is where ubuntu-latest's preinstalled PyYAML lives.
        # `go-tests` calls the same script for --lang go / --lang c and
        # passes because it never shadows that interpreter. Same fix, and
        # same reasoning, as the `examples` job in skills.yml.
        run: pip install --upgrade pip maturin pytest pytest-timeout pyyaml

      # `net,cortex,compute,groups,meshdb,meshos,deck` mirrors the
      # Node binding's feature set for tests. `groups` is needed so
      # `test_groups.py` can import `ReplicaGroup` / `ForkGroup` /
      # `StandbyGroup` / `GroupError`; `meshdb` / `meshos` / `deck`
      # enable the corresponding test modules (each guarded by
      # `pytest.skip` when the feature is absent) plus the stub-drift
      # test's MeshDB class coverage. `delegation` (a shipped default
      # feature) surfaces `derive_child_identity` / `DelegationChain` /
      # `RevocationRegistry` for `test_delegation.py`. Default `redis` is
      # omitted because the suite doesn't exercise the Redis adapter.
      # `extension-module` (the cdylib must not link libpython) has to
      # ride along explicitly: `--no-default-features` + an explicit
      # feature list, so nothing else re-enables it here and we don't
      # rely on maturin merging `[tool.maturin] features` with CLI args.
      - name: Build and install bindings
        # `publish` (V2 Phase 2 — NetMesh.publish_tools) and `a2a` (V2 Phase 3 —
        # NetMesh.serve_a2a / submit_task / task_status / cancel_task) are shipped
        # default features but this job builds `--no-default-features`, so they
        # must be listed explicitly or `test_publish.py` / `test_a2a.py` fail with
        # `AttributeError: 'NetMesh' object has no attribute ...`.
        # `payments-http` (the outbound HTTP-402 client, WS-P2) IS in the
        # default feature set now — it moved there when `PaymentProvider`
        # began requiring an explicit settlement backend, since without it
        # `facilitator_url` can only error and the mock is the only
        # reachable one. This job builds `--no-default-features`, so it
        # still has to be listed, and test_payment_http.py's rows depend on
        # it (they skip cleanly if the class is absent).
        # `dataforts` (the blob CAS) is in the default feature set, so the
        # published wheel carries it — this job's `--no-default-features`
        # build did not, which left `BlobRef` / `blob_publish` /
        # `MeshBlobAdapter` untested in Python and made a blob example
        # unrunnable here. Listed so the tested artifact matches the
        # shipped one; `check-python-wheel-features.py` proves release
        # still covers this list.
        run: maturin develop --no-default-features --features net,cortex,compute,groups,meshdb,meshos,deck,aggregator,tool,consent,mcp,delegation,publish,a2a,payments,payments-http,org,dataforts,extension-module

      # `--timeout-method=thread` is critical for this FFI-heavy
      # suite: the default `signal` method only works while Python
      # is between bytecode instructions, so a deadlock inside a
      # pyo3 call (or in a Rust-spawned thread we're waiting on)
      # never gets interrupted. Thread-mode wakes a watchdog after
      # the deadline regardless of where the test is blocked and
      # dumps a full Python + C frame for the hung test.
      #
      # `--timeout=30` so even if a hang lands 19 min into the
      # run, the watchdog still has a minute of budget to dump the
      # offender before the 20-minute job ceiling fires.
      #
      # `-s` (`--capture=no`) disables pytest's stdout/stderr
      # capture so timeout dumps + faulthandler traces appear in
      # the GHA log live, not buffered behind a hung test's exit.
      # `PYTHONFAULTHANDLER=1` enables faulthandler at interpreter
      # startup so a hard hang in a Rust FFI call (where the
      # pytest-timeout thread can't print through pytest's capture)
      # still dumps a C-level stack when SIGSEGV/SIGABRT fires or
      # when the watchdog sends the dump signal.
      # C5's Python witness (`test_a2a_history_boundary.py`) shells out to a
      # Rust fixture binary that seeds a retained historical incarnation
      # through the production `retain_superseded` API. Built HERE, not inside
      # the test: the pytest step below runs under a blanket `--timeout=30`,
      # and compiling a Rust test target would blow that budget and read as a
      # hang. The test falls back to building it itself when the variable is
      # unset (the local path), and hard-fails rather than skipping if the
      # binary cannot be produced — a skip would make the witness vacuous on
      # exactly the machines that run it.
      - name: Build the A2A history-boundary fixture seeder
        working-directory: net/crates/net
        run: |
          # `--tests`, not `--test review_python_seed`: the integration-test
          # pin guard inventories only the root, SDK and net-cli crates, so a
          # `--test <name>` naming a payments target is a pin it cannot
          # attribute and refuses to guess at. Selecting the executable out
          # of cargo's JSON by target name does the same job without
          # inventing a pin form.
          exe=$(cargo test -p net-payments --features mesh \
                  --tests --no-run --message-format json \
                | jq -r 'select(.reason=="compiler-artifact")
                         | select(.target.name=="review_python_seed")
                         | .executable' | tail -1)
          test -n "$exe" && test -x "$exe" \
            || { echo "::error::the C5 fixture seeder did not build"; exit 1; }
          echo "NET_A2A_SEEDER_EXE=$exe" >> "$GITHUB_ENV"

      # `--junitxml` is the RESULT SET the org facade roster below reads
      # (CI-1): that step used to re-run the whole live org suite, under
      # this job's 20-minute ceiling and without the thread watchdog or
      # faulthandler set here. The stale copy is deleted first so a run
      # that wrote nothing cannot be read as one that passed.
      - name: Run tests
        env:
          PYTHONFAULTHANDLER: "1"
          PYTHONUNBUFFERED: "1"
        run: |
          rm -f "$RUNNER_TEMP/python-bindings-junit.xml"
          pytest -v -s --timeout=30 --timeout-method=thread \
            --junitxml="$RUNNER_TEMP/python-bindings-junit.xml"

      # === the Python org facade witnesses ==
      # The pytest run above EXECUTED the pinned rows; this step PINS them
      # and COUNTS them (CI-1). Before, the pin asserted "15 items / 12
      # cells" in prose while running no tests and counting nothing — a
      # parametrize id or a whole matrix row could vanish and the claim kept
      # standing. Now the pinned base names + the teardown row are pinned
      # lexically (fail-closed, with `decl`'s data-literal quoting) and then
      # counted PER PINNED NODE ID: the floors are the pinned estate's own
      # shape, so a vanished id or a vanished row reddens the count, and
      # every pinned name must have at least one passing row of its own.
      # Unpinned sibling rows in these files cannot mask a loss: only pinned
      # node ids are counted.
      #
      # The estate (26 rows / 20 cells):
      #   * MATRIX — 8 functions x [same_org|granted] = 16 cells: the 6
      #     shape x form cells, plus PY-2's org SS/DX pump-terminal race
      #     witnesses (`*_terminal_is_not_raced_by_the_response_pump`);
      #   * the PY-1 stale-wheel gate — 1 function x [native|facade] x
      #     [test_org_live|test_runtime_teardown_no_deadlock] = 4 cells;
      #   * STANDALONE — 5 rows: the 3 original + PY-2's nRPC SS/DX
      #     pump-terminal race witnesses (they live in test_org_live.py);
      #   * TEARDOWN — 1 row.
      #
      # The rows are read from the JUnit result set the run above wrote, NOT
      # from a re-run. The re-run this replaced executed the whole live org
      # suite a second time inside the job's 20-minute ceiling, without
      # `--timeout-method=thread` or `PYTHONFAULTHANDLER`, so a hang there
      # would have eaten the job with no dump. It also cannot grep the run
      # above's log instead: `-s` interleaves a test's own output between
      # the `-v` node id and its PASSED verdict.
      #
      # The second `--source` is the teardown witness: a live org handler at
      # runtime-drop time must not wedge the interpreter — the GIL-held
      # blocking drop that hung this job and the wheel job to their job
      # ceilings instead of failing. It is its own file (the property is a
      # teardown one), so it is pinned here rather than in a suite that does
      # not name it.
      - name: Witness roster + floor — Python org facade (26 pinned rows / 20 cells)
        working-directory: ${{ github.workspace }}
        run: |
          set -uo pipefail
          MATRIX="
            test_org_streaming_sync_call_and_serve
            test_org_streaming_async_call_and_serve
            test_org_client_stream_sync_call_and_serve
            test_org_client_stream_async_call_and_serve
            test_org_duplex_sync_call_and_serve
            test_org_duplex_async_call_and_serve
            test_org_streaming_terminal_is_not_raced_by_the_response_pump
            test_org_duplex_terminal_is_not_raced_by_the_response_pump
            "
          STALE_GATE=test_stale_wheel_fails_the_gate_loudly
          STANDALONE="
            test_task_cancel_propagates_to_retirement_observables
            test_streaming_midstream_error_surfaces_the_org_vocabulary
            test_live_cross_org_call_from_a_generated_scenario
            test_nrpc_streaming_terminal_is_not_raced_by_the_response_pump
            test_nrpc_duplex_terminal_is_not_raced_by_the_response_pump
            "
          TEARDOWN=test_teardown_with_a_live_handler_does_not_deadlock
          python3 "$GITHUB_WORKSPACE/.github/scripts/check-roster.py" --label test_org_live --mode decl \
            --source net/crates/net/bindings/python/tests/test_org_live.py \
            --source net/crates/net/bindings/python/tests/test_runtime_teardown_no_deadlock.py \
            $MATRIX $STALE_GATE $STANDALONE $TEARDOWN \
            same_org granted native facade || exit 1

          # Fail-closed: a missing or unparseable artifact, a pinned name
          # with no passing row, or a floor miss all exit 1. A row counts
          # only as a PASS — any <failure>/<error>/<skipped> child excludes it.
          python3 - "$RUNNER_TEMP/python-bindings-junit.xml" 26 20 \
            $MATRIX $STALE_GATE $STANDALONE $TEARDOWN <<'PY' || exit 1
          import sys
          import xml.etree.ElementTree as ET
          from pathlib import Path

          junit, min_rows, min_cells, *names = sys.argv[1:]
          modules = {"test_org_live", "test_runtime_teardown_no_deadlock"}
          if not Path(junit).is_file():
              print(f"::error::no pytest JUnit artifact at {junit} - the run above wrote no results")
              sys.exit(1)
          try:
              root = ET.parse(junit).getroot()
          except ET.ParseError as exc:
              print(f"::error::could not parse {junit}: {exc}")
              sys.exit(1)
          passed = {n: [] for n in names}
          for case in root.iter("testcase"):
              if not modules & set((case.get("classname") or "").split(".")):
                  continue
              if any(case.find(c) is not None for c in ("failure", "error", "skipped")):
                  continue
              full = case.get("name") or ""
              base = full.split("[", 1)[0]
              if base in passed:
                  passed[base].append(full)
          rows = sum(len(v) for v in passed.values())
          cells = sum(1 for v in passed.values() for full in v if "[" in full)
          print(f"python org facade: {rows} pinned rows / {cells} cells passed "
                f"(floor {min_rows} rows / {min_cells} cells)")
          missing = [n for n, v in passed.items() if not v]
          for n in missing:
              print(f"::error::pinned python org witness {n} has no passing row in {junit}")
          if rows < int(min_rows) or cells < int(min_cells):
              print(f"::error::the pinned python org facade passed {rows} rows / {cells} cells; "
                    f"the floors are {min_rows} rows / {min_cells} cells (8 matrix functions x "
                    "[same_org|granted] + the 4 stale-wheel gate cells + 5 standalone + the "
                    "teardown row) - lower the floors deliberately or restore the witnesses")
              sys.exit(1)
          sys.exit(1 if missing else 0)
          PY

      # === the Python cross-language vectors rows =======
      # The pytest run above EXECUTED these (119 items: the byte pins, the
      # opening role rows, the reject-reality rows, the vocabulary
      # declaration + grammar rows, the never-success rows, narrowed ids,
      # u64 exactness); this step PINS them: the 9 function names lexically
      # (fail-closed) plus the scoped count floor (the run itself).
      - name: Witness roster + floor — Python cross-lang vectors (119)
        working-directory: ${{ github.workspace }}
        run: |
          set -uo pipefail
          python3 "$GITHUB_WORKSPACE/.github/scripts/check-roster.py" --label test_org_streaming_opening_vectors --mode decl \
            --source net/crates/net/bindings/python/tests/test_org_streaming_opening_vectors.py \
            test_fixture_has_the_expected_shape \
            test_wire_bytes_pin \
            test_opening_wire_as_caller \
            test_reject_mutation_is_real_against_the_base_wire \
            test_vocabulary_row_classifies_back_to_declared_domain_and_kind \
            test_vocabulary_wire_grammar \
            test_unclassified_case_never_becomes_success \
            test_narrowed_ids_never_match_a_full_id \
            test_u64_strings_round_trip_exactly || exit 1
          out=$(cd net/crates/net/bindings/python && python -m pytest -q \
                  tests/test_org_streaming_opening_vectors.py 2>&1 | tee /dev/stderr)
          n=$(printf '%s\n' "$out" | grep -oE '[0-9]+ passed' | grep -oE '[0-9]+' | tail -1)
          echo "python cross-lang vectors: ${n:-0} (floor 119)"
          if [ -z "$n" ] || [ "$n" -lt 119 ]; then
            echo "::error::the python cross-lang vectors ran ${n:-0} rows, floor is 119 — \
          lower the floor deliberately or restore the witness"
            exit 1
          fi

      # The skill examples import `net_sdk`, the ergonomic wrapper, which sits
      # on the binding `maturin develop` just built. This is the only job with
      # both layers: sdk-py-tests installs the wrapper `--no-deps` on purpose
      # (so its suite needs no maturin), and this job had the binding but not
      # the wrapper. One pure-Python editable install closes the gap.
      - name: Install the sdk-py wrapper
        run: pip install --no-deps -e ../../sdk-py

      # === the sdk-py org facade witnesses (Q6) =====
      # PINS the 9 base names of the 6 matrix functions, the parametrize
      # pair that yields their 12 cells, PY-1's stale-wheel gate witness
      # (`test_stale_wheel_gate_is_reachable[native|facade]`, 2 rows), the
      # broken-facade probe witness (§23 audit, 1 row), and the count floor
      # (15 + 2 + 1 = 18, fail-closed)
      # — AND RUNS them: the step is here, not in `sdk-py-tests`, because
      # these are live rows through `net_sdk` and need two things only this
      # job has by now: the built extension (maturin develop, a few steps
      # up) and the installed wrapper (the step above). The sdk-py job is
      # deliberately native-free — its conftest stubs the extension — so
      # `tests/test_org_streaming.py` skips itself there (`no usable net
      # wheel here`), and a floor asserted against a skipped run is a floor
      # that can never fail. It runs with the same watchdog settings as the
      # suite run above (`--timeout-method=thread`, `PYTHONFAULTHANDLER`), so
      # a hang in one of these live rows is dumped, not a silent job timeout.
      - name: Witness roster + floor — sdk-py org facade (18)
        working-directory: net/crates/net/sdk-py
        env:
          PYTHONFAULTHANDLER: "1"
          PYTHONUNBUFFERED: "1"
        run: |
          set -uo pipefail
          python3 "$GITHUB_WORKSPACE/.github/scripts/check-roster.py" --label test_org_streaming --mode decl \
            --source tests/test_org_streaming.py \
            test_org_streaming_sync_call_and_serve \
            test_org_streaming_async_call_and_serve \
            test_org_client_stream_sync_call_and_serve \
            test_org_client_stream_async_call_and_serve \
            test_org_duplex_sync_call_and_serve \
            test_org_duplex_async_call_and_serve \
            test_unary_call_and_serve_preserved_through_net_sdk \
            test_streaming_midstream_error_surfaces_the_org_vocabulary \
            test_task_cancel_propagates_to_retirement_observables \
            test_stale_wheel_gate_is_reachable \
            test_a_facade_that_fails_to_import_fails_the_gate \
            same_org granted native facade || exit 1
          out=$(python -m pytest -q --timeout=30 --timeout-method=thread \
                  tests/test_org_streaming.py 2>&1 | tee /dev/stderr)
          n=$(printf '%s\n' "$out" | grep -oE '[0-9]+ passed' | grep -oE '[0-9]+' | tail -1)
          echo "sdk-py org facade: ${n:-0} (floor 18)"
          if [ -z "$n" ] || [ "$n" -lt 18 ]; then
            echo "::error::the sdk-py org facade ran ${n:-0} rows, floor is 18 — \
          lower the floor deliberately or restore the witness"
            exit 1
          fi

      # Executed, not just type-checked. hello.py's siblings in Rust and
      # TypeScript both compiled clean for months while hanging forever on a
      # subscribe that could never yield; only running them found it. The
      # runner bounds every example with a timeout, so a hang is reported
      # rather than reproduced.
      - name: Run the Python skill examples
        working-directory: ${{ github.workspace }}
        run: .github/scripts/run-skill-examples.sh --lang python

  python-wheel-acceptance:
    name: Python wheel (shipped profile, installed from the wheel)
    runs-on: ubuntu-latest
    # A `python-release` build is `release` plus LTO and one codegen
    # unit, so it is slow. That is the price of testing the artifact
    # that ships rather than a proxy for it.
    timeout-minutes: 60
    defaults:
      run:
        working-directory: net/crates/net/bindings/python
    steps:
      - uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.98.1"

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: python-wheel
          workspaces: net/crates/net -> target

      - name: Ensure libpython is linkable
        run: |
          dpkg -s python3-dev >/dev/null 2>&1 || {
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends python3-dev
          }

      - name: Install maturin
        run: pip install --upgrade pip maturin

      # The profile, features and command here MUST match
      # `release-python.yml`. `check-python-wheel-features.py` enforces
      # that mechanically; this comment is for the reader.
      - name: Build the wheel exactly as the release workflow does
        run: |
          maturin build --profile python-release --out dist \
            --features net,cortex,compute,groups,meshdb,meshos,deck,aggregator,tool,consent,mcp,delegation,publish,a2a,payments,payments-http,org,extension-module

      # A *clean* environment, and install from the built wheel. An
      # editable or `maturin develop` install would put a differently
      # compiled extension on the path and prove nothing about the
      # artifact.
      - name: Install the built wheel into a clean virtualenv
        run: |
          python3 -m venv /tmp/wheelenv
          /tmp/wheelenv/bin/pip install --upgrade pip pytest pytest-timeout pyyaml
          wheel=$(ls dist/*.whl | head -1)
          echo "installing $wheel"
          /tmp/wheelenv/bin/pip install "$wheel"
          # Fail loudly if the import resolves to a source directory
          # rather than the installed extension.
          cd /tmp && /tmp/wheelenv/bin/python -c "import net, sys; assert net.__file__, 'net resolved to a namespace package, not the wheel'; print('wheel import ok:', net.__file__)"

      # The whole point. This is the configuration users get:
      # `panic = "unwind"`, LTO, optimised. A panic that a debug build
      # contains and a release build aborts on shows up here and
      # nowhere else in CI — which is exactly how a tokio runtime being
      # dropped in an async context stayed invisible while 884 tests
      # passed against a `maturin develop` build.
      - name: Run the full suite against the installed wheel
        env:
          PYTHONFAULTHANDLER: "1"
          PYTHONUNBUFFERED: "1"
        run: /tmp/wheelenv/bin/pytest -v -s --timeout=60 --timeout-method=thread

  sdk-py-tests:
    name: Python SDK tests (sdk-py, pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: net/crates/net/sdk-py
    steps:
      - uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # sdk-py is the pure-Python layer over the `net-mesh` bindings.
      # Its `tests/conftest.py` stubs the native `net` extension before
      # any SDK module loads, so the test run does not need maturin or
      # the Rust toolchain. `--no-deps` skips resolving the runtime
      # requirement against PyPI.
      - name: Install sdk-py (no deps) + test deps
        run: |
          pip install --upgrade pip
          pip install --no-deps -e .
          pip install pytest pydantic

      # pytest auto-discovers `tests/` per pyproject.toml's
      # `testpaths`. Notable deck-specific coverage:
      #   - tests/test_deck_wrapper.py — wrapper-level
      #     DeckClient.from_seed kwarg forwarding +
      #     __enter__/__exit__ dunder dispatch (stubs the raw
      #     pyo3 class so this stays a pure-Python test).
      - name: Run tests
        run: pytest -v


  go-tests:
    name: Go bindings tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history: the ABI-commit guard below diffs every commit of
          # the pushed range (`github.event.before..github.sha`), which a
          # depth-1 clone does not contain.
          fetch-depth: 0

      # The text half of "Assert the Go binding links exactly one net::ffi"
      # below. That step guards the CODE — no sibling cdylib, no second `-l`
      # in `go/*.go`. Nothing guarded the TEXT, and text is what a consumer
      # follows: the sweep that consolidated the docs updated
      # `net/crates/net/include/net.go.h` but not `go/net.h`, the copy cgo
      # actually compiles, so the header a Go user has kept saying
      # `Link with -lnet -lnet_compute` months after that library stopped
      # being built. Two test files kept saying `cargo build -p net-<x>-ffi`,
      # which is now an rlib and produces nothing to link.
      #
      # `check-header-count.py` rides along: the header count is the same
      # claim about the same surface, drifts for the same reason — prose
      # duplicated across the docs and skills trees, updated one copy at a
      # time — and is derivable from `git ls-files` over the include
      # directory rather than typed and trusted.
      #
      # First, and before the toolchains: it is pure text, needs no network,
      # and a failure here should not cost a cdylib build to discover.
      - name: Guard — the C surface is described as it ships
        run: |
          python3 .github/scripts/check-one-library-docs.py
          python3 .github/scripts/check-one-library-docs.py --self-test
          python3 .github/scripts/check-header-count.py
          python3 .github/scripts/check-header-count.py --self-test

      # The one-commit ABI rule, enforced over THIS push's commits. A `NET_*`
      # constant or `extern "C"` change landing without its Rust + both
      # headers + a Go ABI test in the SAME commit is how -117 straddled
      # three commits (3c9fa8bde -> 70b008909 -> 0aa63e69f): `header_parity_test.go`
      # was red in between and a bisect inside the window yields a header
      # pair that silently drifts. Text and git only, so it runs before the
      # toolchains like its neighbours above.
      - name: Guard — ABI changes land atomically
        if: ${{ !cancelled() }}
        env:
          BASE_SHA: ${{ github.event.before }}
        run: |
          python3 .github/scripts/check-abi-commit.py --self-test
          python3 .github/scripts/check-abi-commit.py --range "$BASE_SHA..$GITHUB_SHA"

      # Also pure text, also before the toolchains. A `libc::free` on a
      # Go-allocated callback buffer is a wrong-heap free on Windows —
      # confirmed heap corruption, not a style question — and it costs a
      # full cdylib + cgo build to discover any other way.
      - name: Guard — Go callback buffers are freed by their allocator
        run: |
          python3 .github/scripts/check-callback-buffer-ownership.py

      - name: Setup Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go/go.mod

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: go
          workspaces: net/crates/net -> target

      # ONE cdylib, for every consumer. `net-ffi` links `net-mesh` and the seven
      # C-ABI surfaces (compute, deck, mcp, meshdb, meshos, org, rpc) into
      # `libnet.so`; `go/*.go` links `-lnet` and the C skill example links
      # `-lnet`, and neither links anything else. `net-mesh` gave up its own
      # `cdylib` crate-type so `net-ffi` could take the `net` lib name, which is
      # why every existing `-lnet` in the docs stayed correct.
      #
      # This replaced eight separately-linked cdylibs, each of which embedded
      # and re-exported its own copy of `net::ffi`. Link order unified the
      # FUNCTIONS, which is why it looked fine for months. It does not unify
      # `static`s, and `parking_lot_core` keeps its parked-thread registry in
      # one — so a thread that parked on `MeshNode::announce_mu` through one
      # copy was never woken by an unlock through another. That was the Go CI
      # hang, and the same arrangement was documented for C consumers.
      #
      # The seven surfaces are `rlib`-only now, so there is no second cdylib
      # left to link by accident.
      #
      # Features live in `net-ffi/Cargo.toml`, not here. Relying on cargo
      # unifying the siblings' requests made the feature set a property of this
      # command line, so building any subset silently produced a
      # differently-configured `net-mesh`.
      - name: Build the single libnet cdylib
        working-directory: net/crates/net
        env:
          # Line tables + frame pointers so a core from a hung run unwinds.
          # Without them gdb reports "missing debugging information" and the
          # one thread that matters stops two frames in — which is how three
          # captures in a row came back unreadable.
          #
          # Set through the cargo profile variable rather than `-Cdebuginfo` in
          # RUSTFLAGS so a `rustflags` key in `.cargo/config.toml` cannot
          # displace it. `1` is line tables, not full DWARF.
          #
          # Diagnostic setting, kept while the fix is confirmed. Drop it after
          # a few green runs; shipped cdylibs should not carry it.
          CARGO_PROFILE_RELEASE_DEBUG: "1"
          RUSTFLAGS: "-Cforce-frame-pointers=yes"
        run: cargo build --release -p net-ffi --features net-ffi/test-helpers

      # The cdylib's exported C-ABI symbol set is pinned, name for name.
      #
      # Every Go and C consumer links this one artifact (the Python and Node
      # bindings compile the `net` crate in-process and never load it), so a
      # symbol that appears or disappears breaks them all at once — and until
      # this step nothing compared the export table against anything, so the
      # browser-native WebRTC plan's guarantee ("default build's
      # exported symbol set unchanged" across a ~50-site endpoint refactor)
      # was unfalsifiable. The baseline is pinned to the pre-refactor head in
      # its header and regenerated only for an intended ABI change, in the
      # same commit, with `--update`. `--self-test` plants an added, a removed
      # and a renamed export and requires each to be rejected, so a green
      # step means the comparison ran, not that the checker was a no-op.
      # This complements `abi_stability_*_test.go`; it does not replace it.
      - name: Guard — libnet exports match the pinned baseline
        if: ${{ !cancelled() }}
        run: |
          python3 "$GITHUB_WORKSPACE/.github/scripts/check-ffi-exports.py" \
            --artifact "$GITHUB_WORKSPACE/net/crates/net/target/release/libnet.so"
          python3 "$GITHUB_WORKSPACE/.github/scripts/check-ffi-exports.py" --self-test

      # The public nRPC header must describe the library being built.
      #
      # `net_rpc.h` shipped at ABI 0x0002 against a 0x0004
      # implementation, declaring both cancellation functions without
      # the leading `MeshRpcHandle*` that 0x0004 added — so a consumer
      # compiled against it passed whatever was in the first argument
      # register as a mesh pointer. The only guard was
      # `net_rpc_check_abi_version`, which compared `runtime >=
      # expected` and therefore passed the stale header. Text-only, so
      # it runs before the build finishes mattering.
      - name: Guard — FFI C headers match their implementations
        if: ${{ !cancelled() }}
        run: |
          python3 "$GITHUB_WORKSPACE/.github/scripts/check-rpc-abi-parity.py"
          python3 "$GITHUB_WORKSPACE/.github/scripts/check-rpc-abi-parity.py" --self-test

      # The invariant this hang cost a lot to find: the Go binary loads exactly
      # one copy of `net::ffi`.
      #
      # Three ways it can regress, so three assertions — "does it build" passes
      # through all of them:
      #
      #   1. a `go/*.go` file reintroduces a second `-l...` and links a sibling
      #      surface directly again;
      #   2. an `extern crate` line goes missing from `net-ffi/src/lib.rs`, in
      #      which case that surface's symbols are silently absent and the
      #      failure surfaces as a link error somewhere unrelated;
      #   3. the cdylib builds without DWARF — not a correctness bug, but it
      #      makes the next hang unreadable while still looking like success.
      - name: Assert the Go binding links exactly one net::ffi
        if: ${{ !cancelled() }}
        run: |
          cd "$GITHUB_WORKSPACE"
          fail=0

          # (1) every cgo directive names net_go and nothing else.
          if grep -h "cgo LDFLAGS" go/*.go | grep -qv -- "-lnet$"; then
            echo "::error::a go/*.go cgo directive links something other than -lnet"
            grep -h "cgo LDFLAGS" go/*.go | grep -v -- "-lnet$"
            echo "Every surface is in libnet.so. Linking a sibling cdylib beside it"
            echo "puts a second copy of net::ffi in the process, which is the hang."
            fail=1
          fi

          cd net/crates/net/target/release

          # (2) every surface actually made it into the one library.
          for pfx in net_mesh_ net_org_ net_rpc_ net_compute_ net_meshdb_ net_meshos_ net_deck_ net_mcp_; do
            n=$(nm -D --defined-only libnet.so 2>/dev/null | grep -c " T $pfx" || true)
            echo "  $pfx exported: ${n:-0}"
            if [ "${n:-0}" -eq 0 ]; then
              echo "::error::libnet.so exports no ${pfx}* symbols; the matching extern crate line in bindings/go/net-ffi/src/lib.rs is probably gone"
              fail=1
            fi
          done

          # (3) no sibling cdylib exists to be linked beside it. They are
          # rlib-only now; a crate-type regression would silently make the old
          # two-copies arrangement buildable again.
          stray=$(ls libnet_*.so 2>/dev/null || true)
          if [ -n "$stray" ]; then
            echo "::error::a sibling FFI crate emitted a cdylib again:"
            echo "$stray"
            echo "Those surfaces belong inside libnet.so via bindings/go/net-ffi."
            echo "A second cdylib carrying net::ffi is the announce_mu hang."
            fail=1
          fi

          # (4) unwind data, so a hang dump is readable.
          if ! readelf -S libnet.so 2>/dev/null | grep -q debug_; then
            echo "::error::libnet.so has no DWARF; a hang dump will not unwind past the FFI entry point"
            echo "CARGO_PROFILE_RELEASE_DEBUG on the build step above is what sets this."
            fail=1
          fi

          exit $fail

      # `integration_test.go` gates its suite behind RUN_INTEGRATION_TESTS=1
      # so local developers can run quick unit-style passes without the
      # full mesh setup. CI wants the full coverage.
      #
      # Through the shared runner so a hang reports NATIVE frames rather than
      # stopping at the cgo boundary — see that script for why, and for why
      # every Go suite entry point in this job has to go through it.
      - name: Run Go tests
        working-directory: go
        env:
          LD_LIBRARY_PATH: ${{ github.workspace }}/net/crates/net/target/release
          RUN_INTEGRATION_TESTS: "1"
        run: $GITHUB_WORKSPACE/.github/scripts/go-test-with-native-stacks.sh

      # === the Go org facade live cells ==
      # The run above EXECUTED these 6 live cells (3 shapes x {same-org,
      # granted}, call+serve live two-node with verified-caller attribution
      # asserted); this step PINS them (a witness must not disappear
      # silently): lexical name-existence, fail-closed.
      - name: Witness roster — Go org facade live cells (6)
        working-directory: go
        run: |
          set -uo pipefail
          python3 ../.github/scripts/check-roster.py --label org_test --mode decl \
            --source org_test.go \
            TestLiveSameOrgStreamingFromAGeneratedScenario \
            TestLiveSameOrgClientStreamFromAGeneratedScenario \
            TestLiveSameOrgDuplexFromAGeneratedScenario \
            TestLiveGrantedStreamingFromAGeneratedScenario \
            TestLiveGrantedClientStreamFromAGeneratedScenario \
            TestLiveGrantedDuplexFromAGeneratedScenario || exit 1

      # === the Go cross-language vectors rows ===========
      # The go test run above EXECUTED the 8 TestStreamingOpeningVectors_*
      # funcs (124 rows: byte pins, opening roles, rejects, vocabulary,
      # unclassified, narrowed ids, u64 exact — plus the mixed-pair row
      # skip-gated fail-closed behind RUN_MIXED_CROSS_PROCESS=1,
      # F-S4Vectors-1); this step PINS them: lexical name-existence,
      # fail-closed.
      - name: Witness roster — Go cross-lang vectors (9)
        working-directory: go
        run: |
          set -uo pipefail
          python3 ../.github/scripts/check-roster.py --label org_streaming_opening_vectors --mode decl \
            --source org_streaming_opening_vectors_test.go \
            TestStreamingOpeningVectors_Shape \
            TestStreamingOpeningVectors_BytePins \
            TestStreamingOpeningVectors_OpeningRoles \
            TestStreamingOpeningVectors_Rejects \
            TestStreamingOpeningVectors_Vocabulary \
            TestStreamingOpeningVectors_Unclassified \
            TestStreamingOpeningVectors_NarrowedIds \
            TestStreamingOpeningVectors_U64Exact \
            TestStreamingOpeningVectors_MixedPair_GoCallerPythonProvider || exit 1

      # Run again with `-tags test_helpers` so the test-only files
      # (`groups_testhelpers.go`, `groups_test.go`,
      # `capability_aggregation_e2e_test.go`) compile and execute.
      # These reference FFI symbols gated behind the `test-helpers`
      # cargo feature on `net-compute-ffi` (already enabled in the
      # build step above) — without the Go build tag they're
      # excluded from the package compile and silently skipped.
      - name: Run Go tests (test_helpers)
        working-directory: go
        env:
          LD_LIBRARY_PATH: ${{ github.workspace }}/net/crates/net/target/release
          RUN_INTEGRATION_TESTS: "1"
        run: $GITHUB_WORKSPACE/.github/scripts/go-test-with-native-stacks.sh test_helpers

      # `abi_stability_cgo_test.go` (+ its self-contained `_cgo.go`
      # helper) is gated behind the DISTINCT `abi_stability` build tag —
      # cgo directives can't live in a `_test.go`, so the helper sits in a
      # tagged regular `.go` file kept out of shipped SDK builds, and a
      # separate tag avoids pulling in the `test_helpers` groups FFI
      # symbols. Neither run above passes `-tags abi_stability`, so the
      # cgo u64 ABI round-trip (TEST_COVERAGE_PLAN §P3-15) was silently
      # excluded from CI. `-run` keeps this to just that test — it's a
      # fast unit test, no need to re-run the integration suite.
      - name: Run Go ABI-stability cgo test
        working-directory: go
        env:
          LD_LIBRARY_PATH: ${{ github.workspace }}/net/crates/net/target/release
        run: |
          set -o pipefail
          go test -v -tags abi_stability -run TestABIStabilityU64FFIRoundTrip ./... \
            2>&1 | tee /tmp/abi_stability_cgo.log
          # `-run` exits 0 when the filter matches NOTHING ("no tests to
          # run"), so the test's own PASS line must appear in the output —
          # the silent-skip shape this repo has been bitten by twice. The
          # trailing space keeps `<name>Extended` or a subtest of it from
          # satisfying the grep.
          grep -q -- '^--- PASS: TestABIStabilityU64FFIRoundTrip ' /tmp/abi_stability_cgo.log || {
            echo "::error::TestABIStabilityU64FFIRoundTrip did not run and pass — the -run filter matched nothing"
            exit 1
          }

      # With CGO_ENABLED=0 — the default on a Go install with no C compiler
      # on PATH — the toolchain drops every cgo file in this package and
      # compiles it down to the few plain-Go type declarations that remain.
      # The package still exists, so the caller gets type-checked against an
      # almost-empty API and told `undefined: net.New` about their OWN file,
      # with nothing anywhere naming cgo. `go/cgo_disabled.go` replaces that
      # with a message that does. Assert the guard is still wired: the build
      # must fail, the failure must name cgo, and the misleading diagnostic
      # must be gone.
      - name: Assert the cgo-disabled build explains itself
        working-directory: go
        run: |
          set +e
          out=$(CGO_ENABLED=0 go build ./... 2>&1)
          rc=$?
          set -e
          printf '%s\n' "$out"

          if [ "$rc" -eq 0 ]; then
            echo "::error::CGO_ENABLED=0 build succeeded — the cgo_disabled.go guard is gone"
            exit 1
          fi
          if ! printf '%s' "$out" | grep -q "requires_cgo"; then
            echo "::error::the cgo-disabled build failed without naming cgo"
            exit 1
          fi
          if printf '%s' "$out" | grep -q "undefined: net\."; then
            echo "::error::the misleading 'undefined: net.New' diagnostic is back"
            exit 1
          fi

      # `go/example` is the checked-in "run this and watch it work" program,
      # and until now NOTHING in this workflow compiled it. So its manifest
      # drifted: it still declared `go 1.21` long after `go/go.mod` moved to
      # `go 1.26`, and since it consumes that module through a local
      # `replace`, running it as supplied failed before reaching main:
      #
      #   $ go run .
      #   go: module .. requires go >= 1.26 (running go 1.25.5)
      #
      # The directive comparison is the readable diagnostic; building and
      # RUNNING it is what proves the example still works against the module
      # it replaces. Running matters now that the example asserts its own
      # success condition — the producer boundary accepted all 7 events —
      # rather than printing `Done!` over an empty poll. Both are cheap: the
      # library is already built by this job.
      - name: Build and run the checked-in Go example
        working-directory: go/example
        env:
          CGO_LDFLAGS: -L${{ github.workspace }}/net/crates/net/target/release
          LD_LIBRARY_PATH: ${{ github.workspace }}/net/crates/net/target/release
        run: |
          sdk=$(awk '/^go /{print $2; exit}' ../go.mod)
          ex=$(awk '/^go /{print $2; exit}' go.mod)
          echo "go/go.mod declares go $sdk; go/example/go.mod declares go $ex"
          # The example may declare a NEWER language version than the module
          # it replaces, but never an older one — that combination cannot
          # resolve at all. `sort -V` puts the lower version first.
          if [ "$(printf '%s\n%s\n' "$sdk" "$ex" | sort -V | head -1)" != "$sdk" ]; then
            echo "::error::go/example/go.mod declares go $ex but replaces a module requiring go $sdk"
            echo "A local-replace example cannot consume a module with a higher go directive."
            exit 1
          fi
          go run .

      # The Go and C skill examples, executed against the cdylibs built above.
      # This job is the only place they can run: cgo links against libnet, and
      # the C example links against it directly, so the *compile* checks
      # elsewhere use `go vet` and `gcc -fsyntax-only` — neither of which
      # links, let alone runs.
      #
      # C rides along here rather than in ffi-tests because ffi-tests is a
      # cargo-test matrix per FFI crate and never produces a linkable libnet
      # plus a C toolchain in one place. This job already has both.
      - name: Run the Go and C skill examples
        env:
          LD_LIBRARY_PATH: ${{ github.workspace }}/net/crates/net/target/release
          NET_LIB_DIR: ${{ github.workspace }}/net/crates/net/target/release
        run: |
          .github/scripts/run-skill-examples.sh --lang go
          .github/scripts/run-skill-examples.sh --lang c

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: net/crates/net
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: clippy
          workspaces: net/crates/net -> target

      # PANIC_AUDIT_AND_LINT_HARDENING_PLAN.md: production
      # code (lib + bins) is denied for the four panic-hygiene + unsafe
      # lints declared in `Cargo.toml`'s `[lints.clippy]` table. This
      # step has no `-A` overrides — any new `.unwrap()` /
      # `.expect()` / undocumented `unsafe` block / multi-op unsafe
      # block in lib / bin code fails CI here. `--all-targets`
      # coverage for OTHER clippy lints lives in the next step.
      - name: Run clippy (production code, strict)
        run: cargo clippy --all-features --lib --bins -- -D warnings

      # `--all-features` above lints exactly ONE configuration, and it is not
      # one anybody ships: it force-enables every opt-in feature, including
      # `fixtures` (the test/bench seam). That made CI structurally blind to
      # breakage in the configurations people actually build — `cargo build`,
      # `--features net`, `--features cortex` — none of which enable
      # `fixtures`.
      #
      # This is not hypothetical. Gating `apply_legacy_announcement` behind
      # `#[cfg(any(test, feature = "fixtures"))]` left the two imports that
      # type its signature dangling in every non-`fixtures` build. The
      # `--all-features` job stayed green while `cargo clippy --lib --features
      # cortex -- -D warnings` failed, and so did the Windows security job
      # below (which pins `--features net`) — so the platform-specific
      # security suites it exists to gate silently ran in NO job.
      #
      # `--no-default-features` and the default set are the two ends of the
      # range; between them they catch a cfg that only compiles under a
      # feature nobody enables by default.
      - name: Run clippy (default features, strict)
        run: cargo clippy --lib --bins -- -D warnings

      - name: Run clippy (no default features, strict)
        run: cargo clippy --no-default-features --lib --bins -- -D warnings

      # `--all-targets` adds clippy coverage for tests / benches /
      # examples. Tests are allowed to `.unwrap()` / `.expect()` freely
      # (~5000 sites across the test surface) and rarely contain
      # `unsafe`. The four lints from `[lints.clippy]` are silenced
      # here with `-A`. The `clippy::disallowed_methods` rule
      # (driven by `clippy.toml`) is silenced inside each test module
      # via inner `#![allow(clippy::disallowed_methods)]` attributes
      # — Cargo's `[lints]`-table-vs-CLI precedence quirks make a
      # blanket `-A` flag here unreliable. Every OTHER clippy lint
      # still fails on warning across all targets via `-D warnings`.
      - name: Run clippy (all targets, test surface allowed to panic)
        run: >
          cargo clippy --all-features --all-targets --
          -D warnings
          -A clippy::unwrap_used
          -A clippy::expect_used
          -A clippy::undocumented_unsafe_blocks
          -A clippy::multiple_unsafe_ops_per_block

      # net-payments is a workspace member, not the root `net-mesh`
      # crate, so the bare `cargo clippy` above (no `-p` / `--workspace`,
      # no `default-members`) never lints it — leaving the panic-hygiene
      # warnings in its own `[lints.clippy]` table unpromoted to `-D
      # warnings`, contrary to what that table's comment promises. Lint
      # it explicitly, mirroring the two-step split above: strict on
      # lib/bins, panic lints relaxed on the unwrap-heavy test surface.
      - name: Run clippy — net-payments (production code, strict)
        if: ${{ !cancelled() }}
        working-directory: net/crates/net/payments
        run: cargo clippy --all-features --lib --bins -- -D warnings

      - name: Run clippy — net-payments (all targets, test surface allowed to panic)
        if: ${{ !cancelled() }}
        working-directory: net/crates/net/payments
        run: >
          cargo clippy --all-features --all-targets --
          -D warnings
          -A clippy::unwrap_used
          -A clippy::expect_used
          -A clippy::undocumented_unsafe_blocks
          -A clippy::multiple_unsafe_ops_per_block

  # The `clippy` job above lints the root `net` package and net-payments
  # — `cargo clippy` without `--workspace` doesn't traverse the other
  # workspace members,
  # and the bindings each need a different feature combination so a
  # single `--workspace --all-features` invocation isn't workable
  # either (the Python and Node bindings carry build-tool-specific
  # default features that conflict in CI). This matrix lints each
  # FFI / SDK crate with the same feature flags its build / test job
  # uses, so a clippy regression in any binding fails CI before it
  # lands.
  ffi-clippy:
    name: FFI clippy (${{ matrix.crate.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        crate:
          - name: rust-sdk
            path: net/crates/net/sdk
            # `full` is misleadingly named — it is `local + nat-traversal
            # + redis + jetstream + meshos + deck + tool + macros` and
            # OMITS `port-mapping`, `dataforts`, `meshdb`. Add those three
            # code surfaces explicitly so clippy lints them too (clippy
            # only compiles, so the service-adapter features are fine).
            features: --features "full port-mapping dataforts meshdb"
          - name: node
            path: net/crates/net/bindings/node
            # The widest service-free NAPI surface (no redis default).
            # `test-helpers` keeps the test-only FFI symbols in the lint
            # set; `dataforts` / `nat-traversal` / `port-mapping` are
            # included because the TS-SDK ships with `dataforts` (and the
            # transfer / traversal NAPI surfaces would otherwise go
            # unlinted — that gap hid a dead-code lint on the transfer
            # stream-id helpers).
            features: --no-default-features --features net,cortex,compute,groups,meshos,deck,meshdb,aggregator,tool,consent,mcp,publish,payments,payments-http,test-helpers,dataforts,nat-traversal,port-mapping,org
          - name: python
            path: net/crates/net/bindings/python
            # The widest service-free pyo3 surface. `meshdb` /
            # `dataforts` / `nat-traversal` / `port-mapping` are included
            # because the python build / test jobs compile them (the
            # earlier set even omitted `meshdb`, which `python-tests`
            # builds) — without them those pyo3 surfaces went unlinted.
            # `consent` / `mcp` are the P1 consent + bridge-helper modules.
            # `delegation` / `publish` / `a2a` add the V2 enrollment, local-tool
            # publication, and A2A binding modules so clippy lints them (they
            # match the `python-tests` build set).
            #
            # `payments` / `payments-http` are here because the paid surface is
            # NOT reachable through `a2a` alone: the paid-A2A gateway verbs
            # (`prepare_task`, `purchase_task`, `submit_task`,
            # `a2a_attempts`, `a2a_resolve_attempt`) and `PaymentProvider`'s
            # `serve_a2a_configured` / `a2a_unresolved` / `a2a_resolve` sit
            # behind `#[cfg(feature = "payments")]`. With `a2a` on and
            # `payments` off, every one of those functions compiles OUT and
            # this job lints an empty surface while reporting success — the
            # same silent-coverage shape the comments above describe. The
            # `python-tests` build set carries both.
            features: --no-default-features --features net,cortex,compute,groups,meshos,deck,meshdb,aggregator,tool,dataforts,nat-traversal,port-mapping,consent,mcp,delegation,publish,a2a,payments,payments-http,org
          - name: go-compute-ffi
            path: net/crates/net/bindings/go/compute-ffi
            # Default features only — the cdylib production build
            # ships without `test-helpers`, and that is the surface
            # we want CI to enforce against. The `test-helpers`
            # symbols are exercised by the `go test` suite, not by
            # consumers.
            features: ""
          - name: go-rpc-ffi
            # nRPC FFI shim — carries the dispatcher trampolines
            # (`net_rpc_set_handler_dispatcher`,
            # `net_rpc_set_client_streaming_handler_dispatcher`,
            # `net_rpc_set_duplex_handler_dispatcher`,
            # `net_rpc_set_streaming_handler_dispatcher`) consumed
            # by `go/mesh_rpc.go`. Lint-coverage gap closed when the
            # streaming-serve dispatcher landed (G-1 of
            # NET_GO_NRPC_PORT).
            path: net/crates/net/bindings/go/rpc-ffi
            features: ""
          - name: go-meshdb-ffi
            path: net/crates/net/bindings/go/meshdb-ffi
            features: ""
          - name: go-meshos-ffi
            path: net/crates/net/bindings/go/meshos-ffi
            features: ""
          - name: go-deck-ffi
            path: net/crates/net/bindings/go/deck-ffi
            features: ""
          - name: go-mcp-ffi
            # MCP bridge pure helpers + consent/pin C ABI, consumed by
            # `go/mcp.go` (MCP_BRIDGE_SDK_PLAN P3). Default features only.
            path: net/crates/net/bindings/go/mcp-ffi
            features: ""
          - name: go-org-ffi
            # Organization capability-auth verb facade C ABI, consumed
            # by `go/org.go` (OSDK-L Workstream C). Default features only.
            path: net/crates/net/bindings/go/org-ffi
            features: ""
          - name: sdk-macros
            # `net-mesh-sdk-macros` ships the `#[tool]` attribute
            # proc-macro. Linted separately from the SDK because the
            # proc-macro crate doesn't inherit feature flags from
            # its consumers — its public surface is the macro's
            # generated code, which the SDK's `tool_macro`
            # integration test covers separately at runtime.
            path: net/crates/net/sdk-macros
            features: ""
          - name: cli
            path: net/crates/net/cli
            # `net-cli` pulls the SDK in with the explicit feature
            # set its Cargo.toml declares; clippy honors that.
            # `--all-targets` covers the bin + integration test
            # crates under `tests/`.
            features: ""
          - name: deck
            path: net/crates/net/deck
            # The deck TUI binary's `unit-tests` step at the top
            # of this workflow runs its `#[cfg(test)] mod tests`
            # blocks, but clippy lints + module-level dead-code
            # checks weren't covered until this matrix entry.
            # Default features only — matches the cargo invocation
            # the test step uses, so what the binary ships gets
            # linted (not the `demo` feature, which is dev-only).
            features: ""
          - name: wire
            # `net-mesh-wire` is the tokio-free wire layer the core
            # depends on (
            # BROWSER_NATIVE_WEBRTC_TRANSPORT_PLAN.md). `json` is the
            # only feature and is what the core turns on, so linting
            # with it matches the surface every native consumer
            # compiles. Its wasm32 target is linted by the dedicated
            # `wasm-wire` job, which is where the other backend lives.
            path: net/crates/net/wire
            features: --features json
          - name: aggregator-daemon
            path: net/crates/net/aggregator-daemon
            # `net-aggregator-daemon` is a lib + bin crate that
            # hosts an AggregatorRegistry + the
            # `aggregator.registry` RPC service. `--all-targets`
            # covers the bin, lib, and the integration test crate
            # under `tests/`. Default features — the crate's
            # Cargo.toml pins its SDK feature set.
            features: ""
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      # The seven `go-*-ffi` rows are C-ABI rlib shims over the same default
      # `net-mesh` graph, linted the same way on the same runner, so their
      # cached dependency artifacts are interchangeable and one key serves
      # them all. Rows with their own `--features` (rust-sdk, node, python,
      # wire) and the non-shim members (cli, deck, sdk-macros,
      # aggregator-daemon — different dependency sets: clap, ratatui, …) keep
      # their own keys.
      #
      # This key is separate from `ffi-tests`' merged key ON PURPOSE: clippy
      # emits metadata, `cargo test` links binaries, and the two artifact
      # sets do not substitute for each other.
      #
      # `save-if` names one writer: cache entries are immutable and reserved
      # by whoever finishes first, so the other six rows would tar the whole
      # target dir and then lose the reservation.
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: >-
            ${{ startsWith(matrix.crate.name, 'go-') && 'clippy-ffi-go-shims'
                || format('clippy-ffi-{0}', matrix.crate.name) }}
          save-if: >-
            ${{ !startsWith(matrix.crate.name, 'go-')
                || matrix.crate.name == 'go-rpc-ffi' }}
          workspaces: net/crates/net -> target

      - name: Run clippy
        working-directory: ${{ matrix.crate.path }}
        run: cargo clippy ${{ matrix.crate.features }} --all-targets -- -D warnings

  ffi-tests:
    # Executes `cargo test --lib` for each FFI shim crate. The
    # `ffi-clippy` matrix above lints these but never runs their
    # internal `#[cfg(test)] mod tests {}` blocks; pre-fix, ~85
    # Rust unit tests in `bindings/go/*-ffi` and ~32 in the
    # node/python NAPI/PyO3 surfaces were silently uncovered. The
    # `rust-sdk` member is omitted — the dedicated `rust-sdk-tests`
    # job already covers its tests with a broader feature set.
    #
    # Notable deck-specific coverage in `go-deck-ffi`:
    #   - ice_simulate_unknown_variant_leaves_husk_retryable
    #   - ice_commit_unknown_variant_leaves_husk_retryable
    #     (both use a thread-local fault-injection switch on
    #     `build_core_proposal` to exercise the failure-branch
    #     invariant — the husk stays retry-able when the variant
    #     is unrecognised)
    #   - audit_query_setters_set_last_error_on_null_query
    #     (pins the last-error envelope on every NULL-arm return)
    name: FFI tests (${{ matrix.crate.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        crate:
          - name: node
            path: net/crates/net/bindings/node
            features: --no-default-features --features net,cortex,compute,groups,meshos,deck,aggregator,tool,consent,mcp,publish,payments,payments-http,test-helpers,org
          - name: python
            path: net/crates/net/bindings/python
            # `a2a` and `publish` join `payments` here so the paid-A2A
            # binding surface EXISTS in this job. Three gates, not one:
            # `mod a2a_paid` is `#[cfg(all(feature = "a2a", feature =
            # "payments"))]`, and the `PaymentProvider` pyclass that calls
            # into it lives in `payment_provider.rs`'s `mod provider`, which
            # is `#[cfg(feature = "publish")]`. With `payments` alone the
            # whole paid surface compiled out; with `payments,a2a` and no
            # `publish` it compiled but nothing reached it, which rustc
            # reported as 17 never-used items (measured). All three together
            # are warning-clean and give the in-crate `#[cfg(test)]` blocks
            # in `src/a2a.rs` / `src/a2a_paid.rs` something to run against.
            features: --no-default-features --features net,cortex,compute,groups,meshos,deck,aggregator,tool,consent,mcp,payments,a2a,publish,org
          - name: go-compute-ffi
            path: net/crates/net/bindings/go/compute-ffi
            features: ""
          - name: go-rpc-ffi
            path: net/crates/net/bindings/go/rpc-ffi
            features: ""
          - name: go-meshdb-ffi
            path: net/crates/net/bindings/go/meshdb-ffi
            features: ""
          - name: go-meshos-ffi
            path: net/crates/net/bindings/go/meshos-ffi
            features: ""
          - name: go-deck-ffi
            path: net/crates/net/bindings/go/deck-ffi
            features: ""
          - name: go-mcp-ffi
            # MCP bridge C ABI — its #[cfg(test)] mod tests drive the
            # net_mcp_* symbols directly (classify/lower parity, secret-
            # negative, pin-store round-trip + concurrent mutations).
            path: net/crates/net/bindings/go/mcp-ffi
            features: ""
          - name: go-org-ffi
            # Organization capability-auth C ABI — its #[cfg(test)] mod
            # tests drive net_org_* directly (caller layout, credential
            # refusal wire, ABI stamp, header↔Rust numeric mirror).
            path: net/crates/net/bindings/go/org-ffi
            features: ""
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      # CACHE KEY, and why these rows share one.
      #
      # Seven of the nine rows below pass `features: ""`, run the same
      # `cargo test --lib` against the same default `net-mesh` graph, on the
      # same runner, with the same job env — so rust-cache resolves the same
      # env-hash segment for all of them and their dependency artifacts are
      # interchangeable. Giving each its own `shared-key` wrote SEVEN
      # near-identical ~210-230 MB archives per manifest generation (measured
      # against this repo's cache API: 1.09 GB across those rows alone) into a
      # 10 GB per-repo pool that is already over quota — 229 entries,
      # including four rust-cache archives, were evicted in one observed hour
      # with no new entries created, and the default branch currently holds
      # ZERO rust-cache archives as a result.
      #
      # `node` and `python` keep their own keys: their rows carry real
      # `--features` lists, so they are a different build, not a duplicate.
      # And this key is deliberately NOT shared with `ffi-clippy`'s default
      # rows — clippy emits metadata, `cargo test` links binaries, and those
      # artifact sets are not interchangeable.
      #
      # `save-if` names ONE row as the writer. A GitHub cache entry is
      # immutable and is reserved by whoever finishes first; the other six
      # would each pay a full tar+zstd of the target dir and then lose the
      # reservation. One designated saver keeps the archive and drops six
      # wasted uploads.
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: >-
            ${{ (matrix.crate.features == '' && 'test-ffi-default-graph')
                || format('test-ffi-{0}', matrix.crate.name) }}
          save-if: >-
            ${{ matrix.crate.features != ''
                || matrix.crate.name == 'go-rpc-ffi' }}
          workspaces: net/crates/net -> target

      # napi-rs links `napi_*` runtime symbols at load time (Node
      # provides them inside its embedded V8); a standalone
      # `cargo test --lib` binary can't resolve them at link time.
      # Lazy-linking flags (`-z lazy`, `--allow-shlib-undefined`,
      # `LD_BIND_NOT=1`) defer resolution but modern Ubuntu's
      # `-z now` hardening still trips before main() and the
      # binary fails with `undefined symbol: napi_get_reference_value`
      # / exit 127.
      #
      # Hard fix: build a tiny `libnapi_stub.so` that exports every
      # napi symbol the binding references as a no-op, then
      # `LD_PRELOAD` it before running cargo test. The dynamic
      # linker finds the symbol in the stub, the process starts,
      # and the tests run their pure-Rust helpers
      # (`bigint_u64`, capability conversion, etc.) without ever
      # invoking the stubs at runtime — none of these tests reach
      # the napi-rs runtime code path.
      #
      # Other matrix members don't need this and would silently
      # mask real link-time bugs if the stub were set globally.
      - name: Build napi stub library
        if: matrix.crate.name == 'node'
        working-directory: ${{ matrix.crate.path }}
        run: |
          cat > /tmp/napi_stub.c <<'CEOF'
          // No-op stubs for every napi_* symbol the napi-rs runtime
          // references. The cargo-test binary calls none of these at
          // runtime — the pure-Rust unit tests this matrix entry
          // covers don't exercise napi-rs's JS-bridge code path —
          // but the dynamic linker needs symbol *definitions* to load
          // the binary at all. Every stub returns 0 (napi_ok) so
          // even if a stub IS called by accident, the caller sees a
          // benign "success with no value" result.
          #include <stddef.h>
          typedef int napi_status;
          #define NAPI_STUB(name) napi_status name() { return 0; }
          NAPI_STUB(napi_get_reference_value)
          NAPI_STUB(napi_create_reference)
          NAPI_STUB(napi_delete_reference)
          NAPI_STUB(napi_reference_ref)
          NAPI_STUB(napi_reference_unref)
          NAPI_STUB(napi_module_register)
          NAPI_STUB(napi_set_instance_data)
          NAPI_STUB(napi_get_instance_data)
          NAPI_STUB(napi_create_function)
          NAPI_STUB(napi_throw)
          NAPI_STUB(napi_throw_error)
          NAPI_STUB(napi_throw_type_error)
          NAPI_STUB(napi_get_undefined)
          NAPI_STUB(napi_get_null)
          NAPI_STUB(napi_get_global)
          NAPI_STUB(napi_create_object)
          NAPI_STUB(napi_create_array)
          NAPI_STUB(napi_create_array_with_length)
          NAPI_STUB(napi_create_string_utf8)
          NAPI_STUB(napi_create_string_latin1)
          NAPI_STUB(napi_create_string_utf16)
          NAPI_STUB(napi_create_double)
          NAPI_STUB(napi_create_int32)
          NAPI_STUB(napi_create_uint32)
          NAPI_STUB(napi_create_int64)
          NAPI_STUB(napi_create_bigint_int64)
          NAPI_STUB(napi_create_bigint_uint64)
          NAPI_STUB(napi_create_bigint_words)
          NAPI_STUB(napi_get_value_bigint_int64)
          NAPI_STUB(napi_get_value_bigint_uint64)
          NAPI_STUB(napi_get_value_bigint_words)
          NAPI_STUB(napi_get_value_bool)
          NAPI_STUB(napi_get_value_double)
          NAPI_STUB(napi_get_value_int32)
          NAPI_STUB(napi_get_value_uint32)
          NAPI_STUB(napi_get_value_int64)
          NAPI_STUB(napi_get_value_string_utf8)
          NAPI_STUB(napi_get_value_string_latin1)
          NAPI_STUB(napi_get_value_string_utf16)
          NAPI_STUB(napi_get_boolean)
          NAPI_STUB(napi_typeof)
          NAPI_STUB(napi_get_property)
          NAPI_STUB(napi_set_property)
          NAPI_STUB(napi_has_property)
          NAPI_STUB(napi_delete_property)
          NAPI_STUB(napi_define_class)
          NAPI_STUB(napi_define_properties)
          NAPI_STUB(napi_get_property_names)
          NAPI_STUB(napi_get_all_property_names)
          NAPI_STUB(napi_call_function)
          NAPI_STUB(napi_new_instance)
          NAPI_STUB(napi_instanceof)
          NAPI_STUB(napi_is_array)
          NAPI_STUB(napi_get_array_length)
          NAPI_STUB(napi_get_element)
          NAPI_STUB(napi_set_element)
          NAPI_STUB(napi_create_buffer)
          NAPI_STUB(napi_create_buffer_copy)
