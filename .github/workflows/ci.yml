  # --- Family B: NAT traversal + port mapping + RedEX ------------------
  integration-nat-redex:
    name: Integration — NAT traversal, port mapping, RedEX
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Same sccache trial as `integration-net-core` — see the note there.
      # All five integration families carry it: reusing compiler objects
      # ACROSS these jobs is what keeps the split from paying for itself in
      # repeated dependency compilation.
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: "sccache"
      CARGO_INCREMENTAL: "0"
    defaults:
      run:
        working-directory: net/crates/net
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Set up sccache
        uses: mozilla-actions/sccache-action@v0.0.11

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: integration-nat-redex
          workspaces: net/crates/net -> target

      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: nextest

      # === NAT traversal ==================================================
      # `fixtures` rides alongside because these tests use the gated test
      # seams (`peer_session_for_test` in direct_upgrade). The seams are cfg'd
      # `any(test, fixtures)` ONLY: `nat-traversal` is a production feature and
      # must not expose them, so the tests opt in explicitly here instead.
      #
      # FEATURE GRAPH for this whole job: `default + fixtures + port-mapping`.
      # The three steps below used to declare `net nat-traversal fixtures`,
      # `net port-mapping` and `redex` — three separate crate compiles and
      # three mass relinks. None of them passed `--no-default-features`, so all
      # three were already `default` plus a delta (`nat-traversal`, `cortex`,
      # `redex` and `dataforts` are all in `default`), and the only real
      # distinguisher was `port-mapping`. Compiling `port-mapping` in does not
      # change what the other tests exercise: it is a two-level gate, and the
      # runtime half (`MeshNodeConfig::try_port_mapping`) defaults to `false`,
      # so no node in these suites attempts a mapping unless it asks.
      - name: NAT traversal
        if: ${{ !cancelled() }}
        run: >
          cargo nextest run --no-fail-fast --no-tests=fail --features "fixtures port-mapping"
          --test connect_direct
          --test nat_classify
          --test peer_death_clears_capability_index
          --test punch_keepalive
          --test punch_keepalive_timing
          --test reflex_probe
          --test reflex_override
          --test rendezvous_ack
          --test rendezvous_coordinator
          --test coordinator_selection
          --test direct_upgrade
          --test nat_matrix
          --test rendezvous_introduce_validation
          --test traversal_observability

      # === Port mapping (UPnP-IGD / NAT-PMP / PCP) ========================
      - name: Port mapping
        if: ${{ !cancelled() }}
        run: >
          cargo nextest run --no-fail-fast --no-tests=fail --features "fixtures port-mapping"
          --test port_mapping_null
          --test port_mapping_real_router

      # === RedEX ==========================================================
      - name: RedEX
        if: ${{ !cancelled() }}
        run: >
          cargo nextest run --no-fail-fast --no-tests=fail --features "fixtures port-mapping"
          --test integration_redex
          --test redex_replication_dst
          --test redex_replication_e2e

  # --- Family C: CortEX + nRPC + tools + sensing + NetDB ---------------
  integration-cortex:
    name: Integration — CortEX, nRPC, AI tools, sensing, NetDB
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Same sccache trial as `integration-net-core` — see the note there.
      # All five integration families carry it: reusing compiler objects
      # ACROSS these jobs is what keeps the split from paying for itself in
      # repeated dependency compilation.
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: "sccache"
      CARGO_INCREMENTAL: "0"
    defaults:
      run:
        working-directory: net/crates/net
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Set up sccache
        uses: mozilla-actions/sccache-action@v0.0.11

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: integration-cortex
          workspaces: net/crates/net -> target

      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
