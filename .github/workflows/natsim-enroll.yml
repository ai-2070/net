# Real-NAT validation for V3 enrollment reachability
# (docs/internal/plans/NET_CLI_PLAN_V3.md, "Primary use case and
# reachability requirement", R1c).
#
# A device behind a home-router NAT that forwards nothing by itself runs
# `net-mesh up --enroll` with defaults; a cloud agent on the simulated
# internet runs `net-mesh join` + `net-mesh up`. The join must succeed
# DIRECTLY through the router mapping the device requested over NAT-PMP /
# PCP / UPnP (miniupnpd), with no relay anywhere in the topology, and must
# FAIL in the same topology when mapping is disabled (negative control).
#
# Separate from natsim.yml: that job builds the browser matrix (wasm,
# Playwright) and runs for over an hour; this row needs only net-mesh.
name: natsim-enroll

on:
  push:
    paths:
      - ".github/workflows/natsim-enroll.yml"
      - "net/crates/net/tests/natsim/enroll/**"
      - "net/crates/net/tests/natsim/setup.sh"
      - "net/crates/net/tests/natsim/teardown.sh"
      - "net/crates/net/cli/src/**"
      - "net/crates/net/sdk/src/enrollment/**"
      - "net/crates/net/sdk/src/enrollment.rs"
      - "net/crates/net/src/adapter/net/traversal/portmap/**"
  pull_request:
    paths:
      - ".github/workflows/natsim-enroll.yml"
      - "net/crates/net/tests/natsim/enroll/**"
      - "net/crates/net/tests/natsim/setup.sh"
      - "net/crates/net/tests/natsim/teardown.sh"
      - "net/crates/net/cli/src/**"
      - "net/crates/net/sdk/src/enrollment/**"
      - "net/crates/net/sdk/src/enrollment.rs"
      - "net/crates/net/src/adapter/net/traversal/portmap/**"
  workflow_dispatch:

concurrency:
  group: natsim-enroll-${{ github.ref }}
  cancel-in-progress: true

jobs:
  direct:
    name: enrollment direct path (router port mapping, no relay)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: net/crates/net

      # miniupnpd is the simulated home router's port-mapping daemon. The
      # package may start a host-namespace service on install; stop it, the
      # scenario runs its own instance inside the gateway namespace.
      - name: Install NAT lab tools
        run: |
          sudo apt-get update -q
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -q \
            nftables iproute2 conntrack jq miniupnpd-nftables
          sudo systemctl disable --now miniupnpd 2>/dev/null || true
          (miniupnpd --version 2>&1 || true) | head -n 3

      - name: Build net-mesh
        working-directory: net/crates/net
        run: cargo build -p net-cli

      - name: Direct path through automatic port mapping, no relay
        run: |
          sudo NET_MESH_BIN="$PWD/net/crates/net/target/debug/net-mesh" \
            net/crates/net/tests/natsim/enroll/run_enroll_direct.sh

      - name: Show scenario evidence
        if: ${{ always() }}
        run: |
          for f in /tmp/natsim-enroll.*/*; do
            [ -f "$f" ] || continue
            echo "=== $f"
            tail -n 120 "$f" || true
          done

      - name: Upload scenario evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: natsim-enroll-evidence
          path: /tmp/natsim-enroll.*
          if-no-files-found: ignore
