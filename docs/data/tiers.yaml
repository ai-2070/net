# Migration state for every page under web/src/content/docs.
#
# Exhaustive and disjoint by construction: every .md file appears exactly
# once. check-docs-tiers.py proves that against the tree on every run, so a
# page added without a state fails rather than defaulting to one.
#
# States
#   universal         one URL, no language segment
#   adaptive          universal body + per-binding fragments (D2 composition)
#   adaptive_pending  not yet composed; acknowledged, see the allowlist. NOT
#                     necessarily Rust-only — `reference/redis-dedup` already
#                     carries all five languages as per-language sections, which
#                     is the pre-composition shape rather than a Rust-only page.
#   sdk_native        per-language by construction (the SDK spine)
#   boundary_native   the C ABI surface, its own shape
#
# Assignment rules, so this file is reproducible rather than a judgement call:
#   - a section README is navigation, not a task -> universal
#   - zero code fences + CLI/doctrine character   -> universal
#   - protocol or operator reference             -> universal
#   - Rust-native reference pages                -> sdk_native (nav owner only;
#     D7 keeps their physical path and canonical URL unchanged)
#
# Counts: adaptive=1 adaptive_pending=29 boundary_native=5 sdk_native=34 universal=80, total=149
#
# Governed by docs/internal/plans/DOCS_POLYGLOT_LENS_PLAN.md

