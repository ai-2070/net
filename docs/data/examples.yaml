# Example index — what exists, where it lives, and what CI proves about it.
#
# NEUTRAL BY DESIGN, IN THE INDEX ONLY. This file is the contract; the runnable
# source stays where each language's tooling expects it. Relocating source into
# one language-neutral directory for conceptual symmetry would cost package-local
# discoverability, native build integration, release coupling, IDE behaviour and
# first-party provenance — and buy nothing. So: neutralize the index, not the
# files. `.github/scripts/skill_examples.py` reads this; the docs transclude from
# the paths it names.
#
# THE RULE THAT EARNS THE MANIFEST: every binding in `bindings` must appear in
# either `files` or `absent`, for every example. A binding named in neither is an
# error, not a skip — otherwise an example that quietly covers three languages
# reads exactly like one that covers five.
#
# `absent` is for a binding that will not get this example, with the reason. It is
# not a to-do list: an example that is merely unwritten should say so in its
# reason.
#
# EVIDENCE LEVELS. Every example declares what CI actually proves, because
# "everything is executed" is a promise the machinery cannot keep — a C lifecycle
# example needs a link step, an expected-compile-failure must not pass, a wire
# dump cannot run at all. Declaring the truth is stronger than claiming the
# maximum and quietly making exceptions.
#
#   run              executes, exits 0, stdout matches its contract
#   compile          compiles
#   link             compiles and links against the real cdylib
#   typecheck        type-checks against the SDK source
#   source-match     the quoted text matches the named source
#   expected-failure fails, in the named way
#   illustrative     nothing — and says so
#
# A binding at any level BELOW `run` needs a reason in `level_reasons`. Same
# discipline as `absent`: the weaker claim has to be argued, or the levels drift
# down to whatever was convenient. `run.not_wired` names bindings whose artifacts
# are missing from the job that runs the others, so a partially-executed example
# can never read as a fully-executed one.
#
# Governed by docs/internal/plans/DOCS_POLYGLOT_LENS_PLAN.md

bindings: [rust, typescript, python, go, c]

levels: [run, compile, link, typecheck, source-match, expected-failure, illustrative]

examples:
  - id: hello
    skill: net-event-bus
    title: Hello, mesh
    route: construct · publish · verify the bus accepted it · shutdown
    dir: .claude/skills/net-event-bus/examples
    # All five bindings execute: Rust and TypeScript in skills.yml, Python, Go
    # and C in ci.yml, each riding the job that already holds the artifacts.
    level: run
    files:
      rust: hello.rs
      typescript: hello.ts
      python: hello.py
      go: hello.go
      c: hello.c
    absent: {}
    run:
      # Asserts observable state rather than snapshotting a transcript: the shard
      # id is nondeterministic, the ingest count is the contract.
      expect: "accepted: .*ingested=1"
      timeout_s: 60
      not_wired: {}

  - id: observe
    skill: net-event-bus
    title: What the drop counters tell you
    route: push past capacity in all three backpressure modes · read the producer-side counters
    dir: .claude/skills/net-event-bus/examples
    level: run
    files:
      rust: observe.rs
      typescript: observe.ts
      python: observe.py
      go: observe.go
      c: observe.c
    absent: {}
    run:
      # DropOldest is the one mode that loses events without reporting it, which
      # is the whole point of the example. Measured, not assumed: 20,000 events
      # into a 1024-slot buffer gave ingested=20000/dropped=0 for DropOldest and
      # 1023/18977 for both DropNewest and FailProducer.
      expect: "loses events silently"
      timeout_s: 120
      not_wired: {}

  # ------------------------------------------------------------------ wave 1
  # Four services a developer already runs — a registry, a broker-backed job
  # queue, an object store, a config service — each rebuilt on the substrate in
  # one file with no service process to deploy. Rust is the reference binding;
  # the ports are tracked, not silently missing.

  - id: service-registry
    skill: net-event-bus
    title: The service registry you no longer run
    route: providers announce a capability · a caller discovers and ranks them locally · a new provider appears and wins the next lookup
    dir: .claude/skills/net-event-bus/examples
    level: run
    files:
      rust: registry.rs
      typescript: registry.ts
      python: registry.py
    absent:
      go: "unwritten in wave 1 — Rust is the reference implementation; ports follow"
      c: "unwritten in wave 1 — Rust is the reference implementation; ports follow"
    run:
      # Asserted on the last line's fields, not a transcript: node ids are
      # nondeterministic, the counts are the contract.
      expect: "RESULT ok providers=3 joined=1 best_moved=1"
      timeout_s: 120
      not_wired: {}

  - id: job-queue
    skill: net-event-bus
    title: The job queue you no longer run
    route: append jobs to a local log · dispatch each over nRPC · a refused job is re-issued to the peer · reconcile from the log
    dir: .claude/skills/net-event-bus/examples
    level: run
    files:
      rust: jobqueue.rs
      typescript: jobqueue.ts
    absent:
      python: "nRPC is not reachable from the shipped Python wheel: `net/mesh_rpc.py` imports six streaming classes (`ClientStreamCall`, `DuplexCall`, `DuplexSink`, `DuplexStream`, `RequestStreamRecv`, `ResponseSinkSend`) that `bindings/python/src/lib.rs` never registers, so the import shim falls back and `TypedMeshRpc.from_mesh` always raises `MeshRpc unavailable`. Rust and TypeScript pass."
      go: "unwritten in wave 1 — Rust is the reference implementation; ports follow"
      c: "unwritten in wave 1 — Rust is the reference implementation; ports follow"
    run:
      expect: "RESULT ok jobs=6 done=6 retried=1 duplicates=0"
      timeout_s: 120
      not_wired: {}

  - id: object-store
    skill: net-event-bus
    title: The object store you no longer run
    route: store bytes · mint a content address · fetch them from another node · store the same bytes again for the same address
    dir: .claude/skills/net-event-bus/examples
    level: run
    files:
      rust: objectstore.rs
      typescript: objectstore.ts
    absent:
      python: "the standard Python wheel is built without the `dataforts` feature, so `BlobRef`, `blob_publish` and `MeshBlobAdapter` are not in `net` at all. Rust, TypeScript and C carry the blob surface."

      go: "unwritten in wave 1 — Rust is the reference implementation; ports follow"
      c: "unwritten in wave 1 — Rust is the reference implementation; ports follow"
    run:
      expect: "RESULT ok dedup=1 readback=1 bytes=64"
      timeout_s: 120
      not_wired: {}

  - id: live-config
    skill: net-event-bus
    title: The config service you no longer run
    route: register a channel · subscribers join by name · the publisher pushes two revisions · each applies them locally
    dir: .claude/skills/net-event-bus/examples
    level: run
    files:
      rust: liveconfig.rs
      typescript: liveconfig.ts
      python: liveconfig.py
    absent:
      go: "unwritten in wave 1 — Rust is the reference implementation; ports follow"
      c: "unwritten in wave 1 — Rust is the reference implementation; ports follow"
    run:
      expect: "RESULT ok subscribers=2 applied=2 version=2"
      timeout_s: 120
      not_wired: {}
