# Example index — what exists, where it lives, and what CI proves about it.
#
# NEUTRAL BY DESIGN, IN THE INDEX ONLY. This file is the contract; the runnable
# source stays where each language's tooling expects it. Relocating source into
# one language-neutral directory for conceptual symmetry would cost package-local
# discoverability, native build integration, release coupling, IDE behaviour and
# first-party provenance — and buy nothing. So: neutralize the index, not the
# files. `.github/scripts/skill_examples.py` reads this; the docs transclude from
# the paths it names.
#
# THE RULE THAT EARNS THE MANIFEST: every binding in `bindings` must appear in
# either `files` or `absent`, for every example. A binding named in neither is an
# error, not a skip — otherwise an example that quietly covers three languages
# reads exactly like one that covers five.
#
# `absent` is for a binding that will not get this example, with the reason. It is
# not a to-do list: an example that is merely unwritten should say so in its
# reason.
#
# EVIDENCE LEVELS. Every example declares what CI actually proves, because
# "everything is executed" is a promise the machinery cannot keep — a C lifecycle
# example needs a link step, an expected-compile-failure must not pass, a wire
# dump cannot run at all. Declaring the truth is stronger than claiming the
# maximum and quietly making exceptions.
#
#   run              executes, exits 0, stdout matches its contract
#   compile          compiles
#   link             compiles and links against the real cdylib
#   typecheck        type-checks against the SDK source
#   source-match     the quoted text matches the named source
#   expected-failure fails, in the named way
#   illustrative     nothing — and says so
#
# A binding at any level BELOW `run` needs a reason in `level_reasons`. Same
# discipline as `absent`: the weaker claim has to be argued, or the levels drift
# down to whatever was convenient. `run.not_wired` names bindings whose artifacts
# are missing from the job that runs the others, so a partially-executed example
# can never read as a fully-executed one.
#
# Governed by docs/internal/plans/DOCS_POLYGLOT_LENS_PLAN.md

bindings: [rust, typescript, python, go, c]

levels: [run, compile, link, typecheck, source-match, expected-failure, illustrative]

examples:
  - id: hello
    skill: net-event-bus
    title: Hello, mesh
    route: construct · publish · verify the bus accepted it · shutdown
    dir: .claude/skills/net-event-bus/examples
    # All five bindings execute: Rust and TypeScript in skills.yml, Python, Go
    # and C in ci.yml, each riding the job that already holds the artifacts.
    level: run
    files:
      rust: hello.rs
      typescript: hello.ts
      python: hello.py
      go: hello.go
      c: hello.c
    absent: {}
    run:
      # Asserts observable state rather than snapshotting a transcript: the shard
      # id is nondeterministic, the ingest count is the contract.
      expect: "accepted: .*ingested=1"
      timeout_s: 60
      not_wired: {}

  - id: observe
    skill: net-event-bus
    title: What the drop counters tell you
    route: push past capacity in all three backpressure modes · read the producer-side counters
    dir: .claude/skills/net-event-bus/examples
    level: run
    files:
      rust: observe.rs
      typescript: observe.ts
      python: observe.py
      go: observe.go
      c: observe.c
    absent: {}
    run:
      # DropOldest is the one mode that loses events without reporting it, which
      # is the whole point of the example. Measured, not assumed: 20,000 events
      # into a 1024-slot buffer gave ingested=20000/dropped=0 for DropOldest and
      # 1023/18977 for both DropNewest and FailProducer.
      expect: "loses events silently"
      timeout_s: 120
      not_wired: {}

  # ------------------------------------------------------------------ wave 1
  # Four services a developer already runs — a registry, a broker-backed job
  # queue, an object store, a config service — each rebuilt on the substrate in
  # one file with no service process to deploy. Rust is the reference binding;
  # the ports are tracked, not silently missing.

  - id: service-registry
    skill: net-event-bus
    title: The service registry you no longer run
    route: providers announce a capability · a caller discovers and ranks them locally · a new provider appears and wins the next lookup
    dir: .claude/skills/net-event-bus/examples
    level: run
    files:
      rust: registry.rs
      typescript: registry.ts
      python: registry.py
      go: registry.go
      c: registry.c
    absent:
    run:
      # Asserted on the last line's fields, not a transcript: node ids are
      # nondeterministic, the counts are the contract.
      expect: "RESULT ok providers=3 joined=1 best_moved=1"
      timeout_s: 120
      not_wired: {}

  - id: job-queue
    skill: net-event-bus
    title: The job queue you no longer run
    route: append jobs to a local log · dispatch each over nRPC · a refused job is re-issued to the peer · reconcile from the log
    dir: .claude/skills/net-event-bus/examples
    level: run
    files:
      rust: jobqueue.rs
      typescript: jobqueue.ts
      python: jobqueue.py
      go: jobqueue.go
      c: jobqueue.c
    absent:
    run:
      expect: "RESULT ok jobs=6 done=6 retried=1 duplicates=0"
      timeout_s: 120
      not_wired: {}

  - id: object-store
    skill: net-event-bus
    title: The object store you no longer run
    route: store bytes · mint a content address · fetch them from another node · store the same bytes again for the same address
    dir: .claude/skills/net-event-bus/examples
    level: run
    files:
      rust: objectstore.rs
      typescript: objectstore.ts
      python: objectstore.py
      go: objectstore.go
      c: objectstore.c
    absent:
    run:
      expect: "RESULT ok dedup=1 readback=1 bytes=64"
      timeout_s: 120
      not_wired: {}

  - id: live-config
    skill: net-event-bus
    title: The config service you no longer run
    route: register a channel · subscribers join by name · the publisher pushes two revisions · each applies them locally
    dir: .claude/skills/net-event-bus/examples
    level: run
    files:
      rust: liveconfig.rs
      typescript: liveconfig.ts
      python: liveconfig.py
      go: liveconfig.go
      c: liveconfig.c
    absent:
    run:
      expect: "RESULT ok subscribers=2 applied=2 version=2"
      timeout_s: 120
      not_wired: {}

  # ------------------------------------------------------------------ wave 2
  # Two more routes, both portable to every binding without a caveat: a local
  # append-only log with a consumer-owned offset, and a channel whose access
  # boundary is a scoped credential rather than an open roster.

  - id: event-log
    skill: net-event-bus
    title: The event log you no longer run
    route: append records to a local log · replay them all · a consumer checkpoint · replay from the offset
    dir: .claude/skills/net-event-bus/examples
    level: run
    files:
      rust: eventlog.rs
      typescript: eventlog.ts
      python: eventlog.py
      go: eventlog.go
      c: eventlog.c
    absent: {}
    run:
      expect: "RESULT ok records=8 replayed=8 resumed=3"
      timeout_s: 120
      not_wired: {}

  - id: token-channel
    skill: net-event-bus
    title: Scoped credentials, not an open channel
    route: a channel gated on token roots · a subscribe-only token bound to one entity · refused bare, admitted with it
    dir: .claude/skills/net-event-bus/examples
    level: run
    files:
      rust: tokenchannel.rs
      typescript: tokenchannel.ts
      python: tokenchannel.py
      go: tokenchannel.go
      c: tokenchannel.c
    absent: {}
    run:
      expect: "RESULT ok granted=1 refused=1"
      timeout_s: 120
      not_wired: {}

  # ------------------------------------------------------------------ wave 3
  # One route, and a negative result worth more than the other two candidates.
  # All five bindings.

  - id: service-failover
    skill: net-event-bus
    title: The sidecar you no longer run
    route: two providers behind one service name · the caller addresses the service, never a node id · the answering provider dies · the next call lands on the survivor
    dir: .claude/skills/net-event-bus/examples
    level: run
    files:
      rust: failover.rs
      typescript: failover.ts
      python: failover.py
      go: failover.go
      c: failover.c
    absent: {}
    run:
      expect: "RESULT ok providers=2 moved=1 served=2"
      timeout_s: 120
      not_wired: {}

  - id: a2a-paid
    skill: net-event-bus
    title: Paid agent-to-agent admission
    route: prepare (no money) · unpaid submit refused · purchase · submit · ran once, charged once
    dir: .claude/skills/net-event-bus/examples
    # Rust in skills.yml, Python in ci.yml's python-tests job, each riding the
    # job that already holds the artifacts. Both stand up a real provider (one
    # PaymentEngine behind the quote/pay wire AND the admission gate, a durable
    # journal on disk) and a real caller (spend policy, durable purchase store)
    # on two live mesh nodes over loopback UDP.
    level: run
    files:
      rust: a2a_paid.rs
      python: a2a_paid.py
    absent:
      typescript: >-
        Node has no paid A2A surface in either direction: paid serving is an
        explicit non-goal of the admission slice (no consumer), and the caller
        verbs are not bound either. `submitTask` is free-path only. Writing
        this example would mean writing the binding first.
      go: >-
        There is no Go A2A surface of any kind — free or paid. Neither the
        binding nor the C ABI exposes a task verb.
      c: >-
        Same as Go: no A2A in the C ABI. The paid flow additionally needs the
        payments caller state machine, which has no C surface.
    run:
      # Asserts the two properties the whole design exists for, read out of
      # production artifacts: the executor's own run counter and the provider's
      # billing log. A state label alone would not distinguish one run from
      # three, so the counter is asserted with multiplicity.
      #
      # END-ANCHORED, and that anchor is load-bearing. The runner applies this
      # with `grep -qE` (run-skill-examples.sh `assert_run`), which matches a
      # SUBSTRING of a line: unanchored, `charges=10` and `charges=100` satisfy
      # a pattern whose entire purpose is to pin the count at one. `charges=` is
      # the last field both examples print
      # (`paid task ran once: task=<id> charges=<n>`), so `$` is exactly the
      # boundary — measured: anchored matches `charges=1` and rejects
      # `charges=10`.
      expect: "paid task ran once: .*charges=1$"
      timeout_s: 120
      not_wired: {}

  # ------------------------------------------------------- org streaming (S4)
  #
  # The C consumer-side cell of the org streaming matrix (the plan's Go/C row:
  # "the C skill example against the single libnet"): one file serving AND
  # calling a protected streaming service over the C ABI, linked against ONE
  # library — every net_org_* / net_rpc_* / net_mesh_* symbol resolves out of
  # the single libnet. It boots a throwaway cross-org issuance chain with the
  # in-repo scenario generator (credentials are ISSUED material — the example
  # mints none of its own), then asserts correlated item delivery, explicit
  # completion, and handler-side attribution of the VERIFIED caller.

  - id: org-streaming
    skill: net-event-bus
    title: Protected org streaming, served and called from C
    route: mint a throwaway org chain · serve a Granted streaming service · call it cross-org · verified caller attribution at the handler · explicit completion
    dir: .claude/skills/net-event-bus/examples
    # Executes: a real two-node live call over loopback UDP. The scenario
    # generator (cargo run --example gen_org_scenario) issues the throwaway
    # credentials first — without a Rust toolchain the example fails loudly
    # rather than printing an unearned ok.
    level: run
    files:
      c: net_org_streaming.c
    absent:
      rust: >-
        The Rust tier's org streaming cells live in the SDK's own live suite
        (sdk/tests/org_streaming.rs, same-org and granted, all four shapes);
        a skill example there would duplicate a suite that already owns the
        fixtures. This example exists because C has no binding test suite —
        the skill-examples runner is C's consumer-side evidence, and the
        single-libnet link is exactly what it proves.
      typescript: >-
        The Node binding's org verbs are exercised live by the binding's own
        test suite (bindings/node/test/org_live.test.ts); the C example is
        not the Node row's evidence.
      python: >-
        The Python binding's org verbs are exercised live by the binding's
        own suite (bindings/python/tests/test_org_live.py); the C example is
        not the Python row's evidence.
      go: >-
        The Go row's live cells are go/org_test.go (the same generated
        scenario, both authority modes, all four shapes) — a Go skill example
        would duplicate that suite. C is the surface without one.
    run:
      # END-ANCHORED: assert_run matches with grep -qE over a substring, so
      # "chunks=3" must not be satisfied by "chunks=31".
      expect: "RESULT ok chunks=3 attribution=verified$"
      # The first run compiles the scenario generator against the fixtures
      # feature (warm afterwards); the live call itself is seconds.
      timeout_s: 900
      not_wired: {}
